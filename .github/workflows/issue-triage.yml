# Reusable: classify an incoming issue, then either plan it or ask what is missing.
#
# Called by a thin wrapper in each repo:
#   jobs:
#     triage:
#       uses: dodi-smart/.github/.github/workflows/issue-triage.yml@v1
#       secrets: inherit
#
# TRIGGERS: the `agent:triage` label, or a `@claude triage` / `@claude plan`
# comment. The bare `/triage` and `/plan` forms were removed — three surfaces
# requesting one action meant the exclusion guard in every repo's claude.yml had
# to be hand-synced with this list, and it had already drifted between repos.
# The verb list now lives in the `commands:` input below and nowhere else.
name: Issue Triage

on:
  workflow_call:
    inputs:
      # Runner selection, passed through to the shared picker. Override per repo
      # when the preset does not fit this stack.
      runner-weight:
        type: string
        default: "light"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""       # explicit selector; wins over runner-weight
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }

# One triage per issue. A second request supersedes the first rather than racing it.
concurrency:
  group: triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Gate BEFORE picking a runner: the picker itself costs a hosted minute, so it
  # must never run for an event that will not proceed (DODI-00005).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.bots.outputs.proceed }}
      mode:    ${{ steps.bots.outputs.mode }}
    steps:
      # agent:no-touch is evaluated inside this action, first and unconditionally
      # (DODI-00008). Nothing below may run ahead of it. No checkout is needed:
      # the gate reads event payload only, which is why it is cheap enough to
      # run before the runner picker.
      - id: gate
        uses: dodi-smart/.github/actions/agent-gate@main
        with:
          labels:        ${{ toJson(github.event.issue.labels.*.name) }}
          event-name:    ${{ github.event_name }}
          event-action:  ${{ github.event.action }}
          label:         ${{ github.event.label.name }}
          request-label: 'agent:triage'
          author:        ${{ github.event.issue.user.login }}
          comment:       ${{ github.event.comment.body }}
          commands:      'triage plan'
          bots:          'allow'
          skip-draft:    'false'

      # Bots open issues at machine volume. The Renovate Dependency Dashboard is
      # the one bot issue worth reading, and it is a STANDING issue — so triage
      # it once on open and never again. This only ever narrows the gate above;
      # it can never re-open a run the kill switch stopped.
      - id: bots
        env:
          PROCEED: ${{ steps.gate.outputs.proceed }}
          MODE:    ${{ steps.gate.outputs.mode }}
          AUTHOR:  ${{ github.event.issue.user.login }}
          TITLE:   ${{ github.event.issue.title }}
          ACTION:  ${{ github.event.action }}
        run: |
          set -euo pipefail
          proceed="$PROCEED"
          if [ "$proceed" = "true" ] && printf '%s' "$AUTHOR" | grep -qiE 'renovate|dependabot|\[bot\]$'; then
            proceed=false
            if printf '%s' "$TITLE" | grep -qi 'dependency dashboard' && [ "$ACTION" = "opened" ]; then
              proceed=true
            else
              echo "bot-authored issue that is not a newly opened Dependency Dashboard — stopping"
            fi
          fi
          echo "proceed=$proceed"          >> "$GITHUB_OUTPUT"
          echo "mode=${MODE:-triage}"      >> "$GITHUB_OUTPUT"

  pick-runner:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    uses: dodi-smart/.github/.github/workflows/pick-runner.yml@main
    with:
      weight: ${{ inputs.runner-weight }}
      labels: ${{ inputs.runner-labels }}
    secrets: inherit

  triage:
    needs: [gate, pick-runner]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }

      - name: Load repo area vocabulary
        id: areas
        run: |
          if [ -f .github/areas.yml ]; then
            { echo 'areas<<__EOF__'; cat .github/areas.yml; echo '__EOF__'; } >> "$GITHUB_OUTPUT"
          else
            { echo 'areas<<__EOF__'; echo '(no .github/areas.yml — do NOT invent area labels;'; \
              echo ' say it is missing and apply none)'; echo '__EOF__'; } >> "$GITHUB_OUTPUT"
          fi

      # Opus for triage: it reads unfamiliar code and decides plan-vs-questions,
      # which is judgement work. Reviewing a diff is not the same job.
      - uses: dodi-smart/.github/actions/run-agent@main
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          # Live progress comment, so a run in flight is visible rather than a
          # silence that could equally mean "working" or "broken".
          track-progress: 'true'
          prompt: |
            Triage issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Mode: ${{ needs.gate.outputs.mode }}

            The repo's area vocabulary (each area lists the paths that define it,
            plus disambiguation rules that exist because some paths mislead):
            ---
            ${{ steps.areas.outputs.areas }}
            ---

            ## Always do

            1. Read the issue and anything it links to.
            2. Explore the code enough to know where the work lands. Map changed or
               relevant files to areas using the paths above. Follow the
               disambiguation rules literally — they exist because the obvious
               guess is wrong.
            3. Apply the `area:*` labels. Several is normal. If areas.yml was
               missing, apply none and say so.
            4. Set the issue type:
               gh api -X PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }} -f type='<Type>'
               Bug only for a real regression or a violated spec — not for
               something that never worked and was never specified.

            ## Then decide, and be honest about which

            Ask yourself: could a competent engineer start implementing this today
            without asking anyone anything?

            **If yes** — post an implementation plan: the files to change, the
            approach, the test plan, the risks, and a rough effort. Reference real
            paths you actually opened. Then set:
              Triage state = Plan ready

            **If no** — do NOT write a speculative plan. Post numbered blocking
            questions in exactly two groups:
              ### Questions for the team
              ### Questions to ask the customer
            The second group must be phrased so it can be pasted into an email
            verbatim. Omit a group entirely if it would be empty. Then set:
              Triage state = Needs info
            and add the most specific `needs:*` label
            (needs:info, needs:repro, needs:decision, needs:design, needs:customer, needs:spec).

            Prefer questions over a guessed plan. A confident plan built on an
            assumption you never checked costs far more than one extra round-trip.

            ## Labels are requests; fields are state

            Set `Triage state` and STOP THERE. Do NOT add an `agent:plan` label —
            it no longer exists. The field already says the issue is planned, and
            writing the same fact twice means the two disagree within weeks
            (DODI-00001, DODI-00016).

            `Triage state = Plan ready` is what makes an issue eligible for
            `agent:implement`, so setting it accurately is the whole contract.

            ## Fields

            Set Priority, Effort and Risk only where you can justify them from what
            you read. Leave a field unset rather than guessing — triage output is
            read as evidence, and an unjustified value is worse than an empty one.
            Risk is at least High for auth, payments, RLS, migrations, or anything
            that loses data.

            Set fields with the GraphQL setIssueFieldValue mutation; ids come from
            /orgs/${{ github.repository_owner }}/issue-fields.

            ## Finally

            Remove the `agent:triage` label if it is present. It means "triage
            requested / in progress"; leaving it on makes a finished issue look
            like it is still being worked. Do NOT add it yourself — it is an
            input, not a record of what you did.

            Keep the comment tight. No preamble, no restating the issue back.
