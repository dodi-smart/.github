# Reusable: React Doctor, static analysis of React/TS source on a pull request.
#
# DEPRECATED, removed at v2. pr-checks.yml's `react-doctor` input runs the same
# action as an opt-in job on the light runner its `pick` already chose, so this
# workflow's own picker job is pure cost, and no caller uses it any more. Add
# nothing here; a need it covers and pr-checks does not goes into pr-checks.
#
# `concurrency` and `paths:` belong to the CALLER, the same rule pr-checks
# follows, because both depend on that repo's branches and source layout.
#
# The caller's `paths:` filter is POSITIVE, so a pull request touching no React
# source produces no check run at all. Never make this a required status check.
#
# The action already runs its own setup-node, posts its own sticky pull request
# comment, publishes its own commit status, and skips the comment when a pull
# request changes no React-eligible files. This workflow adds a runner, a
# timeout and permissions, and otherwise gets out of the way.
name: React Doctor

on:
  workflow_call:
    inputs:
      runner-weight:
        description: "light | heavy | apple | hosted"
        type: string
        default: light
      runner-labels:
        description: "Explicit selector; wins over runner-weight. Validated the same way."
        type: string
        default: ""
      directory:
        description: "Project directory to scan."
        type: string
        default: "."
      scope:
        description: >-
          On PRs: changed (only what this PR introduced) | files | lines | full.
        type: string
        default: "changed"
      blocking:
        description: >-
          Severity that fails the run: none (advisory) | warning | error.
        type: string
        default: "none"
      version:
        description: >-
          react-doctor npm spec. The default is a pinned exact version, bumped by
          Renovate as a reviewed PR, because the job holds write scopes and an
          unreviewed upstream publish must not run there. A caller may pass its
          own spec.
        type: string
        default: "0.9.18" # renovate: datasource=npm depName=react-doctor
      timeout-minutes:
        description: "Cold npx pulls ~9.4 MB of dist plus oxlint and typescript."
        type: number
        default: 15
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

# Every job grants its own, so one added later starts with nothing.
permissions: {}

jobs:
  # No `if:` here. A skipped caller job instantiates neither of these, so the
  # picker costs nothing for a pull request that will not be scanned.
  pick:
    permissions: {}   # the picker reads no GITHUB_TOKEN
    uses: dodi-smart/.github/.github/workflows/pick-runner.yml@pinned/v1.44.3
    with:
      weight: ${{ inputs.runner-weight }}
      labels: ${{ inputs.runner-labels }}

  doctor:
    name: React Doctor
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write   # the action posts its own sticky comment
      statuses: write        # and a commit status carrying the score
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.3
        with:
          selector: ${{ needs.pick.outputs.selector }}
      # Says so in every run, so a caller still on it sees it before v2 drops it.
      - name: Deprecated
        run: echo "::warning title=react-doctor.yml is deprecated::It is removed at v2. Call pr-checks.yml with react-doctor true instead."
      # Checkout and scan live in the action, shared with pr-checks.yml.
      - uses: dodi-smart/.github/actions/react-doctor@pinned/v1.44.3
        with:
          directory: ${{ inputs.directory }}
          scope: ${{ inputs.scope }}
          blocking: ${{ inputs.blocking }}
          version: ${{ inputs.version }}
