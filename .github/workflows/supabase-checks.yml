# Reusable: the Supabase-side checks a bun/node PR pipeline never runs.
#
# `pr-checks.yml`'s stacks stop at the application source; none of them touch a
# Deno edge function or a local Postgres. Nothing here overlaps that workflow,
# and nothing here belongs in it: adding Deno or Postgres there would put one
# repo's Supabase project into every other repo's build.
#
# `concurrency`, `paths:` and the dispatch-aware draft gate stay with the
# CALLER, the same rule `pr-checks.yml` and `react-doctor.yml` follow, because
# all three depend on that repo's branches and layout. A caller that also runs
# `pr-checks.yml` should gate both jobs with the same `if:`.
#
# The job graph follows DODI-00056, the shape `pr-checks.yml` has: `plan` reads
# the inputs and the pull request's file list and emits the lanes this run
# needs; `lanes` runs them, one matrix leg each, with one checkout and one
# install per lane; `Supabase Checks` is the one row a caller requires. A
# feature left off, or a pull request that touches none of its paths, books no
# runner and leaves no row. The lanes:
#
# - Database: one CLI install and at most one local stack for the generated
#   types, the seed re-run, pgTAP and the declarative schema drift check, each a
#   step. Hosted: the self-hosted fleet runs jobs inside containers on a shared
#   daemon, so `supabase db start` publishes postgres's ports on the host while
#   the CLI polls the container's own localhost. The native runtime runs no
#   containers, which removes that reason; moving the lane onto the fleet is a
#   separate change, once a native run there is proven.
# - Edge Functions and Migration Lint read files only, so they run on the light
#   pool of a private repo and hosted otherwise.
name: Supabase Checks

on:
  workflow_call:
    inputs:
      cli-version:
        description: >-
          Supabase CLI version, pinned exact. The generated types this workflow
          diffs against must come from the same CLI the repo commits with, so
          the caller pins this with a `renovate: datasource=npm depName=supabase`
          marker tracking the same `supabase` devDependency the repo installs
          from, not a bare Renovate comment that can drift from it unnoticed.
        type: string
        required: true
      types-path:
        description: >-
          Path of the committed generated types file, e.g.
          `src/lib/supabase/database.types.ts`. Empty turns the types check off.
        type: string
        default: ""
      migrations-paths:
        description: >-
          Newline-separated paths whose change starts the database checks on a
          pull request: types and the seed on these, pgTAP also on
          `supabase/tests`, the drift check also on `schema-path` and
          `supabase/config.toml`. Blank means no filter. Any event that is not a
          pull request ignores this and always runs them.
        type: string
        default: |
          supabase/migrations
          supabase/seed.sql
      seed-check:
        description: >-
          Re-apply `supabase/seed.sql` after `db start` to prove it is
          re-runnable. On, this catches an insert a staging `db push
          --include-seed` would fail on the second time it runs.
        type: boolean
        default: false
      deno-dir:
        description: >-
          Directory of Deno-only source, e.g. `supabase/functions`. Empty turns
          the Edge Functions lane off.
        type: string
        default: ""
      pgtap:
        description: "Run `supabase test db` (the pgTAP suite in supabase/tests/) in the Database lane."
        type: boolean
        default: false
      runtime:
        description: >-
          How the Database lane runs the local stack for types, seed and pgTAP. `docker` (the
          default) is the CLI's `supabase db start` on the runner's Docker.
          `native` is the CLI's stack mode on its native runtime: every service
          is a host process, with no container engine, Postgres starts at once
          and the rest on first request, and the downloads are cached as one
          directory. It needs `cli-version` 2.119 or later and a config stack
          mode accepts (no auth email `content_path` outside `[remotes.*]`).
          Generated types depend on `cli-version`, not on the runtime: bumping
          the CLI to reach 2.119 can change the committed types file. The drift
          check always runs natively, whatever this says.
        type: string
        default: docker
      migration-lint:
        description: >-
          Lint the SQL migrations a pull request adds or changes with squawk, in
          a lane that starts no database.
        type: boolean
        default: false
      migrations-path:
        description: >-
          Directory the Migration Lint lane lints. Singular, and not the same
          input as `migrations-paths`: that one is a list of paths whose change
          starts the Database lane, and this one is the single directory of
          migrations squawk reads. Only `*.sql` files the pull
          request added, modified or renamed under it are linted.
        type: string
        default: supabase/migrations
      migration-lint-excluded-rules:
        description: >-
          squawk rule names the lint skips, separated by commas or
          whitespace. Passed as `--exclude`, which replaces `excluded_rules` in
          the repo's `.squawk.toml`; the rest of that file still applies.
        type: string
        default: ""
      migration-lint-blocking:
        description: >-
          `false` (the default) reports findings as warnings and the lane stays
          green, so the baseline is visible before anything can fail. `true`
          fails the lane on any finding. squawk failing to install or run fails
          it either way.
        type: boolean
        default: false
      schema-drift:
        description: >-
          For a repo that keeps its schema declaratively under `schema-path` and
          generates migrations from it with `supabase db schema declarative sync`:
          run that sync against the committed migrations and fail when it would
          write a new one, so a schema edit committed without its migration
          cannot reach a deploy. Needs a CLI 3 `cli-version` that has the
          command. A step of the Database lane, always on the native runtime.
        type: boolean
        default: false
      schema-path:
        description: >-
          The declarative schema directory. A pull request that changes it starts
          the drift check.
        type: string
        default: supabase/schemas
      schema-drift-strict-coverage:
        description: >-
          Pass `--strict-coverage`, so an object the diff engine cannot manage
          (a cast, an operator, a function of your own inside `auth` or
          `storage`) fails the check instead of being left out of the diff
          with a warning. Turn it off only while such an object moves to a
          hand-written migration.
        type: boolean
        default: true
      deno-version:
        type: string
        default: "v2.x"
      timeout-minutes:
        type: number
        default: 30

jobs:
  # Decides which lanes this run needs, so a disabled feature or an untouched
  # path books no runner and leaves no row (DODI-00056). Reads the pull
  # request's file list through the API, without a checkout.
  plan:
    name: Plan
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.58.0

      # One read of the pull request's file list; the plan matches each check's
      # own paths against it. Any doubt (no pull request, an API error, the
      # cap) leaves `complete` false, and every check that is on runs.
      - id: files
        uses: dodi-smart/.github/actions/changed-files@pinned/v1.58.0

      # Database runs hosted (see the header); the file-only lanes take light.
      - id: hosted
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.58.0
        with:
          weight: hosted
      - id: light
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.58.0
        with:
          weight: light

      - id: plan
        uses: dodi-smart/.github/actions/supabase-checks-plan@pinned/v1.58.0
        with:
          types: ${{ inputs.types-path != '' }}
          seed-check: ${{ inputs.seed-check }}
          pgtap: ${{ inputs.pgtap }}
          schema-drift: ${{ inputs.schema-drift }}
          migration-lint: ${{ inputs.migration-lint }}
          deno-dir: ${{ inputs.deno-dir }}
          migrations-paths: ${{ inputs.migrations-paths }}
          migrations-path: ${{ inputs.migrations-path }}
          schema-path: ${{ inputs.schema-path }}
          files-path: ${{ steps.files.outputs.files-path }}
          complete: ${{ steps.files.outputs.complete }}
          hosted: ${{ steps.hosted.outputs.runner }}
          light: ${{ steps.light.outputs.runner }}

  lanes:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.lanes != '[]' }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.58.0

      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      # --- Edge Functions -----------------------------------------------------
      - if: matrix.lane == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ inputs.deno-version }}

      - name: Type check edge functions
        if: matrix.lane == 'deno'
        working-directory: ${{ inputs.deno-dir }}
        run: deno check --allow-import ./**/*.ts

      - name: Lint edge functions
        if: ${{ !cancelled() && matrix.lane == 'deno' }}
        working-directory: ${{ inputs.deno-dir }}
        run: deno lint

      # --- Database -----------------------------------------------------------
      # One CLI install and at most one stack for every database check. Each
      # check runs while the stack is up, even when an earlier one failed, so a
      # pull request sees every failure at once.
      - name: Setup Supabase CLI
        if: matrix.lane == 'database'
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ inputs.cli-version }}

      # A config whose [auth] signing_keys_path names a git-ignored file does not
      # load on a clean checkout, so neither the stack nor the drift check could
      # start. This writes a throwaway development key there, and nothing else.
      - name: Prepare the local signing key
        if: matrix.lane == 'database'
        uses: dodi-smart/.github/actions/supabase-signing-key@pinned/v1.58.0

      - name: Start Supabase (local)
        id: start
        if: matrix.lane == 'database' && (inputs.types-path != '' || inputs.seed-check || inputs.pgtap)
        uses: dodi-smart/.github/actions/supabase-start@pinned/v1.58.0
        with:
          runtime: ${{ inputs.runtime }}

      # `db start` applies the seed once, so a fresh reset can never catch an
      # insert that is not re-runnable. A staging `db push --include-seed`
      # applies the same file again on every merge, where the second
      # application is the one that fails. Reproduce that here.
      # The URL comes from the start step: a stack-mode project (either runtime,
      # or a config with `stack = true`) listens on a port the CLI picked.
      - name: Verify the seed is re-runnable
        if: ${{ !cancelled() && inputs.seed-check && steps.start.outcome == 'success' }}
        env:
          DB_URL: ${{ steps.start.outputs.db-url }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          echo "Seed re-applied cleanly."

      - name: Verify types (local)
        if: ${{ !cancelled() && inputs.types-path != '' && steps.start.outcome == 'success' }}
        env:
          TYPES_PATH: ${{ inputs.types-path }}
        run: |
          # CLI 3 generates from the local stack by default and deprecates
          # `--local`; CLI 2 needs it.
          major="$(supabase --version | sed -n 's/^v\{0,1\}\([0-9]*\)\..*/\1/p' | head -1)"
          target="--local"
          if [ "${major:-0}" -ge 3 ]; then target=""; fi
          # Generating against the local stack spins a pinned postgres-meta
          # container; pulling it can hit public-registry rate limits (toomanyrequests) on
          # a shared runner IP. Retry the generation with backoff before
          # diffing. A real type mismatch still fails the diff below; this only
          # retries the flaky image pull, never masks stale types.
          generated=false
          for attempt in 1 2 3 4 5; do
            # shellcheck disable=SC2086 # empty on CLI 3, one word on CLI 2
            if supabase gen types typescript $target > types.gen.ts 2> gen.err; then
              generated=true
              break
            fi
            echo "gen types attempt ${attempt} failed:"
            cat gen.err || true
            if [ "${attempt}" -lt 5 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done
          if [ "${generated}" != "true" ]; then
            echo "::error::supabase gen types failed after 5 attempts (see logs above)."
            exit 1
          fi
          if ! diff -q types.gen.ts "$TYPES_PATH" > /dev/null 2>&1; then
            echo "::error::TypeScript types are out of date for $TYPES_PATH. Run: supabase gen types typescript${target:+ $target} > $TYPES_PATH"
            diff types.gen.ts "$TYPES_PATH" || true
            exit 1
          fi
          echo "TypeScript types are up-to-date"

      # `supabase test db` runs pg_prove over supabase/tests/*.sql against the
      # local database. Every file is expected to be self-contained (begin ...
      # rollback), so order does not matter and the seed `db start` applied is
      # left untouched.
      - name: Run pgTAP suite
        if: ${{ !cancelled() && inputs.pgtap && steps.start.outcome == 'success' }}
        run: supabase test db --debug

      # Always native, whatever `runtime` says: the action runs the sync's
      # throwaway databases in stack mode for its own step, with no Docker.
      - name: Compare migrations with the declarative schema
        if: ${{ !cancelled() && matrix.lane == 'database' && inputs.schema-drift }}
        uses: dodi-smart/.github/actions/schema-drift@pinned/v1.58.0
        with:
          schema-path: ${{ inputs.schema-path }}
          strict-coverage: ${{ inputs.schema-drift-strict-coverage }}

      # --- Migration Lint ------------------------------------------------------
      - name: Lint changed migrations
        if: matrix.lane == 'migration-lint'
        uses: dodi-smart/.github/actions/migration-lint@pinned/v1.58.0
        with:
          migrations-path: ${{ inputs.migrations-path }}
          excluded-rules: ${{ inputs.migration-lint-excluded-rules }}
          blocking: ${{ inputs.migration-lint-blocking }}

  # The one row a caller requires. A lane that failed or was cancelled fails it;
  # no lane at all (nothing enabled, nothing changed) passes it.
  supabase-checks:
    name: Supabase Checks
    needs: [plan, lanes]
    if: always()
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.58.0
      - name: Summarize
        if: ${{ !cancelled() }}
        uses: dodi-smart/.github/actions/pr-checks-summary@pinned/v1.58.0
        with:
          needs: ${{ toJSON(needs) }}
          label: supabase-checks
