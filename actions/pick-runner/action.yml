# Composite: resolve a runner weight to a `runs-on` selector. Static.
#
# This is the logic behind the `pick-runner.yml` reusable workflow, extracted so
# a caller that already has a job (pr-checks.yml's own `pick`, an agent
# workflow's gate job) can pick without a second job. `pick-runner.yml` stays the
# thin wrapper for a caller that wants the selection as a job of its own.
#
# There is NO API call, NO GitHub App token and NO fleet listing. A weight is a
# fixed list of capability labels, and overflow is left to GitHub's queue: the
# large pool also carries `light`, so a light job waits for whichever matching
# runner frees up first. The old picker listed the org's runners to choose
# between pools, which cost a token, an API call and a hosted job on every run,
# and could only guess when the listing failed.
#
# Selection is by capability label, never by architecture and never by machine
# name. An architecture pins a tier of intent to this month's hardware, and a
# machine name does not survive re-registration. A lost or renamed label is one
# commit in pick.sh rather than one per workflow per repo.
#
# Public repos and fork PRs never touch self-hosted, with no opt-out. The runner
# group refuses public repos, and a fork PR would otherwise run attacker-authored
# code on our hardware against a cache the next job inherits.
#
# There is no switch to repoint a weight at run time. A weight's labels change
# here, in a release, and pool health is watched instead of escaped.
name: Pick runner
description: Resolve a semantic runner weight to a runs-on selector, with no API call.

inputs:
  # Semantic preset. Prefer this over `labels`, so re-tiering the fleet is
  # one edit here rather than an audit of every caller.
  #   light   lint, typecheck, checks, releases, reading a diff
  #   heavy   builds, Docker, full suites
  #   agent   agent workflows: review, triage, assist
  #   apple   Xcode, iOS, Swift, signing
  #   hosted  force GitHub-hosted, skip self-hosted entirely
  #
  # These name TIERS OF INTENT, not machine classes, and they select on
  # capability labels with NO architecture. A runner of any arch that joins
  # a pool is picked up without a change here.
  weight:
    description: 'light | heavy | agent | apple | hosted'
    default: light

  # Escape hatch for a stack the presets do not describe, e.g. a job needing
  # the `docker` label. Wins over `weight`.
  labels:
    description: 'Comma-separated capability labels. Wins over weight when set.'
    default: ""

  # The runner used whenever self-hosted is off the table: `weight: hosted`,
  # and the public-repo and fork-PR path.
  hosted-runner:
    description: 'Runner used when self-hosted is off the table.'
    default: "ubuntu-latest"

  # Self-hosted is refused on public repos by org policy and is unsafe for
  # fork PRs. Leave this on unless you know exactly why not.
  guard-public:
    description: 'Force hosted on public repos and fork PRs. Leave true.'
    default: "true"

  # DEPRECATED and ignored: setting either prints a warning that names it, and
  # both are removed once no caller passes them. Overflow is the queue's job, so
  # there is no fallback to choose.
  fallback:
    description: 'Deprecated and ignored; warns when set. Remove it from the caller.'
    default: ""
  fallback-when:
    description: 'Deprecated and ignored; warns when set. Remove it from the caller.'
    default: ""

outputs:
  runner:
    description: "JSON array of labels for runs-on, via fromJson()"
    value: ${{ steps.resolve.outputs.runner }}
  selector:
    description: "The resolved selector, for logging. Empty when hosted."
    value: ${{ steps.resolve.outputs.selector }}
  fell-back:
    description: "Always false. Kept so existing callers keep working."
    value: ${{ steps.resolve.outputs.fell-back }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        WEIGHT:        ${{ inputs.weight }}
        LABELS:        ${{ inputs.labels }}
        HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        GUARD:         ${{ inputs.guard-public }}
        PRIVATE:       ${{ github.event.repository.private }}
        FORK:          ${{ github.event.pull_request.head.repo.fork }}
        FALLBACK:      ${{ inputs.fallback }}
        FALLBACK_WHEN: ${{ inputs.fallback-when }}
        ACTION_PATH:   ${{ github.action_path }}
      run: '"$ACTION_PATH/pick.sh"'
