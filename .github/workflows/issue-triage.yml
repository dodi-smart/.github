# Reusable: classify an incoming issue, then either plan it or ask what is missing.
#
# Called by a thin wrapper in each repo:
#   jobs:
#     triage:
#       uses: dodi-smart/.github/.github/workflows/issue-triage.yml@v1
#       secrets: inherit
#
# TRIGGERS: an issue opened or reopened, the `agent:triage` label, or a
# `@claude triage` / `@claude plan` comment. There is deliberately no bare
# `/triage` or `/plan`. Every extra surface has to be excluded again in the
# assistant workflow, and that list drifts. The verbs live in the `commands:`
# input below and nowhere else.
#
# A caller may also offer `workflow_dispatch`, for a manual re-run against one
# issue. Pass its number through the `issue-number` input below. A dispatch
# with no `issue-number` is a clean no-op: the gate stops before the runner
# picker or the agent, with a notice, and the job still reports success. A
# dispatch is not a `pull_request`, `issues`, `issue_comment`,
# `pull_request_review_comment` or `pull_request_review` event, so tag mode
# cannot render a prompt for it; the triage job always runs in agent mode for
# a dispatch (see `actions/run-agent`), which is fine because the prompt below
# already carries the issue number, not the event payload.
#
# ANSWERS. When triage ends in `Needs info` it drafts the message for whoever
# must answer, and a person sends it. The answer comes back as a plain comment
# on the issue, pasted by that person or written by the one asked, and that
# comment re-runs triage in mode `answer`. The gate lets a plain comment through
# only while the issue carries a `needs:*` label, and a step then re-reads the
# live `Triage state`: anything but `Needs info` stops before the agent. A
# comment with @claude in it is addressed to the assistant, never an answer.
#
# EPICS. On an Epic or an Initiative, triage proposes child issues in a
# ```children block. It never creates one. A person confirms by applying
# `agent:decompose`, and issue-decompose.yml files them with a script.
#
# A reopened issue is triaged again rather than skipped. Reopening means the
# issue is back in play and its earlier triage describes a state that no longer
# holds, so leaving it alone leaves `Triage state` claiming a plan that was
# already implemented.
name: Issue Triage

on:
  workflow_call:
    inputs:
      # Runner selection, passed through to the shared picker. Override per repo
      # when the preset does not fit this stack.
      runner-weight:
        type: string
        default: "light"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""       # explicit selector; wins over runner-weight
      # Only meaningful on workflow_dispatch. workflow_call inputs are separate
      # from workflow_dispatch inputs, so a caller offering manual dispatch
      # must declare its own `inputs.issue-number` and forward it here.
      # Default empty; a dispatch with nothing to triage is a no-op, not a
      # failure.
      issue-number:
        type: string
        default: ""
      # The repos a cross-repo blocker may be in, as names separated by spaces.
      # The link step refuses any other, and its write token covers only these,
      # so an issue author cannot steer a link elsewhere in the org. Empty
      # allows every repo in the org.
      blocker-repos:
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }
      AGENT_ENV_SECRET:        { required: false }   # KEY=VALUE lines for the agent alone

# One triage per issue. A second request supersedes the first rather than racing it.
concurrency:
  group: triage-${{ github.repository }}-${{ inputs.issue-number || github.event.issue.number }}
  cancel-in-progress: true

# Every job grants its own, so one added later starts with nothing.
permissions: {}

jobs:
  # The picker runs INSIDE this job, after the last step that can still say
  # no, so it never runs for an event that will not proceed.
  # The gate runs on the light pool of a private repo and on a hosted runner
  # otherwise (a public repo, or a fork PR, which the pool cannot serve). The
  # `if:` below is a cheap pre-filter on the event payload alone, so an event the
  # gate would only stop costs no runner at all. It is strictly narrower than the
  # gate: every rule the gate keeps (`agent:no-touch` first, then the rest) still
  # runs for an event that passes it, and nothing the gate posts is skipped.
  gate:
    # These clauses only save a runner. The gate below makes the decision
    # (`bots: request`, `answer-prefix`), so a looser `if:` costs a run but
    # never lets work through.
    if: >-
      contains(fromJSON('["issues","issue_comment","workflow_dispatch"]'), github.event_name)
      && github.event.sender.type != 'Bot'
      && (github.event_name != 'issues' || github.event.action == 'labeled'
          || !(endsWith(github.event.issue.user.login, '[bot]') || startsWith(github.event.issue.user.login, 'app/')))
      && (github.event.action != 'labeled' || github.event.label.name == 'agent:triage')
      && (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@claude')
          || contains(join(github.event.issue.labels.*.name, ' '), 'needs:'))
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.bots.outputs.proceed }}
      mode:    ${{ steps.bots.outputs.mode }}
      runner:  ${{ steps.pick.outputs.runner }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.52.0
        with:
          selector: light

      # agent:no-touch is evaluated inside this action, first and
      # unconditionally. Nothing below may run ahead of it. The gate reads the
      # event payload only, so it needs no checkout and stays cheap enough to
      # run before the runner picker.
      - id: gate
        uses: dodi-smart/.github/actions/agent-gate@pinned/v1.52.0
        with:
          labels:        ${{ toJson(github.event.issue.labels.*.name) }}
          number:        ${{ inputs.issue-number }}
          event-name:    ${{ github.event_name }}
          event-action:  ${{ github.event.action }}
          label:         ${{ github.event.label.name }}
          request-label: 'agent:triage'
          author:        ${{ github.event.issue.user.login }}
          comment:       ${{ github.event.comment.body }}
          commands:      'triage plan'
          # A plain comment on an issue waiting on answers is the answer.
          answer-prefix: 'needs:'
          # Bots open issues at machine volume, and none is work to plan on
          # its own: the Dependency Dashboard is a standing status page. So a
          # bot's issue is never triaged when it opens, but a person may ask,
          # which is how the children an Epic's confirmation filed get planned.
          bots:          'request'
          skip-draft:    'false'
          # A caller listens to more events than triage can act on, because its
          # assistant needs the review events. A person's PR review has no
          # issue to triage, so it stops here rather than reaching the agent.
          events:        'issues issue_comment workflow_dispatch'

      # An answer re-runs triage only while the issue is really waiting on one.
      # The `needs:*` label let the comment through the gate; the field is the
      # state, so it decides. Read through the shared reader, whose `read` is
      # false on a failed read, and a failed read stops: re-running triage on
      # every comment is the costlier mistake.
      - id: fields
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.mode == 'answer'
        uses: dodi-smart/.github/actions/factory@pinned/v1.52.0
        with:
          command: fields
          issue:   ${{ github.event.issue.number }}

      # This only narrows the gate above. It can never re-open a run the kill
      # switch stopped.
      - id: bots
        env:
          PROCEED:     ${{ steps.gate.outputs.proceed }}
          MODE:        ${{ steps.gate.outputs.mode }}
          EVENT_NAME:  ${{ github.event_name }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          ISSUE_INPUT: ${{ inputs.issue-number }}
          READ:        ${{ steps.fields.outputs.read }}
          STATE:       ${{ steps.fields.outputs.state }}
        run: |
          set -euo pipefail
          proceed="$PROCEED"
          # The SENDER, not the issue author. The caller also listens to
          # pull_request_review and pull_request_review_comment, and the review
          # agent's own inline comments arrive as sender type Bot with no issue
          # author at all. Letting those through reaches claude-code-action,
          # which refuses a non-human actor and fails the run, so every reviewed
          # pull request carried a red triage check that had nothing to triage.
          if [ "$proceed" = "true" ] && [ "$SENDER_TYPE" = "Bot" ]; then
            proceed=false
            echo "bot-sent event ($EVENT_NAME), stopping before the agent"
          fi
          if [ "$proceed" = "true" ] && [ "$MODE" = "answer" ]; then
            if [ "$READ" = "false" ] || [ "$STATE" != "Needs info" ]; then
              proceed=false
              echo "a plain comment, but Triage state is '${STATE:-unread}', not Needs info, so it is not an answer"
            else
              echo "an answer to an issue in Needs info, triaging again"
            fi
          fi
          # A dispatch with nothing to triage is a clean no-op, not a failure.
          # `workflow_call` inputs and `workflow_dispatch` inputs are separate,
          # so this is empty unless the caller's dispatch trigger forwards its
          # own `issue-number` input into this one.
          if [ "$proceed" = "true" ] && [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$ISSUE_INPUT" ]; then
            proceed=false
            echo "::notice title=Nothing to triage::workflow_dispatch needs an issue-number input naming which issue to triage. None was given, so this run does nothing."
          fi
          echo "proceed=$proceed"          >> "$GITHUB_OUTPUT"
          echo "mode=${MODE:-triage}"      >> "$GITHUB_OUTPUT"

      # Only when the run above is still proceeding: a no-op dispatch or a
      # kill-switched issue picks no runner.
      - id: pick
        if: steps.bots.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.52.0
        with:
          weight:             ${{ inputs.runner-weight }}
          labels:             ${{ inputs.runner-labels }}

  triage:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.gate.outputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.52.0
        with:
          selector: ${{ needs.gate.outputs.runner }}

      # Credentials persist on purpose: the action runs `git fetch` from this checkout before the agent starts.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }

      - name: Load repo area vocabulary
        id: areas
        run: |
          if [ -f .github/areas.yml ]; then
            { echo 'areas<<__EOF__'; cat .github/areas.yml; echo '__EOF__'; } >> "$GITHUB_OUTPUT"
          else
            { echo 'areas<<__EOF__'; echo '(no .github/areas.yml, so do NOT invent area labels;'; \
              echo ' say it is missing and apply none)'; echo '__EOF__'; } >> "$GITHUB_OUTPUT"
          fi

      # Opus for triage. It reads unfamiliar code and decides between a plan
      # and questions, which is judgement work.
      - uses: dodi-smart/.github/actions/run-agent@pinned/v1.52.0
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          stage: triage
          issue: ${{ inputs.issue-number }}
          model-pin: ${{ vars.AGENT_MODEL_PIN }}
          org-plugins:             ${{ vars.AGENT_PLUGINS }}
          org-plugin-marketplaces: ${{ vars.AGENT_PLUGIN_MARKETPLACES }}
          agent-env:               ${{ vars.AGENT_ENV }}
          agent-env-secret:        ${{ secrets.AGENT_ENV_SECRET }}
          agent-hooks:             ${{ vars.AGENT_HOOKS }}
          # Live progress comment, so a run in flight is visible. Silence reads
          # the same whether the job is working or broken.
          track-progress: 'true'
          prompt: |
            Triage issue #${{ inputs.issue-number || github.event.issue.number }} in ${{ github.repository }}.
            Mode: ${{ needs.gate.outputs.mode }}
            Event: ${{ github.event_name }}${{ github.event.action && format('/{0}', github.event.action) || '' }}

            The repo's area vocabulary (each area lists the paths that define it,
            plus disambiguation rules that exist because some paths mislead):
            ---
            ${{ steps.areas.outputs.areas }}
            ---

            ## Always do

            1. Read the issue and anything it links to.
            2. Explore the code enough to know where the work lands. Map changed or
               relevant files to areas using the paths above. Follow the
               disambiguation rules literally. They exist because the obvious
               guess is wrong.
            3. Apply the `area:*` labels. Several is normal. If areas.yml was
               missing, apply none and say so.
            4. Set the issue type:
               gh api -X PATCH /repos/${{ github.repository }}/issues/${{ inputs.issue-number || github.event.issue.number }} -f type='<Type>'
               Bug only for a real regression or a violated spec, not for
               something that never worked and was never specified.

            ## An answer (Mode: answer)

            When the mode above is `answer`, this issue is in `Needs info` and
            a person just commented. Read your earlier questions and every
            comment since. Then triage the issue again, as it stands now:

            - Answered enough to start: post the plan and set `Plan ready`.
            - Still missing something: post only the questions still open and
              a fresh draft message, and keep `Needs info`.
            - The comment answers nothing (a note, a thank-you, "sent"): post
              nothing, change nothing, and stop. `Triage state` stays set.

            Leave the `needs:*` labels alone when the issue leaves `Needs
            info`. A step after you clears them unless the state is `Needs
            info` or `Blocked`.

            ## A reopened issue

            When the event above is `issues/reopened`, this issue has been
            triaged before. Its labels, its fields and any earlier plan are
            still on it, and they describe the issue as it was, not as it is.
            Read the comments and whatever closed it, usually a merged pull
            request, before you decide anything.

            Say in one line what has changed, then triage the issue as it
            stands today. Correct the labels and fields that no longer fit and
            post a fresh plan or fresh questions. Never leave `Triage state` on
            the value from the previous round when the plan it refers to has
            already been implemented, because that state is what makes an issue
            eligible for `agent:implement` and a stale one sends an agent to
            build something that already exists.

            ## Then decide, and be honest about which

            Ask yourself: could a competent engineer start implementing this today
            without asking anyone anything?

            **If yes**, post the plan in exactly this shape:

              ### Plan

              #### Files
              Real paths you opened, one line each: the path, then why it
              changes.

              #### Approach
              The shape of the change, not a diff. Three to six sentences.

              #### Tests
              What proves it works. Name the runner if the repo has one.

              #### Acceptance criteria
              Numbered, one observable behaviour per line, as given, when,
              then. Each one becomes a test the implement agent writes before
              the code and may not change afterwards, so state behaviour a
              user or caller sees, never an internal detail. Omit the section
              only when there is nothing a test could assert.

              #### Risks
              The specific thing that could break. Omit this section when
              there is nothing worth naming.

            Under 40 lines. Do not write an Effort, Priority or Risk level line.
            Those are fields, you set them below, and a fact written in two
            places disagrees with itself within weeks.
            Then set:
              Triage state = Plan ready

            **If no**, do NOT write a speculative plan. Post numbered blocking
            questions in exactly two groups:
              ### Questions for the team
              ### Questions to ask the customer
            At most five questions per group. Omit a group entirely if it would
            be empty, and never leave a heading with nothing under it. The
            customer group must be phrased so it can be pasted into an email
            verbatim: no internal jargon, no ticket numbers, no code paths.

            Then draft the message that gets the answers, under
              ### Draft message
            addressed to whoever must answer: the customer when the customer
            group has questions, otherwise the reporter or the team member
            the questions are for. A short greeting, one sentence of context,
            the numbered questions, and a closing line. Plain words, no
            jargon, no ticket numbers, no code paths, nothing internal. Put it
            in a quote block so it copies cleanly. A person sends it; you
            never send, email or mention anyone yourself. End the comment
            with one line: "Reply here with the answers, or paste them in,
            and triage runs again."

            Then set:
              Triage state = Needs info
            and add the most specific `needs:*` label
            (needs:info, needs:repro, needs:decision, needs:design, needs:customer, needs:spec).

            Prefer questions over a guessed plan. A confident plan built on an
            assumption you never checked costs far more than one extra round-trip.

            ## An Epic or an Initiative

            When the issue type is Epic or Initiative, the plan is the split.
            After the plan, propose the child issues under
              #### Proposed children
            as ONE fenced block whose info string is `children`, holding a
            JSON array. Each entry has exactly these keys:

              repo   the repository name the child belongs in; omit it for
                     this repository
              type   Feature, Improvement, Task, Chore, Spike or Bug
                     (an Initiative's children are Epic)
              title  specific and searchable, led by feat:, fix: or chore:
              areas  area labels from the vocabulary above, for this repo
              plan   one line: what the child delivers

            Two to twenty children, each independently shippable. Then write:
            "Apply `agent:decompose` to create these as sub-issues."

            YOU NEVER CREATE AN ISSUE, and never apply `agent:decompose`
            yourself. A person reads the list and confirms with the label, and
            a script files exactly what the block says. A person may correct
            the list by posting a new block; the newest one wins.

            ## Work in another repository

            When this plan cannot ship until something exists in another repo
            of the org (an endpoint, a table, a shared contract), say so under
              #### Blocked by
            as ONE fenced block whose info string is `blocked-by`, holding a
            JSON array. Each entry has `repo` (the repository name) and either
              number  the issue there that delivers it, when the issue body or
                      a link names one
              title   and `plan`, one line, when you know of no such issue
            A step after you links each entry as "blocked by" on this issue.
            It finds a titled one by its exact title, and lists any it cannot
            find for a person to file. You never file one. You cannot read
            other repos; never guess a number.

            Plan only this repo's side. When the shared work is planned in the
            other issue, link it and do not restate it: one plan per piece of
            work, where the code lands. Leave the block out when nothing in
            another repo is needed. Its links keep the dispatcher off this
            issue until every blocker closes, so it can stay `Plan ready`.

            ## Labels are requests; fields are state

            Set `Triage state` and STOP THERE. Do NOT add an `agent:plan` label.
            It no longer exists. The field already says the issue is planned,
            and writing the same fact twice means the two disagree within weeks.

            `Triage state = Plan ready` is what makes an issue eligible for
            `agent:implement`, so setting it accurately is the whole contract.

            ## Fields

            Set Priority, Effort and Risk only where you can justify them from what
            you read. Leave a field unset rather than guessing. Triage output is
            read as evidence, and an unjustified value is worse than an empty one.
            Risk is at least High for auth, payments, RLS, migrations, or anything
            that loses data.

            Never invent an option name. The valid ones, exactly:

              Triage state  Needs triage | Needs info | Ready for plan |
                            Plan ready | Ready for agent | Blocked
              Priority      Urgent | High | Medium | Low
              Effort        High | Medium | Low
              Risk          Low | Medium | High | Critical

            Set them with the GraphQL setIssueFieldValue mutation. Resolve the ids
            from the REPOSITORY, not the organisation:

              gh api graphql -f query='query($o:String!,$r:String!){
                repository(owner:$o,name:$r){ issueFields(first:50){ nodes{
                  ... on IssueFieldSingleSelect { id name options{ id name } }
                } } } }' -f o='${{ github.repository_owner }}' -f r='${{ github.event.repository.name }}'

            Three things that will otherwise cost you the whole triage:

            - `/orgs/${{ github.repository_owner }}/issue-fields` returns
              403 `Resource not accessible by integration` for THIS token. The
              GitHub App this job runs as holds repo-scoped permissions only and
              has no organisation permission at all, so every /orgs/* endpoint is
              closed to it, REST and GraphQL alike. The repository query above
              returns the same org-level fields with the same ids. Do not fall
              back to the org path, and do not report the fields as unsettable:
              if the query above fails, say so and fail, because the fallback you
              are reaching for cannot work.
            - The ids must be GRAPHQL NODE IDS (`IFSS_…`, `IFSSO_…`). The REST
              catalog hands out numeric database ids and the mutation rejects
              them with "Could not resolve to a node with the global id of ...".
              The query above already returns the right kind.
            - The mutation argument is `issueFields`, but the key INSIDE each
              entry is `fieldId`, not `issueFieldId`. Easy to misread, and the
              error it produces does not point at the cause.

            A worked call, both fields in one mutation:

              gh api graphql -f query='mutation{ setIssueFieldValue(input:{
                issueId:"<issue node id>", issueFields:[
                  {fieldId:"IFSS_…", singleSelectOptionId:"IFSSO_…"},
                  {fieldId:"IFSS_…", singleSelectOptionId:"IFSSO_…"}
                ]}){ clientMutationId } }'

            `Triage state` is not optional. This job FAILS if it is still unset
            when you finish, and it is right to. A triage pass that did not
            record its own state is a triage pass nobody downstream can act on.

            ## Finally

            Remove the `agent:triage` label if it is present. It means "triage
            requested / in progress"; leaving it on makes a finished issue look
            like it is still being worked. Do NOT add it yourself. It is an
            input, not a record of what you did.

            Keep the comment tight. No preamble, no restating the issue back.

      # A triage pass that did not record its own state is a failed triage and
      # must look like one. Without this the job reports SUCCESS with the fields
      # unwritten, and the break surfaces days later as `agent:implement`
      # refusing the issue, long after the run that caused it.
      #
      # The read is repo-scoped on purpose. It must use the same token the agent
      # had, or it would pass where the agent failed. No `if:`, so it runs only
      # when the agent step succeeded, which is the one case where a green job
      # would otherwise mislead.
      - name: Verify triage recorded its state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          NUM:      ${{ inputs.issue-number || github.event.issue.number }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"; name="${REPO##*/}"
          # shellcheck disable=SC2016  # $o/$r/$n are GraphQL variables, not shell
          state=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){
            repository(owner:$o,name:$r){ issue(number:$n){
              issueFieldValues(first:50){ nodes{
                ... on IssueFieldSingleSelectValue {
                  name field { ... on IssueFieldSingleSelect { name } } } } } } } }' \
            -f o="$owner" -f r="$name" -F n="$NUM" \
            --jq '[.data.repository.issue.issueFieldValues.nodes[]
                   | select(.field.name == "Triage state") | .name] | first // ""')

          if [ -n "$state" ]; then
            echo "Triage state = $state"
            # Only Needs info and Blocked wait on someone, and `needs:decision`
            # or `needs:design` is how a Blocked issue says on what. On any
            # other state a `needs:*` would let every later comment through the
            # gate as an answer, so the step clears it instead of trusting the
            # agent to.
            if [ "$state" != "Needs info" ] && [ "$state" != "Blocked" ]; then
              gh api "/repos/$REPO/issues/$NUM/labels" --jq '.[].name | select(startswith("needs:"))' |
                while IFS= read -r l; do
                  gh api -X DELETE "/repos/$REPO/issues/$NUM/labels/$(jq -rn --arg l "$l" '$l|@uri')" >/dev/null
                  echo "cleared $l"
                done || echo "::warning title=needs labels::could not clear the needs:* labels on #$NUM; clear them by hand or later comments re-run triage"
            fi
            exit 0
          fi

          echo "::error title=Triage did not set Triage state::$REPO#$NUM came out of triage with \`Triage state\` unset, so it is not eligible for \`agent:implement\` and no one downstream can act on it. Usual cause: the agent could not resolve issue-field ids. Resolve them from repository(owner,name){ issueFields }, because /orgs/*/issue-fields is 403 for this token."
          exit 1

      # The cross-repo blockers the plan named, applied as GitHub issue
      # dependencies by a script, not the agent: the agent's token is scoped to
      # this repo, and the dispatcher skips an issue with an open blocker. A
      # blocker named by title that does not exist is listed for a person, not
      # filed (DODI-00069). No App, or no block, links nothing and fails nothing.
      # Most plans name no other repo: look first, with this repo's token, so
      # the org-wide write token is minted only when there is a block to link.
      - id: block
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          NUM:      ${{ inputs.issue-number || github.event.issue.number }}
        run: |
          set -euo pipefail
          has=$(gh api --paginate "/repos/$REPO/issues/$NUM/comments?per_page=100" | jq -s '
            [add // [] | .[] | select(.user.login | endswith("[bot]"))
             | select(.body | test("(?m)^#{2,4}\\s+Plan\\s*$|^\\s*```+\\s*blocked-by\\s*$"))]
            | last // {} | (.body // "") | test("(?m)^\\s*```+\\s*blocked-by\\s*$")') || has=true
          echo "has=$has" >> "$GITHUB_OUTPUT"
      - id: org
        if: steps.block.outputs.has == 'true'
        uses: dodi-smart/.github/actions/app-token@pinned/v1.52.0
        with:
          client-id:        ${{ secrets.GH_APP_CLIENT_ID }}
          private-key:      ${{ secrets.GH_APP_PRIVATE_KEY }}
          permissions:      'issues:write'
          all-repositories: ${{ inputs.blocker-repos == '' && 'true' || 'false' }}
          repositories:     ${{ inputs.blocker-repos }}
      - name: Link cross-repo blockers
        if: steps.org.outputs.token != ''
        uses: dodi-smart/.github/actions/factory@pinned/v1.52.0
        with:
          command:       link
          issue:         ${{ inputs.issue-number || github.event.issue.number }}
          token:         ${{ steps.org.outputs.token }}
          authors:       claude[bot] ${{ steps.org.outputs.login }}
          blocker-repos: ${{ inputs.blocker-repos }}
