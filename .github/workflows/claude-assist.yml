# Reusable: the general-purpose assistant, for `@claude <anything>`.
#
# This is the widest agent surface in the org. It answers any mention, so it
# checks `agent:no-touch` like every other agent workflow. A kill switch with
# one hole in it is not a kill switch.
#
# It also has to decline the verbs other workflows own, or `@claude triage`
# runs both this and triage on the same comment. That list is
# `reserved-commands` below, and it lives here rather than in each repo.
#
# Called by a thin wrapper in each repo:
#   jobs:
#     assist:
#       uses: dodi-smart/.github/.github/workflows/claude-assist.yml@v1
#       secrets: inherit
name: Claude Assist

on:
  workflow_call:
    inputs:
      runner-weight:
        type: string
        default: "light"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""
      # Verbs owned by another workflow. Adding one here is the only change
      # needed to teach every repo about a new command.
      reserved-commands:
        type: string
        default: "triage plan implement"
      model:
        type: string
        default: ""       # empty: actions/pick-model chooses by stage and the issue's fields
      timeout-minutes:
        type: number
        default: 20
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }
      AGENT_ENV_SECRET:        { required: false }   # KEY=VALUE lines for the agent alone

concurrency:
  group: assist-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Every job grants its own, so one added later starts with nothing.
permissions: {}

jobs:
  # The picker runs INSIDE this job, after the last step that can still say
  # no, so it never runs for an event that will not proceed.
  # The gate runs on the light pool of a private repo and on a hosted runner
  # otherwise (a public repo, or a fork PR, which the pool cannot serve). The
  # `if:` below is a cheap pre-filter on the event payload alone, so an event the
  # gate would only stop costs no runner at all. It is strictly narrower than the
  # gate: every rule the gate keeps (`agent:no-touch` first, then the rest) still
  # runs for an event that passes it, and nothing the gate posts is skipped.
  gate:
    if: >-
      github.event.action != 'labeled'
      && !(endsWith(github.event.issue.user.login || github.event.pull_request.user.login, '[bot]') || startsWith(github.event.issue.user.login || github.event.pull_request.user.login, 'app/'))
      && contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude')
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10   # the picker calls the org API and may retry
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      runner:  ${{ steps.pick.outputs.runner }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.30.2
        with:
          selector: light

      - id: gate
        uses: dodi-smart/.github/actions/agent-gate@pinned/v1.30.2
        with:
          # An issue and a PR keep their labels in different places. Whichever
          # is absent is an empty list, so the kill switch reads the right one.
          labels: ${{ github.event.issue.number && toJson(github.event.issue.labels.*.name) || toJson(github.event.pull_request.labels.*.name) }}
          event-name:   ${{ github.event_name }}
          event-action: ${{ github.event.action }}
          author:       ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
          # The body to search differs by event. `||` takes the first
          # non-empty of comment, review, or the issue itself.
          comment: >-
            ${{ github.event.comment.body
             || github.event.review.body
             || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
          mention: '@claude'
          exclude-commands: ${{ inputs.reserved-commands }}
          bots: 'reject'
          skip-draft: 'false'

      # Only when the run above is still proceeding: a kill-switched or
      # reserved-verb mention must never pay for a hosted picker.
      - id: pick
        if: steps.gate.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.30.2
        with:
          weight:             ${{ inputs.runner-weight }}
          labels:             ${{ inputs.runner-labels }}
          gh-app-client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  assist:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.gate.outputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.30.2
        with:
          selector: ${{ needs.gate.outputs.runner }}

      # Credentials persist on purpose: the action runs `git fetch` from this checkout before the agent starts.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }

      # No `prompt`. With none supplied the action follows the instruction in
      # the comment that mentioned it, which is the point of this workflow.
      - uses: dodi-smart/.github/actions/run-agent@pinned/v1.30.2
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          stage: assist
          model: ${{ inputs.model }}
          model-pin: ${{ vars.AGENT_MODEL_PIN }}
          org-plugins:             ${{ vars.AGENT_PLUGINS }}
          org-plugin-marketplaces: ${{ vars.AGENT_PLUGIN_MARKETPLACES }}
          agent-env:               ${{ vars.AGENT_ENV }}
          agent-env-secret:        ${{ secrets.AGENT_ENV_SECRET }}
          prompt: ''
          additional-permissions: |
            actions: read
