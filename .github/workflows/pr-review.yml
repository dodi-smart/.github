# Reusable: second-opinion review on a pull request.
#
# Uses Anthropic's maintained `code-review` plugin rather than a hand-written
# prompt. The gate's job is to decide WHETHER to review and HOW DEEPLY; what a
# good review looks like is the plugin's problem, and it is better at it.
#
# Triggers are deliberately narrow. Reviewing on every push is what gets a review
# bot muted, and a muted bot reviews nothing (DODI-00005). The caller fires this
# on `ready_for_review` and on the `agent:review` label — never on `synchronize`.
name: PR Review

on:
  workflow_call:
    inputs:
      # Runner selection, passed through to the shared picker. Override per repo
      # when the preset does not fit this stack — e.g. an Android build needing an
      # SDK-bearing image, or a job needing the `docker` label.
      runner-weight:
        type: string
        default: "light"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""       # explicit selector; wins over runner-weight

      # Effort passed to /code-review. low|medium: fewer, high-confidence
      # findings. high|xhigh|max: broader coverage, may include uncertain ones.
      level:           { type: string, default: "medium" }
      elevated-level:  { type: string, default: "high" }

      # Paths that earn `elevated-level`, as an ERE matched against changed files.
      #
      # The default is deliberately stack-agnostic: it names CONCEPTS that are
      # sensitive in any language — credentials, money, permissions, crypto,
      # request boundaries, schema changes, CI and deploy config. Override it per
      # repo; a Rust CLI, an Android app and a Next.js site do not share a
      # vocabulary, and a pattern that matches nothing silently downgrades every
      # review to the base level.
      sensitive-paths:
        type: string
        default: >-
          (auth|login|signup|session|token|jwt|oauth|saml|password|credential|secret|vault|keystore|
          payment|billing|invoice|checkout|subscription|payout|
          permission|role|policy|acl|rbac|tenant|
          crypt|cipher|sign|hash|
          migration|schema|
          middleware|proxy|cors|csp|webhook|
          Dockerfile|entrypoint|\.github/workflows|deploy)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }

concurrency:
  group: review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.c.outputs.proceed }}
      level:   ${{ steps.c.outputs.level }}
      reason:  ${{ steps.c.outputs.reason }}
      ci:      ${{ steps.ci.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: c
        env:
          DRAFT:     ${{ github.event.pull_request.draft }}
          AUTHOR:    ${{ github.event.pull_request.user.login }}
          LABELS:    ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE:      ${{ github.event.pull_request.base.sha }}
          HEAD:      ${{ github.event.pull_request.head.sha }}
          SENSITIVE: ${{ inputs.sensitive-paths }}
          LEVEL:     ${{ inputs.level }}
          ELEVATED:  ${{ inputs.elevated-level }}
        run: |
          set -euo pipefail
          proceed=true; level="$LEVEL"; reason=""

          if printf '%s' "$LABELS" | grep -q '"agent:no-touch"'; then
            proceed=false; reason="agent:no-touch"
          elif [ "$DRAFT" = "true" ]; then
            proceed=false; reason="draft"
          elif printf '%s' "$AUTHOR" | grep -qiE 'renovate|dependabot'; then
            # deps-verify owns these; reviewing them here would double-cover.
            proceed=false; reason="bot dependency PR"
          fi

          if [ "$proceed" = "true" ]; then
            files=$(git diff --name-only "$BASE" "$HEAD" || true)
            if [ -z "$files" ]; then
              proceed=false; reason="no changed files"
            elif ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
              proceed=false; reason="docs only"
            fi
          fi

          if [ "$proceed" = "true" ]; then
            # Collapse the multi-line default into one ERE before matching.
            pattern=$(printf '%s' "$SENSITIVE" | tr -d '[:space:]')
            if printf '%s\n' "$files" | grep -qiE "$pattern"; then
              level="$ELEVATED"; reason="sensitive paths touched"
            fi
            if printf '%s' "$LABELS" | grep -q '"sec:'; then
              level="$ELEVATED"; reason="sec: label"
            fi
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "level=$level"     >> "$GITHUB_OUTPUT"
          echo "reason=$reason"   >> "$GITHUB_OUTPUT"
          echo "decision: proceed=$proceed level=$level ${reason:+($reason)}"

      # Why CI failed, gathered deterministically and handed to the reviewer.
      # A reviewer that can see the failing check reviews the actual problem
      # instead of the diff in the abstract. Annotations carry file, line and
      # message, which is far more usable than scraping raw logs.
      #
      # Kept to ONE LINE on purpose: this value is interpolated into
      # claude_args, which is a shell-style argument string. A multi-line or
      # quote-bearing value would break the quoting and take the whole step with it.
      - id: ci
        if: steps.c.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          runs=$(gh api "/repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                 --jq '[.check_runs[] | {name, conclusion, id}]' 2>/dev/null || echo '[]')
          failed=$(jq -c '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")]' <<<"$runs")
          n=$(jq 'length' <<<"$failed" 2>/dev/null || echo 0)

          if [ "${n:-0}" = "0" ]; then
            echo "summary=CI on this PR is green." >> "$GITHUB_OUTPUT"
            echo "no failing checks"; exit 0
          fi

          out="CI on this PR is FAILING ($n check(s))."
          for id in $(jq -r '.[].id' <<<"$failed"); do
            name=$(jq -r --argjson i "$id" '.[]|select(.id==$i)|.name' <<<"$failed")
            # The run id is the useful handle: annotations are often just
            # "Process completed with exit code 1", which explains nothing. Give
            # the reviewer the id so it can fetch the real log with the tools it
            # has been allowed.
            runid=$(gh api "/repos/$REPO/check-runs/$id" \
                    --jq '.details_url | capture("/runs/(?<r>[0-9]+)") | .r' 2>/dev/null || echo "")
            out="$out  ||  CHECK '$name'"
            [ -n "$runid" ] && out="$out (run $runid)"
            out="$out:"
            ann=$(gh api "/repos/$REPO/check-runs/$id/annotations" \
                  --jq '.[] | "\(.path):\(.start_line) \(.annotation_level) \(.message)"' 2>/dev/null \
                  | head -8 | tr '\n' ' ' | tr -d '"' | cut -c1-700)
            [ -n "$ann" ] && out="$out $ann"
          done
          out="$out  ||  Annotations are often just 'Process completed with exit code 1'. Fetch the real output with: gh run view <run id> --log-failed"

          # Collapse to one line and drop quotes, so it survives interpolation.
          out=$(printf '%s' "$out" | tr '\n' ' ' | tr -d '"\r' | cut -c1-3000)
          echo "summary=$out" >> "$GITHUB_OUTPUT"
          echo "collected $n failing check(s)"

  pick-runner:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    uses: dodi-smart/.github/.github/workflows/pick-runner.yml@main
    with:
      weight: ${{ inputs.runner-weight }}
      labels: ${{ inputs.runner-labels }}
    secrets: inherit

  review:
    needs: [gate, pick-runner]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          additional_permissions: |
            actions: read
          display_report: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The CI context goes in via --append-system-prompt rather than the
          # prompt, so the plugin's slash command stays exactly as the plugin
          # expects it. Tools are allowed so the reviewer can pull a full log
          # when the annotations are not enough.
          claude_args: >-
            --allowed-tools "Bash(gh run:*)" "Bash(gh pr:*)" "Bash(gh api:*)" "Bash(cat:*)" "Bash(grep:*)" "Bash(rg:*)" Read Grep Glob
            --append-system-prompt "${{ needs.gate.outputs.ci }}
            When CI is failing, diagnose the cause and say which change caused it and how to fix it. Lead with that — it is more useful than anything else you could report. Do not repeat a failure the annotations already state verbatim; explain it."
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} ${{ needs.gate.outputs.level }}'
