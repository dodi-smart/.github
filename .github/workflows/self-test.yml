# The standard tests itself.
#
# Everything here is deterministic and hosted-only. This repo is public, and a
# public repo never touches a self-hosted runner.
#
# No push trigger: Publish release calls this before it moves `v1`.
name: Self test

# No `paths:` filter on purpose. The run is short, and two of the
# checks read files a filter would have to list: the preset check compares the
# README runner table against the picker, so a README-only change can break it.
# A filter also makes this unusable as a required check, since a filtered-out
# pull request produces no check run at all and could never merge.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push cancels a pull request's run. Any other run gets a group of its
# own, so the run a release waits on is never cancelled and never shares a group.
concurrency:
  group: self-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The python steps import their helpers from here (lib.py), and leave no
      # bytecode behind in the checkout.
      PYTHONPATH: .github/selftest
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      # The beta plugins the shared config pins (commit-analyzer, release-notes-generator)
      # require Node ^22.22.2 or >=24.15. Node 24 satisfies that everywhere the
      # rest of this job needs Node, including the release config parse below.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Shared semantic-release config tests
        run: npm test

      # Every actions/*/test.sh and scripts/*.test.sh, four at a time. Each writes its own
      # log and the logs print in order, so the output does not interleave. The scripts
      # share nothing: each makes its own temp dir and runs git and gh under its own HOME.
      # REAL=1 is read by commitlint/test.sh alone: it also installs the pinned set and
      # lints with the real commitlint (the preset declares no dependency, so only that
      # proves it resolves config-conventional). Without it that section is skipped and
      # nothing fails, which the commitlint step below asserts.
      # Under `set -o pipefail`, `cmd | head` kills `cmd` with SIGPIPE whenever head exits
      # first, so `x=$(cmd | head -n 1)` exits the script at random under load. Take the
      # first line with `sed -n 1p`, which reads all input, or drain the rest with `cat`.
      - name: No shipped script cuts a pipe short with head
        run: |
          set -euo pipefail
          if hits=$(grep -nE '\|[[:space:]]*\{?[[:space:]]*head([[:space:]]|$)' actions/*/*.sh scripts/*.sh \
                      | grep -v -e '/test\.sh:' -e '\.test\.sh:' | grep -v 'cat >/dev/null'); then
            echo "::error::a pipe into head can kill its writer with SIGPIPE under pipefail; use sed -n 1p:"
            echo "$hits"; exit 1
          fi
          echo "no shipped script pipes into head without draining the rest"

      - name: Shell tests, four at a time
        env:
          REAL: "1"
        run: |
          set -euo pipefail
          logs="$(mktemp -d "${TMPDIR:-/tmp}/shell-tests.XXXXXX")"
          export logs
          # shellcheck disable=SC2016
          printf '%s\0' actions/*/test.sh scripts/*.test.sh |
            xargs -0 -n1 -P4 bash -c '
              base="$logs/${1//\//__}"
              rc=0
              "./$1" >"$base.log" 2>&1 || rc=$?
              echo "$rc" >"$base.rc"
            ' _
          failed=()
          for t in actions/*/test.sh scripts/*.test.sh; do
            base="$logs/${t//\//__}"
            # No .rc file means the script was killed (out of memory, say), not that it passed.
          rc="$(cat "$base.rc" 2>/dev/null || echo 255)"
            if [ "$rc" -eq 0 ]; then
              echo "::group::$t"
              cat "$base.log"
              echo "::endgroup::"
            else
              echo "::error::$t exited $rc"
              cat "$base.log"
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi
          echo "every shell test passed"

      # The model ids live in pick-model. A workflow that names one, or calls
      # run-agent without a stage or the org pin, drifts from the policy
      # without anyone deciding it.
      - name: Every agent run goes through the model policy and gets the org's plugins and env
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, yaml
          bad = []
          expr = lambda e: '$' + '{{ ' + e + ' }}'
          files = glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')
          for f in files:
              if f.startswith('actions/pick-model/'):
                  continue
              text = open(f).read()
              for n, line in enumerate(text.splitlines(), 1):
                  if re.search(r'claude-(opus|sonnet|haiku)-', line):
                      bad.append('%s:%d names a model id; the ids live in actions/pick-model' % (f, n))
              doc = yaml.safe_load(text) or {}
              steps = [s for j in (doc.get('jobs') or {}).values() if isinstance(j, dict) for s in j.get('steps', [])]
              for s in steps:
                  if 'actions/run-agent@' not in str(s.get('uses', '')):
                      continue
                  w = s.get('with') or {}
                  if not w.get('stage'):
                      bad.append('%s: a run-agent step passes no stage' % f)
                  # Built at run time: Actions would expand a literal expression in this script.
                  if w.get('model-pin') != expr('vars.AGENT_MODEL_PIN'):
                      bad.append('%s: a run-agent step does not forward vars.AGENT_MODEL_PIN' % f)
                  org = {'org-plugins': expr('vars.AGENT_PLUGINS'),
                         'org-plugin-marketplaces': expr('vars.AGENT_PLUGIN_MARKETPLACES'),
                         'agent-env': expr('vars.AGENT_ENV'),
                         'agent-env-secret': expr('secrets.AGENT_ENV_SECRET')}
                  for k, v in org.items():
                      if w.get(k) != v:
                          bad.append('%s: a run-agent step does not forward %s as %s' % (f, k, v))
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)
          print('every run-agent call passes a stage, the pin and the org plugins and env, and no file names a model id')
          PY

      # A pull request that can change the config it is linted by, or make CI
      # install a package, controls the check. Callers get the action defaults.
      - name: commitlint reads the base config, installs nothing unpinned and does not cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from lib import load
          bad = []
          doc = load('actions/commitlint/action.yml')
          expr = '$' + '{{ github.event.pull_request.base.sha }}'
          if doc['inputs']['ref']['default'] != expr:
              bad.append('the ref input does not default to the pull request base sha')
          if 'npm install' in open('actions/commitlint/lint.sh').read():
              bad.append('lint.sh runs npm install; the pinned set is installed by npm ci only')
          steps = doc['runs']['steps']
          if any(str(s.get('uses', '')).startswith('actions/cache@') for s in steps):
              bad.append('the commitlint action caches node_modules; a PR-ref cache is unreadable by other PRs')
          # Without REAL=1 the real-install section of test.sh is skipped and nothing fails.
          me = load('.github/workflows/self-test.yml')['jobs']['test']['steps']
          if not any('actions/*/test.sh' in s.get('run', '') and s.get('env', {}).get('REAL') == '1' for s in me):
              bad.append('the Self test step that runs the shell tests does not set REAL=1, so commitlint/test.sh skips its real install')
          if bad:
              print('\n'.join(bad)); raise SystemExit(1)
          print('commitlint reads the config at the base sha, never runs npm install, has no cache and runs the real install')
          PY

      # The agent writes; steps push, ready and merge. An agent job that holds a
      # write token beside the agent, or pushes outside a guarded push step, is
      # how that line moves without anyone deciding it. Merges are asserted by
      # the merge-gate step below.
      - name: Agents never push, and pr-iterate merges only through merge-gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, yaml
          from lib import checkout_ok
          bad = []
          gate = yaml.safe_load(open('.github/workflows/pr-iterate.yml'))['jobs']['gate']
          if any(gate['permissions'].get(k) == 'write' for k in gate['permissions']):
              bad.append('pr-iterate gate holds a write token; its writes go through the App')
          land = [s for s in gate['steps'] if s.get('id') == 'land']
          if not land or 'actions/merge-gate@' not in land[0].get('uses', '') or land[0]['with'].get('policy') != 'factory':
              bad.append('pr-iterate must land through merge-gate with policy factory')
          # claude-code-action rejects a status event, so a fix decided on one
          # must be relayed to a labeled event, never handed to the fix job.
          route = [s for s in gate['steps'] if s.get('id') == 'route']
          if not route or 'status/fix-ci|status/fix-review) action=relay' not in route[0].get('run', ''):
              bad.append('pr-iterate must relay a fix decided on a status event')
          if 'route.outputs.action' not in str((gate.get('outputs') or {}).get('action', '')):
              bad.append('pr-iterate gate must publish the routed action, not the raw decision')
          pushes = {'issue-implement.yml': 'actions/factory@', 'pr-iterate.yml': 'actions/push-round@'}
          for f, job in (('issue-implement.yml', 'implement'), ('pr-iterate.yml', 'fix')):
              j = yaml.safe_load(open('.github/workflows/' + f))['jobs'][job]
              if (j.get('permissions') or {}).get('contents') != 'read':
                  bad.append('%s %s: the agent job holds contents write; pushes go through the factory step' % (f, job))
              co = [s for s in j['steps'] if 'actions/checkout@' in str(s.get('uses', ''))][0]
              if not checkout_ok(co):
                  bad.append('%s %s: checkout persists credentials beside the agent' % (f, job))
              if not any(s.get('id') == 'push' and pushes[f] in str(s.get('uses', '')) for s in j['steps']):
                  bad.append('%s %s: no guarded push step (%s)' % (f, job, pushes[f]))
              agent = [s for s in j['steps'] if 'run-agent@' in str(s.get('uses', ''))][0]
              if (agent.get('with') or {}).get('track-progress') == 'true':
                  bad.append('%s %s: track-progress forces tag mode, which pushes its own branch' % (f, job))
              # One holdout list per issue: the shared file conflicted between agent PRs.
              if re.search(r'\.factory/holdout(?!\.d/)', str((agent.get('with') or {}).get('prompt', ''))):
                  bad.append('%s %s: the prompt names the shared .factory/holdout, not .factory/holdout.d/<issue>' % (f, job))
          hold = [s for s in yaml.safe_load(open('.github/workflows/pr-iterate.yml'))['jobs']['fix']['steps'] if s.get('id') == 'holdout']
          if not hold or 'needs.gate.outputs.issue' not in str((hold[0].get('with') or {}).get('issue', '')):
              bad.append('pr-iterate fix: the holdout step must pass the PR issue')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('the agent jobs cannot push, and pr-iterate lands through merge-gate')
          PY

      # A conflicted agent PR is brought up to date by a merge round and nothing
      # else: a rebase or force-push rewrites what the loop counted and a
      # reviewer read, and the update job holds no token that pushes by itself.
      # Also: the sweep can reach the gate (it takes `schedule`), and merge-gate
      # squashes a factory PR, pinned to the head it read.
      - name: A conflicted agent PR is merged into, never rebased or forced
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys, yaml
          from lib import checkout_ok
          bad = []
          wf = yaml.safe_load(open('.github/workflows/pr-iterate.yml'))
          upd = wf['jobs'].get('update')
          if not upd:
              bad.append('pr-iterate has no update job')
          else:
              if (upd.get('permissions') or {}).get('contents') == 'write':
                  bad.append('pr-iterate update holds contents write; its push goes through push-round')
              if upd.get('needs') != ['gate'] or "action == 'update'" not in str(upd.get('if', '')):
                  bad.append('pr-iterate update must need the gate and run only on the update action')
              steps = upd.get('steps') or []
              co = [x for x in steps if 'actions/checkout@' in str(x.get('uses', ''))]
              if not co or not checkout_ok(co[0]):
                  bad.append('pr-iterate update checks out with persisted credentials')
              push = [x for x in steps if 'actions/push-round@' in str(x.get('uses', ''))]
              if len(push) != 1 or str((push[0].get('with') or {}).get('merge')) != 'true':
                  bad.append('pr-iterate update must push only through push-round with merge: true')
              if any(re.search(r'\bgit\s+push\b', str(x.get('run', ''))) for x in steps):
                  bad.append('pr-iterate update pushes outside push-round')
          gate = wf['jobs']['gate']
          agate = [x for x in gate['steps'] if 'agent-gate@' in str(x.get('uses', ''))][0]
          events = str((agate.get('with') or {}).get('events', '')).split()
          if 'schedule' not in events:
              bad.append('pr-iterate agent-gate events omit schedule, so the sweep never proceeds')
          sweep = [x for x in gate['steps'] if x.get('id') == 'sweep']
          if not sweep or (sweep[0].get('with') or {}).get('command') != 'sweep':
              bad.append('pr-iterate gate has no sweep step')
          # No rebase or force-push in the files the update job runs (tests aside).
          pats = [r'\bgit\s+rebase\b', r'\bpush\b[^\n]*\s(-[a-zA-Z]*f[a-zA-Z]*|--force\S*)(\s|$)', r'\+HEAD:']
          files = ['.github/workflows/pr-iterate.yml'] + [f for f in glob.glob('actions/push-round/*') + glob.glob('actions/factory/*')
                                                          if not f.endswith('test.sh')]
          for f in files:
              text = open(f).read()
              for pat in pats:
                  if re.search(pat, text):
                      bad.append(f + ' rebases or force-pushes (' + pat + ')')
          # merge-gate: a factory PR is squashed, pinned to the head it read.
          mg = yaml.safe_load(open('actions/merge-gate/action.yml'))['runs']['steps']
          run = [x for x in mg if x.get('id') == 'merge'][0]['run']
          factory, _, deps = run.partition('else')
          if '--squash' not in factory or 'factory' not in factory:
              bad.append('merge-gate must squash a factory PR')
          if '--rebase' not in deps or '--squash' in deps:
              bad.append('merge-gate must keep rebasing a dependency PR')
          merges = [l for l in run.splitlines() if 'gh pr merge' in l]
          if not merges or any('--match-head-commit' not in l for l in merges):
              bad.append('merge-gate must pin every merge with --match-head-commit')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('a conflicted agent PR is merged into through push-round, and a factory PR lands by squash')
          PY

      # The deploy holds a signing key on a machine other jobs share, so how it
      # runs is asserted, not reviewed: nothing granted at the top, no persisted
      # checkout token, every third-party action on a commit SHA, the cleanup last
      # and unconditional. Its pool and first step are the runner step's.
      - name: android-deploy is confined, pinned and cleans up on every outcome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          from lib import load, D, checkout_ok
          path = '.github/workflows/android-deploy.yml'
          src = open(path).read()
          doc = load(path)
          bad = []
          job = doc['jobs']['deploy']
          steps = job['steps']
          if doc.get('permissions') != {}:
              bad.append('the workflow has no top-level permissions: {}')
          if job.get('permissions') != {'contents': 'write'}:
              bad.append('the job holds more than contents: write')
          checkouts = [s for s in steps if str(s.get('uses', '')).startswith('actions/checkout@')]
          if len(checkouts) != 1 or not checkout_ok(checkouts[0]):
              bad.append('the checkout does not set persist-credentials: false')
          cleanup = [s for s in steps if 'rm -rf' in str(s.get('run', ''))]
          if len(cleanup) != 1 or str(cleanup[0].get('if', '')).strip() not in ('always()', D + 'always() }}'):
              bad.append('the step that deletes the secrets is not if: always()')
          elif steps[-1] is not cleanup[0]:
              bad.append('the cleanup is not the last step, so a later step could leave a secret behind')
          # Signing goes through gradle.properties in the isolated Gradle home: a -P
          # argument is readable by every process on the machine, and an env var
          # reaches every process the build starts.
          runs = ' '.join(str(s.get('run', '')) + str(s.get('env', '')) for s in steps)
          if '-Pandroid.injected' in runs or 'ORG_GRADLE_PROJECT_android' in runs:
              bad.append('signing reaches Gradle as an argument or an environment variable')
          setup = [s for s in steps if str(s.get('uses', '')).startswith('dodi-smart/.github/actions/setup-stack@')]
          if len(setup) != 1 or str((setup[0].get('with') or {}).get('isolate')).lower() != 'true':
              bad.append('setup-stack is not isolated, so the signing build would share a Gradle home with pull request builds')
          # Third-party actions that see secrets are on a full commit SHA. The first-party
          # ones (actions/*, dodi-smart/*) stay on this repo's tag convention.
          sha = re.compile(r'^[\w.-]+/[\w./-]+@[0-9a-f]{40}$')
          action = load('actions/android-distribute/action.yml')['runs']['steps']
          for where, ss in ((path, steps), ('actions/android-distribute/action.yml', action)):
              for s in ss:
                  u = str(s.get('uses', ''))
                  if u and not u.startswith(('actions/', 'dodi-smart/')) and not sha.match(u):
                      bad.append(where + ': ' + u + ' is third-party and not pinned to a 40-hex commit SHA')
          # firebase-tools is pinned in one place; the renovate step proves a manager reads it.
          if src.count('FIREBASE_TOOLS_VERSION:') != 1:
              bad.append('firebase-tools is not pinned exactly once')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('android-deploy: permissions: {}, no persisted token, SHA-pinned secrets actions, cleanup last and always')
          PY

      # `sticky-comment` is read only in tag mode, which a non-empty `prompt`
      # switches off. The pair costs a full agent run and posts nothing.
      # run-agent refuses it at runtime; this catches it at review time.
      - name: No workflow asks for a sticky comment it will not get
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              doc = yaml.safe_load(open(f)) or {}
              for job in (doc.get('jobs') or {}).values():
                  for step in (job.get('steps') or []) if isinstance(job, dict) else []:
                      if 'run-agent@' not in str(step.get('uses', '')):
                          continue
                      w = step.get('with') or {}
                      if str(w.get('sticky-comment')) == 'True' or w.get('sticky-comment') == 'true':
                          if str(w.get('prompt', '')).strip():
                              bad.append(f)
          if bad:
              print('::error::sticky-comment with a non-empty prompt in ' + ', '.join(bad)
                    + '. A prompt selects agent mode, which creates no comment. Use track-progress, or tell the agent to post.')
              sys.exit(1)
          print('no run-agent call combines sticky-comment with a prompt')
          "

      # PR Review published nothing on its first real run and then failed its own
      # guard. The agent had run fine. It had simply taken the plugin's documented
      # silent path, and the workflow had no way to tell that from a broken one.
      # The fix was to stop asking the agent to publish and start requiring a file.
      # If the prompt stops naming the file, or the verdict step stops reading the
      # same path, the silence comes straight back.
      - name: PR Review publishes through a file, not through the agent
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          steps = yaml.safe_load(open('.github/workflows/pr-review.yml'))['jobs']['review']['steps']

          agent = [s for s in steps if 'run-agent@' in str(s.get('uses', ''))][0]
          env = agent.get('env') or {}
          prompt = str(env.get('FULL_PROMPT', ''))
          for name in ('FULL_PROMPT', 'SCOPED_PROMPT'):
              for f in ('review-body.md', 'review-verdict.json'):
                  if f not in str(env.get(name, '')):
                      sys.exit('::error::the PR Review %s no longer asks the agent to write %s.' % (name, f))
          if 'review-body.md' not in prompt:
              sys.exit('::error::the PR Review prompt no longer asks the agent to write review-body.md. '
                       'That file is the only thing that reaches the pull request, so the review goes silent.')
          if '--comment' not in prompt:
              sys.exit('::error::the PR Review prompt lost --comment. Inline comments come from the '
                       'plugin steps that flag unlocks.')

          verdict = [s for s in steps if s.get('id') == 'verdict'][0]
          if 'review-body.md' not in verdict['run']:
              sys.exit('::error::the verdict step no longer reads review-body.md, so the agent writes a '
                       'file nobody posts.')

          guard = [s for s in steps if s.get('name', '').startswith('The review reached')][0]
          if 'steps.verdict.outputs.wrote' not in str(guard.get('if', '')):
              sys.exit('::error::the PR Review guard is not keyed on whether the agent wrote its verdict. '
                       'Counting comments cannot tell a silent review from a broken one.')

          # claude-code-action skips itself, reporting success, on any pull request
          # that changes a workflow file. Without this the guard blames the prompt.
          for s_ in (verdict, guard):
              if 'agent.outputs.execution-file' not in str(s_.get('env', {})):
                  sys.exit('::error::PR Review no longer reads run-agent execution-file, so a run the '
                           'action skipped is reported as the agent writing nothing.')
          print('PR Review requires the file it posts')
          "

          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('actions/run-agent/action.yml'))
          if 'execution-file' not in (doc.get('outputs') or {}):
              sys.exit('::error::run-agent no longer forwards execution-file. Its callers cannot then tell '
                       'an agent that ran and said nothing from one claude-code-action never started.')
          call = [s for s in doc['runs']['steps'] if 'claude-code-action@' in str(s.get('uses', ''))][0]
          if call.get('id') != 'agent':
              sys.exit('::error::the claude-code-action step in run-agent lost id: agent, so its outputs '
                       'resolve to empty and every run looks skipped.')
          print('run-agent forwards whether the agent ran')
          "

      # Counting a bot by a substring of its login is a trap. claude-code-action
      # posts under whichever app minted its token, and every one of these
      # workflows already declares GH_APP_CLIENT_ID. Wire those through and a
      # login match silently counts zero for work that did happen.
      - name: No workflow identifies its own bot by a login substring
        run: |
          set -euo pipefail
          # This file is excluded because it carries the pattern it looks for.
          if grep -rn 'user.login' .github/workflows/*.yml \
             | grep -v '^.github/workflows/self-test.yml:' \
             | grep -i 'contains("claude")'; then
            echo '::error::a workflow above matches its own comments by a login containing claude. Match .user.type or a marker in the body instead; the posting identity changes with the token.'
            exit 1
          fi
          echo 'no workflow matches its own bot by login substring'

      # A sparse checkout outlives its job in a persistent workspace. AGENTS.md.
      - name: No workflow or action checks out sparsely
        run: |
          set -euo pipefail
          if grep -rn '^ *sparse-checkout' .github/workflows actions --include='*.yml'; then
            echo '::error::the checkout above is sparse. Read the files from the contents API instead; see AGENTS.md.'
            exit 1
          fi
          echo 'no sparse checkout'

      # The dependency-bot list lived in four places in two shapes, and adding a
      # bot meant four edits, one of them easy to miss. The gate owns it now.
      # A login literal creeping back into a workflow is how the copies return.
      - name: The gate is the only place that lists dependency bots
        run: |
          set -euo pipefail
          python3 -c "
          import sys, re, glob, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              if f.endswith('self-test.yml'):
                  continue
              if re.search(r'renovate\[bot\]|dependabot\[bot\]|app/renovate', open(f).read()):
                  bad.append(f + ' names a dependency-bot login')
          wf = lambda n: yaml.safe_load(open('.github/workflows/' + n))['jobs']
          zsteps = yaml.safe_load(open('actions/zavet-check/action.yml'))['runs']['steps']
          author = [s for s in zsteps if s.get('id') == 'author']
          if not author or 'agent-gate@' not in str(author[0].get('uses', '')):
              bad.append('zavet-check no longer reads the author from agent-gate')
          if any(s.get('id') == 'mode' for s in zsteps):
              bad.append('zavet-check has its own mode step again')
          # The install is gated on need.outputs.install and the guards step asks
