# Reusable: resolve a runner weight to a runs-on selector. Static, no API call.
#
#   jobs:
#     pick-light:
#       uses: dodi-smart/.github/.github/workflows/pick-runner.yml@v1
#       with: { weight: light }
#       secrets: inherit
#     lint:
#       needs: [pick-light]
#       runs-on: ${{ fromJson(needs.pick-light.outputs.runner) }}
#
# A thin wrapper around `actions/pick-runner`, the composite action that does the
# actual work. It exists so a caller that already has a job (pr-checks.yml picks
# twice from inside its own `pick` job, for one) is not forced to run a second one
# just to reuse this logic. Inputs and outputs here are identical to the action's,
# and stay that way: every existing `uses:` of this workflow, and every internal
# one, is unaffected by the split.
#
# The pick is static, with no API call and no token, so this job runs on the light
# pool of a private repo instead of a GitHub-hosted runner. A public repo or a fork
# PR stays hosted.
name: Pick runner

on:
  workflow_call:
    inputs:
      # Semantic preset. Prefer this over `labels`, so re-tiering the fleet is
      # one edit here rather than an audit of every caller.
      #   light   lint, typecheck, checks, releases, reading a diff
      #   heavy   builds, Docker, full suites
      #   agent   review, triage, assist
      #   apple   Xcode, iOS, Swift, signing
      #   hosted  force GitHub-hosted, skip self-hosted entirely
      #
      # These name TIERS OF INTENT, not machine classes, and they select on
      # capability labels with NO architecture. A runner of any arch that joins
      # a pool is picked up without a change here.
      weight:
        type: string
        default: light

      # Escape hatch for a stack the presets do not describe, e.g. a job needing
      # the `docker` label, or an Android build needing an SDK-bearing image.
      # Wins over `weight` when non-empty. Validated like any other selector, so a
      # typo here is reported rather than silently downgraded to hosted.
      labels:
        type: string
        default: ""

      # DEPRECATED and ignored: a caller that still passes either gets a warning
      # naming it. They are removed once no caller passes them. Overflow is the
      # queue's job: the large pool also carries `light`, so there is no
      # fallback to choose.
      fallback:
        type: string
        default: ""
      fallback-when:
        type: string
        default: ""

      # The runner used whenever self-hosted is off the table: `weight: hosted`,
      # and the public-repo and fork-PR path. That path never reads `fallback`,
      # so `fallback` can never point it at our own hardware.
      hosted-runner:
        type: string
        default: "ubuntu-latest"

      # Self-hosted is refused on public repos by org policy and is unsafe for
      # fork PRs. Leave this on unless you know exactly why not.
      guard-public:
        type: boolean
        default: true

    outputs:
      runner:
        description: "JSON array of labels for runs-on, via fromJson()"
        value: ${{ jobs.pick.outputs.runner }}
      selector:
        description: "The resolved selector, for logging"
        value: ${{ jobs.pick.outputs.selector }}
      fell-back:
        description: "Always false. Kept so existing callers keep working."
        value: ${{ jobs.pick.outputs.fell-back }}

    # Accepted and ignored: the picker no longer reads the org runner list.
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  pick:
    name: Pick runner
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      runner:   ${{ steps.pick.outputs.runner }}
      selector: ${{ steps.pick.outputs.selector }}
      fell-back: ${{ steps.pick.outputs.fell-back }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.28.3
      - id: pick
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.28.3
        with:
          weight:        ${{ inputs.weight }}
          labels:        ${{ inputs.labels }}
          hosted-runner: ${{ inputs.hosted-runner }}
          guard-public:  ${{ inputs.guard-public }}
          fallback:      ${{ inputs.fallback }}
          fallback-when: ${{ inputs.fallback-when }}
