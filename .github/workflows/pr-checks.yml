# Reusable: the deterministic checks a pull request must pass.
#
# Replaces a hand-written ci.yml per repo. `concurrency:` stays with the
# CALLER, because it depends on that repo's branches. Do NOT add `paths-ignore`
# on the caller for a docs-only skip: this workflow already does that itself
# (see `docs-only-paths` below), and a caller-side `paths-ignore` produces no
# status-check context at all, which is worse -- a branch ruleset requiring one
# then waits on a pull request forever.
#
# Light work (lint, typecheck) goes to the light pool and heavy work (build,
# tests) to the large one. Any step whose command resolves to empty is skipped.
# `single-job: true` collapses the split onto the heavy runner; see that input.
#
# ONE hosted `pick` job resolves both runners (and whether the change is
# docs-only), instead of two hosted picker jobs. Picking twice used to cost two
# full hosted minutes before any real work started; picking once from inside a
# job that already exists costs one. `pr-checks` at the bottom is a summary job
# that always runs: it is the one status-check context a branch ruleset should
# require, because it exists in both single-job and split mode, and because a
# docs-only change still produces it even though `checks`/`test`/`build`/`all`
# are skipped.
name: PR Checks

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true      # bun | node | gradle | android | flutter | rust | xcode | none

      # "@stack" = this stack's conventional command; "" = this repo has no such
      # step. See actions/setup-stack, which resolves these.
      install:   { type: string, default: "@stack" }
      lint:      { type: string, default: "@stack" }
      typecheck: { type: string, default: "@stack" }
      test:      { type: string, default: "@stack" }
      build:     { type: string, default: "@stack" }

      # Design-system verifier (oxlint + @shadcn/lint). Opt-in: no `@stack`
      # default, since there is no conventional command for it. Runs on the
      # light pool right after Lint. Advisory until the caller's command adds
      # `--max-warnings`.
      design-lint: { type: string, default: "" }

      light-weight: { type: string, default: "light" }
      heavy-weight: { type: string, default: "heavy" }

      # Run every step in ONE job on the heavy runner instead of splitting light
      # work from heavy.
      #
      # The split is right for a repo whose lint is cheap and independent, and
      # wrong for Gradle: three jobs mean three configuration phases and no
      # shared daemon. One job gives one checkout and one warm GRADLE_USER_HOME.
      # The split stays the default.
      single-job: { type: boolean, default: false }

      # Every changed file must match one of these globs (newline-separated,
      # `fnmatch`-style: `*` crosses `/`) for the run to skip `checks`, `test`,
      # `build` and `all`. `commitlint` still runs, because the commit message
      # is what it checks, and is unaffected by which files changed.
      #
      # `docs_only` is always `false` on `workflow_dispatch`, and whenever the
      # diff against the PR base cannot be computed -- a skip is only ever a
      # positive claim, never the fallback when something went wrong reading it.
      docs-only-paths:
        type: string
        default: |-
          **.md
          docs/**

      commitlint:        { type: boolean, default: false }
      commitlint-config: { type: string,  default: ".commitlintrc.json" }

      coverage:      { type: string, default: "none" }   # none | vitest | kover
      coverage-path: { type: string, default: "" }
      coverage-min-overall: { type: number, default: 0 }
      coverage-min-changed: { type: number, default: 0 }

      # Applied to EVERY command step, via setup-stack's env-file. This is where
      # build tuning goes: GRADLE_OPTS, JAVA_OPTS, a worker count. Placeholders
      # and tuning only, never secrets. A value that must stay secret has no
      # business in a PR build log.
      env:
        type: string
        default: ""      # newline-separated KEY=VALUE

      # Build step only, and kept because callers already depend on it.
      # `env` is the general one, so prefer it. Both apply when both are set.
      build-env:
        type: string
        default: ""      # newline-separated KEY=VALUE, placeholders only
      timeout-minutes: { type: number, default: 30 }

      java-version:    { type: string, default: "21" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "latest" }
      flutter-version: { type: string, default: "" }
      # Ignored: setup-stack pins the rust channel in the action ref. Declared
      # so a caller already passing it does not break.
      rust-toolchain:  { type: string, default: "stable" }
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  # ONE hosted job resolves both runners and whether the diff is docs-only.
  # It always runs, unlike the jobs it feeds -- it is the job a docs-only skip
  # and single-job mode both still need, and its own two picks are what let
  # `checks`/`test`/`build`/`all` skip cleanly through `needs.pick.outputs`.
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      light:     ${{ steps.light.outputs.runner }}
      heavy:     ${{ steps.heavy.outputs.runner }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      # Full history: the only way to diff reliably against whatever commit
      # the PR base names, which a shallow default checkout does not carry.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # A skip is a positive claim, never a fallback. `workflow_dispatch` has
      # no PR to diff against, and an unresolvable base/head commit means the
      # diff could not be read, not that it was read and found docs-only.
      - id: docs
        shell: bash
        env:
          PATTERNS: ${{ inputs.docs-only-paths }}
          EVENT:    ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "pull_request_target" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event ($EVENT), docs_only=false"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
             || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::could not resolve the PR base/head commit to diff, assuming docs_only=false"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "empty diff, docs_only=false"
            exit 0
          fi
          result=$(CHANGED="$changed" python3 -c "
          import fnmatch, os
          patterns = [p.strip() for p in os.environ['PATTERNS'].splitlines() if p.strip()]
          changed = [f for f in os.environ['CHANGED'].splitlines() if f.strip()]
          ok = bool(changed) and all(any(fnmatch.fnmatch(f, p) for p in patterns) for f in changed)
          print('true' if ok else 'false')
          ")
          echo "docs_only=$result" >> "$GITHUB_OUTPUT"
          echo "changed files:"
          echo "$changed"
          echo "docs_only=$result"

      # The picker carries the same `if:` as the job it feeds. In single-job
      # mode nothing runs on the light pool; in a docs-only change neither
      # pool is needed at all.
      - id: light
        if: ${{ !inputs.single-job && steps.docs.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/pick-runner@v1
        with:
          weight:             ${{ inputs.light-weight }}
          gh-app-client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - id: heavy
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/pick-runner@v1
        with:
          weight:             ${{ inputs.heavy-weight }}
          gh-app-client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  # Hosted on purpose: needs full history and no toolchain, so the large pool
  # would be wasted on it.
  commitlint:
    if: inputs.commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ${{ inputs.commitlint-config }}

  # ---------------------------------------------------------------------------
  # Split shape: light work on the small pool, heavy work on the large one.
  # ---------------------------------------------------------------------------

  checks:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with:
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          env:             ${{ inputs.env }}
          install:         ${{ inputs.install }}
          lint:            ${{ inputs.lint }}
          typecheck:       ${{ inputs.typecheck }}
          design-lint:     ${{ inputs.design-lint }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}

      # Every command step below sources the env file setup-stack wrote. It is
      # always written, empty when the caller passed no `env`, so the source is
      # unconditional and there is no second code path to get wrong.
      - name: Install
        if: steps.setup.outputs.install != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.install }}
      - name: Lint
        if: steps.setup.outputs.lint != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.lint }}
      - name: Design lint
        if: steps.setup.outputs.design-lint != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.design-lint }}
      - name: Typecheck
        if: steps.setup.outputs.typecheck != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.typecheck }}

  test:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write     # coverage comment
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with:
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          env:             ${{ inputs.env }}
          install:         ${{ inputs.install }}
          test:            ${{ inputs.test }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}
      - name: Install
        if: steps.setup.outputs.install != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.install }}
      - name: Test
        if: steps.setup.outputs.test != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.test }}

      - if: always() && inputs.coverage == 'vitest'
        uses: davelosert/vitest-coverage-report-action@v2
      - if: always() && inputs.coverage == 'kover'
        uses: mi-kas/kover-report@v2
        with:
          path: ${{ inputs.coverage-path }}
          token: ${{ github.token }}
          title: Code Coverage
          update-comment: true
          min-coverage-overall: ${{ inputs.coverage-min-overall }}
          min-coverage-changed-files: ${{ inputs.coverage-min-changed }}

  build:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick, checks]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with:
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          env:             ${{ inputs.env }}
          install:         ${{ inputs.install }}
          build:           ${{ inputs.build }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}

      - name: Install
        if: steps.setup.outputs.install != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.install }}

      # Placeholders a build needs present but not real, supplied by the caller
      # in plain sight. Never secrets: a value that must stay secret has no
      # business in a PR build log.
      #
      # Exported into THIS shell, not $GITHUB_ENV, which refuses NODE_OPTIONS
      # outright, and NODE_OPTIONS is the variable a Next.js build needs here.
      # setup-stack's env file exists for the same reason. `IFS='='` splits on
      # the FIRST `=` only, so URLs and base64 survive intact.
      - name: Build
        if: steps.setup.outputs.build != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS='=' read -r k v; do
              [ -z "$k" ] && continue
              export "$k=$v"
            done <<< "$BUILD_ENV"
          fi
          ${{ steps.setup.outputs.build }}

  # ---------------------------------------------------------------------------
  # Single-job shape: the same steps, in the same order, with the same
  # skip-on-empty rule. Only the runner and the job boundaries differ.
  # ---------------------------------------------------------------------------

  all:
    if: ${{ inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write     # coverage comment
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with:
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          env:             ${{ inputs.env }}
          install:         ${{ inputs.install }}
          lint:            ${{ inputs.lint }}
          typecheck:       ${{ inputs.typecheck }}
          test:            ${{ inputs.test }}
          build:           ${{ inputs.build }}
          design-lint:     ${{ inputs.design-lint }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}

      - name: Install
        if: steps.setup.outputs.install != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.install }}
      - name: Lint
        if: steps.setup.outputs.lint != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.lint }}
      - name: Design lint
        if: steps.setup.outputs.design-lint != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.design-lint }}
      - name: Typecheck
        if: steps.setup.outputs.typecheck != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.typecheck }}
      - name: Test
        if: steps.setup.outputs.test != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.test }}

      # `build-env` applies exactly as in the split shape; see that step.
      - name: Build
        if: steps.setup.outputs.build != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          if [ -n "${BUILD_ENV:-}" ]; then
            while IFS='=' read -r k v; do
              [ -z "$k" ] && continue
              export "$k=$v"
            done <<< "$BUILD_ENV"
          fi
          ${{ steps.setup.outputs.build }}

      # Same reporters, in the job that produced the report. A coverage file
      # written on one runner is not readable from another.
      - if: always() && inputs.coverage == 'vitest'
        uses: davelosert/vitest-coverage-report-action@v2
      - if: always() && inputs.coverage == 'kover'
        uses: mi-kas/kover-report@v2
        with:
          path: ${{ inputs.coverage-path }}
          token: ${{ github.token }}
          title: Code Coverage
          update-comment: true
          min-coverage-overall: ${{ inputs.coverage-min-overall }}
          min-coverage-changed-files: ${{ inputs.coverage-min-changed }}

  # ---------------------------------------------------------------------------
  # One stable context, on every push, in both modes.
  # ---------------------------------------------------------------------------

  # This is the job a branch ruleset should require, never `checks` or `all`.
  # `<caller job id> / pr-checks` exists on every PR push whether single-job or
  # split, and whether or not the change is docs-only, which is exactly what
  # `checks / checks` and `checks / all` cannot promise: one of them is always
  # skipped depending on `single-job`, and both are skipped on a docs-only
  # change. A required context that a docs-only push never creates is a ruleset
  # that waits forever, which is what a caller's `paths-ignore` used to cause.
  pr-checks:
    name: PR Checks
    needs: [pick, commitlint, checks, test, build, all]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize
        env:
          PICK:       ${{ needs.pick.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          CHECKS:     ${{ needs.checks.result }}
          TEST:       ${{ needs.test.result }}
          BUILD:      ${{ needs.build.result }}
          ALL:        ${{ needs.all.result }}
          DOCS_ONLY:  ${{ needs.pick.outputs.docs_only }}
        run: |
          set -euo pipefail
          failed=""
          for pair in "pick:$PICK" "commitlint:$COMMITLINT" "checks:$CHECKS" "test:$TEST" "build:$BUILD" "all:$ALL"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              failure|cancelled) failed="$failed $name($result)" ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::pr-checks: failed jobs:$failed"
            exit 1
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "pr-checks: docs-only change, checks skipped"
          else
            echo "pr-checks: all required jobs passed"
          fi
