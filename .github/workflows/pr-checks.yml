# Reusable: the deterministic checks a pull request must pass. Replaces a
# hand-written ci.yml per repo. `concurrency:` stays with the CALLER, because it
# depends on that repo's branches.
#
# Do NOT add `paths-ignore` on the caller for a docs-only skip: this workflow
# does that itself (`docs-only-paths`), and a caller-side `paths-ignore` creates
# no status-check context at all, so a ruleset requiring one waits forever.
#
# Light work (lint, typecheck) goes to the light pool, heavy work (build, tests)
# to the large one; `single-job: true` collapses the split onto the heavy runner.
# A step whose command resolves to empty is skipped, and a `test` or `build`
# job with none does not start. ONE `pick` job resolves both runners and
# docs-only from the API, with no checkout. `pr-checks` at the bottom always
# runs and is the one context a ruleset should require. `pick` and `pr-checks`
# run no caller code and sit on the `control` pool of a private repo (AGENTS.md);
# their `runs-on` is written out per job because `runs-on` cannot read `env`.
name: PR Checks

# Runs the caller's own code, so no job holds more than it needs.
permissions:
  contents: read

env:
  # What `test` and `all` upload for the coverage job: vitest's two JSON files, or the caller's one report.
  COVERAGE_REPORT: ${{ inputs.coverage == 'vitest' && 'coverage/coverage-*.json' || inputs.coverage-path || 'coverage/lcov.info' }}

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true      # bun | node | gradle | android | flutter | rust | xcode | none

      # "@stack" = this stack's conventional command; "" = this repo has no such
      # step. See actions/setup-stack, which resolves these.
      install:   { type: string, default: "@stack" }
      lint:      { type: string, default: "@stack" }
      typecheck: { type: string, default: "@stack" }
      test:      { type: string, default: "@stack" }
      build:     { type: string, default: "@stack" }

      # Design-system verifier (oxlint + @shadcn/lint). Opt-in, no `@stack`
      # default (there is no conventional command). Runs on the light pool right
      # after Lint; advisory until the caller's command adds `--max-warnings`.
      design-lint: { type: string, default: "" }

      # Runs `hk check --all` from the caller's hk.pkl, with the tools its
      # mise.toml pins, after install and before lint. Replaces nothing. Findings
      # show in the job log and summary, and the SARIF is kept as an `hk-sarif-<n>`
      # artifact. Nothing goes to code scanning (that needs `security-events:
      # write`, which every caller would have to grant): a repo that wants it
      # uploads the artifact from its own workflow.
      hk: { type: boolean, default: false }

      light-weight: { type: string, default: "light" }
      heavy-weight: { type: string, default: "heavy" }

      # Run every step in ONE job on the heavy runner instead of splitting light
      # work from heavy. Right for Gradle, where three jobs mean three
      # configuration phases and no shared daemon (one job gives one checkout and
      # one warm GRADLE_USER_HOME); the split stays the default.
      single-job: { type: boolean, default: false }

      # Every changed file must match one of these globs (newline-separated,
      # `fnmatch`-style: `*` crosses `/`) for the run to skip `test`, `build`
      # and `all`, and every step of `checks` but commitlint. That step still runs
      # on the light runner when `commitlint` is on, even with `single-job`: it
      # checks the commit messages, not the files.
      #
      # `docs_only` is always `false` on `workflow_dispatch`, and whenever the
      # changed files cannot be listed in full (an API error, or the 3000-file
      # cap): a skip is only ever a positive claim, never the fallback.
      docs-only-paths:
        type: string
        default: |-
          **.md
          docs/**

      commitlint:        { type: boolean, default: false }
      commitlint-config: { type: string,  default: ".commitlintrc.json" }

      # Opt-in osv-scanner over the lockfiles the PR changed; only the findings
      # the PR introduces count, and a dependency PR is skipped (deps-verify owns
      # it). `none` reports; low | moderate | high | critical fails a new finding
      # at or above it, and a scan that could not run. Never
      # dependency-review-action: it needs GitHub Advanced Security on private
      # repos and `security-events`, which no pr-checks job holds (see `hk`).
      dependency-check:         { type: boolean, default: false }
      dependency-check-fail-on: { type: string,  default: "none" }

      # Opt-in jobs that replace zavet-check.yml and react-doctor.yml. They
      # feed the `pr-checks` summary only when their `*-blocking` input is on.
      # `zavet-stack` is the toolchain the decision checks run on.
      # `react-doctor-paths` are newline globs; the default is web source and
      # package.json, narrow it to an app directory in a monorepo. A repo that
      # tunes React Doctor keeps react-doctor.yml.
      zavet:       { type: boolean, default: false }
      zavet-dir:   { type: string,  default: ".zavet" }
      zavet-stack: { type: string,  default: "none" }
      zavet-audit: { type: boolean, default: false }   # report-only health sweep
      # Off by default: an advisory check that silently starts blocking merges
      # is worse than one that reports. On, the job's result joins `PR Checks`,
      # the required context, so a red Zavet Check blocks the merge.
      zavet-blocking: { type: boolean, default: false }
      # The zavet job's install. Empty reuses `install`; set it when the decision
      # checks need more, e.g. a build whose output a check reads.
      zavet-install: { type: string, default: "" }

      react-doctor:           { type: boolean, default: false }
      react-doctor-paths:
        type: string
        default: |-
          **.ts
          **.tsx
          **.js
          **.jsx
          package.json
      react-doctor-directory: { type: string,  default: "." }
      # Off by default, as `zavet-blocking`. On, the job joins `PR Checks` and
      # React Doctor fails the run on an error-severity finding.
      react-doctor-blocking:  { type: boolean, default: false }

      # none | vitest | kover | lcov. `lcov`: the test command writes an LCOV
      # file (bun test, cargo llvm-cov, c8, nyc) and `coverage-path` points at
      # it; the default is coverage/lcov.info.
      coverage:      { type: string, default: "none" }
      coverage-path: { type: string, default: "" }
      coverage-min-overall: { type: number, default: 0 }
      coverage-min-changed: { type: number, default: 0 }

      # Applied to EVERY command step, via setup-stack's env-file. This is where
      # build tuning goes: GRADLE_OPTS, JAVA_OPTS, a worker count. Placeholders
      # and tuning only, never secrets. A value that must stay secret has no
      # business in a PR build log.
      env:
        type: string
        default: ""      # newline-separated KEY=VALUE

      # Build step only, parsed exactly like `env` (comments and blank lines
      # skipped, first `=` splits). Kept because callers already depend on it;
      # `env` is the general one, so prefer it. Both apply when both are set,
      # and `build-env` wins on a name in both.
      build-env:
        type: string
        default: ""      # newline-separated KEY=VALUE, placeholders only
      timeout-minutes: { type: number, default: 30 }

      java-version:    { type: string, default: "21" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "auto" }
      flutter-version: { type: string, default: "" }
      # Passed to the pinned rust-toolchain action: stable, nightly, or a version.
      rust-toolchain:  { type: string, default: "stable" }
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  # ONE job resolves both runners and whether the diff is docs-only. It always
  # runs: a docs-only skip and single-job mode still need it, and its outputs are
  # how the other jobs skip cleanly. It needs bash, git, gh, jq and python3
  # (`changed-files` matches globs with fnmatch); a missing one degrades to "not
  # docs-only, run everything" and skips React Doctor, so the check below says so.
  pick:
    name: Pick runner
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","control"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read }   # pull-requests: the changed-files listing
    outputs:
      light:     ${{ steps.light.outputs.runner }}
      heavy:     ${{ steps.heavy.outputs.runner }}
      docs_only: ${{ steps.docs.outputs.all-matched }}
      has_test:  ${{ steps.cmds.outputs.test != '' }}
      has_build: ${{ steps.cmds.outputs.build != '' }}
      react_doctor: ${{ inputs.react-doctor && steps.rd.outputs.matched == 'true' }}
      key:       ${{ steps.key.outputs.key }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
      # Artifact names are per run and a caller may call this workflow twice, so
      # each call's names carry a hash of its inputs. Not `github.job`: both calls
      # have a job called `test`.
      - id: key
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "key=$(printf '%s' "$INPUTS" | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the tools changed-files needs
        run: |
          for t in gh jq python3; do
            command -v "$t" >/dev/null || echo "::warning title=Runner is missing $t::changed-files needs $t, so docs-only detection and the React Doctor path filter will not work on this runner."
          done

      # Whether `test` and `build` have a command, so an empty one never starts a
      # large runner. Bash only, no checkout; an unknown stack fails here.
      - id: cmds
        uses: dodi-smart/.github/actions/setup-stack/resolve@pinned/v1.39.5
        with:
          stack: ${{ inputs.stack }}
          test:  ${{ inputs.test }}
          build: ${{ inputs.build }}

      # `all-matched` is `true` only when the whole list was read and every file
      # matches; any doubt (no PR, API error, empty list, the cap) is `false`.
      - id: docs
        uses: dodi-smart/.github/actions/changed-files@pinned/v1.39.5
        with:
          patterns: ${{ inputs.docs-only-paths }}

      - id: rd
        if: ${{ inputs.react-doctor }}
        uses: dodi-smart/.github/actions/changed-files@pinned/v1.39.5
        with:
          patterns: ${{ inputs.react-doctor-paths }}

      # Only when some light job will run: the split `checks`, commitlint, zavet,
      # react-doctor or coverage.
      - id: light
        if: ${{ (!inputs.single-job && steps.docs.outputs.all-matched != 'true') || (inputs.commitlint && github.event.pull_request) || inputs.zavet || steps.rd.outputs.matched == 'true' || (steps.docs.outputs.all-matched != 'true' && inputs.coverage != 'none') }}
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.39.5
        with:
          weight: ${{ inputs.light-weight }}

      - id: heavy
        if: ${{ steps.docs.outputs.all-matched != 'true' }}
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.39.5
        with:
          weight: ${{ inputs.heavy-weight }}

  # Full history, because guards walk the pull request's commits.
  zavet:
    name: Zavet Check
    if: inputs.zavet
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: 15
    permissions: { contents: read, pull-requests: write }   # pull-requests: the failure comment
    steps:
      - &report-light
        uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
        with:
          selector: ${{ needs.pick.outputs.light }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dodi-smart/.github/actions/zavet-check@pinned/v1.39.5
        with:
          zavet-dir:       ${{ inputs.zavet-dir }}
          stack:           ${{ inputs.zavet-stack }}
          audit:           ${{ inputs.zavet-audit }}
          install:         ${{ inputs.zavet-install || inputs.install }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          java-version:    ${{ inputs.java-version }}
          flutter-version: ${{ inputs.flutter-version }}

  react-doctor:
    name: React Doctor
    if: ${{ needs.pick.outputs.react_doctor == 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: 15
    permissions: { contents: read, pull-requests: write, statuses: write }   # the action's sticky comment and score status
    steps:
      - *report-light
      - uses: dodi-smart/.github/actions/react-doctor@pinned/v1.39.5
        with:
          directory: ${{ inputs.react-doctor-directory }}
          # `error`, not `warning`: a gate on findings nobody agreed to fix
          # gets bypassed.
          blocking:  ${{ inputs.react-doctor-blocking && 'error' || 'none' }}

  # ---------------------------------------------------------------------------
  # Split shape: light work on the small pool, heavy work on the large one.
  # Every job runs its commands through `run-phases`, which sources the env file
  # setup-stack wrote, skips an empty phase, stops at the first failure and puts
  # a timing table in the job summary. Steps written once are aliased below.
  # ---------------------------------------------------------------------------

  # On a docs-only change this runs for commitlint alone, even with `single-job`,
  # so every other step skips on `docs_only`.
  checks:
    if: ${{ (!inputs.single-job && needs.pick.outputs.docs_only != 'true') || (inputs.commitlint && github.event.pull_request && needs.pick.outputs.docs_only == 'true') }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions: { contents: read, pull-requests: read }   # pull-requests: commitlint's commit list, dependency-check's changed files
    steps:
      - *report-light
      # Aliased by every job below (the gate is then redundant outside `checks`).
      # Default depth: no reporter needs history, they list files through the API.
      - &checkout
        id: checkout
        if: ${{ needs.pick.outputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      # Every job passes every command: setup-stack only resolves them into
      # outputs, and each job's `run-phases` reads the ones it uses.
      - &setup
        id: setup
        if: ${{ needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/setup-stack@pinned/v1.39.5
        with:
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          # Only a job that builds has a `.next/cache` worth keeping.
          next-cache:      ${{ (github.job == 'build' || github.job == 'all') && 'auto' || 'false' }}
          env:             ${{ inputs.env }}
          build-env:       ${{ inputs.build-env }}
          install:         ${{ inputs.install }}
          lint:            ${{ inputs.lint }}
          typecheck:       ${{ inputs.typecheck }}
          test:            ${{ inputs.test }}
          build:           ${{ inputs.build }}
          design-lint:     ${{ inputs.design-lint }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}
      # Opt-in `hk`: install first, then hk (the whole tree, never `--pr`; its
      # mise cache follows setup-stack's), then `Run phases` for the rest.
      - &hk-install
        id: install
        name: Run phases (install)
        if: ${{ inputs.hk && needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.39.5
        with:
          env-file: ${{ steps.setup.outputs.env-file }}
          install:  ${{ steps.setup.outputs.install }}
      - &hk-check
        if: ${{ inputs.hk && needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/hk-check@pinned/v1.39.5
        with:
          cache:         ${{ steps.setup.outputs.cache-enabled }}
          cache-save:    ${{ steps.setup.outputs.cache-save }}
          artifact-name: hk-sarif-${{ needs.pick.outputs.key }}
      # One step either way. With `hk` the install already ran above, so it is not
      # repeated (an empty command is skipped) and a red hk does not hide the
      # rest: they run unless the install failed.
      - name: Run phases
        if: ${{ needs.pick.outputs.docs_only != 'true' && (success() || (inputs.hk && !cancelled() && steps.install.outcome == 'success')) }}
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.39.5
        with:
          env-file:    ${{ steps.setup.outputs.env-file }}
          install:     ${{ !inputs.hk && steps.setup.outputs.install || '' }}
          lint:        ${{ steps.setup.outputs.lint }}
          design-lint: ${{ steps.setup.outputs.design-lint }}
          typecheck:   ${{ steps.setup.outputs.typecheck }}
      # Opt-in `dependency-check`, a step and not a job, on `!cancelled()` and the
      # checkout so a red lint does not hide it and a docs-only change skips it.
      - &dependency-check
        name: Dependency check
        if: ${{ !cancelled() && inputs.dependency-check && steps.checkout.outcome == 'success' }}
        uses: dodi-smart/.github/actions/dependency-check@pinned/v1.39.5
        with:
          fail-on: ${{ inputs.dependency-check-fail-on }}
      # Last, on !cancelled(): a red phase still gets its messages checked. A CLI,
      # not a Docker action: see actions/commitlint. A push or dispatch has no pull
      # request to list commits from, so it skips.
      - &commitlint
        name: commitlint
        if: ${{ !cancelled() && inputs.commitlint && github.event.pull_request }}
        uses: dodi-smart/.github/actions/commitlint@pinned/v1.39.5
        with:
          config: ${{ inputs.commitlint-config }}
          number: ${{ github.event.pull_request.number }}

  test:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' && needs.pick.outputs.has_test == 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      workspace: ${{ github.workspace }}    # the coverage job maps report paths with it
    steps:
      - &report-heavy
        uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
        with:
          selector: ${{ needs.pick.outputs.heavy }}
      - *checkout
      - *setup
      - name: Run phases
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.39.5
        with:
          env-file: ${{ steps.setup.outputs.env-file }}
          install:  ${{ steps.setup.outputs.install }}
          test:     ${{ steps.setup.outputs.test }}
      # The `coverage` job posts the comment and holds the write token; this job
      # runs the caller's code, so it only hands the report over. A red run
      # uploads nothing.
      - &coverage-upload
        if: ${{ inputs.coverage != 'none' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: ${{ env.COVERAGE_REPORT }}
          if-no-files-found: error
          retention-days: 1

  # `build` needs only `pick`, so it starts beside `checks` and `test`: a push
  # waits for the slowest of the three, not for two in a row. `build-env` holds
  # placeholders (never secrets); `run-phases` sources it for the build phase
  # only, in that phase's shell, since $GITHUB_ENV refuses NODE_OPTIONS.
  build:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' && needs.pick.outputs.has_build == 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - *report-heavy
      - *checkout
      - *setup
      - name: Run phases
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.39.5
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          install:        ${{ steps.setup.outputs.install }}
          build:          ${{ steps.setup.outputs.build }}

  # ---------------------------------------------------------------------------
  # Single-job shape: the same phases in the same order, with the same
  # skip-on-empty rule. Only the runner and the job boundaries differ.
  # ---------------------------------------------------------------------------

  all:
    if: ${{ inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions: { contents: read, pull-requests: read }   # pull-requests: commitlint's commit list, dependency-check's changed files
    outputs:
      workspace: ${{ github.workspace }}    # the coverage job maps report paths with it
    steps:
      - *report-heavy
      - *checkout
      - *setup
      - *hk-install
      - *hk-check
      - name: Run phases
        if: ${{ needs.pick.outputs.docs_only != 'true' && (success() || (inputs.hk && !cancelled() && steps.install.outcome == 'success')) }}
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.39.5
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          install:        ${{ !inputs.hk && steps.setup.outputs.install || '' }}
          lint:           ${{ steps.setup.outputs.lint }}
          design-lint:    ${{ steps.setup.outputs.design-lint }}
          typecheck:      ${{ steps.setup.outputs.typecheck }}
          test:           ${{ steps.setup.outputs.test }}
          build:          ${{ steps.setup.outputs.build }}
      - *coverage-upload
      - *dependency-check
      - *commitlint

  # ---------------------------------------------------------------------------
  # The coverage comment, from a separate light job so no caller code runs beside
  # the write token. The checkout below only gives the vitest reporter the tree.
  # ---------------------------------------------------------------------------

  coverage:
    name: Coverage
    if: ${{ !cancelled() && inputs.coverage != 'none' && (needs.test.result == 'success' || needs.all.result == 'success') }}
    needs: [pick, test, all]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: write }   # pull-requests: the coverage comment
    env:
      # `test` or `all`, whichever ran: the workspace the report was written in.
      WRITER_WORKSPACE: ${{ needs.test.outputs.workspace || needs.all.outputs.workspace }}
    steps:
      - *report-light
      # The artifact holds one file, or vitest's two, named by basename, so the
      # reporters read `coverage/*` whatever `coverage-path` was.
      - if: inputs.coverage == 'vitest'
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: coverage
      - if: inputs.coverage == 'vitest'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          file-coverage-root-path: ${{ env.WRITER_WORKSPACE }}
      - if: inputs.coverage == 'lcov'
        uses: dodi-smart/.github/actions/lcov-report@pinned/v1.39.5
        with:
          path:        coverage/*
          source-root: ${{ env.WRITER_WORKSPACE }}
          min-overall: ${{ inputs.coverage-min-overall }}
          min-changed: ${{ inputs.coverage-min-changed }}
      - if: inputs.coverage == 'kover'
        id: kover
        uses: mi-kas/kover-report@v2
        with:
          path: coverage/*
          token: ${{ github.token }}
          title: Code Coverage
          update-comment: true
          min-coverage-overall: ${{ inputs.coverage-min-overall }}
          min-coverage-changed-files: ${{ inputs.coverage-min-changed }}
      # kover-report only comments on a breached minimum, so the overall floor is
      # enforced here; the changed-files floor stays comment-only.
      - if: inputs.coverage == 'kover'
        uses: dodi-smart/.github/actions/kover-floor@pinned/v1.39.5
        with:
          overall:     ${{ steps.kover.outputs.coverage-overall }}
          min-overall: ${{ inputs.coverage-min-overall }}

  # ---------------------------------------------------------------------------
  # One stable context, on every push, in both modes: the job a branch ruleset
  # should require, never `checks` or `all`, so its name never changes. It runs
  # no caller code: the control pool of a private repo, like `pick`.
  #
  # `zavet` and `react-doctor` are always in `needs` (it cannot vary with an
  # input) but are ignored unless their `*-blocking` input is on.
  # ---------------------------------------------------------------------------

  pr-checks:
    name: PR Checks
    needs: [pick, checks, test, build, all, coverage, zavet, react-doctor]
    if: always()
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","control"]' || '"ubuntu-latest"') }}
    timeout-minutes: 2
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
      # The "Where it ran" table for every job of this run attempt, before the
      # summary, which exits non-zero on a red run.
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
        with:
          mode: run
      - name: Summarize
        uses: dodi-smart/.github/actions/pr-checks-summary@pinned/v1.39.5
        with:
