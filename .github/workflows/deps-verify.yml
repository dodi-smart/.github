# Reusable: verify a Renovate/Dependabot PR from the repo's own CI result and
# what upstream changed, and fix the code when the update broke it.
#
# It never merges and never approves; deps-automerge.yml merges from the label
# this sets. It may push fix commits to the dependency branch through
# actions/push-round: code, and the companion versions the update needs from
# the stack's version files, never a version Renovate chose and never a
# hand-edited lockfile, at most two rounds, each one a plain commit anyone can
# read or revert. A fix is still evidence.
name: Dependency Verification

on:
  workflow_call:
    inputs:
      runner-weight:
        type: string
        default: "heavy"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""       # explicit selector; wins over runner-weight

      # WHICH TOOLCHAIN. One input, not one template per stack. See
      # actions/setup-stack for why.
      #   bun | node | gradle | android | flutter | rust | xcode | none
      stack:
        type: string
        default: ""
      # DEPRECATED alias for `stack`, kept so callers written against the older
      # shape keep working. `java` mapped to what is now `gradle`. Remove once
      # every repo has moved.
      setup:
        type: string
        default: ""

      # Commands. "@stack" is this stack's conventional command; an explicit
      # empty string skips the step. See actions/setup-stack, which resolves them.
      install:   { type: string, default: "@stack" }
      build:     { type: string, default: "@stack" }
      typecheck: { type: string, default: "@stack" }
      test:      { type: string, default: "@stack" }
      smoke:     { type: string, default: "" }

      # The same two inputs as pr-checks, with the same meaning, so a caller
      # copies one block into both. Without them a Next.js build here failed on
      # a missing placeholder that pr-checks had, and every web repo's
      # dependency PR came out red for a reason unrelated to the update.
      #   env:       every command step. Placeholders and tuning, never secrets.
      #   build-env: build step only.
      env:       { type: string, default: "" }   # newline-separated KEY=VALUE
      build-env: { type: string, default: "" }   # newline-separated KEY=VALUE

      # Where the build verdict comes from. When one of the repo's own workflows
      # calls this path, its run on the PR's head commit is read instead of
      # building here. Empty means always build here.
      #
      # The caller must also listen for that run to finish, or nothing starts the
      # verification once it does:
      #   workflow_run: { workflows: [PR Checks], types: [completed] }
      ci-workflow:        { type: string, default: "dodi-smart/.github/.github/workflows/pr-checks.yml" }

      java-version:    { type: string, default: "21" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "auto" }
      flutter-version: { type: string, default: "" }
      # Passed to the pinned rust-toolchain action: stable, nightly, or a version.
      rust-toolchain:  { type: string, default: "stable" }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }
      AGENT_ENV_SECRET:        { required: false }   # KEY=VALUE lines for the agent alone

# Keyed by branch, the one thing both events carry. A workflow_run has no
# pull_request, and keying on its number would put every PR in one group.
concurrency:
  group: deps-${{ github.repository }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# Every job grants its own, so one added later starts with nothing.
permissions: {}

jobs:
  # Everything before the build, in ONE short job: which pull request,
  # whether to proceed, the build verdict, whether anything is left to judge, and
  # the runners. The picker runs after the last step that can still say no, so
  # a run that will not proceed never pays for it.
  #
  # It runs on the light pool of a private repository and on a hosted runner
  # for a public one or a fork pull request. It only reads the API and re-runs
  # a failed run once; it checks nothing out, and it never waits.
  #
  # The job-level `if:` below skips a run before it takes a runner at all. It
  # reads only the event payload, and every case it drops is one the steps
  # below already end with `proceed=false` and no side effect:
  #   pull_request  the author is not a bot at all (the agent-gate rule
  #                 `bots: only` stops it, a `labeled agent:review` included),
  #                 or the label is not `agent:review` (rule 4 stops it), or
  #                 the head is a fork (the pr step stops it).
  #   workflow_run  the finished run was not for a pull request, or was for a
  #                 fork, or was cancelled or skipped (the ci step ends those
  #                 with ready=false before it re-runs anything).
  # A workflow_run payload carries no PR author, so a human's pull request
  # still starts this job once per PR Checks completion, and ends in the pr
  # or gate step. The filter knows only the SHAPE of a bot login (the `[bot]`
  # suffix the API always uses), a superset of the dependency bots; the list of
  # which bots count stays in actions/agent-gate/gate.sh and nowhere else.
  #
  # Nothing here waits. Two events reach it:
  #   pull_request  opened, synchronize, reopened, or labeled `agent:review`.
  #                 A repo whose pr-checks has not finished on the head commit
  #                 stops here; that run's completion starts this again.
  #   workflow_run  the caller's PR Checks run completed. The verdict is read
  #                 from the finished run, once.
  # Why nothing may wait here: see deps-verify in AGENTS.md.
  gate:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && endsWith(github.event.pull_request.user.login, '[bot]')
        && (github.event.action != 'labeled' || github.event.label.name == 'agent:review'))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.conclusion != 'cancelled'
        && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10   # the picker may retry
    permissions:
      contents: read        # workflow files and the compare API
      pull-requests: read   # the pull request and the verdict comment
      actions: write        # read the pr-checks run, and re-run it once after an infra failure
    outputs:
      proceed: ${{ steps.ci.outputs.ready == 'true' && steps.judge.outputs.judge != 'skip' }}
      dependency-bots: ${{ steps.gate.outputs.dependency-bots }}
      stack:    ${{ steps.stack.outputs.stack }}
      # light for a green verdict (reading notes), heavy to build or fix.
      runner:   ${{ steps.ci.outputs.verdict == 'green' && steps.pick-light.outputs.runner || steps.pick-heavy.outputs.runner }}
      number:   ${{ steps.pr.outputs.number }}
      head-ref: ${{ steps.pr.outputs.head-ref }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
      base-ref: ${{ steps.pr.outputs.base-ref }}
      author:   ${{ steps.pr.outputs.author }}
      mode:     ${{ steps.ci.outputs.mode }}        # own | ci
      verdict:  ${{ steps.ci.outputs.verdict }}     # ci mode only; own mode is decided by the build
      url:      ${{ steps.ci.outputs.url }}
      run-id:   ${{ steps.ci.outputs.run-id }}
      judge:    ${{ steps.judge.outputs.judge }}    # skip | lockfile | agent
      intent:   ${{ steps.judge.outputs.intent }}
      update:   ${{ steps.judge.outputs.update }}   # major | minor | patch | lockfile | unknown
    env:
      GH_TOKEN: ${{ github.token }}
      REPO:     ${{ github.repository }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
        with:
          selector: '["self-hosted","Linux","light"]'

      # The pull request, read from the API for either event, so every later
      # step sees one shape and live labels. Forks, closed PRs and a run for a
      # commit the PR has since moved past stop here.
      - id: pr
        uses: dodi-smart/.github/actions/pr-facts@pinned/v1.39.5

      # `bots: only` is the inverse of every other agent workflow: this one runs
      # for Renovate and Dependabot and nothing else. It also absorbs the author
      # check every caller used to carry in its own `if:`, byte-identically.
      - id: gate
        if: steps.pr.outputs.found == 'true'
        uses: dodi-smart/.github/actions/agent-gate@pinned/v1.39.5
        with:
          labels:        ${{ steps.pr.outputs.labels }}
          number:        ${{ steps.pr.outputs.number }}
          event-name:    ${{ github.event_name }}
          event-action:  ${{ github.event.action }}
          label:         ${{ github.event.label.name }}
          request-label: 'agent:review'
          author:        ${{ steps.pr.outputs.author }}
          draft:         ${{ steps.pr.outputs.draft }}
          bots:          'only'

      - id: stack
        env:
          STACK: ${{ inputs.stack }}
          SETUP: ${{ inputs.setup }}
        run: |
          set -euo pipefail
          s="$STACK"
          if [ -z "$s" ] && [ -n "$SETUP" ]; then
            case "$SETUP" in
              java) s=gradle ;;
              *)    s="$SETUP" ;;
            esac
            echo "::warning title=Deprecated input::'setup: $SETUP' is deprecated; use 'stack: $s'. The alias will be removed once every repo has moved."
          fi
          [ -z "$s" ] && s=none
          echo "stack=$s" >> "$GITHUB_OUTPUT"
          echo "stack: $s"

      # The build verdict, from the caller's pr-checks run on the head commit,
      # read once. `ready=false` ends this run without a verdict: pr-checks has
      # not finished, or was cancelled for a newer push, or was just re-run. Its
      # completion starts this workflow again through the caller's workflow_run
      # trigger. A run that died of the runner is re-run ONCE, failed jobs only.
      - id: ci
        if: steps.gate.outputs.proceed == 'true'
        env:
          EVENT:       ${{ github.event_name }}
          SHA:         ${{ steps.pr.outputs.head-sha }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          # The finished run that started this one, on a workflow_run event.
          WR_ID:         ${{ github.event.workflow_run.id }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_ATTEMPT:    ${{ github.event.workflow_run.run_attempt }}
          WR_URL:        ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          LOGS="$RUNNER_TEMP/deps-logs"
          mkdir -p "$LOGS"
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          later() { out ready=false; echo "$1. The PR Checks run's completion starts verification."; exit 0; }

          if [ "$EVENT" = workflow_run ]; then
            # Only a PR Checks run starts this, so the mode is ci and the run is
            # the one in the payload: nothing to look up.
            out mode=ci
            id="$WR_ID" status=completed conclusion="$WR_CONCLUSION" attempt="$WR_ATTEMPT" url="$WR_URL"
          else
            # Who calls CI_WORKFLOW, read from the API at the PR head: no
            # checkout, so nothing from the PR lands on the runner.
            callers() {
              gh api "/repos/$REPO/contents/.github/workflows?ref=$SHA" --jq '.[] | select(.name | test("\\.ya?ml$")) | .path' \
                | xargs -I{} gh api -H "Accept: application/vnd.github.raw" "/repos/$REPO/contents/{}?ref=$SHA"
            }
            if [ -z "$CI_WORKFLOW" ] || ! callers 2>/dev/null | grep -F "$CI_WORKFLOW@" >/dev/null; then
              out mode=own
              out ready=true
              echo "no workflow here calls ${CI_WORKFLOW:-a CI workflow}, so the verify job builds the PR itself"
              exit 0
            fi
            out mode=ci
            # The newest run on this commit whose workflow calls CI_WORKFLOW.
            # A skipped run (a draft, a filtered event) is not one.
            id=$(gh api "/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                  | jq -r --arg w "$CI_WORKFLOW" '
                      [.workflow_runs[]
                       | select(any(.referenced_workflows[]?; .path | startswith($w)))
                       | select(.conclusion != "skipped")]
                      | sort_by(.id) | last | .id // empty')
            [ -n "$id" ] || later "No PR Checks run on $SHA yet"
            # `|`, not a tab: read collapses adjacent tabs, and an in-progress
            # run has an empty conclusion between two.
            IFS='|' read -r status conclusion attempt url < <(gh api "/repos/$REPO/actions/runs/$id" \
              --jq '[.status, (.conclusion // ""), .run_attempt, .html_url] | map(tostring) | join("|")')
          fi
          [ "$status" = completed ] || later "PR Checks is $status on $SHA ($url)"
          case "$conclusion" in
            cancelled) later "PR Checks was cancelled on $SHA, so a newer run replaces it" ;;
            skipped)   later "PR Checks was skipped on $SHA" ;;
          esac

          # One verdict string: green | red:<failed jobs> | red:infra (the runner
          # failed twice). Decided here so `verify` can pick its runner from it.
          # A runner failure on the first attempt is re-run ONCE, failed jobs
          # only, and that run's completion brings the verdict.
          v=green
          if [ "$conclusion" != success ]; then
            gh run view "$id" --repo "$REPO" --log-failed > "$LOGS/ci.log" 2>&1 || true
            if grep -qE 'exit code 137|signal SIGKILL|daemon disappeared unexpectedly|received a shutdown signal|lost communication with the server|No space left on device|ENOSPC|JavaScript heap out of memory' "$LOGS/ci.log"; then
              if [ "$attempt" = 1 ]; then
                echo "::notice title=Re-running CI::The pr-checks run failed on the runner, not the code. Re-running its failed jobs once."
                gh run rerun "$id" --repo "$REPO" --failed
                later "Re-ran the failed PR Checks jobs"
              fi
              v=red:infra
            else
              failed=$(gh api "/repos/$REPO/actions/runs/$id/attempts/$attempt/jobs" \
                       --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' || true)
              v="red:${failed:-$conclusion}"
            fi
          fi
          out ready=true
          out "verdict=$v"
          out "url=$url"
          out "run-id=$id"
          echo "pr-checks: $conclusion (attempt $attempt) $url"
          echo "verdict: $v"

      # Ends the run here when nothing new is left to judge. With no verdict yet
      # (a repo that builds in `verify`) the answer is always the agent.
      - id: judge
        if: steps.ci.outputs.ready == 'true'
        uses: dodi-smart/.github/actions/deps-intent@pinned/v1.39.5
        with:
          base-ref: ${{ steps.pr.outputs.base-ref }}
          head-sha: ${{ steps.pr.outputs.head-sha }}
          number:   ${{ steps.pr.outputs.number }}
          title:    ${{ steps.pr.outputs.title }}
          labels:   ${{ steps.pr.outputs.labels }}
          verdict:  ${{ steps.ci.outputs.verdict }}

      # Only when the run above is still proceeding: a human-authored PR (this
      # workflow runs for bots only) must never pay for a hosted picker.
      #
      # Both pools are picked here, because the verify job runs on light for a
      # green verdict and takes heavy only when there is something to build. The
      # action caches the fleet listing, so the second call costs no API calls.
      # An `apple` or `hosted` weight, or an explicit selector, has no lighter
      # pool (the light pool cannot run Xcode), so light follows it.
      - id: pick-light
        if: steps.gate.outputs.proceed == 'true' && steps.ci.outputs.ready == 'true' && steps.judge.outputs.judge != 'skip'
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.39.5
        with:
          weight:             ${{ (inputs.runner-weight == 'apple' || inputs.runner-weight == 'hosted') && inputs.runner-weight || 'light' }}
          labels:             ${{ inputs.runner-labels }}
          gh-app-client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - id: pick-heavy
        if: steps.gate.outputs.proceed == 'true' && steps.ci.outputs.ready == 'true' && steps.judge.outputs.judge != 'skip'
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.39.5
        with:
          weight:             ${{ inputs.runner-weight }}
          labels:             ${{ inputs.runner-labels }}
          gh-app-client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  # The build (here, when the repo has no pr-checks), the agent, then a
  # deterministic push and publish. A green verdict stays on the light pool;
  # anything that needs a build or a fix takes the heavy one.
  verify:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.gate.outputs.runner) }}
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read   # the failed jobs' logs of the pr-checks run
    env:
      GH_TOKEN: ${{ github.token }}
      REPO:     ${{ github.repository }}
      PR:       ${{ needs.gate.outputs.number }}
      HEAD_REF: ${{ needs.gate.outputs.head-ref }}
      BASE_REF: ${{ needs.gate.outputs.base-ref }}
      # The identity every fix commit carries. It is also the author the shared
      # Renovate preset lists under gitIgnoredAuthors, so Renovate keeps owning
      # a branch this job has committed to. Change both together.
      # FIX_ID is the user id inside FIX_EMAIL. The agent is told to commit as
      # this identity (run-agent bot-name and bot-id), and the push step writes
      # its one commit per round as this author whatever the agent used.
      FIX_NAME:  github-actions[bot]
      FIX_ID:    '41898282'
      FIX_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.39.5
        with:
          selector: ${{ needs.gate.outputs.runner }}

      # The PR's head commit, not the merge ref: a fix is committed on top of
      # it. By SHA, not branch, so a PR merged or closed while the job queued
      # still checks out; the `open` step stops it before anything is pushed
      # or published. No credentials persist. Dependency install scripts run
      # below, and a token they could read is a token they could push with.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.head-sha }}
          fetch-depth: 0
          filter: blob:none   # history for the range below, blobs on demand
          persist-credentials: false

      # Toolchain only. setup-stack resolves the commands and installs nothing,
      # so the green path below never pays for an install. Isolation is
      # hard-coded, never a caller input: a verification job that can see
      # yesterday's tree is not verifying.
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@pinned/v1.39.5
        with:
          stack:           ${{ needs.gate.outputs.stack }}
          isolate:         true
          cache:           false
          env:             ${{ inputs.env }}
          build-env:       ${{ inputs.build-env }}
          install:         ${{ inputs.install }}
          build:           ${{ inputs.build }}
          typecheck:       ${{ inputs.typecheck }}
          test:            ${{ inputs.test }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}

      # Facts the agent and the publish step both need, computed once.
      #   fix-rounds: fix commits this job pushed to the branch. The push step
      #               writes each round as ONE commit with a Deps-Verify-Round
      #               trailer, so the count never depends on a subject the
      #               agent chose.
      #   base-sha:   the head before the agent, so its commits can be isolated
      # It also sets the commit identity, before the agent can commit anything.
      - id: facts
        run: |
          set -euo pipefail
          git config user.name  "$FIX_NAME"
          git config user.email "$FIX_EMAIL"
          # Only commits this PR adds: a fix merged with an earlier PR is in the
          # base branch's history and is not a round spent on this one.
          fixes=$(git log --format='%h %s%x09%(trailers:key=Deps-Verify-Round,valueonly,separator=)' \
                    "origin/$BASE_REF..HEAD" | awk -F'\t' '$2 != "" { print $1 }')
          rounds=$(printf '%s' "$fixes" | grep -c . || true)
          {
            echo "fix-rounds=$rounds"
            echo "base-sha=$(git rev-parse HEAD)"
            echo "fixes<<EOF_FIXES"
            printf '%s\n' "${fixes:-none}"
            echo "EOF_FIXES"
          } >> "$GITHUB_OUTPUT"
          echo "fix-rounds=$rounds"

      # claude-code-action stops a run whose actor is a bot outside allowed-bots.
      # A workflow_run's actor is whoever pushed the commit PR Checks ran on, so
      # after a fix round it is the App this job pushed with, and re-verifying
      # our own fix was refused. That actor is allowed only when the head commit
      # is a fix round of this job: the fix author and the push step's trailer.
      # Any other bot still stops the agent.
      - id: actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          extra=''
          case "$ACTOR" in
            *'[bot]')
              author=$(git log -1 --format='%ae' HEAD)
              round=$(git log -1 --format='%(trailers:key=Deps-Verify-Round,valueonly,separator=)' HEAD)
              if [ "$author" = "$FIX_EMAIL" ] && [ -n "$round" ]; then
                extra=",$ACTOR"
                echo "re-verifying fix round $round, pushed by $ACTOR"
              fi
              ;;
          esac
          echo "fix-pusher=$extra" >> "$GITHUB_OUTPUT"

      # Renovate stops rebasing a branch, so its PR can never automerge, once the
      # branch carries a commit by an author it does not ignore. A fix is pushed
      # only where the repo's Renovate config ignores FIX_EMAIL: listed in its
      # own gitIgnoredAuthors, or inherited from this repo's preset
      # (`default.json` lists it). Elsewhere the agent is told not to commit and
      # the push step refuses, so the PR ends needs-manual, as it did before
      # fixes were pushed at all. The config is the first file in Renovate's own
      # search order, read from the checkout. A repo with none is not configured
      # by Renovate here, so a push is not held back. The match is textual: a
      # mention in a comment counts.
      - id: renovate
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cfg=''
          for f in renovate.json renovate.json5 .github/renovate.json .github/renovate.json5 \
                   .gitlab/renovate.json .gitlab/renovate.json5 .renovaterc .renovaterc.json .renovaterc.json5; do
            if [ -f "$f" ]; then cfg="$f"; break; fi
          done
          if [ -z "$cfg" ] && [ -f package.json ] && jq -e '.renovate' package.json >/dev/null 2>&1; then
            cfg=package.json
          fi
          preset="[\"']github>${OWNER}/\\.github(#[^\"']*)?[\"']"
          if [ -z "$cfg" ]; then
            ok=true; why="no Renovate config in the repo"
          elif grep -qF "$FIX_EMAIL" "$cfg"; then
            ok=true; why="$cfg lists the fix author in gitIgnoredAuthors"
          elif grep -qE "$preset" "$cfg"; then
            ok=true; why="$cfg extends the shared preset, which ignores the fix author"
          else
            ok=false
            why="Renovate does not ignore the fix author here: add \"$FIX_EMAIL\" to gitIgnoredAuthors in $cfg, or extend the shared preset"
          fi
          {
            echo "fix-push=$ok"
            echo "why=$why"
          } >> "$GITHUB_OUTPUT"
          echo "fix-push=$ok: $why"

      # Logs do not cross jobs, so a red pr-checks verdict fetches the failed
      # jobs' logs here, where the agent reads them.
      - if: needs.gate.outputs.mode == 'ci' && needs.gate.outputs.verdict != 'green' && needs.gate.outputs.run-id != ''
        env:
          RUN_ID: ${{ needs.gate.outputs.run-id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps-logs"
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > "$RUNNER_TEMP/deps-logs/ci.log" 2>&1 || true

      # Only when there is no pr-checks run to read. `run-phases` runs every
      # command in its own subshell, keeps going past a failure, and writes each
      # phase's full output to a log, because the agent diagnoses from the log,
      # not from a phase name.
      - id: steps
        if: needs.gate.outputs.mode == 'own'
        continue-on-error: true
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.39.5
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          install:        ${{ steps.setup.outputs.install }}
          build:          ${{ steps.setup.outputs.build }}
          typecheck:      ${{ steps.setup.outputs.typecheck }}
          test:           ${{ steps.setup.outputs.test }}
          smoke:          ${{ inputs.smoke }}
          log-dir:        ${{ runner.temp }}/deps-logs
          keep-going:     true

      # One verdict string, whichever source produced it:
      #   green | red:<steps or jobs> | red:infra (the runner failed twice)
      # The gate decided it from the pr-checks run. Only a repo with no
      # pr-checks is decided here, from its own build.
      - id: result
        env:
          MODE:        ${{ needs.gate.outputs.mode }}
          CI_VERDICT:  ${{ needs.gate.outputs.verdict }}
          OWN_FAILED:  ${{ steps.steps.outputs.failed }}
        run: |
          set -euo pipefail
          if [ "$MODE" = own ]; then
            v=green; [ -n "${OWN_FAILED:-}" ] && v="red:$OWN_FAILED"
          else
            v="$CI_VERDICT"
          fi
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          echo "verdict: $v"
          if [ "$v" != green ]; then
            echo "::warning title=Dependency build failed::$v. The agent reads the logs and either fixes the cause or explains it on the PR."
          fi

      # Opus when there is something to fix or a major to read; Sonnet when the
      # build is green on a minor or patch, where the work is reading notes.
      #
      # The agent commits and never pushes. The push is the deterministic step
      # after it, which checks what the commits touch first.
      #
      # `allowed-bots` is load-bearing. Without it the action aborts with
      # "Workflow initiated by non-human actor", and every run here is
      # bot-initiated. Named explicitly rather than '*', from the gate's list,
      # plus the App that pushed this job's own fix round (the `actor` step).
      - id: agent
        if: needs.gate.outputs.judge == 'agent'
        uses: dodi-smart/.github/actions/run-agent@pinned/v1.39.5
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # actions/pick-model sets the model and the cap: red gets the most
          # turns, a green minor 40, because it reads notes for a dozen
          # packages in a group. run-agent's `why` names the cap when it is
          # reached.
          stage:   deps-verify
          signals: ${{ needs.gate.outputs.update }} ${{ steps.result.outputs.verdict != 'green' && 'red' || '' }}
          model-pin: ${{ vars.AGENT_MODEL_PIN }}
          org-plugins:             ${{ vars.AGENT_PLUGINS }}
          org-plugin-marketplaces: ${{ vars.AGENT_PLUGIN_MARKETPLACES }}
          agent-env:               ${{ vars.AGENT_ENV }}
          agent-env-secret:        ${{ secrets.AGENT_ENV_SECRET }}
          allowed-bots: ${{ needs.gate.outputs.dependency-bots }}${{ steps.actor.outputs.fix-pusher }}
          # claude-code-action sets its own git identity on the checkout, over
          # the `git config` of the facts step, so without these the agent
          # commits as claude[bot]. The push step accepts both identities and
          # rewrites the round to ours either way.
          bot-name: ${{ env.FIX_NAME }}
          bot-id:   ${{ env.FIX_ID }}
          # run-agent writes a needs-manual verdict naming the cause whenever
          # the agent leaves no valid one, so publish reads one file always.
          report-file:     ${{ runner.temp }}/deps-verdict.json
          report-valid:    '.verdict | IN("verified", "fixed", "needs-manual")'
          report-fallback: '{"verdict": "needs-manual"}'
          allowed-tools: 'Bash "Bash(gh:*)" Read Write Edit Grep Glob WebFetch'
          prompt: |
            Verify dependency PR #${{ needs.gate.outputs.number }} in
            ${{ github.repository }}, and fix it when the update broke something.

            You are on the PR branch `${{ needs.gate.outputs.head-ref }}`,
            base `${{ needs.gate.outputs.base-ref }}`.

            Facts already established. Do not re-derive them:
            - Build result: `${{ steps.result.outputs.verdict }}`.
              `green`, `red:<failed jobs or steps>`, or `red:infra` when the
              runner itself failed twice (out of memory, killed daemon).
            - Source: ${{ needs.gate.outputs.mode == 'ci' && format('the repo''s own PR checks run, {0}. The failed jobs'' logs are in `{1}/deps-logs/ci.log`.', needs.gate.outputs.url, runner.temp) || format('this job''s own build. Each step''s output is in `{0}/deps-logs/<step>.log`.', runner.temp) }}
            - Update kind: `${{ needs.gate.outputs.update }}`.
            - Fix rounds already pushed: ${{ steps.facts.outputs.fix-rounds }} of 2.
            - A fix can be pushed here: ${{ steps.renovate.outputs.fix-push == 'true' && 'yes' || format('no. {0}', steps.renovate.outputs.why) }}
            - Fix commits already on this branch:
              ${{ steps.facts.outputs.fixes }}

            Nothing is installed. Run a command only when you need to: to
            reproduce a failure you are fixing, or to prove a fix. On a green
            build that you do not change, run nothing. The repo's own
            commands, runnable as they are. Source the env file first, and use
            a subshell per command, install first:
              env file:  ${{ steps.setup.outputs.env-file }}
              install:   ${{ steps.setup.outputs.install }}
              build:     ${{ steps.setup.outputs.build }}
              typecheck: ${{ steps.setup.outputs.typecheck }}
              test:      ${{ steps.setup.outputs.test }}

            ## Work

            1. List every direct dependency whose version changed, from the
               manifest diff against `origin/${{ needs.gate.outputs.base-ref }}`.
               Count lockfile-only transitive changes, do not list them.
            2. For a major, and for any package whose notes mention a deprecation
               or removal, read the release notes or the compare view between
               the two tags. Skip notes for a patch with nothing in its title.
               Never guess about notes you could not find; say so.
            3. Grep this repo for each breaking or deprecated API. A change the
               code never touches is not a risk here.
            4. If the build is red, read the logs FIRST. Decide for each failed
               job or step: caused by this update, caused by the runner
               (`red:infra`, exit 137, a killed process: never try to fix
               those), or already failing on the base branch (check the base
               branch's latest CI with `gh run list --branch ${{ needs.gate.outputs.base-ref }}`
               before reproducing anything).
            5. Fix when the update caused the failure, or when this repo calls
               an API the notes deprecate and name a replacement for, and only
               while fix rounds are under 2 and a fix can be pushed here. When
               it cannot, commit nothing: the verdict is `needs-manual`, and
               its blocker line names the fix you would have made.
               - Make the smallest change that fixes it.
               - NEVER edit a lockfile. The job regenerates lockfiles with the
                 stack's own command after you finish.
               - NEVER change a version this PR's update set. Renovate chose it.
               - You MAY change another version declaration when the update's
                 notes or the build require it: a companion bump, such as the
                 Gradle wrapper a new AGP needs, a peer dependency, or the
                 Kotlin that pairs with a Compose compiler. Only in a file
                 matching `${{ steps.setup.outputs.version-files }}`. Pick the
                 lowest version that satisfies the requirement and cite the
                 note or log line that requires it. Record every such change in
                 `${{ runner.temp }}/deps-bumps.json`:
                   [{"name": "gradle", "from": "9.5.0", "to": "9.6.0", "why": "AGP 9.4.1 requires Gradle 9.6"}]
               - Re-run the failed commands until they pass.
               - Commit with `git commit -m "chore(deps): adapt to <pkg> <version>"`
                 and a body of one or two lines naming what changed.
               - Do NOT push. A later step checks and pushes your commits.
            5a. For a major (update kind `major`), also find the migration
               guide (release notes, a MIGRATION, UPGRADING or CHANGELOG file
               upstream, or the project's upgrade docs) and read the section
               between the two versions. When it names a codemod or migration
               command, run it rather than editing by hand. After you change
               code, run the repo's typecheck and test commands above. A green
               build you did not change needs no re-run. A major is never
               merged by automation, so say plainly in the comment what a
               reviewer has to check.
            6. Write `${{ runner.temp }}/deps-verdict.json`:
                 {"verdict": "verified" | "fixed" | "needs-manual", "reason": "<one line>"}
               - `verified`: build green, nothing breaking reaches this repo.
               - `fixed`: you committed a fix in this run and the commands pass.
               - `needs-manual`: anything else. A red build you did not fix is
                 always this, including one that was already red on the base.
            7. Write `${{ runner.temp }}/deps-verdict.md`, the body of the PR
               comment. The job writes the verdict line above it from the
               JSON, so do not repeat the verdict or the reason. Hard limit
               1000 characters. Exactly this shape:

                 | Package | Version | Notes |
                 |---|---|---|
                 | `pkg` | `1.2.3 → 1.3.0` | minor |

               - Notes cells hold a few words, never a sentence.
               - Add `+ N transitive lockfile updates` under the table if any.
               - More than 8 rows: put the table in `<details><summary>N packages</summary>`.
               - For each fix commit, one line: `Fixed: <what changed> (<short sha>)`.
               - For each companion bump, one line: `Bumped: <name> <from> → <to>, <why>`.
               - For needs-manual, one line naming the blocker and the log line
                 that shows it, in backticks.
               - A major may add at most two sentences and a release-notes link.
               - Nothing else. No headings, no closing summary, no advice.

            Write both files with the Write tool. The job posts the comment and
            sets the label from them. Your turns are capped, so write a
            provisional `needs-manual` pair as soon as you have the package
            table, and overwrite it when you finish. A run cut off by the cap
            then still leaves a report.
            Do not comment on, label, merge or approve the pull request yourself.

      # Lock file maintenance has no agent report. A green build is `verified`
      # with this fixed verdict, written where the agent's would be, so publish
      # has one path.
      - if: needs.gate.outputs.judge == 'lockfile'
        run: |
          set -euo pipefail
          reason="Lock file maintenance; the repo's checks passed."
          jq -nc --arg r "$reason" '{verdict: "verified", reason: $r}' > "$RUNNER_TEMP/deps-verdict.json"
          echo "No dependency versions changed, only lock files." > "$RUNNER_TEMP/deps-verdict.md"

      # Still the same open PR at the head this job checked out. A PR merged,
      # closed or pushed to while the job ran gets nothing pushed or
      # published, and the run stays green: a verdict on a PR that moved on
      # is noise, and the push for the new head is the next run's.
      - id: open
        if: ${{ !cancelled() }}
        uses: dodi-smart/.github/actions/pr-facts@pinned/v1.39.5
        with:
          number:       ${{ needs.gate.outputs.number }}
          expected-sha: ${{ needs.gate.outputs.head-sha }}

      # The only push, through actions/push-round, which checks every commit
      # before any token exists, regenerates lockfiles with the stack's lock
      # command, then mints the App token and pushes one commit per round with
      # a Deps-Verify-Round trailer and a Deps-Verify-Bump per recorded
      # companion bump. Renovate's own lines (`keep-range`) are never changed.
      # A repo whose Renovate config does not ignore the fix author refuses
      # here (`renovate` step). AGENT_EMAILS is the fix identity and
      # claude-code-action's own, which it falls back to; anything else is
      # refused, never rewritten.
      - id: push
        if: ${{ !cancelled() && steps.open.outputs.found == 'true' && needs.gate.outputs.judge == 'agent' }}
        uses: dodi-smart/.github/actions/push-round@pinned/v1.39.5
        with:
          base-sha:       ${{ steps.facts.outputs.base-sha }}
          head-ref:       ${{ needs.gate.outputs.head-ref }}
          rounds:         ${{ steps.facts.outputs.fix-rounds }}
          trailer-key:    Deps-Verify-Round
          author-name:    ${{ env.FIX_NAME }}
          author-email:   ${{ env.FIX_EMAIL }}
          agent-emails: |
            ${{ env.FIX_EMAIL }}
            41898282+claude[bot]@users.noreply.github.com
          allowed:        ${{ steps.renovate.outputs.fix-push }}
          denied-why:     ${{ steps.renovate.outputs.why }}
          refuse-paths:   ${{ steps.setup.outputs.lockfiles }}
          keep-range:     origin/${{ needs.gate.outputs.base-ref }}..${{ steps.facts.outputs.base-sha }}
          record-paths:   ${{ steps.setup.outputs.version-files }}
          records-file:   ${{ runner.temp }}/deps-bumps.json
          record-trailer: Deps-Verify-Bump
          lock:           ${{ steps.setup.outputs.lock }}
          lockfiles:      ${{ steps.setup.outputs.lockfiles }}
          env-file:       ${{ steps.setup.outputs.env-file }}
          client-id:      ${{ secrets.GH_APP_CLIENT_ID }}
          private-key:    ${{ secrets.GH_APP_PRIVATE_KEY }}

      # For publish's labels, so a repo that has never seen a verdict label
      # gets it created. After push-round, which ran the lock tooling.
      - id: app-token
        if: ${{ !cancelled() && steps.open.outputs.found == 'true' }}
        uses: dodi-smart/.github/actions/app-token@pinned/v1.39.5
        with:
          client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permissions: issues:write pull-requests:write

      # The label and the comment are set HERE, from the verdict files, never by
      # the agent. One label, the others removed, so a PR never carries two
      # verdicts. A build that is red and was not fixed is needs-manual whatever
      # the agent wrote, and a branch that carries fix commits is `fixed`, never
      # `verified`, so a later automerge rule can tell the two apart.
      #
      # Every comment carries the intent hash, a hidden line the next run reads
      # to tell a rebase of the same update from a new one.
      #
      # Skipped when this run pushed: the push starts a new run on the new head,
      # and that run's verdict is the one that counts.
      - id: publish
        if: ${{ !cancelled() && steps.open.outputs.found == 'true' && steps.push.outputs.pushed != 'true' }}
        env:
          # `result` is empty when a step before it failed. The gate's verdict is
          # the same string in ci mode, so it stands in; both empty means unknown.
          VERDICT:  ${{ steps.result.outputs.verdict || needs.gate.outputs.verdict }}
          INTENT:   ${{ needs.gate.outputs.intent }}
          ROUNDS:   ${{ steps.facts.outputs.fix-rounds }}
          REFUSED:  ${{ steps.push.outputs.refused }}
          PR_AUTHOR: ${{ needs.gate.outputs.author }}
          JSON:     ${{ runner.temp }}/deps-verdict.json
          MD:       ${{ runner.temp }}/deps-verdict.md
          COMMENT:  ${{ runner.temp }}/deps-comment.md
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # `fallback` when run-agent wrote the report; `workflow-mismatch` when
          # the agent was not started on purpose. Empty when it never ran.
          REPORT_SOURCE: ${{ steps.agent.outputs.report }}
          AGENT_SKIPPED: ${{ steps.agent.outputs.skipped }}
        run: |
          set -euo pipefail
          missing=false
          agent=$(jq -r '.verdict // empty' "$JSON" 2>/dev/null || true)
          reason=$(jq -r '.reason // .why // empty' "$JSON" 2>/dev/null || true)
          case "$agent" in verified|fixed|needs-manual) ;; *) missing=true ;; esac
          if [ "$missing" = true ]; then
            reason="A step before the agent failed, so the agent did not run. See the run log."
          fi
          [ -s "$MD" ] || printf 'Build: %s. No package table, because the agent wrote no report.\n' "\`${VERDICT:-unknown}\`" > "$MD"

          # The job's facts decide; the agent's word only counts when they agree.
          if   [ "$VERDICT" != green ] || [ "$missing" = true ]; then label=needs-manual
          elif [ "$agent" = needs-manual ]; then label=needs-manual
          elif [ "$ROUNDS" -gt 0 ];         then label=fixed          # green, with fix commits on the branch
          elif [ "$agent" = fixed ];        then label=needs-manual   # a fix that never reached the branch
          else                                   label=verified
          fi

          {
            printf '**deps:%s** %s\n\n' "$label" "$reason"
            cat "$MD"
            [ -z "${REFUSED:-}" ] || printf '\nA fix was prepared but not pushed: %s.\n' "$REFUSED"
          } > "$COMMENT"
          [ -z "$INTENT" ] || printf '\n<!-- deps-intent: %s -->\n' "$INTENT" >> "$COMMENT"

          # Labels with the App's token when there is one, so a repo that has
          # never seen `deps:fixed` gets it created on first use.
          export GH_TOKEN="${APP_TOKEN:-$GH_TOKEN}"
          gh label create "deps:$label" --repo "$REPO" --color ededed >/dev/null 2>&1 || true
          # A `deps:needs-manual` that the pull request's own author applied
          # (Renovate, from a package rule that asks for manual review) is that
          # rule's, not a verdict of this job, so it stays whatever the verdict.
          # The last `labeled` event says who set it: this job's labels come
          # from the App or GITHUB_TOKEN, never from the PR author. If the
          # events cannot be read, the label is treated as this job's own.
          keep=''
          if [ "$label" != needs-manual ]; then
            setter=$(gh api --paginate "/repos/$REPO/issues/$PR/events?per_page=100" \
                       --jq '.[] | select(.event == "labeled" and .label.name == "deps:needs-manual") | .actor.login' \
                       2>/dev/null | tail -n 1 || true)
            if [ -n "$PR_AUTHOR" ] && [ "$setter" = "$PR_AUTHOR" ]; then
              keep=deps:needs-manual
              echo "keeping deps:needs-manual: $PR_AUTHOR applied it"
            fi
          fi
          for old in deps:verified deps:fixed deps:needs-manual; do
            [ "$old" = "deps:$label" ] && continue
            [ "$old" = "$keep" ] && continue
            gh api -X DELETE "/repos/$REPO/issues/$PR/labels/$old" >/dev/null 2>&1 || true
          done
          gh api "/repos/$REPO/issues/$PR/labels" -f "labels[]=deps:$label" >/dev/null
          echo "verdict label: deps:$label"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          # Red after the comment, so the PR says why: no report at all, or one
          # run-agent had to write. The deliberate skip (the workflow file
          # mismatch) is a reason, not a failure.
          if [ "$missing" = true ] || { [ "${REPORT_SOURCE:-}" = fallback ] && [ -z "${AGENT_SKIPPED:-}" ]; }; then
            echo "::error title=No verification report::$reason"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # One comment per pull request, rewritten by every later run. Renovate
      # rebases a long-lived PR repeatedly, and stacked verdict tables are how a
      # report stops being read.
      - if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: dodi-smart/.github/actions/sticky-comment@pinned/v1.39.5
        with:
          key:       deps-verify
          number:    ${{ needs.gate.outputs.number }}
          body-file: ${{ runner.temp }}/deps-comment.md

      # A `deps:fixed` PR merges only after pr-review approves the fix commits
      # (deps-automerge reads `review / verdict`). Asked for after the comment,
      # so the run the label also starts here reads the new intent hash and
      # skips.
      - if: ${{ !cancelled() && steps.publish.outputs.label == 'fixed' }}
        uses: dodi-smart/.github/actions/request-review@pinned/v1.39.5
        with:
          sha:         ${{ needs.gate.outputs.head-sha }}
          number:      ${{ needs.gate.outputs.number }}
          client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Red after the comment is up; publish decides when.
      - if: ${{ !cancelled() && steps.publish.outputs.failed == 'true' }}
        run: exit 1
