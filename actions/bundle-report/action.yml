# First-load JS per route and in total for a Next.js build, compared with the default branch.
# Thin wrapper; the sizing and the reasoning are in bundle-report.sh.
name: Bundle report
description: Measure a Next.js build's gzip first-load JS per route and in total, compare it with a base report, and post the largest changes as a sticky comment.

inputs:
  next-dir:
    description: >-
      The build directory (`.next`, or a downloaded copy of it). It needs the
      manifests and the chunks they name, nothing else.
    default: .next
  base-file:
    description: >-
      A report written by an earlier run (this action's `report-file`) to compare
      with. A missing or malformed file means no base, with a warning.
    default: ''
  base-artifact:
    description: >-
      When `base-file` is empty: the name of an artifact holding a report, fetched
      from the newest successful run on the default branch that has an unexpired
      one. Needs `actions: read`. Nothing found means no base, with a warning,
      never a failure.
    default: ''
  top:
    description: How many routes the comment lists, ordered by absolute change (by size when there is no base).
    default: '10'
  max-increase-kb:
    description: >-
      Fail when the total first-load JS grew by more than this many kB (1 kB is
      1000 bytes) against the base. 0 means report only. Never checked without a base.
    default: '0'
  number:
    description: Pull request number. Empty means no comment.
    default: ${{ github.event.pull_request.number }}
  token:
    description: 'Token to comment with and to read artifacts with. Needs pull-requests: write, and actions: read for `base-artifact`.'
    default: ${{ github.token }}

outputs:
  total-bytes:
    description: Gzip bytes of every distinct JS chunk any route loads. Empty when there was nothing to measure.
    value: ${{ steps.report.outputs.total-bytes }}
  delta-bytes:
    description: Change in `total-bytes` against the base. Empty without a base.
    value: ${{ steps.report.outputs.delta-bytes }}
  report-file:
    description: Path of the JSON report, for a default-branch run to upload as the next base. Empty when there was nothing to measure.
    value: ${{ steps.report.outputs.report-file }}
  failed:
    description: Why `max-increase-kb` was breached, or empty.
    value: ${{ steps.report.outputs.failed }}

runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        NEXT_DIR:        ${{ inputs.next-dir }}
        BASE_FILE:       ${{ inputs.base-file }}
        BASE_ARTIFACT:   ${{ inputs.base-artifact }}
        TOP:             ${{ inputs.top }}
        MAX_INCREASE_KB: ${{ inputs.max-increase-kb }}
        REPO:            ${{ github.repository }}
        DEFAULT_BRANCH:  ${{ github.event.repository.default_branch }}
        GH_TOKEN:        ${{ inputs.token }}
        OUT:             ${{ runner.temp }}/bundle-report.md
        REPORT_FILE:     ${{ runner.temp }}/bundle-report.json
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/bundle-report.sh"'

    # Post before failing, so the comment says why the job is red.
    - if: ${{ inputs.number != '' }}
      uses: dodi-smart/.github/actions/sticky-comment@pinned/v1.33.1
      with:
        key:       bundle-report
        body-file: ${{ runner.temp }}/bundle-report.md
        number:    ${{ inputs.number }}
        token:     ${{ inputs.token }}

    - if: ${{ steps.report.outputs.failed != '' }}
      shell: bash
      env:
        FAILED: ${{ steps.report.outputs.failed }}
      run: |
        echo "::error::bundle-report: $FAILED"
        exit 1
