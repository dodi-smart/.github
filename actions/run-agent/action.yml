# Run claude-code-action with the org's settled defaults.
#
# Bash is allowed broadly on purpose. The bound is not the allowlist: the action
# refuses to run for an actor without write access, so untrusted content only
# reaches the agent when someone trusted invokes it. The real guards are
# elsewhere and must not be removed. `agent:no-touch` is checked before every
# other condition, and public repos and fork PRs never touch a self-hosted
# runner.
#
# Five footguns are repeated below because the code reads as wrong without them:
#
#   `--allowed-tools` is VARIADIC, space-separated, each entry quoted if it
#   contains parentheses. A comma-joined list parses as one meaningless token:
#   nothing matches, every Bash call is denied, and the job reports SUCCESS.
#
#   `display_report` defaults to false, so a run that did nothing looks exactly
#   like a run that worked. Forced on below.
#
#   A non-empty `prompt` selects AGENT mode, which creates no comment at all.
#   `use_sticky_comment` is read only in tag mode, so pairing the two posts
#   nothing. The guard below refuses that pair instead of passing green.
#
#   `track_progress` overrides that and forces TAG mode, but tag mode only
#   renders a prompt for pull_request, issues, issue_comment,
#   pull_request_review_comment and pull_request_review, and for issues it
#   knows three actions: opened, assigned and labeled. Any other event
#   (workflow_dispatch, schedule, a reopened issue) fails the job in Create
#   prompt before the agent runs. The guard below drops the progress comment
#   for those cases rather than the run.
#
#   claude-code-action sets its own git identity (`claude[bot]`) on the
#   checkout, over whatever the caller configured earlier. A caller that checks
#   who authored the agent's commits has to pass the identity it expects as
#   `bot-name` and `bot-id`, or its own `git config` is silently replaced.
name: Run agent
description: Invoke claude-code-action with the org's tool allowlist, model policy and reporting defaults.

inputs:
  oauth-token:
    description: 'CLAUDE_CODE_OAUTH_TOKEN'
    required: true
  prompt:
    description: 'The prompt, or a plugin slash command'
    required: true
  stage:
    description: >-
      What the agent is doing, for the model policy in actions/pick-model:
      triage | implement | fix-ci | fix-review | review | deps-verify |
      fleet-sync | assist. The policy picks the model and the turn cap from it
      and the facts below, so a caller never names a model id. Empty only for
      a caller written before stages, which then runs on its own `model`.
    default: ''
  effort:
    description: "The issue's Effort field, empty when unknown."
    default: ''
  priority:
    description: "The issue's Priority field, empty when unknown."
    default: ''
  risk:
    description: "The issue's Risk field, empty when unknown."
    default: ''
  signals:
    description: 'Space-separated facts the gate established. The words pick-model knows are listed in its pick.sh; an unknown one fails.'
    default: ''
  round:
    description: 'The fix round about to run, 1 is the first.'
    default: ''
  model:
    description: 'Caller override of the policy. Leave empty unless a repo has a reason.'
    default: ''
  model-pin:
    description: >-
      Emergency pin that wins over the policy and any override. Every shared
      workflow forwards vars.AGENT_MODEL_PIN here, so one org variable moves
      every agent run when a model misbehaves.
    default: ''
  max-turns:
    description: "Cap on agent turns, over the policy's. Empty means the policy's cap, or the action default when it has none. A cap is what stops a stuck agent from spending a whole job timeout."
    default: ''
  allowed-tools:
    description: 'Variadic, space-separated. See the header before changing.'
    default: 'Bash "Bash(gh:*)" Read Grep Glob'
  append-system-prompt:
    description: 'Extra system-prompt text, appended after house-style. Must be ONE LINE, with no double quotes, backticks or dollar signs, because it is interpolated into a double-quoted shell argument.'
    default: ''
  house-style:
    description: >-
      The org writing-style rule, prepended to append-system-prompt on every
      run. Same one-line constraint as append-system-prompt. Do not override
      this to change the rule. Edit the default here, so every workflow picks
      up the fix at once.
    default: 'House writing style for everything you write, issue comments and PR bodies alike. Be plain and direct, like telling a colleague what happened. One idea per sentence, and split anything that makes the reader backtrack. Active voice, name the actor. No em dashes, use a period or a comma. Sentence case headings. No inline-header bullets, write the sentence instead. Cut words that sound technical and say nothing: surface, harness, substrate, vector, primitive, pivotal, delve, underscore, crucial, leverage, foster, showcase. Skip the pattern not just X but Y, state the point once. Prefer the plain word, use instead of leverage, help instead of facilitate. Write to the person who has to act on this today. Lead with the verdict or answer in one line, and never restate a table or list in prose. No preamble, do not restate the request back, and no chatbot enthusiasm.'
  sticky-comment:
    description: >-
      Update one comment instead of adding a new one each run. TAG MODE ONLY,
      so only when `prompt` is empty. Setting it with a prompt is an error.
    default: 'false'
  track-progress:
    description: >-
      Post a live progress comment, so a run in flight is visible rather than
      silent. Ignored on an event the action cannot render a tag-mode prompt
      for: anything but pull_request, issues, issue_comment,
      pull_request_review_comment and pull_request_review, and for issues,
      anything but opened, assigned and labeled. The run proceeds without the
      comment; see the header.
    default: 'false'
  allowed-bots:
    description: 'Comma-separated bot logins permitted to initiate. Named explicitly, never "*".'
    default: ''
  org-plugins:
    description: >-
      The org's plugins, added to `plugins` on every run. Shared workflows
      forward vars.AGENT_PLUGINS. Newline-separated, like `plugins`.
    default: ''
  org-plugin-marketplaces:
    description: "Marketplaces for org-plugins. Shared workflows forward vars.AGENT_PLUGIN_MARKETPLACES."
    default: ''
  agent-env:
    description: >-
      KEY=VALUE lines set for the agent alone, through claude-code-action's
      settings, never through GITHUB_ENV. Shared workflows forward vars.AGENT_ENV.
      Keys that would change the runner, the action or the agent's credentials
      are refused; see agent-env.sh.
    default: ''
  agent-env-secret:
    description: 'The same as agent-env, with masked values; its line wins on a clash. Shared workflows forward secrets.AGENT_ENV_SECRET.'
    default: ''
  plugins:
    description: 'Plugin spec, e.g. code-review@claude-code-plugins'
    default: ''
  plugin-marketplaces:
    description: 'Marketplace URL for the above'
    default: ''
  additional-permissions:
    description: 'YAML block, e.g. "actions: read"'
    default: ''
  bot-name:
    description: >-
      Login of the git identity the agent commits as, forwarded to
      claude-code-action's `bot_name`. The default is the action's own, so a
      caller that does not care sees no change. See the header.
    default: 'claude[bot]'
  bot-id:
    description: >-
      Numeric GitHub user id for `bot-name`, forwarded to `bot_id`. The commit
      email is `<bot-id>+<bot-name>@users.noreply.github.com`, so the two have to
      belong together.
    default: '41898282'
  branch-prefix:
    description: >-
      Prefix of the branch claude-code-action creates for an issue in tag mode,
      forwarded to `branch_prefix`. The action's own default is `claude/`, which
      breaks the org's conventional branch names, so it is never passed through.
      A caller that knows the change type passes `feat/` or `fix/`.
    default: 'chore/'
  report-file:
    description: >-
      A JSON file the prompt tells the agent to write. When it is set, run-agent
      guarantees the file exists after the run: if the agent left none, or one
      `report-valid` rejects, it writes `report-fallback` with a `why` field
      naming the cause. Callers read one file on every path.
    default: ''
  report-valid:
    description: 'jq expression that is `true` for an acceptable report, e.g. `.verdict | IN("a", "b")`.'
    default: 'true'
  report-fallback:
    description: 'JSON object written in place of a missing or invalid report; `why` is added to it.'
    default: '{}'
  github-token:
    description: 'Reads the running workflow file at two refs, for the mismatch check below. Needs contents: read.'
    default: ${{ github.token }}

# `execution-file` and `conclusion` are EMPTY when the agent never ran, which is
# not the same as a run that found nothing. claude-code-action skips itself, and
# still reports success, when the running workflow file differs from the
# default branch's copy; on a pull_request event that file is read at the merge
# commit. The `skipped` and `why` outputs name that case before the action is
# started, and the rest are read from the execution file, because the action
# hides its own output, error text included. Callers map these to their own
# wording instead of parsing the file again.
outputs:
  execution-file:
    description: 'Path to claude-code-action execution log. Empty when the agent never ran.'
    value: ${{ steps.agent.outputs.execution_file }}
  conclusion:
    description: "claude-code-action's own success or failure. Empty when the agent never ran."
    value: ${{ steps.agent.outputs.conclusion }}
  skipped:
    description: '`workflow-mismatch` when the agent was not started because the running workflow file differs from the default branch; empty otherwise.'
    value: ${{ steps.validate.outputs.skipped }}
  why:
    description: 'One line saying why the agent did not start, stopped without a result, or left no valid report. Empty for a run that finished normally.'
    value: ${{ steps.report.outputs.why || steps.outcome.outputs.why || steps.validate.outputs.why }}
  report:
    description: '`agent` when the agent wrote a valid report-file, `fallback` when run-agent wrote it, empty without a report-file.'
    value: ${{ steps.report.outputs.source }}
  model:
    description: 'The model the agent ran on.'
    value: ${{ steps.model.outputs.model }}
  route:
    description: 'Which policy rule chose the model, one line.'
    value: ${{ steps.model.outputs.route }}
  turns:
    description: 'Turns the agent took. Empty when it never ran.'
    value: ${{ steps.outcome.outputs.turns }}
  cost-usd:
    description: 'Cost claude-code-action reported for the run. Empty when it never ran.'
    value: ${{ steps.outcome.outputs.cost }}

runs:
  using: composite
  steps:
    # The model and the turn cap. The ids live in pick-model and nowhere else.
    - id: model
      shell: bash
      env:
        STAGE:     ${{ inputs.stage }}
        EFFORT:    ${{ inputs.effort }}
        PRIORITY:  ${{ inputs.priority }}
        RISK:      ${{ inputs.risk }}
        SIGNALS:   ${{ inputs.signals }}
        ROUND:     ${{ inputs.round }}
        MODEL:     ${{ inputs.model }}
        PIN:       ${{ inputs.model-pin }}
        MAX_TURNS: ${{ inputs.max-turns }}
      run: '"$GITHUB_ACTION_PATH/../pick-model/pick.sh"'

    # The org's plugins and the agent's env. See agent-env.sh.
    - id: org
      shell: bash
      env:
        PLUGINS:          ${{ inputs.plugins }}
        MARKETPLACES:     ${{ inputs.plugin-marketplaces }}
        ORG_PLUGINS:      ${{ inputs.org-plugins }}
        ORG_MARKETPLACES: ${{ inputs.org-plugin-marketplaces }}
        AGENT_ENV:        ${{ inputs.agent-env }}
        AGENT_ENV_SECRET: ${{ inputs.agent-env-secret }}
      run: '"$GITHUB_ACTION_PATH/agent-env.sh"'

    # Fail fast on the combination that silently posts nothing. See the header.
    - name: Reject a sticky comment agent mode will ignore
      if: inputs.sticky-comment == 'true' && inputs.prompt != ''
      shell: bash
      run: |
        echo "::error::sticky-comment is set alongside a non-empty prompt. A prompt selects agent mode, which creates no comment, so this run would report only to the job summary. Use track-progress for a live comment, or instruct the agent to post with gh pr comment."
        exit 1

    # `track_progress` forces TAG mode, and tag mode builds its prompt from the
    # triggering event. It renders one for pull_request, issues, issue_comment,
    # pull_request_review_comment and pull_request_review only, and for issues
    # it knows three actions: opened, assigned and labeled. Any other event, or
    # any other issue action, throws in Create prompt and fails the job before
    # the agent runs -- that is what a reopened issue did, and it is also what
    # a workflow_dispatch run does, since dispatch is none of the five events
    # above. Dropping the progress comment leaves agent mode, which uses the
    # prompt as written and still posts whatever that prompt tells it to post.
    # Narrow the list, never widen it: an event or action tag mode cannot
    # render is a failed job, and a lost progress comment is a cosmetic one.
    - name: Drop a progress comment the action cannot render
      id: progress
      shell: bash
      env:
        TRACK:  ${{ inputs.track-progress }}
        EVENT:  ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
      run: |
        set -euo pipefail
        track="$TRACK"
        if [ "$track" = "true" ]; then
          case "$EVENT" in
            pull_request|issue_comment|pull_request_review_comment|pull_request_review)
              ;;
            issues)
              case "$ACTION" in
                opened|assigned|labeled) ;;
                *)
                  track=false
                  echo "::notice title=No live progress comment::claude-code-action renders a tag-mode prompt for issue events and supports opened, assigned and labeled only. This run is issues/$ACTION, so track-progress is off and the agent reports through the comment its own prompt asks for."
                  ;;
              esac
              ;;
            *)
              track=false
              echo "::notice title=No live progress comment::claude-code-action's track_progress only renders a tag-mode prompt for pull_request, issues, issue_comment, pull_request_review_comment and pull_request_review. This run is $EVENT, so track-progress is off and the agent reports through whatever its own prompt asks for."
              ;;
          esac
        fi
        echo "track=$track" >> "$GITHUB_OUTPUT"

    # See the outputs comment. Only a pull_request event can differ: every
    # other event runs the default branch's own file. An unreadable copy
    # compares equal, so a failed read starts the agent as before.
    - id: validate
      if: startsWith(github.event_name, 'pull_request')
      shell: bash
      env:
        GH_TOKEN:       ${{ inputs.github-token }}
        REPO:           ${{ github.repository }}
        WORKFLOW_REF:   ${{ github.workflow_ref }}
        SHA:            ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        path="${WORKFLOW_REF#"$REPO"/}"; path="${path%@*}"
        raw() { gh api -H "Accept: application/vnd.github.raw" "/repos/$REPO/contents/$path?ref=$1" > "$2" 2>/dev/null || : > "$2"; }
        raw "$SHA" "$RUNNER_TEMP/wf-here" & raw "$DEFAULT_BRANCH" "$RUNNER_TEMP/wf-default" & wait
        if [ -s "$RUNNER_TEMP/wf-here" ] && [ -s "$RUNNER_TEMP/wf-default" ] \
           && ! cmp -s "$RUNNER_TEMP/wf-here" "$RUNNER_TEMP/wf-default"; then
          {
            echo "skipped=workflow-mismatch"
            echo "why=claude-code-action refuses to run while $path at this run's commit differs from $DEFAULT_BRANCH. It runs once that change is on $DEFAULT_BRANCH."
          } >> "$GITHUB_OUTPUT"
          echo "::warning title=Agent not started::$path differs from $DEFAULT_BRANCH, and claude-code-action would skip itself."
        fi

    - id: agent
      if: steps.validate.outputs.skipped == ''
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        prompt: ${{ inputs.prompt }}
        use_sticky_comment: ${{ inputs.sticky-comment }}
        # Not inputs.track-progress. See the step above.
        track_progress: ${{ steps.progress.outputs.track }}
        allowed_bots: ${{ inputs.allowed-bots }}
        plugins: ${{ steps.org.outputs.plugins }}
        plugin_marketplaces: ${{ steps.org.outputs.marketplaces }}
        settings: ${{ steps.org.outputs.settings }}
        additional_permissions: ${{ inputs.additional-permissions }}
        bot_name: ${{ inputs.bot-name }}
        bot_id: ${{ inputs.bot-id }}
        branch_prefix: ${{ inputs.branch-prefix }}
        # Never optional. See the header.
        display_report: true
        claude_args: >-
          --model ${{ steps.model.outputs.model }}
          --allowed-tools ${{ inputs.allowed-tools }}
          ${{ steps.model.outputs.max-turns != '' && format('--max-turns {0}', steps.model.outputs.max-turns) || '' }}
          ${{ format('--append-system-prompt "{0} {1}"', inputs.house-style, inputs.append-system-prompt) }}

    # The settings file holds the agent's env, secret values included. A
    # self-hosted runner keeps RUNNER_TEMP's parent, so it goes now.
    - if: always() && steps.org.outputs.settings != ''
      shell: bash
      env:
        SETTINGS: ${{ steps.org.outputs.settings }}
      run: rm -f "$SETTINGS"

    # Read even when the agent step failed, which is when it matters most.
    # The action writes its log to this path and leaves `execution_file` empty
    # on some failures, so the path is the fallback.
    - id: outcome
      if: always() && steps.agent.outcome != 'skipped'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        OUTCOME:        ${{ steps.agent.outcome }}
        STAGE:          ${{ inputs.stage }}
        MODEL:          ${{ steps.model.outputs.model }}
        ROUTE:          ${{ steps.model.outputs.route }}
      run: |
        set -euo pipefail
        exe="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
        r=$(jq -c '[.[]? | select(.type == "result")] | last // empty' "$exe" 2>/dev/null || true)
        if [ -z "$r" ]; then
          [ "$OUTCOME" = success ] && why="claude-code-action skipped itself and reported success." \
                                   || why="claude-code-action failed before the agent produced a result."
          echo "why=$why" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        IFS=$'\t' read -r subtype is_error turns text < <(jq -r '[.subtype // "", (.is_error // false), (.num_turns // ""),
            ((.result // ((.errors // []) | map(tostring) | join("; "))) | gsub("[\\t\\r\\n]+"; " ") | .[:300])] | @tsv' <<<"$r")
        cost=$(jq -r '.total_cost_usd // empty' <<<"$r")
        case "$subtype" in
          error_max_turns) why="The agent reached its turn cap after $turns turns." ;;
          *) [ "$is_error" = true ] && why="The agent stopped with an error after $turns turn(s): ${text:-no message}." || why='' ;;
        esac
        {
          echo "turns=$turns"
          echo "cost=$cost"
          echo "why=$why"
        } >> "$GITHUB_OUTPUT"
        # One line per run, the same shape everywhere, for comparing models.
        echo "::notice title=Agent run::stage=${STAGE:-} model=${MODEL:-} turns=${turns:-?} cost=${cost:-?} (${ROUTE:-})"

    # The report contract. The agent is told to write the file; this makes
    # sure it exists and passes `report-valid` on every path, the skipped and
    # failed ones included, so a caller never words "wrote no report" itself.
    - id: report
      if: always() && inputs.report-file != ''
      shell: bash
      env:
        FILE:     ${{ inputs.report-file }}
        VALID:    ${{ inputs.report-valid }}
        FALLBACK: ${{ inputs.report-fallback }}
        WHY:      ${{ steps.outcome.outputs.why || steps.validate.outputs.why }}
        TURNS:    ${{ steps.outcome.outputs.turns }}
      run: |
        set -euo pipefail
        if [ -s "$FILE" ] && [ "$(jq -r "$VALID" "$FILE" 2>/dev/null || true)" = true ]; then
          echo "source=agent" >> "$GITHUB_OUTPUT"; exit 0
        fi
        why="${WHY:-The agent finished${TURNS:+ after $TURNS turn(s)} without writing a valid $(basename "$FILE").}"
        mkdir -p "$(dirname "$FILE")"
        jq -n --argjson f "$FALLBACK" --arg why "$why" '$f + {why: $why}' > "$FILE"
        {
          echo "source=fallback"
          echo "why=$why"
        } >> "$GITHUB_OUTPUT"
        echo "::warning title=No agent report::$why"
