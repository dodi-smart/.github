              if action not in uses(load('.github/workflows/' + wf)['jobs'][wfjob]):
                  errors.append(wf + ' must use ' + action)
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('zavet and react-doctor reach the summary only when blocking, and share their actions')
          "

      # A pin only stays current if a manager reads it, and a manager that stops
      # matching fails silently: Renovate just opens no more PRs. So every file that
      # carries a `# renovate: datasource=` marker must be matched by a customManager
      # in renovate.json that captures the marker's datasource and depName and an exact
      # version. PINNED lists the pins that must carry a marker, so deleting one is not
      # a way to stop their updates. react-doctor adds two claims of its own.
      - name: Every renovate pin is read by a Renovate manager
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, re, sys
          bad = []
          ren = json.load(open('renovate.json'))
          managers = [m for m in ren.get('customManagers', []) if m.get('customType') == 'regex']
          # A marker starts a comment line or trails a value. One inside a comment that
          # documents a caller's pin (supabase-*.yml) is prose, not a pin.
          MARK = re.compile(r'^\s*(?:[^#\s][^\n]*)?# renovate: datasource=(\S+) depName=(\S+)', re.M)
          PINNED = {
              'actions/dependency-check/install.sh': 'google/osv-scanner',
              'actions/migration-lint/install.sh': 'sbdchd/squawk',
              'actions/react-doctor/action.yml': 'react-doctor',
              '.github/workflows/react-doctor.yml': 'react-doctor',
              '.github/workflows/android-deploy.yml': 'firebase-tools',
          }
          files = glob.glob('.github/workflows/*.yml') + glob.glob('actions/**/*', recursive=True)
          versions = {}
          for f in sorted(files):
              if not os.path.isfile(f) or f.endswith(('self-test.yml', 'test.sh')):
                  continue
              try:
                  text = open(f).read()
              except UnicodeDecodeError:
                  continue
              marks = MARK.findall(text)
              if f in PINNED and PINNED[f] not in [dep for _, dep in marks]:
                  bad.append(f + ' lost its renovate marker for ' + PINNED[f])
              # Run each manager's own matchStrings over the file: one match proves the
              # pin is an exact version, carries the marker and is reached.
              read = set()
              for m in managers:
                  if not any(re.search(p[1:-1], f) for p in m.get('managerFilePatterns', [])):
                      continue
                  for s in m.get('matchStrings', []):
                      for hit in re.finditer(re.sub(r'\(\?<(?=[A-Za-z])', '(?P<', s), text):
                          g = hit.groupdict()
                          read.add((g.get('datasource') or m.get('datasourceTemplate'),
                                    g.get('depName') or m.get('depNameTemplate'), g.get('currentValue')))
              for ds, dep in marks:
                  got = [v for d, n, v in read if (d, n) == (ds, dep) and v and re.fullmatch(r'v?\d+\.\d+\.\d+', v)]
                  if not got:
                      bad.append('%s: no customManager in renovate.json reads the marker for %s (%s) with an exact x.y.z version' % (f, dep, ds))
                  elif dep == 'react-doctor':
                      versions[f] = got[0]
          # A react-doctor bump changes what every caller's scan runs, so it must release.
          if not any('react-doctor' in r.get('matchDepNames', []) and r.get('semanticCommitType') == 'chore' and r.get('semanticCommitScope') == 'deps' for r in ren.get('packageRules', [])):
              bad.append('renovate.json has no packageRule typing react-doctor bumps chore(deps), so a bump would not release')
          if len(set(versions.values())) > 1:
              bad.append('the two react-doctor version defaults differ: ' + repr(versions))
          if bad:
              sys.exit('::error::' + '; '.join(bad) + '. See AGENTS.md.')
          print('every renovate marker is read by a manager')
          PY

      # `build` runs beside `checks`, and the summary must still require
      # `checks`, or a red lint stops failing the required context.
      - name: pr-checks runs build beside checks and the summary still needs checks
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          if 'checks' in jobs['build'].get('needs', []):
              sys.exit('::error::the build job must not need checks, or it waits for lint and typecheck on every push.')
          summary = jobs['pr-checks']['needs']
          for j in ('checks', 'build'):
              if j not in summary:
                  sys.exit('::error::the pr-checks summary job must need ' + j + ', or a failure there stops failing the required context.')
          print('build needs only pick, and pr-checks still needs checks and build')
          "

      # commitlint is the last step of `checks` and `all`, not a job: as a job it
      # cost a runner start and the cleanup hook for about 5 s of linting. On a
      # docs-only change `checks` runs for it alone, never a heavy runner.
      - name: pr-checks runs commitlint as a step of checks and all
        run: |
          set -euo pipefail
          python3 - <<'CL'
          import sys, yaml
          DOCS = 'needs.pick.outputs.docs_only'
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          errors = []
          if 'commitlint' in jobs:
              errors.append('commitlint must stay a step of checks and all, not a job: a job pays a runner start and the cleanup hook for about 5 s of work.')
          for name in ('checks', 'all'):
              steps = jobs[name]['steps']
              at = [i for i, st in enumerate(steps) if 'actions/commitlint@' in str(st.get('uses', ''))]
              # Last and on !cancelled(): a red phase must not skip it, and a bad
              # message fails the job on its own step.
              if at != [len(steps) - 1] or '!cancelled()' not in str(steps[-1].get('if', '')):
                  errors.append(name + ' must run actions/commitlint once, as its last step, on !cancelled().')
              if (jobs[name].get('permissions') or {}).get('pull-requests') != 'read':
                  errors.append(name + ' must hold pull-requests: read, which commitlint lists the commits with.')
          if 'inputs.commitlint' not in str(jobs['checks'].get('if', '')):
              errors.append('checks must also run on a docs-only change when inputs.commitlint is on.')
          if 'commitlint' in str(jobs['all'].get('if', '')):
              errors.append('all must skip on a docs-only change even with commitlint on: never start a heavy runner to lint commit messages.')
          # Every other step of checks skips on docs-only; the phases after hk
          # follow the install step and dependency-check follows the checkout,
          # and both of those skip.
          for st in jobs['checks']['steps'][1:-1]:
              cond = str(st.get('if', ''))
              if DOCS not in cond and 'steps.install.outcome' not in cond and 'steps.checkout.outcome' not in cond:
                  errors.append('checks step %r must skip on a docs-only change.' % (st.get('name') or st.get('uses')))
          light = next(st for st in jobs['pick']['steps'] if st.get('id') == 'light')
          if 'inputs.commitlint' not in str(light.get('if', '')):
              errors.append('pick must keep inputs.commitlint in the light picker condition, or a docs-only change picks no light runner for commitlint.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('commitlint is the last step of checks and all, and checks runs for it alone on docs-only')
          CL

      # dependency-check is an opt-in step of `checks` and `all`, not a job: a job
      # would pay a runner start for seconds of work. It runs after the phases on
      # !cancelled(), on the checkout (a docs-only change skips it), before
      # commitlint, and classifies the author itself. Never
      # dependency-review-action, which needs GHAS and `security-events`.
      - name: pr-checks runs dependency-check as an opt-in step of checks and all
        run: |
          set -euo pipefail
          python3 - <<'DC'
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/pr-checks.yml'))
          inputs = doc[True]['workflow_call']['inputs']
          jobs = doc['jobs']
          errors = []
          on = inputs.get('dependency-check')
          if not on or on.get('type') != 'boolean' or on.get('default') is not False:
              errors.append('dependency-check must be a boolean input that defaults to false.')
          fail_on = inputs.get('dependency-check-fail-on')
          if not fail_on or fail_on.get('type') != 'string' or fail_on.get('default') != 'none':
              errors.append('dependency-check-fail-on must be a string input that defaults to none.')
          if any('dependency-review-action' in str(st.get('uses', '')) for j in jobs.values() for st in j.get('steps') or []):
              errors.append('pr-checks must never use actions/dependency-review-action: it needs GHAS on private repos and security-events.')
          if 'dependency-check' in jobs:
              errors.append('dependency-check must stay a step of checks and all, not a job.')
          for name, job in jobs.items():
              if 'security-events' in (job.get('permissions') or {}):
                  errors.append(name + ' must not hold security-events.')
          for name in ('checks', 'all'):
              steps = jobs[name]['steps']
              at = [i for i, st in enumerate(steps) if 'actions/dependency-check@' in str(st.get('uses', ''))]
              if len(at) != 1:
                  errors.append(name + ' must run actions/dependency-check exactly once.')
                  continue
              step = steps[at[0]]
              cond = str(step.get('if', ''))
              for need in ('!cancelled()', 'inputs.dependency-check', 'steps.checkout.outcome'):
                  if need not in cond:
                      errors.append(name + ': the dependency-check condition must contain ' + need + '.')
              phases = [i for i, st in enumerate(steps) if 'actions/run-phases@' in str(st.get('uses', ''))]
              lint = [i for i, st in enumerate(steps) if 'actions/commitlint@' in str(st.get('uses', ''))]
              if not phases or max(phases) > at[0] or lint != [at[0] + 1]:
                  errors.append(name + ': dependency-check must come after the phases and right before commitlint.')
              if not any(st.get('id') == 'checkout' and 'actions/checkout@' in str(st.get('uses', '')) for st in steps):
                  errors.append(name + ': the checkout step must have id: checkout, which dependency-check is conditioned on.')
              if any('actions/agent-gate@' in str(st.get('uses', '')) for st in steps) or 'author-kind' in (step.get('with') or {}):
                  errors.append(name + ': dependency-check classifies the author itself, so the job needs no agent-gate step.')
              if 'inputs.dependency-check-fail-on' not in str((step.get('with') or {}).get('fail-on', '')):
                  errors.append(name + ': dependency-check must pass inputs.dependency-check-fail-on as fail-on.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('dependency-check is an opt-in step of checks and all, after the phases and before commitlint')
          DC

      # A `test` or `build` with no command must not start a large runner, which
      # cost one caller 5 minutes of queue for 2 seconds of work. `pick` decides,
      # from the one command table and with no checkout (the step below asserts
      # that), and the two jobs read its answer.
      - name: pr-checks skips test and build that have no command
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          pick = jobs['pick']
          errors = []
          cmds = [s for s in pick['steps'] if str(s.get('uses', '')).startswith('dodi-smart/.github/actions/setup-stack/resolve@')]
          if len(cmds) != 1:
              errors.append('pick must resolve the commands through actions/setup-stack/resolve, once.')
          for name in ('has_test', 'has_build'):
              if name not in pick['outputs']:
                  errors.append('pick must output ' + name + '.')
          for job, out in (('test', 'has_test'), ('build', 'has_build')):
              if 'needs.pick.outputs.' + out + " == 'true'" not in str(jobs[job].get('if')):
                  errors.append(job + ' must run only when pick.' + out + ' is true.')
          action = open('actions/setup-stack/resolve/action.yml').read()
          if 'defaults.sh' not in action:
              errors.append('the resolve action must run defaults.sh.')
          for table in ('bun run build', 'npm ci', './gradlew'):
              if table in action:
                  errors.append('the resolve action carries part of the command table (' + table + '); it lives in defaults.sh only.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('pick resolves test and build through the one table, and the jobs skip when empty')
          PY

      # This workflow runs the caller's own code, so no job holds a write token
      # it does not use. jactionlint covers checkouts and script expressions.
      - name: pr-checks keeps a read-only token and clones nothing to list files
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          errors = []
          doc = yaml.safe_load(open('.github/workflows/pr-checks.yml'))
          if doc.get('permissions') != {'contents': 'read'}:
              errors.append('pr-checks.yml needs workflow-level permissions: {contents: read}, so a job with no block of its own gets no more.')
          # The docs-only decision reads the API, never a clone: a hosted job
          # that clones to list files is the cost this replaced.
          pick = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']['pick']
          gate = yaml.safe_load(open('.github/workflows/pr-review.yml'))['jobs']['gate']
          for label, job in (('pr-checks pick', pick), ('pr-review gate', gate)):
              if any(str(st.get('uses', '')).startswith('actions/checkout@') for st in job['steps']):
                  errors.append('the ' + label + ' job has a checkout; it lists changed files through actions/changed-files, which needs no clone.')
              if not any('actions/changed-files@' in str(st.get('uses', '')) for st in job['steps']):
                  errors.append('the ' + label + ' job must list changed files with actions/changed-files.')
          if 'all-matched' not in str(pick['outputs']['docs_only']):
              errors.append('pick.docs_only must come from changed-files all-matched, so only a fully read list can skip the checks.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('pr-checks holds contents: read at workflow level, pick and the gate clone nothing')
          "

      # The opt-in `hk` input runs the caller's own hk.pkl over the whole tree,
      # through actions/hk-check. No job holds security-events: a code scanning
      # upload would force that grant on every caller, so the SARIF stays an
      # artifact. A red hk must not hide lint, so the phases after it run unless
      # the install failed.
      - name: pr-checks hk is opt-in, checks the whole tree and holds no new permission
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          errors = []
          doc = yaml.safe_load(open('.github/workflows/pr-checks.yml'))
          inp = doc[True]['workflow_call']['inputs'].get('hk')
          if not inp or inp.get('type') != 'boolean' or inp.get('default') is not False:
              errors.append('the hk input must be a boolean that defaults to false, so a caller that never sets it behaves as before.')
          jobs = doc['jobs']
          phases = lambda st: 'actions/run-phases@' in str(st.get('uses', ''))
          hk_on = lambda st: 'inputs.hk' in str(st.get('if', '')) and '!inputs.hk' not in str(st.get('if', ''))
          for name in ('checks', 'all'):
              job = jobs[name]
              if 'security-events' in (job.get('permissions') or {}):
                  errors.append(name + ' runs the caller code and must not hold security-events: write.')
              steps = job['steps']
              if any('hk check' in str(st.get('run', '')) for st in steps):
                  errors.append(name + ' must run hk through actions/hk-check, not an inline step.')
              hk = [i for i, st in enumerate(steps) if 'actions/hk-check@' in str(st.get('uses', ''))]
              if len(hk) != 1:
                  errors.append(name + ' must use actions/hk-check exactly once.')
                  continue
              step = steps[hk[0]]
              if not hk_on(step):
                  errors.append(name + ': the hk-check step must run only when hk is on.')
              given = step.get('with') or {}
              if 'steps.setup.outputs.cache-enabled' not in str(given.get('cache', '')):
                  errors.append(name + ': hk-check must take its cache from setup-stack cache-enabled, or mise caches on a self-hosted Linux runner whose volume is the cache.')
              if 'steps.setup.outputs.cache-save' not in str(given.get('cache-save', '')):
                  errors.append(name + ': hk-check must take cache-save from setup-stack, the one place the default-branch save rule lives.')
              if 'needs.pick.outputs.key' not in str(given.get('artifact-name', '')):
                  errors.append(name + ': the hk-check artifact name must carry needs.pick.outputs.key, or two calls of pr-checks collide.')
              inst = [i for i, st in enumerate(steps) if st.get('id') == 'install' and phases(st) and hk_on(st)]
              if not inst or inst[0] > hk[0]:
                  errors.append(name + ' must run install (id: install, hk only) before hk-check.')
              # One Run phases step serves both modes: with hk it runs after a red hk
              # unless the install failed, and it repeats no install.
              rest = [st for st in steps[hk[0] + 1:] if phases(st)]
              cond = str(rest[0].get('if', '')) if rest else ''
              if len(rest) != 1 or not all(t in cond for t in ('success()', 'inputs.hk', '!cancelled()', 'steps.install.outcome == \'success\'')):
                  errors.append(name + ' must run ONE Run phases step after hk, on success() or (hk, !cancelled() and the install outcome), so a red hk does not hide lint and a failed install stops everything.')
              if rest and '!inputs.hk' not in str((rest[0].get('with') or {}).get('install', '')):
                  errors.append(name + ': the Run phases step must pass an empty install when hk is on, or the install runs twice.')
          if any('security-events' in (j.get('permissions') or {}) for j in jobs.values()):
              errors.append('no pr-checks job may hold security-events: a code scanning upload would force that permission on every caller.')
          act = yaml.safe_load(open('actions/hk-check/action.yml'))['runs']['steps']
          mise = [st for st in act if str(st.get('uses', '')).startswith('jdx/mise-action@')]
          given = (mise[0].get('with') or {}) if mise else {}
          if not mise or 'inputs.cache' not in str(given.get('cache', '')):
              errors.append('hk-check must run jdx/mise-action with cache read from its cache input; a bare default turns the GitHub cache on for self-hosted Linux.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('hk defaults off, runs through hk-check over the whole tree, a red hk hides nothing, and no job holds security-events')
          "

      # A caller may call pr-checks twice in one workflow, and artifact names are
      # per run, so every name carries the call's key (a hash of its inputs, from
      # `pick`). A bare name makes the second upload fail and lets a coverage job
      # read the other call's report.
      - name: pr-checks names its artifacts per call
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          errors = []
          if 'steps.key.outputs.key' not in str(jobs['pick'].get('outputs', {}).get('key', '')):
              errors.append('pick must output key, computed by its key step.')
          for jname, job in jobs.items():
              for st in job.get('steps') or []:
                  if 'actions/upload-artifact@' in str(st.get('uses', '')) or 'actions/download-artifact@' in str(st.get('uses', '')):
                      name = str((st.get('with') or {}).get('name', ''))
                      if 'needs.pick.outputs.key' not in name or 'pick' not in job.get('needs', []):
                          errors.append(jname + ' names an artifact ' + repr(name) + ' without needs.pick.outputs.key.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('every pr-checks artifact name carries the per-call key')
          "

      # `test` and `all` run the caller's whole test suite, so the comment token
      # lives in a job that runs none of it and reads the report as an artifact.
      - name: pr-checks posts coverage from a job that runs no repo code
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          errors = []
          writers = [n for n, j in jobs.items() if (j.get('permissions') or {}).get('pull-requests') == 'write']
          # zavet and react-doctor post their own comments, as their standalone workflows do.
          if set(writers) - {'coverage', 'zavet', 'react-doctor'} or 'coverage' not in writers:
              errors.append('test/all/build must hold no pull-requests: write, and coverage must: found ' + repr(writers))
          uses = [str(st.get('uses', '')) for st in jobs['coverage']['steps']]
          if 'coverage' not in jobs['pr-checks']['needs']:
              errors.append('the pr-checks summary must need coverage, or a breached floor stops failing the required context.')
          if not any('actions/lcov-report@' in u for u in uses):
              errors.append('the coverage job must handle coverage: lcov through actions/lcov-report.')
          kover = [st for st in jobs['coverage']['steps'] if 'actions/kover-floor@' in str(st.get('uses', ''))]
          if len(kover) != 1 or 'steps.kover.outputs.coverage-overall' not in str(kover[0].get('with', {}).get('overall', '')):
              errors.append('coverage: kover must fail on a breached floor through actions/kover-floor, given the kover-report figure: kover-report only comments.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('only coverage holds pull-requests: write, and the summary needs it')
          "

      # Each agent workflow used to run the picker as its own hosted job, needed
      # by the agent job. That billed two hosted starts before a proceeding run
      # ever reached the agent. Now the picker is a STEP inside `gate`, after
      # `agent-gate`, guarded on the gate's own `proceed`. Assert the new shape
      # rather than trust it stays this way: a `pick-runner` job creeping back
      # in "just for this one workflow" is exactly how it drifted before.
      - name: Agent workflows pick their runner inside the gate job
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml

          # Each workflow's gate hands its agent job one output, runner. deps-verify
          # picks two pools to choose from, because its verify job runs on light
          # for a green verdict and takes heavy only to build.
          agent_workflows = [
              ('issue-triage.yml',   'triage',    ['runner'], 1),
              ('issue-implement.yml','implement', ['runner'], 1),
              ('claude-assist.yml',  'assist',    ['runner'], 1),
              ('pr-review.yml',      'review',    ['runner'], 1),
              ('deps-verify.yml',    'verify',    ['runner'], 2),
              ('pr-iterate.yml',     'fix',       ['runner'], 1),
          ]

          bad = []
          for f, agent_job, pools, picks in agent_workflows:
              path = '.github/workflows/' + f
              jobs = yaml.safe_load(open(path))['jobs']

              if 'pick-runner' in jobs:
                  bad.append(f + ': still has a standalone pick-runner job')
                  continue

              gate = jobs.get('gate')
              if gate is None:
                  bad.append(f + ': has no gate job')
                  continue

              steps = gate.get('steps') or []
              pick = [s for s in steps if 'pick-runner@' in str(s.get('uses', ''))]
              if len(pick) != picks:
                  bad.append(f + ': gate job must have exactly %d pick-runner step(s), found %d' % (picks, len(pick)))
                  continue

              for step in pick:
                  cond = str(step.get('if', ''))
                  if 'proceed' not in cond:
                      bad.append(f + ': a pick step is not guarded on a proceed output (if: %r)' % cond)

              for pool in pools:
                  if pool not in (gate.get('outputs') or {}):
                      bad.append(f + ': gate job has no ' + pool + ' output for the agent job to read')

              job = jobs.get(agent_job)
              if job is None:
                  bad.append(f + ': has no ' + agent_job + ' job')
                  continue
              if 'pick-runner' in (job.get('needs') or []):
                  bad.append(f + ': ' + agent_job + ' job still needs pick-runner')
              for pool in pools:
                  if 'needs.gate.outputs.' + pool not in str(job.get('runs-on', '')):
                      bad.append(f + ': ' + agent_job + ' job does not read runs-on from needs.gate.outputs.' + pool)

          if bad:
              sys.exit('::error::' + '; '.join(bad) + '. Folding the picker into the gate job is what makes a '
                        'proceeding agent run cost one hosted start instead of two.')
          print('every agent workflow picks its runner inside the gate job, guarded on proceed')
          "

      # The agent workflows' gates ran on a billed hosted runner before every agent
      # job. They now take the light pool of a private repo and stay hosted for a
      # public repo or a fork PR (the runner step covers the expression and the first
      # step of every job). Three claims stay here: each gate filters on the payload
      # alone, every report names its selector, and the kill switch is still the first
      # rule the gate evaluates.
      - name: Agent workflow gates are off hosted minutes and keep the kill switch first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from lib import load

          files = ['pr-review', 'claude-assist', 'issue-triage', 'issue-implement', 'pr-iterate']
          bad = []
          for f in files:
              jobs = load('.github/workflows/' + f + '.yml')['jobs']
              gate = jobs['gate']
              cond = str(gate.get('if', '')).strip()
              if not cond:
                  bad.append(f + ': gate has no job-level if for the payload-only filters')
              if 'agent:no-touch' in cond:
                  bad.append(f + ': the kill switch belongs to the gate action, not the job if')
              if gate.get('permissions', {}).get('actions') and f != 'pr-review':
                  bad.append(f + ': gate gained an actions permission')
              for name, job in jobs.items():
                  first = (job.get('steps') or [{}])[0]
                  if (first.get('with') or {}).get('selector') is None:
                      bad.append(f + ': job ' + name + ' runner-report passes no selector')
              # The gate action is the step straight after the report, so
              # nothing evaluates ahead of agent:no-touch.
              if 'agent-gate@' not in str(gate['steps'][1].get('uses', '')):
                  bad.append(f + ': agent-gate is not the first step after runner-report')
          # Inside the gate, agent:no-touch precedes every other rule.
          sh = open('actions/agent-gate/gate.sh').read()
          nt = sh.index('RULE 0, the kill switch')
          for rule in ['RULE 0b', 'RULE 1,', 'RULE 2,', 'RULE 3,', 'RULE 4,', 'RULE 5,', 'RULE 6,']:
              if sh.index(rule) < nt:
                  bad.append('gate.sh evaluates ' + rule + ' before the kill switch')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('agent gates filter on the payload, report their selector and check agent:no-touch first')
          PY

      # Every unattended merge goes through actions/merge-gate, so its rules
      # exist once. `gh pr merge` anywhere else is a second gate. deps-automerge
      # runs no agent, and the preset still labels the update kinds the gate
      # reads through deps-intent.
      - name: merge-gate is the only place anything merges
        run: |
          set -euo pipefail
          python3 -c "
          import glob, os, re, sys
          bad = []
          # The merge jobs, named once. A workflow that merges calls merge-gate.
          allowed = {'actions/merge-gate/action.yml'}
          # Files only: an action may hold a directory, like commitlint's preset.
          for f in glob.glob('.github/workflows/*.yml') + [p for p in glob.glob('actions/*/*') if os.path.isfile(p)]:
              if f.endswith('test.sh') or f.endswith('self-test.yml'):
                  continue
              if 'gh pr merge' in open(f).read() and f not in allowed:
                  bad.append(f + ' merges outside actions/merge-gate')
          gate = open('actions/merge-gate/action.yml').read()
          if '--match-head-commit' not in gate or 'APP_TOKEN' not in gate:
              bad.append('merge-gate must merge with the App token, pinned to the head it read')
          auto = open('.github/workflows/deps-automerge.yml').read()
          if 'run-agent' in auto or 'claude-code-action' in auto:
              bad.append('deps-automerge must not run an agent')
          if 'actions/merge-gate@' not in auto:
              bad.append('deps-automerge must decide through merge-gate')
          preset = re.sub(r'^\\s*//.*$', '', open('default.json').read(), flags=re.M)
          for label in ('deps:minor', 'deps:patch', 'deps:lockfile', 'deps:major'):
              if label not in preset:
                  bad.append('default.json no longer adds ' + label + ', which deps-intent kind reads')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('merge-gate is the one merge, and deps-automerge runs no agent')
          "

      # Nothing in deps-verify waits for pr-checks (see deps-verify in AGENTS.md
      # for why). The gate reads a finished run once; verify takes heavy only
      # when the verdict is not green, and the agent runs only when the judge
      # says so.
      - name: deps-verify never waits, and takes heavy only to build
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          src = open('.github/workflows/deps-verify.yml').read()
          jobs = yaml.safe_load(src)['jobs']
          bad = []
          if sorted(jobs) != ['gate', 'verify']:
              bad.append('deps-verify must have exactly the gate and verify jobs, found %s: a third job is how a waiting job comes back' % sorted(jobs))
          if 'sleep ' in src:
              bad.append('deps-verify must not sleep: it reads a finished pr-checks run, it never polls one')
          gate, verify = jobs.get('gate') or {}, jobs.get('verify') or {}
          proceed = str((gate.get('outputs') or {}).get('proceed', ''))
          if \"steps.judge.outputs.judge != 'skip'\" not in proceed or \"steps.ci.outputs.ready == 'true'\" not in proceed:
              bad.append('the gate must proceed only with a ready verdict and a judge that is not skip')
          if \"needs.gate.outputs.proceed == 'true'\" not in str(verify.get('if')):
              bad.append('verify must run only when the gate proceeds')
          runner = str((gate.get('outputs') or {}).get('runner', ''))
          if \"verdict == 'green'\" not in runner or 'pick-light' not in runner or 'pick-heavy' not in runner:
              bad.append('the gate runner output must choose light for a green verdict and heavy otherwise')
          if 'needs.gate.outputs.runner' not in str(verify.get('runs-on')):
              bad.append('verify must run on the gate runner output')
          agent = [s for s in verify.get('steps', []) if s.get('id') == 'agent']
          if not agent or \"needs.gate.outputs.judge == 'agent'\" not in str(agent[0].get('if', '')):
              bad.append('the agent step must run only when the judge says agent')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('deps-verify never waits, and takes heavy only when there is something to build')
          "

      # deps-verify may push fix commits, so where the push happens is the
      # guard. Only the deterministic `push` step may run `git push`, only the
      # `publish` step may set labels, and the agent's prompt must still say it
      # does not push, merge or approve.
      - name: deps-verify pushes and labels only from its deterministic steps
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          steps = yaml.safe_load(open('.github/workflows/deps-verify.yml'))['jobs']['verify']['steps']
          bad = []
          for s in steps:
              run = str(s.get('run', ''))
              sid = s.get('id', s.get('name', s.get('uses', '?')))
              if 'git push' in run and sid != 'push':
                  bad.append('git push outside the push step (%s)' % sid)
              if '/labels' in run and sid != 'publish':
                  bad.append('labels written outside the publish step (%s)' % sid)
          agent = [s for s in steps if 'run-agent@' in str(s.get('uses', ''))]
          if len(agent) != 1:
              bad.append('expected exactly one run-agent step, found %d' % len(agent))
          else:
              prompt = agent[0]['with']['prompt']
              for phrase in ('Do NOT push', 'NEVER edit a lockfile', 'Do not comment on, label, merge or approve'):
                  if phrase not in prompt:
                      bad.append('agent prompt lost: ' + phrase)
          # Renovate ignores the fix commits only while the preset names
          # their author. A drift here marks every fixed branch as edited.
          email = yaml.safe_load(open('.github/workflows/deps-verify.yml'))['jobs']['verify']['env']['FIX_EMAIL']
          if email not in open('default.json').read():
              bad.append('FIX_EMAIL %s is not in default.json gitIgnoredAuthors' % email)
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('deps-verify pushes from push, labels from publish, and the agent is told neither')
          "

      # pick-runner.yml is a thin wrapper around actions/pick-runner now. Every
      # existing caller, internal or external, references these names, so the
      # wrapper losing one is a breaking change hiding behind a passing lint.
      - name: pick-runner.yml still exposes its original interface
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/pick-runner.yml'))
          # PyYAML parses the bare scalar 'on' as the boolean True, not the
          # string 'on'. doc['on'] is a KeyError waiting to look like a typo.
          call = doc[True]['workflow_call']
          inputs = set((call.get('inputs') or {}).keys())
          outputs = set((call.get('outputs') or {}).keys())

          need_in = {'weight', 'labels', 'fallback', 'fallback-when', 'hosted-runner', 'guard-public'}
          need_out = {'runner', 'selector', 'fell-back'}

          missing_in = need_in - inputs
          missing_out = need_out - outputs
          if missing_in or missing_out:
              sys.exit('::error::pick-runner.yml dropped input(s) %s and/or output(s) %s. Every caller '
                        'pinned at @v1 already depends on this exact interface.' % (sorted(missing_in), sorted(missing_out)))
          print('pick-runner.yml still exposes inputs %s and outputs %s' % (sorted(need_in), sorted(need_out)))
          "

      # runs-on cannot read env, so the light-or-hosted expression is written out per
      # job (AGENTS.md has why) and pick-runner.yml holds the reference copy. One walk
      # over every job that runs steps, so a new job cannot skip the rule: a hosted
      # literal bills hosted minutes in a private repo, and a job whose first step is
      # not the runner report loses the report when a later step fails. A job takes
      # the reference expression, the same text with another pool (POOLS), or a runner
      # a gate job picked (needs.). A job that is hosted on purpose is listed in
      # HOSTED with its reason.
      - name: Every job is on the static runner expression and reports its runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys
          from lib import load, first_step_is_report
          bad = []
          LIGHT = load('.github/workflows/pick-runner.yml')['jobs']['pick']['runs-on']
          for part in ('github.event.repository.private', '!github.event.pull_request.head.repo.fork',
                       'self-hosted', 'Linux', 'light', 'ubuntu-latest'):
              if part not in LIGHT:
                  bad.append('pick-runner.yml: the light runs-on expression lost ' + part)
          pool = lambda p: LIGHT.replace('"light"', '"%s"' % p)
          # Every job is on light unless it is listed here.
          POOLS = {
              # A merge waits on both; control carries no work label, so it stays free for
              # seconds-long jobs. No other job may name it.
              ('pr-checks.yml', 'pick'): 'control',
              ('pr-checks.yml', 'pr-checks'): 'control',
              # A Gradle build that holds the signing key.
              ('android-deploy.yml', 'deploy'): 'large',
          }
          HOSTED = {
              ('self-test.yml', 'test'): 'this repo is public, and a public repo never touches a self-hosted runner',
              ('publish-release.yml', 'release'): 'the public repo releases itself, so hosted like self-test',
              ('promote.yml', 'promote'): 'the public repo moves its own tag, so hosted like self-test',
              ('release-canary.yml', 'result'): 'the public repo posts its own status, so hosted like self-test',
              ('supabase-checks.yml', 'types'): 'starts Postgres, which needs the runner whose localhost the CLI polls',
              ('supabase-checks.yml', 'deno'): 'starts Postgres, which needs the runner whose localhost the CLI polls',
              ('supabase-checks.yml', 'pgtap'): 'starts Postgres, which needs the runner whose localhost the CLI polls',
              ('supabase-deploy.yml', 'deploy'): 'holds a production Supabase token, which belongs on a throwaway VM',
          }
          seen = set()
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              f = os.path.basename(path)
              for jid, job in load(path)['jobs'].items():
                  if 'uses' in job:
                      continue
                  where = '%s: job %s' % (f, jid)
                  ro = job.get('runs-on')
                  if (f, jid) in HOSTED:
                      seen.add((f, jid))
                      if ro != 'ubuntu-latest':
                          bad.append(where + ' is listed as hosted on purpose but runs on %r' % ro)
                      continue
                  if not first_step_is_report(job):
                      bad.append(where + ' must start with actions/runner-report')
                  want = POOLS.get((f, jid), 'light')
                  if ro != pool(want) and 'needs.' not in str(ro):
                      bad.append(where + ' runs-on is not the %s expression, character for character: %r' % (want, ro))
              # Nothing else in the file may name the hosted runner (pick-runner.yml's
              # hosted-runner input default aside).
              if f != 'pick-runner.yml' and not any(k[0] == f for k in HOSTED):
                  rest = open(path).read().replace(LIGHT, '')
                  for p in set(POOLS.values()):
                      rest = rest.replace(pool(p), '')
                  if 'ubuntu-latest' in rest:
                      bad.append(f + ': a hosted runner literal outside the runs-on expression')
          for k in sorted(set(HOSTED) - seen):
              bad.append('%s: job %s is listed as hosted on purpose but no longer exists' % k)
          if bad:
              sys.exit('::error::' + ' | '.join(bad))
          print('every job uses the static runner expression and starts with runner-report; %d are hosted on purpose' % len(HOSTED))
          PY

      # The summary job is the required status context, so renaming it breaks every
      # caller's ruleset. The control pool is sized for exactly two jobs (the runner
      # step lists them), so no other file may name it. A pool changes in a release,
      # never through a variable. The picker is static and makes no API call.
      - name: pr-checks keeps its required context, the control pool and a call-free picker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          from lib import load
          errors = []
          pc = load('.github/workflows/pr-checks.yml')['jobs']
          for path in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/*.yml') + glob.glob('actions/*/*.sh')):
              if path.endswith('self-test.yml') or path.endswith('test.sh'):
                  continue
              text = open(path).read()
              if 'DODI_RUNS_ON' in text:
                  errors.append(path + ': reads a DODI_RUNS_ON_* switch; pools change in a release, not at run time')
              if text.count('"control"') != (2 if path.endswith('/pr-checks.yml') else 0):
                  errors.append(path + ': names the control pool; only pr-checks pick and PR Checks may')
          if pc['pr-checks'].get('name') != 'PR Checks':
              errors.append('the summary job must stay named PR Checks, it is the required status context')
          modes = [s.get('with', {}).get('mode') for s in pc['pr-checks']['steps'] if 'actions/runner-report@' in str(s.get('uses', ''))]
          if 'run' not in modes:
              errors.append('the PR Checks job must run runner-report with mode: run')
          for f in glob.glob('actions/pick-runner/*'):
              body = open(f).read()
              if f.endswith('test.sh'):
                  continue
              for bad in ('actions/runners', 'create-github-app-token', 'gh api'):
                  if bad in body:
                      errors.append(f + ' mentions ' + bad + '; the picker must make no API call')
          if errors:
              sys.exit('::error::' + ' | '.join(errors))
          print('PR Checks keeps its name, only pick and PR Checks use control, and the picker makes no API call')
          PY

      # The picker's `case` block is the only place a preset is defined, and the
      # README table is where people read it. Drift between them is how a
      # retired pool keeps being documented as live. The picker has no fallback
      # column any more: overflow is the queue's job, and the large pool carries
      # `light` too.
      - name: Runner presets match the README
        run: |
          set -euo pipefail
          python3 - <<'PRESETS'
          import re, sys

          picker = open('actions/pick-runner/pick.sh').read()
          readme = open('README.md').read()

          # Every `weight)  sel="..."` arm is a preset, whatever it is called, as
          # dev-standards' read-presets.sh reads it, so there is no list to keep.
          got = dict(re.findall(r'^\s+([a-z]+)\)\s+sel="([^"]*)"', picker, re.M))

          # The README rows are the table under its `weight` header.
          table = readme.split('| `weight` | Selector | Use |', 1)[1].split('\n\n', 1)[0]
          rows = {}
          for name, sel in re.findall(r'^\|\s*`([a-z]+)`\s*\|([^|]*)\|', table, re.M):
              sel = sel.strip().strip('`').strip()
              rows[name] = '' if sel in ('', 'none') else sel

          if 'light' not in got or 'light' not in rows:
              sys.exit('::error::parsed presets %r and README rows %r with no light. '
                       'Refusing to report clean from a parse that found nothing.'
                       % (sorted(got), sorted(rows)))

          bad = [k for k in sorted(set(got) | set(rows)) if got.get(k) != rows.get(k)]
          if bad:
              for k in bad:
                  print('::error::%s: picker=%r README=%r' % (k, got.get(k), rows.get(k)))
              sys.exit(1)

          print('preset table agrees: %r' % got)

          # No weight may name a fallback again. A busy pool queues, and the
          # large pool is reached through the `light` label it carries, not through
          # picker logic that could send a heavy job to the light pool (exit 137).
          bad = []
          if re.search(r'fb_def|fallback', re.sub(r'#.*', '', picker)):
              bad.append('pick.sh has fallback logic again')
          if 'fallback' in ' '.join(rows.values()).lower():
              bad.append('a README selector cell mentions a fallback')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('the picker has no fallback')
          PRESETS

      # Every actions/cache step in the workflows and the actions, in one scan. A
      # package store or a toolchain takes an exact key: a near match there reimports a
      # poisoned entry, or a compiled tree from another branch. The one exception is
      # .next/cache in setup-stack (ALLOWED), which Next keys by content. Nothing caches
      # a project build directory either: those paths hold absolute paths that do not
      # survive a move between runners, and reusing compiled output is the build tool's
      # job. See AGENTS.md.
      - name: Caches take an exact key and none holds a build directory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys
          from lib import load
          ALLOWED = ('actions/setup-stack/action.yml', 'steps.next.outputs.paths')
          build = re.compile(r'^(.*/)?(build|\.gradle)(/.*)?$')
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/**/action.yml', recursive=True)):
              doc = load(f) or {}
              for job in list((doc.get('jobs') or {}).values()) + [doc.get('runs') or {}]:
                  for step in (job.get('steps') or []) if isinstance(job, dict) else []:
                      if 'actions/cache' not in str(step.get('uses', '')):
                          continue
                      w = step.get('with') or {}
                      path = str(w.get('path', ''))
                      if 'restore-keys' in w and not (f == ALLOWED[0] and ALLOWED[1] in path):
                          bad.append('%s: the cache of %r takes restore-keys; only .next/cache may, every other cache takes an exact key' % (f, path))
                      for line in path.splitlines():
                          line = line.strip().lstrip('!')
                          if line and build.match(line):
                              bad.append('%s: %s is a build directory used as a cache path' % (f, line))
          if bad:
              sys.exit('::error::' + '; '.join(bad) + '. See AGENTS.md.')
          print('every cache takes an exact key, bar .next/cache, and none holds a build directory')
          PY

      # The release is cut the moment semantic-release succeeds, so the only thing
      # between a broken merge and `next` is this `needs`. Without it the two
      # workflows race, and `next` has already moved when Self test reports.
      - name: Publish release waits for Self test
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/publish-release.yml'))
          jobs = doc['jobs']
          gate = [n for n, j in jobs.items() if j.get('uses') == './.github/workflows/self-test.yml']
          if not gate:
              print('::error::publish-release.yml no longer calls self-test.yml, so next can move before Self test passes')
              sys.exit(1)
          needs = jobs['release'].get('needs') or []
          if isinstance(needs, str):
              needs = [needs]
          if not set(gate) <= set(needs):
              print('::error::the release job does not need ' + ', '.join(gate) + ', so next can move before Self test passes')
              sys.exit(1)
          print('release needs ' + ', '.join(gate))
          "

      # pr-checks.yml calls its actions at `@v1`, so on a pull request it tests
      # the PR's workflow against the PREVIOUS release's actions. The end-to-end
      # run is therefore after a release, at the pinned commit (release-canary.yml,
      # dispatched by Publish release, read by Promote). This holds the wiring
      # between those files. The gate's behaviour is canary-gate.test.sh, and what
      # the result job posts is release-canary-status.test.sh.
      - name: The release canary runs pr-checks at the pinned release and gates promotion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from lib import load, D, checkout_ok

          errors = []
          def err(msg): errors.append(msg)
          RANK = {'none': 0, 'read': 1, 'write': 2}

          canary = load('.github/workflows/release-canary.yml')
          pc = load('.github/workflows/pr-checks.yml')
          pub = load('.github/workflows/publish-release.yml')
          prom = load('.github/workflows/promote.yml')
          cj = canary['jobs']

          # --- release-canary.yml: dispatch-only, every job grants its own
          if set(canary[True]) != {'workflow_dispatch'}:
              err('release-canary.yml must trigger on workflow_dispatch only')
          if canary.get('permissions') != {}:
              err('release-canary.yml must set permissions: {} at the top')

          # --- the call: a ./ path (resolves at the pinned ref) with the checks a plain run skips
          call = cj['pr-checks']
          w = call.get('with') or {}
          if call.get('uses') != './.github/workflows/pr-checks.yml':
              err('job pr-checks must call ./.github/workflows/pr-checks.yml')
          for key, want in (('hk', True), ('coverage', 'lcov'), ('zavet', True), ('zavet-blocking', True),
                            ('react-doctor', True), ('react-doctor-blocking', True), ('dependency-check', True)):
              if w.get(key) != want:
                  err('pr-checks input %s must be %r, got %r' % (key, want, w.get(key)))
          if w.get('dependency-check-fail-on', 'none') != 'none':
              err('dependency-check-fail-on must stay none')
          if w.get('commitlint'):
              err('commitlint needs a PR number: it stays off')
          declared = pc[True]['workflow_call']['inputs']
          for key in w:
              if key not in declared:
                  err('%s is not an input of pr-checks.yml; the call would fail at startup' % key)
          # The call holds exactly what pr-checks.yml's jobs ask for, no more.
          need = dict(pc.get('permissions') or {})
          for job in pc['jobs'].values():
              for scope, level in (job.get('permissions') or {}).items():
                  if RANK[level] > RANK[need.get(scope, 'none')]:
                      need[scope] = level
          if call.get('permissions') != need:
              err('the pr-checks call grants %s, but pr-checks.yml needs %s' % (call.get('permissions'), need))

          # --- the result job runs the status script for the call's result, on the commit
          res = cj['result']
          if 'pr-checks' not in res.get('needs', []) or 'always()' not in str(res.get('if')):
              err('result must need pr-checks and run if always(), so a cancelled call still posts failure')
          if res.get('permissions') != {'contents': 'read', 'statuses': 'write'}:
              err('result must hold statuses: write and the contents: read its checkout needs, and nothing else')
          if not any(checkout_ok(s) for s in res['steps']):
              err('result must check the script out without persisting a token')
          post = [s for s in res['steps'] if s.get('run') == './scripts/release-canary-status.sh']
          if len(post) != 1:
              err('result must run ./scripts/release-canary-status.sh once')
          elif post[0]['env'].get('RESULT') != D + 'needs.pr-checks.result }}' or post[0]['env'].get('SHA') != D + 'github.sha }}':
              err('the status must come from needs.pr-checks.result and go on github.sha')
          if not os.access('scripts/release-canary-status.sh', os.X_OK):
              err('scripts/release-canary-status.sh is not executable')

          # --- Publish release dispatches it after pinning next; it never calls it
          rel = pub['jobs']['release']
          if (rel.get('permissions') or {}).get('actions') != 'write' or any(
                  'actions' in (j.get('permissions') or {}) for k, j in pub['jobs'].items() if k != 'release'):
              err('only the release job of publish-release.yml may hold actions: write, and it needs it to dispatch')
          if any('release-canary' in str(j.get('uses')) for j in pub['jobs'].values()):
              err('publish-release.yml must dispatch the canary, never call it: a called ref resolves before next moves')
          runs = [str(s.get('run')) for s in rel['steps']]
          pin = next((i for i, r in enumerate(runs) if 'channel-tag.sh pin' in r), None)
          disp = next((i for i, r in enumerate(runs) if 'gh workflow run release-canary.yml' in r), None)
          if pin is None or disp is None or disp <= pin:
              err('publish-release.yml must run gh workflow run release-canary.yml after channel-tag.sh pin')
          elif "moved == 'true'" not in str(rel['steps'][disp].get('if')):
              err('publish-release.yml: dispatch only when next actually moved')

          # --- Promote asks the gate before it moves the tag
          run = next(s['run'] for s in prom['jobs']['promote']['steps'] if s.get('id') == 'promote')
          if '--canary-gate ./scripts/canary-gate.sh' not in run:
              err('promote.yml must pass --canary-gate ./scripts/canary-gate.sh')

          if errors:
              sys.exit('::error::' + ' | '.join(errors))
          print('release canary: dispatch-only, pr-checks at the pinned ref (%d inputs), status script on the call result, dispatched after pin, gated before promote' % len(w))
          PY

      - name: Every workflow and action is parseable YAML
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')):
              try:
                  yaml.safe_load(open(f))
                  print('ok   ' + f)
              except Exception as e:
                  print('FAIL ' + f + ': ' + str(e)); bad += 1
          sys.exit(bad)
          "

      # The preset is only ever loaded if it is named `default.json`: for a bare
      # `github>owner/repo` Renovate fetches that one path, and on a 404 falls
      # back to `renovate.json`, which here extends this preset and so resolves
      # to nothing. That failure is silent -- Renovate keeps opening PRs, on
      # stock defaults, in every repo extending the preset. Assert the filename,
      # not just the contents. A JSONC object literal is also a valid JavaScript
      # expression, so the contents parse without pulling in a parser.
      - name: Renovate preset parses
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("default.json")) throw new Error("the preset must be named default.json; Renovate fetches no other filename");
            for (const wrong of ["default.json5", "default.jsonc"]) {
              if (fs.existsSync(wrong)) throw new Error(wrong + " is never fetched by Renovate, rename it to default.json");
            }
            const o = eval("(" + fs.readFileSync("default.json", "utf8") + ")");
            if (!Array.isArray(o.packageRules)) throw new Error("packageRules missing");
            if (!o.labels.includes("deps:update")) throw new Error("deps:update label missing");
            if (o.dependencyDashboard !== true) throw new Error("dependencyDashboard is off, so no repo gets a dashboard issue");
            if (o.updateNotScheduled !== false) throw new Error("updateNotScheduled must be false: the weekly schedule only gates new branches, so open branches would be rebased and re-tested all week");
            if (o.rebaseWhen !== "conflicted") throw new Error("rebaseWhen must be conflicted: any other value rebases every open branch each time the base moves, and each push reruns the PR checks");
            const actions = o.packageRules.find(r => r.automerge === true && (r.matchManagers || []).includes("github-actions"));
            if (!actions || !actions.minimumReleaseAge) throw new Error("the github-actions automerge rule needs a minimumReleaseAge: without it an upstream tag reaches every consumer within minutes");
            for (const e of o.extends || []) {
              if (e.includes("dodi-smart/.github")) throw new Error("the preset extends itself: " + e + ", which resolves to nothing");
            }
            console.log("preset OK:", Object.keys(o).join(", "));
          '

      # A malformed release.config.mjs does not fail loudly, it just stops
      # cutting releases, and the next channel stops moving with it.
      - name: Release and Renovate config parse
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import config from "./release.config.mjs";

            // Plugins are absolute paths into the package; pluginName maps back.
            const { pluginName } = await import("@dodi-smart/semantic-release-config");
            const byName = (name) => config.plugins.find(p => pluginName(p) === name);
            if (!config.branches.includes("main")) throw new Error("release config: main is not a release branch");
            if (!byName("@semantic-release/commit-analyzer")) throw new Error("release config: missing @semantic-release/commit-analyzer");
            // A release must not move a caller-facing tag. The next channel is moved by
            // scripts/channel-tag.sh and the major tag only by promote.yml.
            if (/git (tag|push)/.test(JSON.stringify(config.plugins))) throw new Error("release config: a release step moves a tag, so a merge reaches every caller without promote.yml");
            const analyzer = byName("@semantic-release/commit-analyzer");
            const deps = (analyzer[1].releaseRules || []).some(r => r.type === "chore" && r.scope === "deps" && r.release === "patch");
            if (!deps) throw new Error("release config: chore(deps) no longer cuts a patch, so releases stop on dependency updates");
            const notes = byName("@semantic-release/release-notes-generator");
            const types = ((notes[1].presetConfig || {}).types) || [];
            if (!types.length) throw new Error("release config: no changelog sections configured");

            // conventional-changelog-conventionalcommits v10 reads effect, not
            // hidden, and silently treats a leftover hidden key as a bump, so
            // a docs: commit would leak into the notes as an untitled bullet.
            for (const t of types) {
              if ("hidden" in t) throw new Error("release config: " + JSON.stringify(t) + " still carries hidden, which v10 of the preset ignores silently");
              if (t.effect !== "bump" && t.effect !== "hidden") throw new Error("release config: " + JSON.stringify(t) + " has an effect other than bump or hidden");
            }

            // Written as literal UTF-8. An earlier attempt lost every emoji in
            // transit and produced a plain changelog that looked deliberate,
            // so this asserts they survived rather than trusting the file.
            const visible = types.filter(t => t.effect !== "hidden");
            const plain = visible.filter(t => !/[^\x00-\x7F]/.test(t.section || ""));
            if (plain.length) throw new Error("release config: changelog section without an emoji: " + plain.map(t => t.section).join(", "));

            // conventional-changelog takes the FIRST matching entry, so a bare
            // chore listed before the scoped one swallows chore(deps) and hides it.
            const depsAt = types.findIndex(t => t.type === "chore" && t.scope === "deps");
            const choreAt = types.findIndex(t => t.type === "chore" && !t.scope);
            if (depsAt === -1) throw new Error("release config: chore(deps) has no changelog section, so a dependency release would be empty");
            if (choreAt !== -1 && choreAt < depsAt) throw new Error("release config: bare chore is listed before chore(deps), which hides dependency updates");

            const ren = JSON.parse(readFileSync("renovate.json", "utf8"));
            if (!ren.baseBranchPatterns.includes("main")) throw new Error("renovate: baseBranchPatterns must name main, the preset says develop");
            JSON.parse(readFileSync("package.json", "utf8"));

            console.log("release and renovate config OK");
          '

          # The shared package is never published. A release config that
          # gained the npm plugin would try, and fail for want of a token.
          node --input-type=module -e '
            import config from "./release.config.mjs";
            import { pluginName } from "@dodi-smart/semantic-release-config";
            const names = config.plugins.map(pluginName);
            if (names.includes("@semantic-release/npm")) throw new Error("release config: @semantic-release/npm is present, and the shared package is not published");
            console.log("nothing publishes, as expected");
          '

      # Everything callers and Publish release rely on in release.yml, from one load.
      # A real backmerge in a bun or pnpm repo conflicts on the lockfile, not just
      # package.json, because the shared git plugin commits those too, so the resolve
      # list and the input that extends it must stay: an edit that narrows the list
      # fails here, not in a caller's release run after the tag already moved. The
      # tooling is installed outside the checkout, so an install there also resolving
      # the caller's whole dependency tree cannot come back. The outputs and
      # permissions are what every caller reads. Its runner is the runner step's.
      - name: release.yml contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from lib import load, D
          doc = load('.github/workflows/release.yml')
          bad = []
          inputs = doc[True]['workflow_call']['inputs']
          release = doc['jobs']['release']
          steps = release['steps']

          # --- backmerge
          if 'backmerge-resolve-paths' not in inputs:
              bad.append('release.yml lost the backmerge-resolve-paths input, a consuming repo can no longer add its own manifest/lockfile paths')
          elif inputs['backmerge-resolve-paths'].get('default') != '':
              bad.append('backmerge-resolve-paths must default to "", so today\'s behaviour is unchanged when a caller does not set it')
          # The backmerge is the release job's last step: a job of its own mints a second
          # App token and makes a second full clone.
          if 'backmerge' in doc['jobs']:
              bad.append('release.yml has a backmerge job again; it belongs in the release job, sharing its token and checkout')
          merge = [s for s in steps if 'RESOLVE_EXTRA' in str(s.get('env', {}))]
          if not merge:
              bad.append('the backmerge step no longer wires backmerge-resolve-paths through as RESOLVE_EXTRA')
          else:
              if steps[-1] is not merge[0]:
                  bad.append('the backmerge step is no longer the last step of the release job, so it could run before the release finished')
              if 'inputs.backmerge' not in str(merge[0].get('if')):
                  bad.append('the backmerge step lost its condition (inputs.backmerge on the backmerge-from branch)')
              for f in ('package.json', 'package-lock.json', 'bun.lock', 'pnpm-lock.yaml', 'yarn.lock', 'CHANGELOG.md', '$RESOLVE_EXTRA'):
                  if f not in merge[0]['run']:
                      bad.append('the backmerge auto-resolve loop no longer names ' + f)

          # --- tooling in a private prefix
          if inputs['semantic-release-packages'].get('default') != '':
              bad.append('semantic-release-packages must default to "", which installs the set pinned in actions/release-tooling')
          install = [s for s in steps if s.get('name') == 'Install semantic-release']
          if len(install) != 1 or install[0].get('uses') != 'dodi-smart/.github/actions/release-tooling@v1':
              bad.append('the Install semantic-release step must use actions/release-tooling, which installs into a private prefix')
          text = '\n'.join(str(s.get('run', '')) for s in steps)
          for word in ('npx semantic-release', 'npm install', '--no-save'):
              if word in text:
                  bad.append("release.yml contains " + word + ". Tooling installed into the checkout also installs the caller's dependency tree, and npx ignores the private prefix.")

          # --- outputs and permissions: the contract every caller reads
          outs = doc[True]['workflow_call']['outputs']
          for o in ('released', 'version', 'tag', 'tags'):
              if outs.get(o, {}).get('value') != D + 'jobs.release.outputs.' + o + ' }}':
                  bad.append('release.yml: workflow output ' + o + ' no longer reads jobs.release.outputs.' + o)
              if release['outputs'].get(o) != D + 'steps.detect.outputs.' + o + ' }}':
                  bad.append('release.yml: job output ' + o + ' no longer reads steps.detect.outputs.' + o)
          if release['permissions'] != {'contents': 'write', 'issues': 'write', 'pull-requests': 'write'}:
              bad.append('release.yml: the release job permissions changed')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('release.yml: backmerge list intact, tooling in a private prefix, outputs and permissions unchanged')
          PY

      # The per-stack command table has one copy, defaults.sh: a second one
      # (in action.yml, or pasted into a workflow for pick) would drift.
      - name: The per-stack command table lives in one place
        run: |
          # Built in two parts, so this step does not match itself.
          pat='install="bun'; pat="$pat install"
          copies="$(grep -rlF "$pat" actions .github/workflows)"
          if [ "$copies" != actions/setup-stack/defaults.sh ]; then
            echo "::error::the per-stack command table must live in actions/setup-stack/defaults.sh alone; found in: ${copies//$'\n'/ }"; exit 1
          fi

      # A branch ref moves under every caller, and Renovate never proposes a change.
      - name: No action is pinned to a branch
        run: |
          if grep -nE '^\s*-?\s*uses:\s*\S+@(stable|main|master)\s*(#.*)?$' .github/workflows/*.yml actions/*/action.yml; then
            echo "::error::pin a tag or a full SHA, never a branch"; exit 1
          fi

      # The gate's pre-filter may only test the SHAPE of a bot login, never name one (a
      # pre-filter stricter than agent-gate would skip a real PR), and it keeps exactly
      # the permissions it had, actions: write included. Its runner is the runner step's.
      - name: deps-verify's gate keeps its permissions and filters on the shape of a bot login
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from lib import load
          dv = load('.github/workflows/deps-verify.yml')['jobs']
          bad = []
          if dv['gate']['permissions'] != {'contents': 'read', 'pull-requests': 'read', 'actions': 'write'}:
              bad.append('deps-verify.yml: the gate permissions changed')
          cond = str(dv['gate'].get('if'))
          # Shape only: the list of dependency bots lives in agent-gate alone.
          for need in ("endsWith(github.event.pull_request.user.login, '[bot]')", "workflow_run.conclusion != 'cancelled'", "workflow_run.conclusion != 'skipped'", "label.name == 'agent:review'"):
              if need not in cond:
                  bad.append('deps-verify.yml: the gate if: lost ' + need)
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('the deps-verify gate keeps its permissions and its shape-only pre-filter')
          PY

      # migration-lint starts no database, so it alone leaves ubuntu-latest (the runner
      # step holds the other supabase-checks jobs to it).
      - name: migration-lint is opt-in, asks for no permission and pins what it pulls in
        run: |
          set -euo pipefail
          python3 - <<'MIGLINT'
          import re, sys
          from lib import load, D
          bad = []
          path = '.github/workflows/supabase-checks.yml'
          doc = load(path)
          job = doc['jobs'].get('migration-lint')
          if job is None:
              sys.exit('::error::supabase-checks.yml has no migration-lint job')
          if str(job.get('if')) != D + 'inputs.migration-lint }}':
              bad.append('the migration-lint if: must read inputs.migration-lint and nothing else, so an off job reports skipped')
          if 'permissions' in job:
              bad.append('migration-lint asks for a permission of its own; it relies on the ones its siblings do')
          inputs = doc[True]['workflow_call']['inputs']
          for name, want in (('migration-lint', False), ('migration-lint-blocking', False),
                             ('migrations-path', 'supabase/migrations'), ('migration-lint-excluded-rules', '')):
              if name not in inputs or inputs[name].get('default') != want:
                  bad.append('input %s must exist with default %r: off, advisory and the standard path unless a caller opts in' % (name, want))
          for step in load('actions/migration-lint/action.yml')['runs']['steps']:
              uses = step.get('uses', '')
              if not uses or uses.startswith(('actions/', 'dodi-smart/', './')):
                  continue
              if not re.search(r'@[0-9a-f]{40}$', uses):
                  bad.append('actions/migration-lint uses %s, which is not pinned to a full commit SHA' % uses)
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('migration-lint is opt-in, asks for no permission and is pinned')
          MIGLINT

      # shellcheck, jactionlint, typos and the whitespace checks all run
      # from hk.pkl, the same definition the local git hooks use. mise.toml
      # pins every tool, and Renovate bumps the pins. .github/jactionlint.yaml
      # holds the linter's policy, with the reason for each exception.
      # Through actions/hk-check, the step pr-checks' `hk: true` runs, so every
      # pull request here runs it for real: mise, `hk check --all --sarif`, the
      # summary and the artifact.
      - name: Lint (hk check --all)
        uses: ./actions/hk-check
        with:
          cache: 'true'    # hosted, so the GitHub cache is the only cache
          # No setup-stack here to say it, so the same rule inline: only the
          # default branch writes.
          cache-save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          artifact-name: self-test-hk-sarif

      # hk-check only warns on a bad SARIF file; here it fails, so an hk bump that
      # renames the flag or breaks the format shows up before a caller uploads it.
      - name: hk wrote valid SARIF
        if: ${{ !cancelled() }}
        run: jq -e '.version and (.runs | type == "array")' hk.sarif > /dev/null
