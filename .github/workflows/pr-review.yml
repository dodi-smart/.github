# Reusable: second-opinion review on a pull request.
#
# Uses Anthropic's maintained `code-review` plugin rather than a hand-written
# prompt. The gate's job is to decide WHETHER to review and HOW DEEPLY; what a
# good review looks like is the plugin's problem, and it is better at it.
#
# Triggers are deliberately narrow. Reviewing on every push is what gets a
# review bot muted, and a muted bot reviews nothing. The caller fires this on
# `ready_for_review` and on the `agent:review` label, never on `synchronize`.
name: PR Review

on:
  workflow_call:
    inputs:
      runner-weight:
        type: string
        default: "light"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""       # explicit selector; wins over runner-weight

      # Review depth. low|medium: fewer, high-confidence findings.
      # high|xhigh|max: broader coverage, may include uncertain ones.
      #
      # Carried in the SYSTEM PROMPT rather than on the command line. Everything
      # after the slash command reaches the model, but the plugin's command knows
      # only `--comment`, so a depth argument would sit there meaning nothing.
      level:           { type: string, default: "medium" }
      elevated-level:  { type: string, default: "high" }

      # Paths that earn `elevated-level`, as an ERE matched against changed files.
      # The default names concepts rather than a stack, because no two repos here
      # share a vocabulary. Override per repo: a pattern matching nothing
      # silently downgrades every review to the base level.
      sensitive-paths:
        type: string
        default: >-
          (auth|login|signup|session|token|jwt|oauth|saml|password|credential|secret|vault|keystore|
          payment|billing|invoice|checkout|subscription|payout|
          permission|role|policy|acl|rbac|tenant|
          crypt|cipher|sign|hash|
          migration|schema|
          middleware|proxy|cors|csp|webhook|
          Dockerfile|entrypoint|\.github/workflows|deploy)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }

concurrency:
  group: review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.level.outputs.proceed }}
      level:   ${{ steps.level.outputs.level }}
      reason:  ${{ steps.level.outputs.reason }}
      ci:      ${{ steps.ci.outputs.summary }}
    steps:
      # Payload-only rules first, before the checkout. agent:no-touch, drafts
      # and bot PRs are decided without fetching anything. Bot dependency PRs
      # are rejected here because deps-verify owns them, and reviewing them in
      # both places double-posts on every Renovate PR.
      - id: gate
        uses: dodi-smart/.github/actions/agent-gate@v1
        with:
          labels:        ${{ toJson(github.event.pull_request.labels.*.name) }}
          event-name:    ${{ github.event_name }}
          event-action:  ${{ github.event.action }}
          label:         ${{ github.event.label.name }}
          request-label: 'agent:review'
          author:        ${{ github.event.pull_request.user.login }}
          draft:         ${{ github.event.pull_request.draft }}
          bots:          'reject'

      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: level
        env:
          PROCEED:   ${{ steps.gate.outputs.proceed }}
          REASON:    ${{ steps.gate.outputs.reason }}
          LABELS:    ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE:      ${{ github.event.pull_request.base.sha }}
          HEAD:      ${{ github.event.pull_request.head.sha }}
          SENSITIVE: ${{ inputs.sensitive-paths }}
          LEVEL:     ${{ inputs.level }}
          ELEVATED:  ${{ inputs.elevated-level }}
        run: |
          set -euo pipefail
          proceed="$PROCEED"; level="$LEVEL"; reason="$REASON"

          if [ "$proceed" = "true" ]; then
            files=$(git diff --name-only "$BASE" "$HEAD" || true)
            if [ -z "$files" ]; then
              proceed=false; reason="no changed files"
            elif ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
              proceed=false; reason="docs only"
            fi
          fi

          if [ "$proceed" = "true" ]; then
            # Collapse the multi-line default into one ERE before matching.
            pattern=$(printf '%s' "$SENSITIVE" | tr -d '[:space:]')
            if printf '%s\n' "$files" | grep -qiE "$pattern"; then
              level="$ELEVATED"; reason="sensitive paths touched"
            fi
            if printf '%s' "$LABELS" | grep -q '"sec:'; then
              level="$ELEVATED"; reason="sec: label"
            fi
          fi

          {
            echo "proceed=$proceed"
            echo "level=$level"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "decision: proceed=$proceed level=$level ${reason:+($reason)}"

      # Why CI failed, gathered deterministically and handed to the reviewer, so
      # it reviews the actual problem rather than the diff in the abstract.
      # Kept to ONE LINE: the value is interpolated into a shell-style argument,
      # so a newline or a quote takes the whole step with it.
      - id: ci
        if: steps.level.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ github.event.pull_request.head.sha }}
        run: |
          # Steps run as `bash -e {0}` and `set -uo pipefail` does not clear
          # `-e`. This step must report rather than fail, hence `set +e`.
          set +e
          set -uo pipefail
          runs=$(gh api "/repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                 --jq '[.check_runs[] | {name, conclusion, id}]' 2>/dev/null || echo '[]')
          failed=$(jq -c '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")]' <<<"$runs")
          n=$(jq 'length' <<<"$failed" 2>/dev/null || echo 0)

          if [ "${n:-0}" = "0" ]; then
            echo "summary=CI on this PR is green." >> "$GITHUB_OUTPUT"
            echo "no failing checks"; exit 0
          fi

          out="CI on this PR is FAILING ($n check(s))."
          for id in $(jq -r '.[].id' <<<"$failed"); do
            name=$(jq -r --argjson i "$id" '.[]|select(.id==$i)|.name' <<<"$failed")
            # Annotations are often just "Process completed with exit code 1",
            # so pass the run id and let the reviewer fetch the real log.
            runid=$(gh api "/repos/$REPO/check-runs/$id" \
                    --jq '.details_url | capture("/runs/(?<r>[0-9]+)") | .r' 2>/dev/null || echo "")
            out="$out  ||  CHECK '$name'"
            [ -n "$runid" ] && out="$out (run $runid)"
            out="$out:"
            ann=$(gh api "/repos/$REPO/check-runs/$id/annotations" \
                  --jq '.[] | "\(.path):\(.start_line) \(.annotation_level) \(.message)"' 2>/dev/null \
                  | head -8 | tr '\n' ' ' | tr -d '"' | cut -c1-700)
            [ -n "$ann" ] && out="$out $ann"
          done
          out="$out  ||  Annotations are often just 'Process completed with exit code 1'. Fetch the real output with: gh run view <run id> --log-failed"

          # Collapse to one line and drop quotes, so it survives interpolation.
          out=$(printf '%s' "$out" | tr '\n' ' ' | tr -d '"\r' | cut -c1-3000)
          echo "summary=$out" >> "$GITHUB_OUTPUT"
          echo "collected $n failing check(s)"

  pick-runner:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    uses: dodi-smart/.github/.github/workflows/pick-runner.yml@v1
    with:
      weight: ${{ inputs.runner-weight }}
      labels: ${{ inputs.runner-labels }}
    secrets: inherit

  review:
    needs: [gate, pick-runner]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # Stamped before the agent, so the inline count below asks "did THIS run
      # post" rather than "has anything ever posted".
      - id: since
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Opus: judging whether a change is correct is the expensive half of this
      # job.
      #
      # `--comment` unlocks the plugin's steps 8 and 9, which are the only place
      # INLINE comments come from, and the tool in the allowlist is what lets the
      # action start that MCP server. Both are needed for inline comments. Neither
      # is what makes this job report, so do not read a missing verdict as one of
      # them being gone.
      #
      # The SUMMARY does not come from the agent's own posting. The agent writes a
      # file and a later step posts it, the same contract deps-verify uses. The
      # plugin is written to be silent, and it is right to be: its step 1 stops the
      # whole run when it judges a pull request not worth reviewing, and a run that
      # stops there posts nothing at all. Telling it in the system prompt to always
      # post did not hold. A file the job requires does.
      - id: agent
        uses: dodi-smart/.github/actions/run-agent@v1
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-5
          additional-permissions: |
            actions: read
          plugin-marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The org default plus the inline-comment tool. Variadic, space
          # separated. See the run-agent header before changing the shape.
          allowed-tools: 'Bash "Bash(gh:*)" Read Grep Glob mcp__github_inline_comment__create_inline_comment'
          # The last clause pushes back on the plugin's first step, which stops
          # the whole run when Claude has already commented or the change looks
          # trivial. This workflow only runs because someone asked for it. Treat
          # the clause as a nudge and nothing more: on this workflow's first real
          # run the agent stopped there anyway. What guarantees a report is the
          # file the prompt requires, not this sentence.
          append-system-prompt: >-
            ${{ needs.gate.outputs.ci }}
            Review depth for this run is ${{ needs.gate.outputs.level }}. At low or medium report only what you are confident in. At high, xhigh or max cover more ground, and say plainly when a finding is uncertain.
            When CI is failing, diagnose the cause and say which change caused it and how to fix it. Lead with that. It is more useful than anything else you could report. Do not repeat a failure the annotations already state verbatim, explain it.
            A comment you left on this pull request earlier is not a reason to stop, and neither is the diff looking small or obviously correct. Somebody asked for this run by hand. Review it again, and always report the outcome, including when the outcome is that you found nothing.
          # The slash command expands as the plugin wrote it; the lines after it
          # are read too, and win where they disagree with it.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Two rules for this run, which override the command above wherever they disagree with it.

            Write your verdict to ${{ runner.temp }}/review-body.md before you finish. Write it on
            every path: when you found issues, when you found none, and when you decided this pull
            request did not need reviewing and stopped early. In that last case say so and say why,
            because that is a real answer and silence is not. A later step posts that file to the
            pull request as one comment, and this job FAILS when the file is missing or empty.
            Your final message goes only to the job summary, which nobody reads, so anything you
            leave out of the file is lost. Do not open the file with a heading, one is added for you.

            Do not post the summary comment yourself. Inline comments on the diff are yours to post
            and are still wanted. The summary is not, because the step that posts the file rewrites
            one comment per pull request, and a second copy from you stacks underneath it.

      # How many inline comments this pass left, for the verdict to mention. It
      # gates nothing: the verdict below is what makes this job pass or fail.
      #
      # Counted by type, not by login. Matching a login containing "claude" was
      # wrong even while it worked. claude-code-action posts inline comments
      # under whichever app minted its token, and this workflow already declares
      # GH_APP_CLIENT_ID and GH_APP_PRIVATE_KEY. The day someone wires those
      # through, every comment arrives from the org's own app, whose login has no
      # "claude" in it, and every review would report zero.
      #
      # `.user.type == "Bot"` is safe on THIS endpoint: it returns review
      # comments anchored to diff lines, and nothing else writes those during a
      # run. Coverage and lint reporters comment on the issue endpoint instead.
      - id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
          SINCE:    ${{ steps.since.outputs.at }}
        run: |
          set -euo pipefail
          # Piped through jq rather than `gh api --jq`, which takes no --arg.
          # `created_at`, not `updated_at`: an older comment edited during this
          # window is not something this pass published.
          inline=$(gh api "/repos/$REPO/pulls/$PR/comments?per_page=100" --paginate \
            | jq --arg s "$SINCE" \
                 '[.[] | select(.user.type == "Bot") | select(.created_at >= $s)] | length')
          echo "inline=$inline" >> "$GITHUB_OUTPUT"
          echo "published: $inline inline comment(s)"

      # One comment per pull request, rewritten by each pass. The agent's own
      # INLINE comments are left alone: they are anchored to diff lines, GitHub
      # collapses them when the line changes, and rewriting a review thread out
      # from under a reader is worse than a longer page.
      #
      # The body is the file the agent wrote. When that file is missing, this
      # still builds a verdict saying so and the sticky comment still posts it,
      # because a broken pass has to be readable from the pull request rather
      # than only from the run log. The step after the posting is what fails.
      - id: verdict
        name: Build the verdict
        env:
          LEVEL:  ${{ needs.gate.outputs.level }}
          REASON: ${{ needs.gate.outputs.reason }}
          SHA:    ${{ github.event.pull_request.head.sha }}
          INLINE: ${{ steps.posted.outputs.inline }}
          RAN:    ${{ steps.agent.outputs.execution-file }}
          RUN:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/review-body.md"

          {
            echo "### Agent review"
            echo
            if [ -s "$body" ]; then
              cat "$body"
            elif [ -z "$RAN" ]; then
              echo "**The agent never ran.** claude-code-action skipped itself and reported success."
              echo
              echo "It does that when a pull request changes any workflow file, because it requires the file to match the default branch byte for byte. That is a real security control, not a fault in this pull request, and nothing can be reviewed until the change lands on the default branch."
            else
              echo "**The agent wrote no review.** That is a bug in this workflow, not a clean bill of health."
            fi
            echo
            if [ "$INLINE" -gt 0 ]; then
              echo "Left $INLINE inline comment(s) on the diff."
              echo
            fi
            echo "Reviewed \`${SHA:0:7}\` at depth \`$LEVEL\`${REASON:+ ($REASON)}. [Run]($RUN)."
            echo
            echo "Apply \`agent:review\` again for another pass. The label is cleared when this finishes, so re-applying it is a fresh request."
          } > "$RUNNER_TEMP/review-verdict.md"

          [ -s "$body" ] && wrote=true || wrote=false
          echo "wrote=$wrote" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/review-verdict.md"

      - uses: dodi-smart/.github/actions/sticky-comment@v1
        with:
          key:       pr-review
          number:    ${{ github.event.pull_request.number }}
          body-file: ${{ runner.temp }}/review-verdict.md

      # A review that produced nothing is a failed review and must look like one.
      # Checked AFTER the verdict is posted, so the pull request carries the
      # explanation rather than only the run log.
      #
      # This asks whether the agent WROTE its verdict, not whether some comment
      # by some login appeared on the pull request. The old question could not be
      # answered from outside: an agent that decides a pull request needs no
      # review is silent on purpose and looks identical to one whose posting is
      # broken. The file removes the guesswork.
      - name: The review reached the pull request
        if: steps.verdict.outputs.wrote != 'true'
        env:
          RAN: ${{ steps.agent.outputs.execution-file }}
        run: |
          if [ -z "$RAN" ]; then
            echo "::error title=The agent never ran::claude-code-action skipped itself and reported success. It does that when a pull request changes a workflow file, which must match the default branch byte for byte. Nothing here can be reviewed until the change lands on the default branch."
          else
            echo "::error title=The agent wrote no review::The agent ran but left ${RUNNER_TEMP}/review-body.md missing or empty. The prompt asks for that file on every path, including when the agent decides the pull request needs no review. Check that the prompt still asks for it and that it still names the same path the verdict step reads."
          fi
          exit 1

      # `agent:review` is a REQUEST, never a record. Adding a label already
      # present emits no `labeled` event, so leaving it on is why asking twice
      # did nothing. Removing it with github.token cannot loop, because GitHub
      # starts no workflow run from GITHUB_TOKEN activity.
      - name: Clear the request label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Percent-encoded: the colon is part of the label name, not a path
          # separator, and it reaches the API as a single segment either way.
          if gh api -X DELETE "/repos/$REPO/issues/$PR/labels/agent%3Areview" --silent 2>/dev/null; then
            echo "removed agent:review, apply it again to request another pass"
          else
            echo "agent:review was not on this PR"
          fi
