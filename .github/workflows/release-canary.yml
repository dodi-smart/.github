# The end-to-end check of a release, run against the exact release. Publish
# release dispatches it on `pinned/vX.Y.Z` right after it moves `next`; promote.yml
# reads the `release-canary` commit status it posts. Why it is shaped this way
# (a `./` call at the pinned ref, a dispatch rather than a `uses:`, no status
# meaning "wait") is in AGENTS.md.
#
# A dispatch has no pull request, so `changed-files` answers "everything matters"
# and nothing skips as docs-only. The opt-in checks run on fixtures in
# .github/canary/ (this repo has no .zavet/ and no React):
#   - test           writes a small LCOV report, so the coverage job runs.
#   - zavet          a stand-in vendored CLI with one declared check.
#   - react-doctor   one component. On a non-PR event the action scans, posts a
#                    status and exits 0 whatever it finds, so this proves the
#                    action runs, not that code is clean.
#   - dependency-check
#                    skips with "not a pull request" on a dispatch, so it proves
#                    only that the step resolves and starts. It scans nothing.
# `commitlint` needs a PR number and `bundle-report` a Next.js build: both off.
#
# Hosted on purpose, like every workflow here: this repo is public.
name: Release canary

on:
  workflow_dispatch:

permissions: {}

jobs:
  # Exactly what pr-checks.yml's jobs ask for: a called workflow that wants more
  # than its caller grants fails at startup. Self test compares the two.
  pr-checks:
    name: pr-checks at the pinned release
    permissions:
      contents: read
      pull-requests: write     # zavet, react-doctor and coverage
      statuses: write          # react-doctor posts its score
    uses: ./.github/workflows/pr-checks.yml
    with:
      stack: none
      # Every other command is empty for `none`, so those phases and the build job skip.
      test: mkdir -p coverage && cp .github/canary/lcov.info coverage/lcov.info
      hk: true
      coverage: lcov
      coverage-min-overall: 50
      zavet: true
      zavet-dir: .github/canary/zavet
      zavet-blocking: true
      react-doctor: true
      react-doctor-directory: .github/canary/react
      react-doctor-blocking: true
      dependency-check: true
      # A stuck job ends the canary red instead of holding the run for 30 minutes.
      timeout-minutes: 10

  # `success` only when the call succeeded; failed, cancelled and skipped post
  # `failure`. A canary that never gets here leaves no status, which promote.yml
  # also holds on.
  result:
    name: Post the release-canary status
    needs: [pr-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the status on the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.pr-checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context=release-canary \
            -f description="pr-checks result against this release: $RESULT" \
            -f target_url="$RUN_URL"
          echo "release-canary: $state on $SHA ($RESULT)" >> "$GITHUB_STEP_SUMMARY"
