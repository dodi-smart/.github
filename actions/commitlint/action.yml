# Lint a pull request's commit messages with the commitlint CLI.
# Thin wrapper; the reasoning is in lint.sh.
# No cache: GitHub scopes one saved on a pull request to that PR's ref, so no other
# PR could read it and every PR's first run only paid to upload node_modules.
# `npm ci --prefer-offline` is enough, and on self-hosted the persistent home
# already holds npm's cache.
name: Commitlint
description: Lint a pull request's commit messages with a pinned commitlint CLI, without Docker.

inputs:
  config:
    description: 'Path of the commitlint config in the repo. Missing means the org preset.'
    default: '.commitlintrc.json'
  ref:
    description: 'Commit to read the config at: the pull request base, so a pull request cannot change its own rules'
    default: ${{ github.event.pull_request.base.sha }}
  number:
    description: 'Pull request number'
    required: true

runs:
  using: composite
  steps:
    # @commitlint/cli 21 needs Node 22.12 or later. A job that already has one
    # (the self-hosted image, or an earlier setup-node) keeps it.
    - id: node
      shell: bash
      run: |
        if node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 22 || (a === 22 && b >= 12) ? 0 : 1)' 2>/dev/null; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.node.outputs.ok != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - shell: bash
      env:
        CONFIG:      ${{ inputs.config }}
        NUMBER:      ${{ inputs.number }}
        REF:         ${{ inputs.ref }}
        REPO:        ${{ github.repository }}
        GH_TOKEN:    ${{ github.token }}
        PREFIX:      ${{ runner.temp }}/commitlint
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/lint.sh"'
