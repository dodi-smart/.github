# Reusable: the deterministic checks a pull request must pass.
#
# Replaces a hand-written ci.yml per repo. `concurrency:` stays with the
# CALLER, because it depends on that repo's branches. Do NOT add `paths-ignore`
# on the caller for a docs-only skip: this workflow already does that itself
# (see `docs-only-paths` below), and a caller-side `paths-ignore` produces no
# status-check context at all, which is worse -- a branch ruleset requiring one
# then waits on a pull request forever.
#
# Light work (lint, typecheck) goes to the light pool and heavy work (build,
# tests) to the large one. Any step whose command resolves to empty is skipped.
# `single-job: true` collapses the split onto the heavy runner.
#
# ONE `pick` job resolves both runners and whether the change is docs-only,
# reading the changed files through the API with no checkout. `pr-checks` at the
# bottom always runs and is the one context a ruleset should require.
#
# `pick` and `pr-checks` are helper jobs that run no caller code. In a private
# repo they run on the `control` pool (see AGENTS.md for why); a public repo or a
# fork PR keeps ubuntu-latest. There is no switch to hosted. The expression is
# written out in each job because `runs-on` cannot read `env`.
name: PR Checks

# This workflow runs the caller's own code (install scripts, tests, builds), so
# no job holds more than it needs. Jobs that need more say so themselves.
permissions:
  contents: read

env:
  # What `test` and `all` upload for the coverage job: vitest's two JSON files,
  # or the one report the caller's test command writes.
  COVERAGE_REPORT: ${{ inputs.coverage == 'vitest' && 'coverage/coverage-*.json' || inputs.coverage-path || 'coverage/lcov.info' }}

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true      # bun | node | gradle | android | flutter | rust | xcode | none

      # "@stack" = this stack's conventional command; "" = this repo has no such
      # step. See actions/setup-stack, which resolves these.
      install:   { type: string, default: "@stack" }
      lint:      { type: string, default: "@stack" }
      typecheck: { type: string, default: "@stack" }
      test:      { type: string, default: "@stack" }
      build:     { type: string, default: "@stack" }

      # Design-system verifier (oxlint + @shadcn/lint). Opt-in: no `@stack`
      # default, since there is no conventional command for it. Runs on the
      # light pool right after Lint. Advisory until the caller's command adds
      # `--max-warnings`.
      design-lint: { type: string, default: "" }

      # Runs `hk check --all` from the caller's own hk.pkl, with the tools its
      # mise.toml pins, after install and before lint. Sits beside `lint` and
      # replaces nothing. Findings show in the job log and summary, and the SARIF
      # is kept as an `hk-sarif-<n>` artifact. Nothing is uploaded to code scanning:
      # that needs `security-events: write`, which every caller would have to
      # grant. A repo that wants it uploads the artifact from its own workflow.
      hk: { type: boolean, default: false }

      light-weight: { type: string, default: "light" }
      heavy-weight: { type: string, default: "heavy" }

      # Run every step in ONE job on the heavy runner instead of splitting light
      # work from heavy.
      #
      # The split is right for a repo whose lint is cheap and independent, and
      # wrong for Gradle: three jobs mean three configuration phases and no
      # shared daemon. One job gives one checkout and one warm GRADLE_USER_HOME.
      # The split stays the default.
      single-job: { type: boolean, default: false }

      # Every changed file must match one of these globs (newline-separated,
      # `fnmatch`-style: `*` crosses `/`) for the run to skip `test`, `build`
      # and `all`, and every step of `checks` but commitlint. That step still runs
      # on the light runner when `commitlint` is on, even with `single-job`,
      # because the commit message is what it checks, not the files.
      #
      # `docs_only` is always `false` on `workflow_dispatch`, and whenever the
      # changed files cannot be listed in full (an API error, or the 3000-file
      # cap) -- a skip is only ever a positive claim, never the fallback when
      # something went wrong reading it.
      docs-only-paths:
        type: string
        default: |-
          **.md
          docs/**

      commitlint:        { type: boolean, default: false }
      commitlint-config: { type: string,  default: ".commitlintrc.json" }

      # Opt-in jobs that replace zavet-check.yml and react-doctor.yml. Neither
      # feeds the `pr-checks` summary. `zavet-stack` is the toolchain the
      # decision checks run on. `react-doctor-paths` are newline globs; the
      # default is web source and package.json, narrow it to an app directory in
      # a monorepo. A repo that tunes React Doctor keeps react-doctor.yml.
      zavet:       { type: boolean, default: false }
      zavet-dir:   { type: string,  default: ".zavet" }
      zavet-stack: { type: string,  default: "none" }
      zavet-audit: { type: boolean, default: false }   # report-only health sweep
      # The zavet job's install. Empty reuses `install`; set it when the decision
      # checks need more, e.g. a build whose output a check reads.
      zavet-install: { type: string, default: "" }

      react-doctor:           { type: boolean, default: false }
      react-doctor-paths:
        type: string
        default: |-
          **.ts
          **.tsx
          **.js
          **.jsx
          package.json
      react-doctor-directory: { type: string,  default: "." }

      # none | vitest | kover | lcov. `lcov`: the test command writes an LCOV
      # file (bun test, cargo llvm-cov, c8, nyc) and `coverage-path` points at
      # it; the default is coverage/lcov.info.
      coverage:      { type: string, default: "none" }
      coverage-path: { type: string, default: "" }
      coverage-min-overall: { type: number, default: 0 }
      coverage-min-changed: { type: number, default: 0 }

      # Applied to EVERY command step, via setup-stack's env-file. This is where
      # build tuning goes: GRADLE_OPTS, JAVA_OPTS, a worker count. Placeholders
      # and tuning only, never secrets. A value that must stay secret has no
      # business in a PR build log.
      env:
        type: string
        default: ""      # newline-separated KEY=VALUE

      # Build step only, parsed exactly like `env` (comments and blank lines
      # skipped, first `=` splits). Kept because callers already depend on it;
      # `env` is the general one, so prefer it. Both apply when both are set,
      # and `build-env` wins on a name in both.
      build-env:
        type: string
        default: ""      # newline-separated KEY=VALUE, placeholders only
      timeout-minutes: { type: number, default: 30 }

      java-version:    { type: string, default: "21" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "auto" }
      flutter-version: { type: string, default: "" }
      # Passed to the pinned rust-toolchain action: stable, nightly, or a version.
      rust-toolchain:  { type: string, default: "stable" }
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  # ONE job resolves both runners and whether the diff is docs-only. It always
  # runs, unlike the jobs it feeds -- it is the job a docs-only skip and
  # single-job mode both still need, and its own two picks are what let
  # `checks`/`test`/`build`/`all` skip cleanly through `needs.pick.outputs`.
  #
  # It needs bash, git, gh, jq and python3 (`changed-files` matches globs with
  # Python's fnmatch). A missing one degrades to "not docs-only, run everything"
  # and silently skips React Doctor, so the tool check below says so out loud.
  pick:
    name: Pick runner
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","control"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read      # the changed-files listing
    outputs:
      light:     ${{ steps.light.outputs.runner }}
      heavy:     ${{ steps.heavy.outputs.runner }}
      docs_only: ${{ steps.docs.outputs.all-matched }}
      react_doctor: ${{ inputs.react-doctor && steps.rd.outputs.matched == 'true' }}
      key:       ${{ steps.key.outputs.key }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
      # Artifact names are per workflow run, and a caller may call this workflow
      # twice (a `checks` job and an `ios` job), so each call's names carry a hash
      # of its inputs. Not `github.job`: both calls have a job called `test`.
      - id: key
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "key=$(printf '%s' "$INPUTS" | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the tools changed-files needs
        run: |
          for t in gh jq python3; do
            command -v "$t" >/dev/null || echo "::warning title=Runner is missing $t::changed-files needs $t, so docs-only detection and the React Doctor path filter will not work on this runner."
          done

      # `all-matched` is a positive claim, never a fallback: it is `true` only
      # when the whole list was read and every file matches `docs-only-paths`.
      # A `workflow_dispatch` (no PR), an API error, an empty list and the
      # 3000-file cap all come out `false`.
      - id: docs
        uses: dodi-smart/.github/actions/changed-files@v1
        with:
          patterns: ${{ inputs.docs-only-paths }}

      - id: rd
        if: ${{ inputs.react-doctor }}
        uses: dodi-smart/.github/actions/changed-files@v1
        with:
          patterns: ${{ inputs.react-doctor-paths }}

      # Whether any light job will run, so the picker below skips otherwise.
      - id: need
        env:
          SPLIT:      ${{ !inputs.single-job && steps.docs.outputs.all-matched != 'true' }}
          COMMITLINT: ${{ inputs.commitlint }}
          ZAVET:      ${{ inputs.zavet }}
          RD:         ${{ steps.rd.outputs.matched }}
          COVERAGE:   ${{ inputs.coverage != 'none' && steps.docs.outputs.all-matched != 'true' }}
        run: |
          set -euo pipefail
          need=false
          for v in "$SPLIT" "$COMMITLINT" "$ZAVET" "$RD" "$COVERAGE"; do
            [ "$v" = "true" ] && need=true
          done
          echo "needs_light=$need" >> "$GITHUB_OUTPUT"

      - id: light
        if: ${{ steps.need.outputs.needs_light == 'true' }}
        uses: dodi-smart/.github/actions/pick-runner@v1
        with:
          weight:        ${{ inputs.light-weight }}

      - id: heavy
        if: ${{ steps.docs.outputs.all-matched != 'true' }}
        uses: dodi-smart/.github/actions/pick-runner@v1
        with:
          weight:        ${{ inputs.heavy-weight }}

  # Full history, because guards walk the pull request's commits.
  zavet:
    name: Zavet Check
    if: inputs.zavet
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write     # the failure comment
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.light }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dodi-smart/.github/actions/zavet-check@v1
        with:
          zavet-dir:       ${{ inputs.zavet-dir }}
          stack:           ${{ inputs.zavet-stack }}
          audit:           ${{ inputs.zavet-audit }}
          install:         ${{ inputs.zavet-install || inputs.install }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          java-version:    ${{ inputs.java-version }}
          flutter-version: ${{ inputs.flutter-version }}

  react-doctor:
    name: React Doctor
    if: ${{ needs.pick.outputs.react_doctor == 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write     # the action posts its own sticky comment
      statuses: write          # and a commit status carrying the score
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.light }}
      - uses: dodi-smart/.github/actions/react-doctor@v1
        with:
          directory: ${{ inputs.react-doctor-directory }}

  # ---------------------------------------------------------------------------
  # Split shape: light work on the small pool, heavy work on the large one.
  #
  # Every job below runs its commands through `run-phases`, which sources the
  # env file setup-stack wrote before each one (always written, empty when the
  # caller passed no `env`), skips a phase whose command is empty, stops at the
  # first failure, and puts a timing table in the job summary.
  # ---------------------------------------------------------------------------

  # On a docs-only change this job runs for commitlint alone, even with
  # `single-job`, so every other step skips on `docs_only`. See AGENTS.md.
  checks:
    if: ${{ (!inputs.single-job && needs.pick.outputs.docs_only != 'true') || (inputs.commitlint && needs.pick.outputs.docs_only == 'true') }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read      # commitlint
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.light }}
      - if: ${{ needs.pick.outputs.docs_only != 'true' }}
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      # Every job passes every command: setup-stack only resolves them into
      # outputs, and each job's `run-phases` reads the ones it uses. That keeps
      # the four calls identical, so this one is written once and aliased.
      - id: setup
        if: ${{ needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/setup-stack@v1
        with: &setup-stack
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          env:             ${{ inputs.env }}
          build-env:       ${{ inputs.build-env }}
          install:         ${{ inputs.install }}
          lint:            ${{ inputs.lint }}
          typecheck:       ${{ inputs.typecheck }}
          test:            ${{ inputs.test }}
          build:           ${{ inputs.build }}
          design-lint:     ${{ inputs.design-lint }}
          java-version:    ${{ inputs.java-version }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          flutter-version: ${{ inputs.flutter-version }}
          rust-toolchain:  ${{ inputs.rust-toolchain }}
      # Opt-in `hk`: install first, then hk, then the rest of the phases. With
      # `hk: false` the single `Run phases` step below runs as it always did.
      - id: install
        name: Run phases (install)
        if: ${{ inputs.hk && needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file: ${{ steps.setup.outputs.env-file }}
          install:  ${{ steps.setup.outputs.install }}
      # The whole tree, never `--pr`; see actions/hk-check. Its mise cache
      # follows setup-stack's, so it stays off on a self-hosted Linux runner.
      - if: ${{ inputs.hk && needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/hk-check@v1
        with:
          cache:         ${{ steps.setup.outputs.cache-enabled }}
          artifact-name: hk-sarif-${{ needs.pick.outputs.key }}
      - name: Run phases
        if: ${{ !inputs.hk && needs.pick.outputs.docs_only != 'true' }}
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file:    ${{ steps.setup.outputs.env-file }}
          install:     ${{ steps.setup.outputs.install }}
          lint:        ${{ steps.setup.outputs.lint }}
          design-lint: ${{ steps.setup.outputs.design-lint }}
          typecheck:   ${{ steps.setup.outputs.typecheck }}
      # A red hk does not hide the rest: they run unless the install failed.
      - name: Run phases (after hk)
        if: ${{ !cancelled() && inputs.hk && steps.install.outcome == 'success' }}
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file:    ${{ steps.setup.outputs.env-file }}
          lint:        ${{ steps.setup.outputs.lint }}
          design-lint: ${{ steps.setup.outputs.design-lint }}
          typecheck:   ${{ steps.setup.outputs.typecheck }}
      # Last, on !cancelled(): a red phase still gets its messages checked. A CLI,
      # not a Docker action: see actions/commitlint.
      - name: commitlint
        if: ${{ !cancelled() && inputs.commitlint }}
        uses: dodi-smart/.github/actions/commitlint@v1
        with:
          config: ${{ inputs.commitlint-config }}
          number: ${{ github.event.pull_request.number }}

  test:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      workspace: ${{ github.workspace }}    # the coverage job maps report paths with it
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.heavy }}
      # Default depth: no reporter needs history; they list changed files
      # through the API.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with: *setup-stack
      - name: Run phases
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file: ${{ steps.setup.outputs.env-file }}
          install:  ${{ steps.setup.outputs.install }}
          test:     ${{ steps.setup.outputs.test }}

      # The `coverage` job posts the comment and holds the write token. This
      # job runs the caller's code, so it only hands the report over. A red run
      # uploads nothing.
      - if: ${{ inputs.coverage != 'none' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: ${{ env.COVERAGE_REPORT }}
          if-no-files-found: error
          retention-days: 1

  # `build` needs only `pick`, so it starts beside `checks` and `test`: a push
  # waits for the slowest of the three, not for two in a row.
  #
  # `build-env` holds placeholders a build needs present but not real, supplied
  # by the caller in plain sight. Never secrets: a value that must stay secret
  # has no business in a PR build log. `run-phases` sources them for the build
  # phase only, into that phase's own shell and not $GITHUB_ENV, which refuses
  # NODE_OPTIONS outright, and NODE_OPTIONS is what a Next.js build needs here.
  build:
    if: ${{ !inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.heavy }}
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with: *setup-stack
      - name: Run phases
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          install:        ${{ steps.setup.outputs.install }}
          build:          ${{ steps.setup.outputs.build }}

  # ---------------------------------------------------------------------------
  # Single-job shape: the same phases, in the same order, with the same
  # skip-on-empty rule. Only the runner and the job boundaries differ.
  # ---------------------------------------------------------------------------

  all:
    if: ${{ inputs.single-job && needs.pick.outputs.docs_only != 'true' }}
    needs: [pick]
    runs-on: ${{ fromJson(needs.pick.outputs.heavy) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read      # commitlint
    outputs:
      workspace: ${{ github.workspace }}    # the coverage job maps report paths with it
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.heavy }}
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: setup
        uses: dodi-smart/.github/actions/setup-stack@v1
        with: *setup-stack
      # Opt-in `hk`: install first, then hk, then the rest of the phases. With
      # `hk: false` the single `Run phases` step below runs as it always did.
      - id: install
        name: Run phases (install)
        if: ${{ inputs.hk }}
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file: ${{ steps.setup.outputs.env-file }}
          install:  ${{ steps.setup.outputs.install }}
      # The whole tree, never `--pr`; see actions/hk-check. Its mise cache
      # follows setup-stack's, so it stays off on a self-hosted Linux runner.
      - if: ${{ inputs.hk }}
        uses: dodi-smart/.github/actions/hk-check@v1
        with:
          cache:         ${{ steps.setup.outputs.cache-enabled }}
          artifact-name: hk-sarif-${{ needs.pick.outputs.key }}
      - name: Run phases
        if: ${{ !inputs.hk }}
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          install:        ${{ steps.setup.outputs.install }}
          lint:           ${{ steps.setup.outputs.lint }}
          design-lint:    ${{ steps.setup.outputs.design-lint }}
          typecheck:      ${{ steps.setup.outputs.typecheck }}
          test:           ${{ steps.setup.outputs.test }}
          build:          ${{ steps.setup.outputs.build }}
      # A red hk does not hide the rest: they run unless the install failed.
      - name: Run phases (after hk)
        if: ${{ !cancelled() && inputs.hk && steps.install.outcome == 'success' }}
        uses: dodi-smart/.github/actions/run-phases@v1
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          lint:           ${{ steps.setup.outputs.lint }}
          design-lint:    ${{ steps.setup.outputs.design-lint }}
          typecheck:      ${{ steps.setup.outputs.typecheck }}
          test:           ${{ steps.setup.outputs.test }}
          build:          ${{ steps.setup.outputs.build }}

      # The `coverage` job posts the comment and holds the write token. This
      # job runs the caller's code, so it only hands the report over. A red run
      # uploads nothing.
      - if: ${{ inputs.coverage != 'none' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: ${{ env.COVERAGE_REPORT }}
          if-no-files-found: error
          retention-days: 1
      # Last, on !cancelled(): a red phase still gets its messages checked. A CLI,
      # not a Docker action: see actions/commitlint.
      - name: commitlint
        if: ${{ !cancelled() && inputs.commitlint }}
        uses: dodi-smart/.github/actions/commitlint@v1
        with:
          config: ${{ inputs.commitlint-config }}
          number: ${{ github.event.pull_request.number }}

  # ---------------------------------------------------------------------------
  # The coverage comment. Posting needs `pull-requests: write`, and `test` and
  # `all` run the caller's whole test suite, so the write token lives here
  # instead: this job downloads what they uploaded and runs no repo code. The
  # checkout below only gives the vitest reporter the source tree; it does not
  # install or run anything, and drops credentials.
  #
  # It runs on the light pool, since it runs none of the caller's code.
  # ---------------------------------------------------------------------------

  coverage:
    name: Coverage
    if: ${{ !cancelled() && inputs.coverage != 'none' && (needs.test.result == 'success' || needs.all.result == 'success') }}
    needs: [pick, test, all]
    runs-on: ${{ fromJson(needs.pick.outputs.light) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write     # coverage comment
    env:
      # `test` or `all`, whichever ran: the workspace the report was written in.
      WRITER_WORKSPACE: ${{ needs.test.outputs.workspace || needs.all.outputs.workspace }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          selector: ${{ needs.pick.outputs.light }}
      # The artifact holds one file, or vitest's two, named by basename, so the
      # reporters read `coverage/*` whatever `coverage-path` was.
      - if: inputs.coverage == 'vitest'
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: coverage
      - if: inputs.coverage == 'vitest'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          file-coverage-root-path: ${{ env.WRITER_WORKSPACE }}
      - if: inputs.coverage == 'lcov'
        uses: dodi-smart/.github/actions/lcov-report@v1
        with:
          path:        coverage/*
          source-root: ${{ env.WRITER_WORKSPACE }}
          min-overall: ${{ inputs.coverage-min-overall }}
          min-changed: ${{ inputs.coverage-min-changed }}
      - if: inputs.coverage == 'kover'
        id: kover
        uses: mi-kas/kover-report@v2
        with:
          path: coverage/*
          token: ${{ github.token }}
          title: Code Coverage
          update-comment: true
          min-coverage-overall: ${{ inputs.coverage-min-overall }}
          min-coverage-changed-files: ${{ inputs.coverage-min-changed }}
      # kover-report only marks a breached minimum in its comment and never
      # fails, so a report at 0% passed with a floor of 40. The overall floor
      # is enforced here from its output, as actions/lcov-report does itself.
      # The changed-files floor stays comment-only: kover-report reports 0,
      # not empty, when no changed file is in the report, so enforcing it
      # would fail every pull request that touches no covered source.
      - if: inputs.coverage == 'kover'
        name: Enforce the overall coverage floor
        env:
          OVERALL:     ${{ steps.kover.outputs.coverage-overall }}
          MIN_OVERALL: ${{ inputs.coverage-min-overall }}
        run: |
          set -euo pipefail
          if [ -z "$OVERALL" ]; then
            echo "::error::coverage: kover-report produced no overall figure"
            exit 1
          fi
          if awk -v v="$OVERALL" -v m="$MIN_OVERALL" 'BEGIN { exit !(m > 0 && v + 0 < m + 0) }'; then
            echo "::error::coverage: overall ${OVERALL}% is below the ${MIN_OVERALL}% floor"
            exit 1
          fi
          echo "coverage: overall ${OVERALL}% (floor ${MIN_OVERALL}%)"

  # ---------------------------------------------------------------------------
  # One stable context, on every push, in both modes.
  # ---------------------------------------------------------------------------

  # This is the job a branch ruleset should require, never `checks` or `all`.
  # `<caller job id> / pr-checks` exists on every PR push whether single-job or
  # split, and whether or not the change is docs-only, which is exactly what
  # `checks / checks` and `checks / all` cannot promise: one of them is always
  # skipped depending on `single-job`, and on a docs-only change `all` is
  # skipped and `checks` runs only when commitlint is on. A required context
  # that a docs-only push never creates is a ruleset that waits forever, which is
  # what a caller's `paths-ignore` used to cause.
  #
  # It needs `checks` and `all`, so a red lint or a bad commit message fails the
  # required context even though `build` runs beside them.
  #
  # `zavet` and `react-doctor` stay out of `needs` and the loop below on purpose.
  #
  # Its name is the required status context (`<caller job> / PR Checks`), so it
  # never changes. It runs no caller code, so it runs on the control pool of a
  # private repo, and on ubuntu-latest for a public repo or a fork PR, like
  # `pick`.
  pr-checks:
    name: PR Checks
    needs: [pick, checks, test, build, all, coverage]
    if: always()
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","control"]' || '"ubuntu-latest"') }}
    timeout-minutes: 2
    steps:
      - uses: dodi-smart/.github/actions/runner-report@v1
      # The "Where it ran" table for every job of this run attempt. Before
      # Summarize, which exits non-zero on a red run. `actions: read` is not
      # granted here, so queue times read "n/a" and the runner names still show.
      - uses: dodi-smart/.github/actions/runner-report@v1
        with:
          mode: run
      - name: Summarize
        env:
          PICK:          ${{ needs.pick.result }}
          CHECKS:        ${{ needs.checks.result }}
          TEST:          ${{ needs.test.result }}
          BUILD:         ${{ needs.build.result }}
          ALL:           ${{ needs.all.result }}
          COVERAGE:      ${{ needs.coverage.result }}
          DOCS_ONLY:     ${{ needs.pick.outputs.docs_only }}
        run: |
          set -euo pipefail
          failed=""
          for pair in "pick:$PICK" "checks:$CHECKS" "test:$TEST" "build:$BUILD" "all:$ALL" "coverage:$COVERAGE"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              failure|cancelled) failed="$failed $name($result)" ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::pr-checks: failed jobs:$failed"
            exit 1
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "pr-checks: docs-only change, checks skipped"
          else
            echo "pr-checks: all required jobs passed"
          fi
