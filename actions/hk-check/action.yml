# hk check over the whole tree, for pr-checks.yml's `hk` input. The run, the
# summary and the SARIF check are in hk-check.sh.
name: hk check
description: Install the repo's mise tools, run `hk check --all --sarif`, write the findings to the job summary and keep the SARIF as an artifact.

inputs:
  cache:
    description: >-
      'true' or 'false': whether mise's GitHub Actions cache is on. Pass
      setup-stack's `cache-enabled` output, so a self-hosted Linux runner, whose
      persistent volume is the cache, never turns it on.
    default: 'false'
  cache-save:
    description: >-
      'true' or 'false': whether this job may write mise's cache. Pass
      setup-stack's `cache-save` output, which is true on the default branch only
      and never while caching is off, so it needs no check against `cache`.
    default: 'false'
  artifact-name:
    description: Name of the uploaded SARIF artifact. Unique per workflow run.
    default: hk-sarif

runs:
  using: composite
  steps:
    # Read where `cache` says, written where `cache-save` says (setup-stack decides).
    - uses: jdx/mise-action@v5
      with:
        cache: ${{ inputs.cache == 'true' }}
        cache_save: ${{ inputs.cache-save == 'true' }}

    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/hk-check.sh"'

    # The SARIF needs no token to keep, so it is uploaded even when hk failed. A
    # repo that wants code scanning uploads this artifact from its own workflow.
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: hk.sarif
        if-no-files-found: ignore
        retention-days: 1
