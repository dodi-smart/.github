      # zavet and react-doctor join the required context only when their
      # `*-blocking` input is on, and each standalone workflow and its pr-checks
      # job must run one shared action. `needs` cannot vary with an input, so the
      # summary needs both always and its `ignore` decides: an advisory job is
      # read as `skipped` by actions/pr-checks-summary, which never fails on it.
      - name: pr-checks counts zavet and react-doctor only when blocking
