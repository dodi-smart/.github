# Reusable: verify a repo's .zavet/ knowledge layer on a pull request.
#
# Local git hooks alone hold only as long as every contributor has them
# installed and never passes --no-verify. Without this, a decision check can rot
# for months with nothing failing.
#
# Severity, the report-only rule for dependency bots and the failure comment
# are documented in actions/zavet-check, which holds the steps. pr-checks runs
# the same action as its opt-in `zavet` job.
#
# Some decision checks reach the GitHub API on purpose, because a decision
# about a file in another repo should be verified rather than asserted. So this
# workflow needs a token and network.
name: Zavet Check

on:
  workflow_call:
    inputs:
      checks: { type: boolean, default: true }   # run every decision's `checks:`
      guards: { type: boolean, default: true }   # require trailers on guarded paths
      audit:  { type: boolean, default: false }  # report-only health sweep
      zavet-dir:     { type: string, default: ".zavet" }
      runner-weight: { type: string, default: "light" }
      runner-labels: { type: string, default: "" }
      yq-version:    { type: string, default: "v4.53.3" }

      # The toolchain the decision checks THEMSELVES run on. Default `none` suits
      # a repo whose checks are plain shell. A check that shells out to a test
      # runner or a build tool needs its stack here, or the command is not found
      # and the job reports a decision that stopped holding when in fact nothing
      # ran. Same input and same values as pr-checks.
      stack:   { type: string, default: "none" }
      # `@stack` installs dependencies the conventional way for that stack, which
      # is what a check running a test file needs. Set to "" for a stack whose
      # tooling resolves on demand.
      install: { type: string, default: "@stack" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "auto" }
      java-version:    { type: string, default: "21" }
      flutter-version: { type: string, default: "" }
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  pick-runner:
    uses: dodi-smart/.github/.github/workflows/pick-runner.yml@v1
    with:
      weight: ${{ inputs.runner-weight }}
      labels: ${{ inputs.runner-labels }}
    secrets: inherit

  check:
    needs: [pick-runner]
    runs-on: ${{ fromJson(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # The steps live in a composite action so the `zavet` job in pr-checks
      # runs the same code. The severity rules and the reasons behind them are
      # written there.
      - uses: dodi-smart/.github/actions/zavet-check@v1
        with:
          checks:          ${{ inputs.checks }}
          guards:          ${{ inputs.guards }}
          audit:           ${{ inputs.audit }}
          zavet-dir:       ${{ inputs.zavet-dir }}
          yq-version:      ${{ inputs.yq-version }}
          stack:           ${{ inputs.stack }}
          install:         ${{ inputs.install }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          java-version:    ${{ inputs.java-version }}
          flutter-version: ${{ inputs.flutter-version }}
