# Reusable: second-opinion review on a pull request.
#
# Uses Anthropic's maintained `code-review` plugin rather than a hand-written
# prompt. The gate's job is to decide WHETHER to review and HOW DEEPLY; what a
# good review looks like is the plugin's problem, and it is better at it.
#
# Triggers are deliberately narrow. Reviewing on every push is what gets a
# review bot muted, and a muted bot reviews nothing. The caller fires this on
# `ready_for_review` and on the `agent:review` label, never on `synchronize`.
#
# Every review ends in a machine-readable verdict, the `review / verdict`
# commit status and the `review-verdict` artifact. The README's "Review
# verdict" section is the contract other workflows merge on.
#
# A bot's PR is reviewed only when a bot (the org App, through
# actions/request-review) applied `agent:review`. When its commits carry a
# `scope-trailers` trailer, only those commits are reviewed: the automation's
# own changes on top of a dependency bot's or an agent's work.
name: PR Review

on:
  workflow_call:
    inputs:
      runner-weight:
        type: string
        default: "light"     # light | heavy | apple | hosted
      runner-labels:
        type: string
        default: ""       # explicit selector; wins over runner-weight

      # On a bot's PR, review only the commits carrying one of these trailers
      # (space-separated). The default is deps-verify's round trailer.
      scope-trailers:
        type: string
        default: "Deps-Verify-Round"

      # Review depth. low|medium: fewer, high-confidence findings.
      # high|xhigh|max: broader coverage, may include uncertain ones.
      #
      # Carried in the SYSTEM PROMPT rather than on the command line. Everything
      # after the slash command reaches the model, but the plugin's command knows
      # only `--comment`, so a depth argument would sit there meaning nothing.
      level:           { type: string, default: "medium" }
      elevated-level:  { type: string, default: "high" }

      # Paths that earn `elevated-level`, as an ERE matched against changed files.
      # The default names concepts rather than a stack, because no two repos here
      # share a vocabulary. Override per repo: a pattern matching nothing
      # silently downgrades every review to the base level.
      #
      # `.github/workflows` is deliberately NOT in the list. Every repo's thin
      # callers live there, so a one-line `with:` change put five pull requests
      # in a row on the elevated level and each got a seven-finding essay. The
      # shared workflows themselves are reviewed in this repo, where the whole
      # diff is workflow and the base level already reads all of it.
      sensitive-paths:
        type: string
        default: >-
          (auth|login|signup|session|token|jwt|oauth|saml|password|credential|secret|vault|keystore|
          payment|billing|invoice|checkout|subscription|payout|
          permission|role|policy|acl|rbac|tenant|
          crypt|cipher|sign|hash|
          migration|schema|
          middleware|proxy|cors|csp|webhook|
          Dockerfile|entrypoint|deploy)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }
      AGENT_ENV_SECRET:        { required: false }   # KEY=VALUE lines for the agent alone

concurrency:
  group: review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job grants its own, so one added later starts with nothing.
permissions: {}

jobs:
  # The picker runs INSIDE this job, after the last step that can still say
  # no, so it never runs for an event that will not proceed.
  # The gate runs on the light pool of a private repo and on a hosted runner
  # otherwise (a public repo, or a fork PR, which the pool cannot serve). The
  # `if:` below is a cheap pre-filter on the event payload alone, so an event the
  # gate would only stop costs no runner at all. It is strictly narrower than the
  # gate: every rule the gate keeps (`agent:no-touch` first, then the rest) still
  # runs for an event that passes it, and nothing the gate posts is skipped.
  gate:
    # The sender test is the point: it asks who applied the label, which on a
    # labeled event is the labeler. Labelling needs write access, and the
    # gate's `level` step tests the same sender again.
    # jactionlint ignore=bot-conditions
    if: >-
      github.event.pull_request.draft != true
      && (github.event.action != 'labeled' || github.event.label.name == 'agent:review')
      && (!(endsWith(github.event.pull_request.user.login, '[bot]') || startsWith(github.event.pull_request.user.login, 'app/'))
        || (github.event.action == 'labeled' && endsWith(github.event.sender.login, '[bot]')))
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.level.outputs.proceed }}
      mode:    ${{ steps.level.outputs.mode }}      # full | scoped
      scope:   ${{ steps.level.outputs.scope }}     # the scoped commits, space-separated
      level:   ${{ steps.level.outputs.level }}
      elevated: ${{ steps.level.outputs.elevated }}  # true: sensitive paths or a sec: label
      reason:  ${{ steps.level.outputs.reason }}
      ci:      ${{ steps.ci.outputs.summary }}
      runner:  ${{ steps.pick.outputs.runner }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.3
        with:
          selector: light

      # Payload-only rules first, before the file listing. agent:no-touch and
      # drafts are decided without fetching anything. Bots pass the gate here
      # and the `level` step decides: a bot's PR is reviewed only when a bot
      # applied `agent:review`. Renovate never does, so deps-verify keeps
      # owning a plain dependency PR and nothing double-posts.
      - id: gate
        uses: dodi-smart/.github/actions/agent-gate@pinned/v1.44.3
        with:
          labels:        ${{ toJson(github.event.pull_request.labels.*.name) }}
          event-name:    ${{ github.event_name }}
          event-action:  ${{ github.event.action }}
          label:         ${{ github.event.label.name }}
          request-label: 'agent:review'
          author:        ${{ github.event.pull_request.user.login }}
          draft:         ${{ github.event.pull_request.draft }}
          bots:          'allow'

      # The changed files come from the API, so this job needs no checkout and
      # no clone. `all-matched` is the docs-only claim: true only when the whole
      # list was read and every file is documentation.
      - id: changed
        if: steps.gate.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/changed-files@pinned/v1.44.3
        with:
          patterns: |-
            **.md
            docs/**

      - id: level
        env:
          PROCEED:   ${{ steps.gate.outputs.proceed }}
          REASON:    ${{ steps.gate.outputs.reason }}
          KIND:      ${{ steps.gate.outputs.author-kind }}
          SENDER:    ${{ github.event.sender.login }}
          TRAILERS:  ${{ inputs.scope-trailers }}
          GH_TOKEN:  ${{ github.token }}
          REPO:      ${{ github.repository }}
          BASE:      ${{ github.event.pull_request.base.sha }}
          HEAD:      ${{ github.event.pull_request.head.sha }}
          LABELS:    ${{ toJson(github.event.pull_request.labels.*.name) }}
          FILES:     ${{ steps.changed.outputs.files }}
          DOCS_ONLY: ${{ steps.changed.outputs.all-matched }}
          SENSITIVE: ${{ inputs.sensitive-paths }}
          LEVEL:     ${{ inputs.level }}
          ELEVATED:  ${{ inputs.elevated-level }}
        run: |
          set -euo pipefail
          proceed="$PROCEED"; level="$LEVEL"; reason="$REASON"; mode=full; scope=''; elevated=false

          # A bot's PR: only on a bot's request, and only its trailered
          # commits when it has any.
          if [ "$proceed" = "true" ] && [ "$KIND" != human ]; then
            case "$SENDER" in
              *'[bot]')
                re=$(printf '%s' "$TRAILERS" | tr -s ' ' '|')
                scope=$(gh api "/repos/$REPO/compare/$BASE...$HEAD?per_page=100" --paginate \
                          | jq -r --arg re "(^|\n)($re): " '.commits[] | select(.commit.message | test($re)) | .sha' | tr '\n' ' ')
                scope="${scope% }"
                [ -z "$scope" ] || { mode=scoped; reason="the commits carrying $TRAILERS"; } ;;
              *) proceed=false; reason="bot author, and the request did not come from a bot" ;;
            esac
          fi

          if [ "$proceed" = "true" ]; then
            files="$FILES"
            if [ -z "$files" ]; then
              proceed=false; reason="no changed files"
            elif [ "$DOCS_ONLY" = "true" ]; then
              proceed=false; reason="docs only"
            fi
          fi

          if [ "$proceed" = "true" ]; then
            # Collapse the multi-line default into one ERE before matching.
            pattern=$(printf '%s' "$SENSITIVE" | tr -d '[:space:]')
            if printf '%s\n' "$files" | grep -qiE "$pattern"; then
              level="$ELEVATED"; reason="sensitive paths touched"; elevated=true
            fi
            if printf '%s' "$LABELS" | grep -q '"sec:'; then
              level="$ELEVATED"; reason="sec: label"; elevated=true
            fi
          fi

          {
            echo "proceed=$proceed"
            echo "mode=$mode"
            echo "scope=$scope"
            echo "level=$level"
            echo "elevated=$elevated"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "decision: proceed=$proceed mode=$mode level=$level ${reason:+($reason)}"

      # Why CI failed, gathered deterministically and handed to the reviewer, so
      # it reviews the actual problem rather than the diff in the abstract.
      # Kept to ONE LINE: the value is interpolated into a shell-style argument,
      # so a newline or a quote takes the whole step with it.
      - id: ci
        if: steps.level.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ github.event.pull_request.head.sha }}
        run: |
          # Steps run as `bash -e {0}` and `set -uo pipefail` does not clear
          # `-e`. This step must report rather than fail, hence `set +e`.
          set +e
          set -uo pipefail
          runs=$(gh api "/repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                 --jq '[.check_runs[] | {name, conclusion, id}]' 2>/dev/null || echo '[]')
          failed=$(jq -c '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")]' <<<"$runs")
          n=$(jq 'length' <<<"$failed" 2>/dev/null || echo 0)

          if [ "${n:-0}" = "0" ]; then
            echo "summary=CI on this PR is green." >> "$GITHUB_OUTPUT"
            echo "no failing checks"; exit 0
          fi

          out="CI on this PR is FAILING ($n check(s))."
          for id in $(jq -r '.[].id' <<<"$failed"); do
            name=$(jq -r --argjson i "$id" '.[]|select(.id==$i)|.name' <<<"$failed")
            # Annotations are often just "Process completed with exit code 1",
            # so pass the run id and let the reviewer fetch the real log.
            runid=$(gh api "/repos/$REPO/check-runs/$id" \
                    --jq '.details_url | capture("/runs/(?<r>[0-9]+)") | .r' 2>/dev/null || echo "")
            out="$out  ||  CHECK '$name'"
            [ -n "$runid" ] && out="$out (run $runid)"
            out="$out:"
            ann=$(gh api "/repos/$REPO/check-runs/$id/annotations" \
                  --jq '.[] | "\(.path):\(.start_line) \(.annotation_level) \(.message)"' 2>/dev/null \
                  | head -8 | tr '\n' ' ' | tr -d '"' | cut -c1-700)
            [ -n "$ann" ] && out="$out $ann"
          done
          out="$out  ||  Annotations are often just 'Process completed with exit code 1'. Fetch the real output with: gh run view <run id> --log-failed"

          # Collapse to one line and drop quotes, so it survives interpolation.
          out=$(printf '%s' "$out" | tr '\n' ' ' | tr -d '"\r' | cut -c1-3000)
          echo "summary=$out" >> "$GITHUB_OUTPUT"
          echo "collected $n failing check(s)"

      # Only when the run above is still proceeding: a draft, a bot PR or a
      # docs-only diff picks no runner. `steps.level`, not
      # `steps.gate`, is the last step that can still say no -- it narrows the
      # gate's own verdict further (no changed files, docs only).
      - id: pick
        if: steps.level.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.44.3
        with:
          weight:             ${{ inputs.runner-weight }}
          labels:             ${{ inputs.runner-labels }}

  review:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.gate.outputs.runner) }}
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.3
        with:
          selector: ${{ needs.gate.outputs.runner }}

      # Credentials persist here on purpose: the review agent works in this
      # checkout and may fetch from it.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scoped commits' diff and messages, for the scoped prompt.
      - if: needs.gate.outputs.mode == 'scoped'
        env:
          SCOPE: ${{ needs.gate.outputs.scope }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # the commit list splits into words on purpose
          git show --format='commit %H%n%B' --stat --patch $SCOPE > "$RUNNER_TEMP/scoped.diff"
          # shellcheck disable=SC2086
          git log --no-walk --format='%H %s%n%(trailers)' $SCOPE > "$RUNNER_TEMP/scoped.log"

      # Stamped before the agent, so the inline count below asks "did THIS run
      # post" rather than "has anything ever posted".
      - id: since
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Opus: judging whether a change is correct is the expensive half of this
      # job.
      #
      # `--comment` unlocks the plugin's steps 8 and 9, which are the only place
      # INLINE comments come from, and the tool in the allowlist is what lets the
      # action start that MCP server. Both are needed for inline comments. Neither
      # is what makes this job report, so do not read a missing verdict as one of
      # them being gone.
      #
      # The SUMMARY does not come from the agent's own posting. The agent writes a
      # file and a later step posts it, the same contract deps-verify uses. The
      # plugin is written to be silent, and it is right to be: its step 1 stops the
      # whole run when it judges a pull request not worth reviewing, and a run that
      # stops there posts nothing at all. Telling it in the system prompt to always
      # post did not hold. A file the job requires does.
      - id: agent
        uses: dodi-smart/.github/actions/run-agent@pinned/v1.44.3
          # Two prompts, one step. `full` runs the code-review plugin on opus over
          # the whole pull request. `scoped` reviews a handful of automation
          # commits from a precomputed diff, which sonnet and a plain prompt do
          # well and the plugin's whole-PR agents would only dilute.
          # The slash command expands as the plugin wrote it; the lines after it
          # are read too, and win where they disagree with it.
        env:
          FULL_PROMPT: |
                /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

                Four rules for this run, which override the command above wherever they disagree with it.

                Write your verdict to ${{ runner.temp }}/review-body.md before you finish. Write it on
                every path: when you found issues, when you found none, and when you decided this pull
                request did not need reviewing and stopped early. In that last case say so and say why,
                because that is a real answer and silence is not. A later step posts that file to the
                pull request as one comment, and this job FAILS when the file is missing or empty.
                Your final message goes only to the job summary, which nobody reads, so anything you
                leave out of the file is lost. Do not open the file with a heading, one is added for you.

                Do not post the summary comment yourself. Inline comments on the diff are yours to post
                and are still wanted. The summary is not, because the step that posts the file rewrites
                one comment per pull request, and a second copy from you stacks underneath it.

                Review for more than bugs. The command's list of false positives says general security
                and quality issues do not count unless CLAUDE.md names them. That rule does not apply
                here. Alongside the command's own agents, run three more with the same scoring and the
                same 80 cutoff, and report what survives:
                security, on the changed code and what it now reaches: injection, missing or weakened
                authorization, secrets or tokens in code or logs, unsafe deserialization or eval,
                SSRF and open redirects, weakened RLS or grants, unvalidated input at a boundary, and
                CI or workflow changes that widen permissions or trust;
                performance, where the change plausibly runs at scale: N+1 or unbounded queries, missing
                indexes for new access paths, work moved onto the request path or into a render, cache
                invalidation gaps, and client bundles that grew or lost a server boundary;
                practices, judged against the repo's own conventions: error handling that swallows
                failure, behaviour added without a test where the repo's CLAUDE.md sets a minimum,
                duplicated logic that an existing helper already covers, and public surface without
                input validation.
                Pre-existing problems on untouched lines stay out unless the change makes them worse.

                Also write ${{ runner.temp }}/review-verdict.json, on every path, as exactly:
                  {"verdict": "approve" | "changes", "blocking": [{"path": "<file>", "line": <n>, "summary": "<one line>"}]}
                `blocking` lists only findings that must be fixed before merging, the ones you would
                not merge with. `approve` means you would merge as it is, and its `blocking` is
                empty. When you stopped early because the change needs no review, that is `approve`
                with an empty list.

                Keep the verdict short. Shape it as: one line saying merge, fix first, or nothing found;
                then one line per finding, path:line first, severity in one word, then what breaks and
                the fix. At most 200 words in total. Detail belongs in the inline comment on the line,
                not here. A verdict nobody finishes reading is a verdict nobody acts on.
          SCOPED_PROMPT: |
                Review ONLY these commits on pull request #${{ github.event.pull_request.number }} in
                ${{ github.repository }}: ${{ needs.gate.outputs.scope }}. Automation wrote them on top
                of another bot's change. Their diff is in ${{ runner.temp }}/scoped.diff and their messages
                in ${{ runner.temp }}/scoped.log. Do not review anything else on the branch.

                For each commit: is it a correct, smallest change for what its message says, with no
                unrelated edit? For each trailer that names a version bump (`<name> <from> -> <to>`),
                check that the upstream release notes really require that version, and say which note.
                Run the repo's checks only when you cannot judge a change by reading it.

                Write ${{ runner.temp }}/review-body.md, the comment: one line saying merge or fix first,
                then one line per finding, path:line first, then what breaks and the fix. At most 120 words.
                Do not open it with a heading.

                Write ${{ runner.temp }}/review-verdict.json as exactly:
                  {"verdict": "approve" | "changes", "blocking": [{"path": "<file>", "line": <n>, "summary": "<one line>"}]}
                `blocking` lists only what must be fixed before merging. `approve` has an empty list.

                Do not post comments, approve, merge or push.
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          stage:   review
          signals: ${{ needs.gate.outputs.mode }} ${{ needs.gate.outputs.elevated == 'true' && 'elevated' || '' }}
          model-pin: ${{ vars.AGENT_MODEL_PIN }}
          org-plugins:             ${{ vars.AGENT_PLUGINS }}
          org-plugin-marketplaces: ${{ vars.AGENT_PLUGIN_MARKETPLACES }}
          agent-env:               ${{ vars.AGENT_ENV }}
          agent-env-secret:        ${{ secrets.AGENT_ENV_SECRET }}
          prompt: ${{ needs.gate.outputs.mode == 'scoped' && env.SCOPED_PROMPT || env.FULL_PROMPT }}
          # A bot's PR is labelled by the org App, and claude-code-action
          # refuses a bot actor it is not told about. The gate has already
          # decided which bot PRs get here.
          allowed-bots: ${{ endsWith(github.actor, '[bot]') && github.actor || '' }}
          additional-permissions: |
            actions: read
          plugin-marketplaces: ${{ needs.gate.outputs.mode != 'scoped' && 'https://github.com/anthropics/claude-code.git' || '' }}
          plugins: ${{ needs.gate.outputs.mode != 'scoped' && 'code-review@claude-code-plugins' || '' }}
          report-file:     ${{ runner.temp }}/review-verdict.json
          report-valid:    '(.verdict | IN("approve", "changes")) and ((.blocking // []) | type == "array")'
          report-fallback: '{"verdict": "changes", "blocking": []}'
          # The org default plus the inline-comment tool. Variadic, space
          # separated. See the run-agent header before changing the shape.
          allowed-tools: 'Bash "Bash(gh:*)" Read Grep Glob mcp__github_inline_comment__create_inline_comment'
          # The last clause pushes back on the plugin's first step, which stops
          # the whole run when Claude has already commented or the change looks
          # trivial. This workflow only runs because someone asked for it. Treat
          # the clause as a nudge and nothing more: on this workflow's first real
          # run the agent stopped there anyway. What guarantees a report is the
          # file the prompt requires, not this sentence.
          append-system-prompt: >-
            ${{ needs.gate.outputs.ci }}
            Review depth for this run is ${{ needs.gate.outputs.level }}. At low or medium report only what you are confident in. At high, xhigh or max look harder, but report the same way: more certainty, not more words. Mark an uncertain finding with one word, "uncertain", and move on.
            When CI is failing, diagnose the cause and say which change caused it and how to fix it. Lead with that. It is more useful than anything else you could report. Do not repeat a failure the annotations already state verbatim, explain it.
            Length is a budget, not a target. The summary you write to the verdict file is at most 200 words. Each finding is one line: path:line, then what breaks and the fix, in one sentence each. No reproduction transcripts, no quoted source, no tables of evidence, no history of what you checked. Put evidence in the inline comment on the line it concerns, once, and keep that to a few sentences with at most one short code block. If you have nothing to report, say so in one sentence. Never restate what the pull request description already says. Plain words: a reader who has to act on this today should not need to decode it.
            A comment you left on this pull request earlier is not a reason to stop, and neither is the diff looking small or obviously correct. Somebody asked for this run by hand. Review it again, and always report the outcome, including when the outcome is that you found nothing.


      # How many inline comments this pass left, for the verdict to mention. It
      # gates nothing: the verdict below is what makes this job pass or fail.
      #
      # Counted by type, not by login. Matching a login containing "claude" was
      # wrong even while it worked. claude-code-action posts inline comments
      # under whichever app minted its token, and this workflow already declares
      # GH_APP_CLIENT_ID and GH_APP_PRIVATE_KEY. The day someone wires those
      # through, every comment arrives from the org's own app, whose login has no
      # "claude" in it, and every review would report zero.
      #
      # `.user.type == "Bot"` is safe on THIS endpoint: it returns review
      # comments anchored to diff lines, and nothing else writes those during a
      # run. Coverage and lint reporters comment on the issue endpoint instead.
      - id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
          SINCE:    ${{ steps.since.outputs.at }}
        run: |
          set -euo pipefail
          # Piped through jq rather than `gh api --jq`, which takes no --arg.
          # `created_at`, not `updated_at`: an older comment edited during this
          # window is not something this pass published.
          inline=$(gh api "/repos/$REPO/pulls/$PR/comments?per_page=100" --paginate \
            | jq --arg s "$SINCE" \
                 '[.[] | select(.user.type == "Bot") | select(.created_at >= $s)] | length')
          echo "inline=$inline" >> "$GITHUB_OUTPUT"
          echo "published: $inline inline comment(s)"

      # One comment per pull request, rewritten by each pass. The agent's own
      # INLINE comments are left alone: they are anchored to diff lines, GitHub
      # collapses them when the line changes, and rewriting a review thread out
      # from under a reader is worse than a longer page.
      #
      # The body is the file the agent wrote. When that file is missing, this
      # still builds a verdict saying so and the sticky comment still posts it,
      # because a broken pass has to be readable from the pull request rather
      # than only from the run log. The step after the posting is what fails.
      - id: verdict
        name: Build the verdict
        env:
          LEVEL:  ${{ needs.gate.outputs.level }}
          REASON: ${{ needs.gate.outputs.reason }}
          SHA:    ${{ github.event.pull_request.head.sha }}
          INLINE: ${{ steps.posted.outputs.inline }}
          RAN:    ${{ steps.agent.outputs.execution-file }}
          RUN:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/review-body.md"

          # Fallback: the agent finished (run-agent handed back an execution
          # file) but never wrote the verdict file. Its final message is still
          # in that file as the `result` entry, and it is the same verdict the
          # prompt asked for, so recover it rather than post "wrote no review"
          # and fail a pass that did the work. Recovery is labelled, so a
          # reader can tell it from the intended path.
          recovered=false
          if [ ! -s "$body" ] && [ -n "$RAN" ] && [ -s "$RAN" ]; then
            if jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$RAN" > "$body.recovered" 2>/dev/null \
               && [ -s "$body.recovered" ]; then
              {
                echo "_Recovered from the agent's final message: it did not write its verdict file. Same content, different path._"
                echo
                cat "$body.recovered"
              } > "$body"
              recovered=true
            fi
          fi

          {
            echo "### Agent review"
            echo
            if [ -s "$body" ]; then
              cat "$body"
            elif [ -z "$RAN" ]; then
              echo "**The agent never ran.** claude-code-action skipped itself and reported success."
              echo
              echo "It does that when a pull request changes any workflow file, because it requires the file to match the default branch byte for byte. That is a real security control, not a fault in this pull request, and nothing can be reviewed until the change lands on the default branch."
            else
              echo "**The agent wrote no review.** That is a bug in this workflow, not a clean bill of health."
            fi
            echo
            if [ "$INLINE" -gt 0 ]; then
              echo "Left $INLINE inline comment(s) on the diff."
              echo
            fi
            echo "Reviewed \`${SHA:0:7}\` at depth \`$LEVEL\`${REASON:+ ($REASON)}. [Run]($RUN)."
            echo
            echo "Apply \`agent:review\` again for another pass. The label is cleared when this finishes, so re-applying it is a fresh request."
          } > "$RUNNER_TEMP/review-verdict.md"

          [ -s "$body" ] && wrote=true || wrote=false
          echo "wrote=$wrote" >> "$GITHUB_OUTPUT"
          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"
          [ "$recovered" = "true" ] && echo "::warning title=Verdict recovered from the agent's final message::The agent did not write review-body.md; its final message was posted instead. Check that the prompt still asks for the file."
          cat "$RUNNER_TEMP/review-verdict.md"

      - uses: dodi-smart/.github/actions/sticky-comment@pinned/v1.44.3
        with:
          key:       pr-review
          number:    ${{ github.event.pull_request.number }}
          body-file: ${{ runner.temp }}/review-verdict.md

      # The machine-readable verdict, normalized here from the agent's file and
      # never trusted as written: anything but a well-formed approve with no
      # blocking finding is `changes`, and a missing file is `changes` with the
      # reason as its one blocking entry. Fail closed, because a consumer merges
      # on `approve`.
      - id: decide
        if: always() && steps.agent.outcome != 'cancelled'
        env:
          RAW:   ${{ runner.temp }}/review-verdict.json
          OUT:   ${{ runner.temp }}/review-verdict/review-verdict.json
          SHA:   ${{ github.event.pull_request.head.sha }}
          MODE:  ${{ needs.gate.outputs.mode }}
          WHY:   ${{ steps.agent.outputs.why }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          # run-agent guarantees the file, with a `why` when it wrote it. One
          # pass reads the verdict word, the blocking list and that `why`.
          { read -r verdict; read -r blocking; read -r why; } < <(jq -r '(.verdict // ""),
              ([(.blocking // [])[] | {path: (.path // ""), line: (.line // 0), summary: ((.summary // "") | tostring)}] | tojson),
              (.why // "")' "$RAW" 2>/dev/null || printf '\nnull\n\n')
          # Only a clean approve is approve.
          if [ "$verdict" != approve ] || [ "${blocking:-null}" != '[]' ]; then verdict=changes; fi
          if [ "${blocking:-null}" = null ] || [ "$blocking" = '[]' ] && [ "$verdict" = changes ]; then
            blocking=$(jq -nc --arg s "${why:-${WHY:-The review asked for changes without naming one.}}" '[{path: "", line: 0, summary: $s}]')
          fi
          jq -n --arg v "$verdict" --argjson b "$blocking" --arg sha "$SHA" --arg mode "$MODE" \
            '{verdict: $v, blocking: $b, sha: $sha, mode: $mode}' > "$OUT"
          n=$(jq 'length' <<<"$blocking")
          {
            echo "verdict=$verdict"
            [ "$verdict" = approve ] && echo "description=Approved" || echo "description=Changes requested: $n blocking"
          } >> "$GITHUB_OUTPUT"
          cat "$OUT"

      - if: always() && steps.decide.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: review-verdict
          path: ${{ runner.temp }}/review-verdict/review-verdict.json
          retention-days: 30

      # The commit status needs `statuses: write`. Asking for it here would fail
      # every caller that does not grant it at startup, so the org App posts it.
      # An App without that permission, or no App at all, leaves a warning and
      # no status, which every consumer reads as "not approved".
      - id: status-token
        if: always() && steps.decide.outcome == 'success'
        uses: dodi-smart/.github/actions/app-token@pinned/v1.44.3
        with:
          client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permissions: statuses:write

      - name: Publish the review / verdict status
        if: always() && steps.decide.outcome == 'success'
        env:
          GH_TOKEN:    ${{ steps.status-token.outputs.token }}
          REPO:        ${{ github.repository }}
          SHA:         ${{ github.event.pull_request.head.sha }}
          VERDICT:     ${{ steps.decide.outputs.verdict }}
          DESCRIPTION: ${{ steps.decide.outputs.description }}
          RUN:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=No review status::GH_APP_CLIENT_ID is not set, so review / verdict was not published."
            exit 0
          fi
          state=failure; [ "$VERDICT" = approve ] && state=success
          if gh api -X POST "/repos/$REPO/statuses/$SHA" -f state="$state" -f context='review / verdict' \
               -f description="$DESCRIPTION" -f target_url="$RUN" --silent; then
            echo "review / verdict: $state on $SHA"
          else
            echo "::warning title=No review status::The org App could not post review / verdict. It needs the Commit statuses: write permission."
          fi

      # A review that produced nothing is a failed review and must look like one.
      # Checked AFTER the verdict is posted, so the pull request carries the
      # explanation rather than only the run log.
      #
      # This asks whether the agent WROTE its verdict, not whether some comment
      # by some login appeared on the pull request. The old question could not be
      # answered from outside: an agent that decides a pull request needs no
      # review is silent on purpose and looks identical to one whose posting is
      # broken. The file removes the guesswork.
      - name: The review reached the pull request
        if: steps.verdict.outputs.wrote != 'true'
        env:
          RAN: ${{ steps.agent.outputs.execution-file }}
        run: |
          if [ -z "$RAN" ]; then
            echo "::error title=The agent never ran::claude-code-action skipped itself and reported success. It does that when a pull request changes a workflow file, which must match the default branch byte for byte. Nothing here can be reviewed until the change lands on the default branch."
          else
            echo "::error title=The agent wrote no review::The agent ran but left ${RUNNER_TEMP}/review-body.md missing or empty. The prompt asks for that file on every path, including when the agent decides the pull request needs no review. Check that the prompt still asks for it and that it still names the same path the verdict step reads."
          fi
          exit 1

      # `agent:review` is a REQUEST, never a record. Adding a label already
      # present emits no `labeled` event, so leaving it on is why asking twice
      # did nothing. Removing it with github.token cannot loop, because GitHub
      # starts no workflow run from GITHUB_TOKEN activity.
      - name: Clear the request label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Percent-encoded: the colon is part of the label name, not a path
          # separator, and it reaches the API as a single segment either way.
          if gh api -X DELETE "/repos/$REPO/issues/$PR/labels/agent%3Areview" --silent 2>/dev/null; then
            echo "removed agent:review, apply it again to request another pass"
          else
            echo "agent:review was not on this PR"
          fi
