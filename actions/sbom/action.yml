# CycloneDX SBOM of the checkout, attached to each GitHub release a run just cut.
# Thin wrapper; the reasoning is in sbom.sh, the installs in install.sh.
name: SBOM
description: Build a CycloneDX SBOM of the checkout (a Gradle build's resolved graph, plus every lockfile syft reads) and attach it to the GitHub release of each new tag. Never fails the job.

inputs:
  tags:
    description: JSON array of the tags the run cut, as `release.yml`'s detect step writes them. Empty or `[]` does nothing.
    default: '[]'
  exclude:
    description: >-
      Extra globs to leave out of the syft scan, newline-separated, on top of the
      built-in list (dependency and build output directories). Relative to the
      checkout, e.g. `./fixtures/**`.
    default: ''
  repository:
    description: 'owner/repo'
    default: ${{ github.repository }}
  token:
    description: 'Token to upload release assets with. Needs contents: write.'
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # The generators are installed inside, only the ones the checkout needs.
    - shell: bash
      env:
        TAGS:        ${{ inputs.tags }}
        EXCLUDE:     ${{ inputs.exclude }}
        REPO:        ${{ inputs.repository }}
        GH_TOKEN:    ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/sbom.sh"'
