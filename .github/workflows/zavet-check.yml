# Reusable: verify a repo's .zavet/ knowledge layer on a pull request.
#
# Local git hooks alone hold only as long as every contributor has them
# installed and never passes --no-verify. Without this, a decision check can rot
# for months with nothing failing.
#
# SEVERITY MIRRORS THE LOCAL HOOKS, deliberately:
#
#   decision checks   FAIL   (a decision that no longer holds is wrong, not stale)
#   guard trailers    FAIL   (the commit-msg hook blocks locally; so does this)
#   spec currency     WARN   (the pre-commit hook is warn-only and always exits 0)
#
# Inverting either of those makes CI disagree with the hooks, and then people
# learn to distrust one of them.
#
# Some decision checks reach the GitHub API on purpose, because a decision
# about a file in another repo should be verified rather than asserted. So this
# workflow needs a token and network.
name: Zavet Check

on:
  workflow_call:
    inputs:
      checks: { type: boolean, default: true }   # run every decision's `checks:`
      guards: { type: boolean, default: true }   # require trailers on guarded paths
      audit:  { type: boolean, default: false }  # report-only health sweep
      zavet-dir:     { type: string, default: ".zavet" }
      runner-weight: { type: string, default: "light" }
      runner-labels: { type: string, default: "" }
      yq-version:    { type: string, default: "v4.53.3" }

      # The toolchain the decision checks THEMSELVES run on. Default `none` suits
      # a repo whose checks are plain shell. A check that shells out to a test
      # runner or a build tool needs its stack here, or the command is not found
      # and the job reports a decision that stopped holding when in fact nothing
      # ran. Same input and same values as pr-checks.
      stack:   { type: string, default: "none" }
      # `@stack` installs dependencies the conventional way for that stack, which
      # is what a check running a test file needs. Set to "" for a stack whose
      # tooling resolves on demand.
      install: { type: string, default: "@stack" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "latest" }
      java-version:    { type: string, default: "21" }
      flutter-version: { type: string, default: "" }
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  pick-runner:
    uses: dodi-smart/.github/.github/workflows/pick-runner.yml@v1
    with:
      weight: ${{ inputs.runner-weight }}
      labels: ${{ inputs.runner-labels }}
    secrets: inherit

  check:
    needs: [pick-runner]
    runs-on: ${{ fromJson(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: present
        env:
          DIR: ${{ inputs.zavet-dir }}
        run: |
          set -euo pipefail
          if [ -d "$DIR" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no $DIR/ in this repository, nothing to check"
          fi

      # mikefarah yq specifically. zavet reads decision frontmatter with it,
      # and the python `yq` of the same name takes different arguments. An
      # easy and confusing way for every check to report NONE.
      - if: steps.present.outputs.yes == 'true'
        env:
          YQ: ${{ inputs.yq-version }}
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null || ! yq --version 2>&1 | grep -q mikefarah; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/${YQ}/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      # Installed before the checks run, because a decision's `checks:` command is
      # arbitrary and usually belongs to the repo's own toolchain. `none` is a
      # real value here, so this runs unconditionally and the env file below is
      # always written; a conditional setup would give the step two code paths
      # and one of them would rot.
      - id: setup
        if: steps.present.outputs.yes == 'true' && inputs.checks
        uses: dodi-smart/.github/actions/setup-stack@v1
        with:
          stack:           ${{ inputs.stack }}
          isolate:         false
          cache:           auto
          install:         ${{ inputs.install }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          java-version:    ${{ inputs.java-version }}
          flutter-version: ${{ inputs.flutter-version }}

      - name: Install dependencies for the decision checks
        if: steps.present.outputs.yes == 'true' && inputs.checks && steps.setup.outputs.install != ''
        run: |
          set -euo pipefail
          . "${{ steps.setup.outputs.env-file }}"
          ${{ steps.setup.outputs.install }}

      - id: checks
        if: steps.present.outputs.yes == 'true' && inputs.checks
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ inputs.zavet-dir }}
          ENV_FILE: ${{ steps.setup.outputs.env-file }}
        run: |
          # `set +e` is REQUIRED and must come first.
          #
          # GitHub runs every `run:` step as `bash -e {0}`. `set -uo pipefail`
          # does NOT clear `-e`, so `out=$(...); rc=$?` aborted the step at
          # the assignment with the runner's exit code, before printf ever ran.
          # The result was a failed check with NO diagnostic output at all, which
          # is the exact failure mode this whole standard exists to eliminate.
          set +e
          set -uo pipefail

          # `zavet verify` is the runner. It prints one "FAIL<TAB>id<TAB>label"
          # row per broken check, which is what the annotation grep below reads,
          # and exits 1 if any failed. This step used to invoke `$DIR/check.sh`,
          # a script the tool has never shipped, so it could only ever have
          # worked in a repo that wrote one by hand.
          #
          # A missing runner is NOT a passing check, and it is not the same event
          # as a check that ran and failed. Without the guard the step exited 127
          # from bash's own "No such file or directory", surfacing as a bare
          # "Process completed with exit code 127" naming nothing. A reader then
          # goes looking for the decision that broke, and there isn't one.
          #
          # Severity splits on whether anything was actually meant to run:
          # a knowledge layer carrying no `checks:` at all has nothing to verify,
          # while one that declares them and cannot run them is unverified, which
          # fails closed like any other unmet check.
          zavet="$DIR/bin/zavet"
          if [ ! -x "$zavet" ]; then
            declared=$(grep -rlE '^checks:' "$DIR/decisions" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$declared" -eq 0 ]; then
              echo "::notice::$zavet not present or not executable, and no decision declares checks:. Nothing to run."
              exit 0
            fi
            echo "::error title=Decision checks could not run::$zavet is not present or not executable, but $declared decision(s) declare checks:. Those checks are unverified. The CLI is vendored into the repo, so commit it."
            { echo "### Decision checks"; echo "Could not run: \`$zavet\` is missing or not executable, while $declared decision(s) declare \`checks:\`."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # setup-stack always writes this, so the guard is for the case where
          # that step itself failed and left the output empty. The directive
          # below is required, because the path is only known at run time and
          # SC1090 is an error here. Keep any prose above it from starting a
          # line with the linter's name, or that line parses as a directive too.
          # shellcheck source=/dev/null
          [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ] && . "$ENV_FILE"
          out=$("$zavet" verify 2>&1); rc=$?
          printf '%s\n' "$out"
          # 127 is bash for "command not found". Reported apart from a real
          # failure, because the fix is a missing toolchain and not a decision
          # that stopped holding. `stack:` on this workflow is what supplies it.
          if [ "$rc" -eq 127 ]; then
            echo "::error title=Decision check could not run::a check exited 127, command not found. Set the 'stack' input to the toolchain these checks need."
          fi
          {
            echo "### Decision checks"
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| true` is the point, not decoration. With zero failures this grep
          # matches nothing and exits 1, which under `-e` killed the step, so the
          # job failed precisely BECAUSE every check had passed. The step's verdict
          # is $rc from the runner, never the annotation pass.
          printf '%s\n' "$out" | grep -E '^\s*FAIL' | while read -r line; do
            echo "::error title=Decision check failed::$line"
          done || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Guards are per-commit: the trailer belongs to the commit that touched
      # the guarded path, so checking the squashed diff would let one trailer
      # cover changes it never described.
      - id: guards
        if: steps.present.outputs.yes == 'true' && inputs.guards && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          DIR:  ${{ inputs.zavet-dir }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e            # see the checks step: GitHub's `bash -e` would abort early
          set -uo pipefail
          zavet="$DIR/bin/zavet"
          if [ ! -x "$zavet" ]; then
            echo "::notice::$zavet not present or not executable, skipping guard check"
            exit 0
          fi
          blocked=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            # Merge commits touch paths their author never edited.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip (merge) $sha $subject"; continue
            fi
            git show --name-only --format= "$sha" > "$RUNNER_TEMP/paths.txt"
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if reason=$("$zavet" gate --paths-from "$RUNNER_TEMP/paths.txt" \
                          --message-file "$RUNNER_TEMP/msg.txt" --guards-only 2>&1); then
              echo "ok   $sha $subject"
            else
              blocked=1
              echo "::error title=Guarded change without a trailer::$sha $subject: $reason"
              { echo "### Guard wall"; echo "- \`$sha\` $subject"; echo "  - $reason"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$blocked"

      - id: audit
        if: steps.present.outputs.yes == 'true' && inputs.audit
        continue-on-error: true
        env:
          DIR: ${{ inputs.zavet-dir }}
        run: |
          set +e            # see the checks step
          set -uo pipefail
          out=$("$DIR/bin/zavet" audit 2>&1 || true)
          printf '%s\n' "$out"
          { echo "### Audit (report only)"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # One comment, updated in place. A new comment per push turns a useful
      # signal into something people collapse and stop reading.
      - if: always() && steps.present.outputs.yes == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM:  ${{ github.event.pull_request.number }}
          CHECKS: ${{ steps.checks.outcome }}
          GUARDS: ${{ steps.guards.outcome }}
        run: |
          set +e            # see the checks step
          set -uo pipefail
          marker="<!-- zavet-check -->"
          status() { case "$1" in success) echo "passed";; skipped) echo "skipped";; *) echo "**FAILED**";; esac; }
          body="$marker
          **Knowledge layer**

          | Check | Result |
          |---|---|
          | Decision checks | $(status "$CHECKS") |
          | Guard trailers | $(status "$GUARDS") |

          Spec currency is reported in the job summary and never fails a build, the same severity the local pre-commit hook uses."

          id=$(gh api "/repos/$REPO/issues/$NUM/comments" --paginate \
                --jq "[.[] | select(.body | startswith(\"$marker\"))] | .[0].id" 2>/dev/null || echo "")
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "/repos/$REPO/issues/$NUM/comments" -f body="$body" >/dev/null
          fi

      - name: Fail if a decision check or guard failed
        if: always() && steps.present.outputs.yes == 'true'
        env:
          CHECKS: ${{ steps.checks.outcome }}
          GUARDS: ${{ steps.guards.outcome }}
        run: |
          set -euo pipefail
          # `if` over `[ x ] && y` for legibility, and the values are echoed
          # because "knowledge-layer checks failed" alone does not say WHICH.
          # (For the record, `[ x ] && y` was NOT the bug. bash's `set -e` does
          # not exit on it. The real cause was the annotation grep above.)
          if [ "$CHECKS" = "failure" ] || [ "$GUARDS" = "failure" ]; then
            echo "knowledge-layer checks failed (checks=$CHECKS guards=$GUARDS)"
            exit 1
          fi
          echo "knowledge layer is consistent (checks=$CHECKS guards=$GUARDS)"
