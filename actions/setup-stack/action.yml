# Install a toolchain, and decide where its package cache lives.
#
# Stack is a VALUE, so it is an input rather than one caller template per stack.
# Five stacks across three workflows would otherwise be fifteen files to keep in
# agreement, and the Gradle one had already grown a product-specific task name.
#
# Cache modes, resolved below:
#
#   isolate=true             -> RUNNER_TEMP dirs, GitHub cache off (deps-verify)
#   self-hosted Linux ARM64  -> isolated anyway; matches no runner today, and is
#                               kept because it describes a class of machine
#   self-hosted Linux X64    -> home dirs, GitHub cache off; the named volume
#                               the runner image mounts IS the cache
#   self-hosted macOS        -> home dirs, and cache=auto becomes true: the
#                               runners are image-based VMs that start every job
#                               with an empty home, so no volume backs anything
#   github-hosted            -> home dirs, and cache=auto becomes true
#
# Two rules that are easy to undo by accident:
#
#   PUB_CACHE is job-scoped in EVERY mode. A home dir is only worth using if a
#   named volume backs it, and the image mounts none for ~/.pub-cache.
#
#   Hosted GitHub cache is ONE mechanism per stack (setup-gradle / rust-cache /
#   flutter-action). Never a package store, and never restore-keys on one, which
#   is how a poisoned entry reimports. The one extra cache, ~/.konan, is a
#   toolchain download (Kotlin/Native's LLVM), not a store: exact key, no restore-keys.
name: Setup stack
description: Install the toolchain for a stack and resolve its package-cache mode.

inputs:
  stack:
    description: 'bun | node | gradle | android | flutter | rust | xcode | none'
    required: true
  node-version:
    description: 'For stack=node, and for semantic-release on any stack'
    default: '24'
  bun-version:
    description: >-
      For stack=bun. `auto` (or empty) takes the repo's own pin, in this order:
      package.json `packageManager` (bun@x.y.z), .bun-version, .tool-versions,
      mise.toml, .mise.toml, and falls back to latest with a notice when none
      names bun. Any explicit version, `latest` included, is used as given.
      Needs the repo checked out first.
    default: 'auto'
  java-version:
    description: 'For gradle/android/flutter. Empty skips the JDK on flutter.'
    default: '21'
  flutter-version:
    description: 'For stack=flutter. Empty takes the channel head.'
    default: ''
  flutter-channel:
    description: 'For stack=flutter'
    default: 'stable'
  rust-toolchain:
    description: 'For stack=rust: stable, nightly, a version such as 1.89.0, or any rustup toolchain specifier'
    default: 'stable'
  rust-components:
    description: 'For stack=rust, e.g. "clippy, rustfmt"'
    default: 'clippy, rustfmt'
  xcode-version:
    description: 'For stack=xcode. Empty takes the runner default.'
    default: ''
  isolate:
    description: >-
      Pin package caches to RUNNER_TEMP and disable GitHub cache. Forced on for
      self-hosted Linux ARM64. Default false: X64 self-hosted uses home dirs
      backed by named volumes, hosted and macOS self-hosted use home dirs plus
      the toolchain cache actions. PUB_CACHE is job-scoped either way.
    default: 'false'
  cache:
    description: >-
      auto | true | false. auto becomes true on github-hosted and on self-hosted
      macOS (ephemeral VMs), and is ignored when isolated or on self-hosted
      Linux (persistent volumes are the cache there). Applies to setup-gradle /
      rust-cache / flutter-action and the Kotlin/Native toolchain cache, never bun.
    default: 'auto'

  env:
    description: >-
      Newline-separated KEY=VALUE applied to every command step the caller runs.
      Written to a sourceable file rather than $GITHUB_ENV, because GitHub
      refuses a few names there, NODE_OPTIONS among them, since it can inject
      code into node processes the runner itself spawns, and that is exactly the
      variable a Next.js build needs. Read the path from the `env-file` output
      and source it. Placeholders and build tuning only, never secrets: a value
      that must stay secret has no business in a PR build log.
    default: ''
  build-env:
    description: >-
      Same format and parser as `env`, for the build command only. Read the path
      from the `build-env-file` output and source it alone in the build step:
      it exports `env` first, then `build-env`. Kept apart from `env` so a placeholder the build needs is not
      in scope for lint and test.
    default: ''

  # Command overrides. "@stack" means the conventional command for this stack;
  # an explicit empty string means the repo has no such step. Those differ, and
  # a plain default cannot express both. Resolved here so callers read
  # `steps.setup.outputs.install` instead of reimplementing the precedence.
  install:   { description: 'Override the install command',   default: '@stack' }
  lint:      { description: 'Override the lint command',      default: '@stack' }
  typecheck: { description: 'Override the typecheck command', default: '@stack' }
  test:      { description: 'Override the test command',      default: '@stack' }
  build:     { description: 'Override the build command',     default: '@stack' }
  design-lint:
    description: >-
      Design-system lint command (e.g. `bun run lint:design` running oxlint +
      @shadcn/lint). Empty means no step. No `@stack` default: this is opt-in
      per repo.
    default: ''

outputs:
  env-file:
    description: >-
      Path to a shell file exporting the `env` input. Always written, empty when
      nothing was given, so a caller can source it unconditionally.
    value: ${{ steps.stepenv.outputs.file }}
  build-env-file:
    description: >-
      Path to a shell file exporting `env` and then `build-env`, for the build
      step alone. Always written, so a caller can source it unconditionally.
    value: ${{ steps.stepenv.outputs.build-file }}
  install:
    description: 'Resolved install command: the override, or the stack default. Empty means skip.'
    value: ${{ steps.defaults.outputs.install }}
  lint:
    description: 'Resolved lint command. Empty means skip.'
    value: ${{ steps.defaults.outputs.lint }}
  typecheck:
    description: 'Resolved typecheck command. Empty means skip.'
    value: ${{ steps.defaults.outputs.typecheck }}
  test:
    description: 'Resolved test command. Empty means skip.'
    value: ${{ steps.defaults.outputs.test }}
  build:
    description: 'Resolved build command. Empty means skip.'
    value: ${{ steps.defaults.outputs.build }}
  design-lint:
    description: 'Resolved design-lint command. Empty means skip.'
    value: ${{ steps.defaults.outputs.design-lint }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        ISOLATE: ${{ inputs.isolate }}
        CACHE: ${{ inputs.cache }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        set -euo pipefail
        case "$STACK" in
          bun|node|gradle|android|flutter|rust|xcode|none) : ;;
          *) echo "::error::unknown stack '$STACK' (expected bun|node|gradle|android|flutter|rust|xcode|none)"; exit 1 ;;
        esac
        case "$CACHE" in
          auto|true|false) : ;;
          *) echo "::error::cache must be auto, true, or false (got '$CACHE')"; exit 1 ;;
        esac

        # isolate=true, or self-hosted Linux ARM64. Deliberately not plain
        # ARM64: the macOS runners are ARM64 too and have no volumes to grow.
        do_isolate=false
        if [ "$ISOLATE" = "true" ]; then
          do_isolate=true
        elif [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] \
          && [ "${RUNNER_OS:-}" = "Linux" ] && [ "${RUNNER_ARCH:-}" = "ARM64" ]; then
          do_isolate=true
        fi

        # GitHub Actions cache: never when isolated, never on self-hosted Linux
        # (a persistent volume is the cache there). self-hosted macOS is an
        # ephemeral VM with an empty home per job, so it caches like hosted.
        # An unknown environment falls through to hosted, so a job that lands
        # on ubuntu-latest still caches.
        cache_enabled=false
        if [ "$do_isolate" != "true" ] \
          && { [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ] || [ "${RUNNER_OS:-}" = "macOS" ]; }; then
          if [ "$CACHE" = "true" ] || [ "$CACHE" = "auto" ]; then
            cache_enabled=true
          fi
        fi

        # No volume backs ~/.pub-cache and the image's LRU cap does not reach
        # it, so it is job-scoped in every mode. See the header.
        echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

        if [ "$do_isolate" = "true" ]; then
          {
            echo "BUN_INSTALL_CACHE_DIR=${RUNNER_TEMP}/bun-cache"
            echo "npm_config_cache=${RUNNER_TEMP}/npm-cache"
            # pnpm reads npm_config_* as its own config: npm_config_store_dir
            # is store-dir, npm_config_cache_dir is cache-dir. npm's `cache`
            # setting above is NOT pnpm's, so both are needed. Without them
            # an isolated job still wrote to the shared ~/.cache/pnpm store.
            echo "npm_config_store_dir=${RUNNER_TEMP}/pnpm-store"
            echo "npm_config_cache_dir=${RUNNER_TEMP}/pnpm-cache"
            # Berry derives YARN_CACHE_FOLDER/YARN_GLOBAL_FOLDER from
            # cacheFolder/globalFolder; classic reads YARN_CACHE_FOLDER.
            echo "YARN_CACHE_FOLDER=${RUNNER_TEMP}/yarn-cache"
            echo "YARN_GLOBAL_FOLDER=${RUNNER_TEMP}/yarn-global"
            echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-home"
            echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home"
          } >> "$GITHUB_ENV"
        fi

        {
          echo "isolated=$do_isolate"
          echo "cache_enabled=$cache_enabled"
        } >> "$GITHUB_OUTPUT"
        echo "stack: $STACK, isolate=$do_isolate, cache=$cache_enabled (input cache=$CACHE, env=${RUNNER_ENVIRONMENT:-unknown}/${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"

    # Resolved here rather than by setup-bun's bun-version-file, which reads one
    # file only. setup-bun takes an exact version or a range, never a leading v.
    - id: bun
      if: inputs.stack == 'bun'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: ${{ github.action_path }}/bun-version.sh "$BUN_VERSION"

    - if: inputs.stack == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun.outputs.version }}
        # The bun install cache is never uploaded to GitHub on any runner.
        # setup-bun's cache of the bun executable stays on: exact key, not a store.

    - if: inputs.stack == 'node'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # No cache: npm. Hosted cache is one mechanism per stack, and this
        # action never uploads a package store under restore-keys.

    # Needs a checkout, like bun-version. Reads files only, never runs Gradle.
    - id: gradle
      if: inputs.stack == 'gradle' || inputs.stack == 'android' || inputs.stack == 'xcode'
      shell: bash
      run: ${{ github.action_path }}/gradle-detect.sh >> "$GITHUB_OUTPUT"

    - if: (inputs.stack == 'gradle' || inputs.stack == 'android') || (inputs.stack == 'flutter' && inputs.java-version != '')
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
        # No cache: gradle. The hosted Gradle cache is setup-gradle's job.

    # xcode joins only with a gradlew and a live cache: a KMP iOS job calls
    # ./gradlew itself. setup-gradle only caches ~/.gradle and never runs Gradle,
    # so it needs no JDK here; the job's own gradlew brings whichever it uses.
    - if: >-
        inputs.stack == 'gradle' || inputs.stack == 'android'
        || (inputs.stack == 'xcode' && steps.gradle.outputs.gradle == 'true'
            && steps.resolve.outputs.cache_enabled == 'true')
      uses: gradle/actions/setup-gradle@v6
      with:
        # Publishing a build scan from a verification job leaks the dependency
        # graph of a private repo to a third party. Off unless a repo opts in.
        build-scan-publish: false
        cache-disabled: ${{ steps.resolve.outputs.cache_enabled != 'true' }}

    # ~/.konan holds Kotlin/Native's LLVM and libffi, about a minute of download
    # per job. A toolchain, not a package store, so an exact key and no
    # restore-keys: a new Kotlin version is a new entry, never a partial one.
    - if: steps.resolve.outputs.cache_enabled == 'true' && steps.gradle.outputs.kmp == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: ${{ steps.gradle.outputs.konan-key }}

    - if: inputs.stack == 'android'
      uses: android-actions/setup-android@v4

    - if: inputs.stack == 'flutter'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.flutter-channel }}
        cache: ${{ steps.resolve.outputs.cache_enabled == 'true' }}

    # A SHA of master: the action has no version tags. See AGENTS.md.
    - if: inputs.stack == 'rust'
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - if: inputs.stack == 'rust' && steps.resolve.outputs.cache_enabled == 'true'
      uses: Swatinem/rust-cache@v2

    - if: inputs.stack == 'xcode' && inputs.xcode-version != ''
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    # The caller's step environment, parsed once so every command step is a
    # one-line `source`. `env` and `build-env` go through the same script, so a
    # comment line or a value with `=` in it means the same in both.
    - id: stepenv
      shell: bash
      env:
        STEP_ENV: ${{ inputs.env }}
        BUILD_ENV: ${{ inputs.build-env }}
      run: |
        set -euo pipefail
        file="${RUNNER_TEMP}/setup-stack-env.sh"
        build_file="${RUNNER_TEMP}/setup-stack-build-env.sh"
        "${{ github.action_path }}/envfile.sh" "$file" <<< "$STEP_ENV"
        # The build file is env followed by build-env, so a build step sources
        # one file and a build-env key wins over the same key in env.
        "${{ github.action_path }}/envfile.sh" "$build_file" <<< "$STEP_ENV"$'\n'"$BUILD_ENV"
        {
          echo "file=$file"
          echo "build-file=$build_file"
        } >> "$GITHUB_OUTPUT"

    # Conventional commands per stack, so a caller that has nothing unusual to
    # say can name its stack and stop. Anything explicit wins over these.
    - id: defaults
      shell: bash
      env:
        STACK:       ${{ inputs.stack }}
        O_INSTALL:   ${{ inputs.install }}
        O_LINT:      ${{ inputs.lint }}
        O_TYPECHECK: ${{ inputs.typecheck }}
        O_TEST:      ${{ inputs.test }}
        O_BUILD:     ${{ inputs.build }}
        O_DESIGN_LINT: ${{ inputs.design-lint }}
      run: |
        set -euo pipefail
        install=""; lint=""; typecheck=""; test=""; build=""
        case "$STACK" in
          bun)
            install="bun install --frozen-lockfile"
            lint="bun run lint"; typecheck="bun run typecheck"
            test="bun run test:run"; build="bun run build" ;;
          node)
            install="npm ci"
            lint="npm run lint"; typecheck="npm run typecheck"
            test="npm test"; build="npm run build" ;;
          gradle|android)
            # Gradle resolves on demand; there is no separate install step.
            lint="./gradlew ktlintCheck"
            test="./gradlew test"; build="./gradlew assemble" ;;
          flutter)
            install="flutter pub get"
            lint="flutter analyze"
            test="flutter test"; build="flutter build apk --debug" ;;
          rust)
            lint="cargo clippy --all-targets -- -D warnings"
            typecheck="cargo check --all-targets"
            test="cargo test --all"; build="cargo build --release" ;;
          xcode)
            lint="swiftlint --strict"
            test="xcodebuild test -scheme \"\$SCHEME\" -destination 'platform=iOS Simulator,name=iPhone 15'"
            build="xcodebuild build -scheme \"\$SCHEME\"" ;;
          none) : ;;
        esac
        # "@stack" -> the conventional command above. Anything else, empty
        # string included, is taken literally.
        pick() { if [ "$1" = "@stack" ]; then printf '%s' "$2"; else printf '%s' "$1"; fi; }

        # Delimiter form, not `echo "k=v"`. A caller's command may span lines,
        # which `k=v` would write into $GITHUB_OUTPUT as if they were outputs.
        emit() {
          {
            printf '%s<<__SETUP_STACK_EOF__\n' "$1"
            printf '%s\n' "$2"
            printf '__SETUP_STACK_EOF__\n'
          } >> "$GITHUB_OUTPUT"
        }
        emit install   "$(pick "$O_INSTALL" "$install")"
        emit lint      "$(pick "$O_LINT" "$lint")"
        emit typecheck "$(pick "$O_TYPECHECK" "$typecheck")"
        emit test      "$(pick "$O_TEST" "$test")"
        emit build     "$(pick "$O_BUILD" "$build")"
        # No conventional command for any stack: this is opt-in only.
        emit design-lint "$(pick "$O_DESIGN_LINT" "")"
