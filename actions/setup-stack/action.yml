# Install a toolchain, and decide where its package cache lives.
#
# WHY THIS IS ONE ACTION AND NOT ONE TEMPLATE PER STACK
#
# The old shape was a thin-caller file per stack (deps-verify.yml,
# deps-verify.gradle.yml, ...). Five stacks across three workflows is fifteen
# files that must be kept in agreement, and the Gradle one had already grown a
# hardcoded product-specific Gradle task name — sitting in a template every other
# Gradle repo was meant to copy, where it produces a build failure whose cause is
# a different product. Stack is a VALUE, so it belongs in an input.
#
# WHY THE CACHE IS NOT ALWAYS JOB-SCOPED
#
# This action used to point every toolchain at $RUNNER_TEMP. That made named
# volumes on the X64 self-hosted pool unused, so every job went cold, and it
# still let setup-gradle talk to GitHub's cache — which is how a partial bun
# tarball plus restore-keys reimported poison. Three modes, resolved here:
#
#   isolate=true          -> RUNNER_TEMP dirs, cache-disabled (deps-verify)
#   self-hosted + ARM64   -> isolate anyway (Pi 8 GB must not grow volumes)
#   self-hosted + X64     -> default home dirs (~/.bun, ~/.gradle, ~/.cargo);
#                            GitHub cache-disabled (the volume IS the cache)
#   github-hosted         -> default home dirs; cache=auto becomes true
#                            (setup-gradle / rust-cache / flutter-action only)
#
# Hosted GitHub cache is ONE mechanism per stack. Never also setup-java
# cache: gradle, never a manual actions/cache of ~/.gradle, never restore-keys
# on a package store. Bun's install cache is never uploaded to GitHub — 8s
# vs a 420 MB restore; the budget belongs to toolchain caches that pay rent.
name: Setup stack
description: Install the toolchain for a stack and resolve its package-cache mode.

inputs:
  stack:
    description: 'bun | node | gradle | android | flutter | rust | xcode | none'
    required: true
  node-version:
    description: 'For stack=node, and for semantic-release on any stack'
    default: '24'
  bun-version:
    description: 'For stack=bun'
    default: 'latest'
  java-version:
    description: 'For gradle/android/flutter. Empty skips the JDK on flutter.'
    default: '21'
  flutter-version:
    description: 'For stack=flutter. Empty takes the channel head.'
    default: ''
  flutter-channel:
    description: 'For stack=flutter'
    default: 'stable'
  rust-toolchain:
    description: 'For stack=rust'
    default: 'stable'
  rust-components:
    description: 'For stack=rust, e.g. "clippy, rustfmt"'
    default: 'clippy, rustfmt'
  xcode-version:
    description: 'For stack=xcode. Empty takes the runner default.'
    default: ''
  isolate:
    description: >-
      Pin package caches to RUNNER_TEMP and disable GitHub cache. Forced on
      for self-hosted ARM64. Default false: X64 self-hosted uses home dirs
      (named volumes); hosted uses home dirs plus toolchain cache actions.
    default: 'false'
  cache:
    description: >-
      auto | true | false. auto becomes true only on github-hosted, and is
      ignored when isolated or on self-hosted (those never use GitHub cache).
      Applies to setup-gradle / rust-cache / flutter-action only — never bun.
    default: 'auto'

  # Command overrides. The sentinel "@stack" means "use this stack's
  # conventional command"; an explicit empty string means "this repo has no such
  # step". Those are different intentions and a plain default cannot express
  # both — a Gradle repo genuinely has no install step. Resolving them HERE
  # means callers read `steps.setup.outputs.install` and never reimplement the
  # precedence rule; three workflows had started to.
  install:   { description: 'Override the install command',   default: '@stack' }
  lint:      { description: 'Override the lint command',      default: '@stack' }
  typecheck: { description: 'Override the typecheck command', default: '@stack' }
  test:      { description: 'Override the test command',      default: '@stack' }
  build:     { description: 'Override the build command',     default: '@stack' }

outputs:
  install:
    description: 'Resolved install command — the override, or the stack default. Empty means skip.'
    value: ${{ steps.defaults.outputs.install }}
  lint:
    description: 'Resolved lint command. Empty means skip.'
    value: ${{ steps.defaults.outputs.lint }}
  typecheck:
    description: 'Resolved typecheck command. Empty means skip.'
    value: ${{ steps.defaults.outputs.typecheck }}
  test:
    description: 'Resolved test command. Empty means skip.'
    value: ${{ steps.defaults.outputs.test }}
  build:
    description: 'Resolved build command. Empty means skip.'
    value: ${{ steps.defaults.outputs.build }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        ISOLATE: ${{ inputs.isolate }}
        CACHE: ${{ inputs.cache }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$STACK" in
          bun|node|gradle|android|flutter|rust|xcode|none) : ;;
          *) echo "::error::unknown stack '$STACK' (expected bun|node|gradle|android|flutter|rust|xcode|none)"; exit 1 ;;
        esac
        case "$CACHE" in
          auto|true|false) : ;;
          *) echo "::error::cache must be auto, true, or false (got '$CACHE')"; exit 1 ;;
        esac

        # isolate=true, or ARM64 self-hosted (Pi 8 GB must not grow volumes).
        do_isolate=false
        if [ "$ISOLATE" = "true" ]; then
          do_isolate=true
        elif [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${RUNNER_ARCH:-}" = "ARM64" ]; then
          do_isolate=true
        fi

        # GitHub Actions cache: never when isolated, never on self-hosted.
        # auto becomes true only on github-hosted. Unknown environment falls
        # through to hosted so a beelink job landing on ubuntu-latest still
        # caches.
        cache_enabled=false
        if [ "$do_isolate" != "true" ] && [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
          if [ "$CACHE" = "true" ] || [ "$CACHE" = "auto" ]; then
            cache_enabled=true
          fi
        fi

        if [ "$do_isolate" = "true" ]; then
          {
            echo "BUN_INSTALL_CACHE_DIR=${RUNNER_TEMP}/bun-cache"
            echo "npm_config_cache=${RUNNER_TEMP}/npm-cache"
            echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-home"
            echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache"
            echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home"
          } >> "$GITHUB_ENV"
        fi

        {
          echo "isolated=$do_isolate"
          echo "cache_enabled=$cache_enabled"
        } >> "$GITHUB_OUTPUT"
        echo "stack: $STACK, isolate=$do_isolate, cache=$cache_enabled (input cache=$CACHE, env=${RUNNER_ENVIRONMENT:-unknown}/${RUNNER_ARCH:-unknown})"

    - if: inputs.stack == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
        # No GitHub cache for bun, even on hosted. The tarball store is large
        # and restore-keys on it is how poison reimports.

    - if: inputs.stack == 'node'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # No cache: npm. Hosted cache is one mechanism per stack, and this
        # action never uploads a package store under restore-keys.

    - if: (inputs.stack == 'gradle' || inputs.stack == 'android') || (inputs.stack == 'flutter' && inputs.java-version != '')
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
        # No cache: gradle. The hosted Gradle cache is setup-gradle's job.

    - if: inputs.stack == 'gradle' || inputs.stack == 'android'
      uses: gradle/actions/setup-gradle@v6
      with:
        # Publishing a build scan from a verification job leaks the dependency
        # graph of a private repo to a third party. Off unless a repo opts in.
        build-scan-publish: false
        cache-disabled: ${{ steps.resolve.outputs.cache_enabled != 'true' }}

    - if: inputs.stack == 'android'
      uses: android-actions/setup-android@v4

    - if: inputs.stack == 'flutter'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.flutter-channel }}
        cache: ${{ steps.resolve.outputs.cache_enabled == 'true' }}

    # Pinned to @master with an explicit `toolchain`, which is how this action
    # is meant to be parameterised — the `@stable` form the README leads with
    # hardcodes the channel in the ref and cannot be overridden by an input.
    - if: inputs.stack == 'rust'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - if: inputs.stack == 'rust' && steps.resolve.outputs.cache_enabled == 'true'
      uses: Swatinem/rust-cache@v2

    - if: inputs.stack == 'xcode' && inputs.xcode-version != ''
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    # Conventional commands per stack, so a caller that has nothing unusual to
    # say can name its stack and stop. Anything explicit wins over these.
    - id: defaults
      shell: bash
      env:
        STACK:       ${{ inputs.stack }}
        O_INSTALL:   ${{ inputs.install }}
        O_LINT:      ${{ inputs.lint }}
        O_TYPECHECK: ${{ inputs.typecheck }}
        O_TEST:      ${{ inputs.test }}
        O_BUILD:     ${{ inputs.build }}
      run: |
        set -euo pipefail
        install=""; lint=""; typecheck=""; test=""; build=""
        case "$STACK" in
          bun)
            install="bun install --frozen-lockfile"
            lint="bun run lint"; typecheck="bun run typecheck"
            test="bun run test:run"; build="bun run build" ;;
          node)
            install="npm ci"
            lint="npm run lint"; typecheck="npm run typecheck"
            test="npm test"; build="npm run build" ;;
          gradle|android)
            # Gradle resolves on demand; there is no separate install step.
            lint="./gradlew ktlintCheck"
            test="./gradlew test"; build="./gradlew assemble" ;;
          flutter)
            install="flutter pub get"
            lint="flutter analyze"
            test="flutter test"; build="flutter build apk --debug" ;;
          rust)
            lint="cargo clippy --all-targets -- -D warnings"
            typecheck="cargo check --all-targets"
            test="cargo test --all"; build="cargo build --release" ;;
          xcode)
            lint="swiftlint --strict"
            test="xcodebuild test -scheme \"\$SCHEME\" -destination 'platform=iOS Simulator,name=iPhone 15'"
            build="xcodebuild build -scheme \"\$SCHEME\"" ;;
          none) : ;;
        esac
        # "@stack" -> the conventional command above. Anything else, empty
        # string included, is taken literally.
        pick() { if [ "$1" = "@stack" ]; then printf '%s' "$2"; else printf '%s' "$1"; fi; }
        {
          echo "install=$(pick "$O_INSTALL" "$install")"
          echo "lint=$(pick "$O_LINT" "$lint")"
          echo "typecheck=$(pick "$O_TYPECHECK" "$typecheck")"
          echo "test=$(pick "$O_TEST" "$test")"
          echo "build=$(pick "$O_BUILD" "$build")"
        } >> "$GITHUB_OUTPUT"
