# The standard tests itself.
#
# Everything here is deterministic and hosted-only. This repo is public, and a
# public repo never touches a self-hosted runner.
name: Self test

# No `paths:` filter on purpose. The run takes about 15 seconds, and two of the
# checks read files a filter would have to list: the preset check compares the
# README runner table against the picker, so a README-only change can break it.
# A filter also makes this unusable as a required check, since a filtered-out
# pull request produces no check run at all and could never merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The beta plugins the shared config pins (commit-analyzer, release-notes-generator)
      # require Node ^22.22.2 or >=24.15. Node 24 satisfies that everywhere the
      # rest of this job needs Node, including the release config parse below.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Shared semantic-release config tests
        run: npm test

      # The kill switch is a claim about behaviour. Assert it.
      - name: Agent gate behaviour
        run: ./actions/agent-gate/test.sh

      # Which comment a sticky run EDITS is the part that can be wrong quietly:
      # picking wrong means a later run overwrites something it did not write.
      - name: Sticky comment picks the right comment
        run: ./actions/sticky-comment/test.sh

      # `sticky-comment` is read only in tag mode, which a non-empty `prompt`
      # switches off. The pair costs a full agent run and posts nothing.
      # run-agent refuses it at runtime; this catches it at review time.
      - name: No workflow asks for a sticky comment it will not get
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              doc = yaml.safe_load(open(f)) or {}
              for job in (doc.get('jobs') or {}).values():
                  for step in (job.get('steps') or []) if isinstance(job, dict) else []:
                      if 'run-agent@' not in str(step.get('uses', '')):
                          continue
                      w = step.get('with') or {}
                      if str(w.get('sticky-comment')) == 'True' or w.get('sticky-comment') == 'true':
                          if str(w.get('prompt', '')).strip():
                              bad.append(f)
          if bad:
              print('::error::sticky-comment with a non-empty prompt in ' + ', '.join(bad)
                    + '. A prompt selects agent mode, which creates no comment. Use track-progress, or tell the agent to post.')
              sys.exit(1)
          print('no run-agent call combines sticky-comment with a prompt')
          "

      # PR Review published nothing on its first real run and then failed its own
      # guard. The agent had run fine. It had simply taken the plugin's documented
      # silent path, and the workflow had no way to tell that from a broken one.
      # The fix was to stop asking the agent to publish and start requiring a file.
      # If the prompt stops naming the file, or the verdict step stops reading the
      # same path, the silence comes straight back.
      - name: PR Review publishes through a file, not through the agent
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          steps = yaml.safe_load(open('.github/workflows/pr-review.yml'))['jobs']['review']['steps']

          agent = [s for s in steps if 'run-agent@' in str(s.get('uses', ''))][0]
          prompt = str((agent.get('with') or {}).get('prompt', ''))
          if 'review-body.md' not in prompt:
              sys.exit('::error::the PR Review prompt no longer asks the agent to write review-body.md. '
                       'That file is the only thing that reaches the pull request, so the review goes silent.')
          if '--comment' not in prompt:
              sys.exit('::error::the PR Review prompt lost --comment. Inline comments come from the '
                       'plugin steps that flag unlocks.')

          verdict = [s for s in steps if s.get('id') == 'verdict'][0]
          if 'review-body.md' not in verdict['run']:
              sys.exit('::error::the verdict step no longer reads review-body.md, so the agent writes a '
                       'file nobody posts.')

          guard = [s for s in steps if s.get('name', '').startswith('The review reached')][0]
          if 'steps.verdict.outputs.wrote' not in str(guard.get('if', '')):
              sys.exit('::error::the PR Review guard is not keyed on whether the agent wrote its verdict. '
                       'Counting comments cannot tell a silent review from a broken one.')

          # claude-code-action skips itself, reporting success, on any pull request
          # that changes a workflow file. Without this the guard blames the prompt.
          for s_ in (verdict, guard):
              if 'agent.outputs.execution-file' not in str(s_.get('env', {})):
                  sys.exit('::error::PR Review no longer reads run-agent execution-file, so a run the '
                           'action skipped is reported as the agent writing nothing.')
          print('PR Review requires the file it posts')
          "

          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('actions/run-agent/action.yml'))
          if 'execution-file' not in (doc.get('outputs') or {}):
              sys.exit('::error::run-agent no longer forwards execution-file. Its callers cannot then tell '
                       'an agent that ran and said nothing from one claude-code-action never started.')
          call = [s for s in doc['runs']['steps'] if 'claude-code-action@' in str(s.get('uses', ''))][0]
          if call.get('id') != 'agent':
              sys.exit('::error::the claude-code-action step in run-agent lost id: agent, so its outputs '
                       'resolve to empty and every run looks skipped.')
          print('run-agent forwards whether the agent ran')
          "

      # Counting a bot by a substring of its login is a trap. claude-code-action
      # posts under whichever app minted its token, and every one of these
      # workflows already declares GH_APP_CLIENT_ID. Wire those through and a
      # login match silently counts zero for work that did happen.
      - name: No workflow identifies its own bot by a login substring
        run: |
          set -euo pipefail
          # This file is excluded because it carries the pattern it looks for.
          if grep -rn 'user.login' .github/workflows/*.yml \
             | grep -v '^.github/workflows/self-test.yml:' \
             | grep -i 'contains("claude")'; then
            echo '::error::a workflow above matches its own comments by a login containing claude. Match .user.type or a marker in the body instead; the posting identity changes with the token.'
            exit 1
          fi
          echo 'no workflow matches its own bot by login substring'

      # `track_progress` forces tag mode, and tag mode renders only three issue
      # actions. run-agent filters the rest out so a reopened issue runs instead
      # of failing in Create prompt. Wiring the raw input back would restore
      # that failure, and it would look like a tidy-up.
      - name: run-agent filters track-progress before passing it on
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('actions/run-agent/action.yml'))
          steps = doc['runs']['steps']
          guard = [s for s in steps if s.get('id') == 'progress']
          if not guard:
              sys.exit('::error::actions/run-agent lost the step that filters track-progress. '
                       'A reopened issue then fails in Create prompt with Unsupported issue action.')
          for a in ('opened', 'assigned', 'labeled'):
              if a not in guard[0]['run']:
                  sys.exit('::error::the track-progress guard no longer names the supported issue action ' + a)
          call = [s for s in steps if 'claude-code-action@' in str(s.get('uses', ''))][0]
          wired = str((call.get('with') or {}).get('track_progress', ''))
          if 'steps.progress.outputs.track' not in wired:
              sys.exit('::error::track_progress is wired to ' + wired + ', not to the guard step. '
                       'It must pass through steps.progress.outputs.track.')
          print('track-progress passes through the guard')
          "

      # One hosted picker job, one summary job. Both drifted back once already:
      # a second picker job crept in as "just for this one caller", and a
      # summary job with a wrong `if:` reports green while its dependencies are
      # still running. Assert the shape rather than trust it stays this way.
      - name: pr-checks has one picker job and an always-on summary job
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']

          pickers = [name for name, job in jobs.items()
                     if any('pick-runner' in str(step.get('uses', ''))
                            for step in (job.get('steps') or []))]
          if len(pickers) != 1:
              sys.exit('::error::pr-checks.yml must call the pick-runner action from exactly one job, found: '
                        + repr(pickers) + '. Two picker jobs bill two hosted minutes before any real work runs.')

          summary = jobs.get('pr-checks')
          if summary is None:
              sys.exit('::error::pr-checks.yml has no pr-checks job. That job is the one stable status-check '
                        'context a branch ruleset can require across single-job and split mode.')
          if str(summary.get('if', '')).strip() != 'always()':
              sys.exit('::error::the pr-checks job must run unconditionally (if: always()), or it silently '
                        'skips instead of reporting the jobs it summarizes.')
          print('pr-checks.yml has one picker job (%s) and an always-on pr-checks summary job' % pickers[0])
          "

      # Each agent workflow used to run the picker as its own hosted job, needed
      # by the agent job. That billed two hosted starts before a proceeding run
      # ever reached the agent. Now the picker is a STEP inside `gate`, after
      # `agent-gate`, guarded on the gate's own `proceed`. Assert the new shape
      # rather than trust it stays this way: a `pick-runner` job creeping back
      # in "just for this one workflow" is exactly how it drifted before.
      - name: Agent workflows pick their runner inside the gate job
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml

          agent_workflows = [
              ('issue-triage.yml',   'triage'),
              ('issue-implement.yml','implement'),
              ('claude-assist.yml',  'assist'),
              ('pr-review.yml',      'review'),
              ('deps-verify.yml',    'verify'),
          ]

          bad = []
          for f, agent_job in agent_workflows:
              path = '.github/workflows/' + f
              jobs = yaml.safe_load(open(path))['jobs']

              if 'pick-runner' in jobs:
                  bad.append(f + ': still has a standalone pick-runner job')
                  continue

              gate = jobs.get('gate')
              if gate is None:
                  bad.append(f + ': has no gate job')
                  continue

              steps = gate.get('steps') or []
              pick = [s for s in steps if 'pick-runner@' in str(s.get('uses', ''))]
              if len(pick) != 1:
                  bad.append(f + ': gate job must have exactly one pick-runner step, found ' + str(len(pick)))
                  continue

              cond = str(pick[0].get('if', ''))
              if 'proceed' not in cond:
                  bad.append(f + ': the pick step is not guarded on a proceed output (if: %r)' % cond)

              if 'runner' not in (gate.get('outputs') or {}):
                  bad.append(f + ': gate job has no runner output for the agent job to read')

              job = jobs.get(agent_job)
              if job is None:
                  bad.append(f + ': has no ' + agent_job + ' job')
                  continue
              if 'pick-runner' in (job.get('needs') or []):
                  bad.append(f + ': ' + agent_job + ' job still needs pick-runner')
              if 'needs.gate.outputs.runner' not in str(job.get('runs-on', '')):
                  bad.append(f + ': ' + agent_job + ' job does not read runs-on from needs.gate.outputs.runner')

          if bad:
              sys.exit('::error::' + '; '.join(bad) + '. Folding the picker into the gate job is what makes a '
                        'proceeding agent run cost one hosted start instead of two.')
          print('every agent workflow picks its runner inside the gate job, guarded on proceed')
          "

      # deps-verify may push fix commits, so where the push happens is the
      # guard. Only the deterministic `push` step may run `git push`, only the
      # `publish` step may set labels, and the agent's prompt must still say it
      # does not push, merge or approve.
      - name: deps-verify pushes and labels only from its deterministic steps
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          steps = yaml.safe_load(open('.github/workflows/deps-verify.yml'))['jobs']['verify']['steps']
          bad = []
          for s in steps:
              run = str(s.get('run', ''))
              sid = s.get('id', s.get('name', s.get('uses', '?')))
              if 'git push' in run and sid != 'push':
                  bad.append('git push outside the push step (%s)' % sid)
              if '/labels' in run and sid != 'publish':
                  bad.append('labels written outside the publish step (%s)' % sid)
          agent = [s for s in steps if 'run-agent@' in str(s.get('uses', ''))]
          if len(agent) != 1:
              bad.append('expected exactly one run-agent step, found %d' % len(agent))
          else:
              prompt = agent[0]['with']['prompt']
              for phrase in ('Do NOT push', 'NEVER edit a lockfile', 'Do not comment on, label, merge or approve'):
                  if phrase not in prompt:
                      bad.append('agent prompt lost: ' + phrase)
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('deps-verify pushes from push, labels from publish, and the agent is told neither')
          "

      # pick-runner.yml is a thin wrapper around actions/pick-runner now. Every
      # existing caller, internal or external, references these names, so the
      # wrapper losing one is a breaking change hiding behind a passing lint.
      - name: pick-runner.yml still exposes its original interface
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/pick-runner.yml'))
          # PyYAML parses the bare scalar 'on' as the boolean True, not the
          # string 'on'. doc['on'] is a KeyError waiting to look like a typo.
          call = doc[True]['workflow_call']
          inputs = set((call.get('inputs') or {}).keys())
          outputs = set((call.get('outputs') or {}).keys())

          need_in = {'weight', 'labels', 'fallback', 'hosted-runner', 'guard-public'}
          need_out = {'runner', 'selector'}

          missing_in = need_in - inputs
          missing_out = need_out - outputs
          if missing_in or missing_out:
              sys.exit('::error::pick-runner.yml dropped input(s) %s and/or output(s) %s. Every caller '
                        'pinned at @v1 already depends on this exact interface.' % (sorted(missing_in), sorted(missing_out)))
          print('pick-runner.yml still exposes inputs %s and outputs %s' % (sorted(need_in), sorted(need_out)))
          "

      # The picker's `case` block is the only place a preset is defined, and the
      # README table is where people read it. Drift between them is how a
      # retired pool keeps being documented as live.
      - name: Runner presets match the README
        run: |
          set -euo pipefail
          python3 - <<'PRESETS'
          import re, sys

          picker = open('actions/pick-runner/action.yml').read()
          readme = open('README.md').read()

          got = dict(re.findall(r'^\s+(light|heavy|apple|hosted)\)\s+sel="([^"]*)"',
                                picker, re.M))

          rows = {}
          for name, sel in re.findall(r'^\|\s*.(light|heavy|apple|hosted).\s*\|([^|]*)\|',
                                      readme, re.M):
              sel = sel.strip().strip('`').strip()
              rows[name] = '' if sel in ('', 'none') else sel

          if len(got) != 4 or len(rows) != 4:
              sys.exit('::error::parsed %d presets and %d README rows, expected 4 and 4. '
                       'Refusing to report clean from a parse that found nothing.'
                       % (len(got), len(rows)))

          bad = [k for k in sorted(got) if got[k] != rows.get(k)]
          if bad:
              for k in bad:
                  print('::error::%s: picker=%r README=%r' % (k, got[k], rows.get(k)))
              sys.exit(1)

          print('preset table agrees: %r' % got)
          PRESETS

      # Caching a project build directory is a governed rule, not a preference.
      # Those paths hold absolute paths that do not survive a move between
      # runners, and a per-SHA key falls through restore-keys to another
      # branch's compiled output. See AGENTS.md.
      - name: No workflow caches a build directory
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, re, yaml
          pat = re.compile(r'^(.*/)?(build|\.gradle)(/.*)?$')
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')):
              doc = yaml.safe_load(open(f)) or {}
              jobs = list((doc.get('jobs') or {}).values())
              jobs += [doc.get('runs') or {}]
              for job in jobs:
                  for step in (job.get('steps') or []) if isinstance(job, dict) else []:
                      if 'actions/cache' not in str(step.get('uses', '')):
                          continue
                      for line in str((step.get('with') or {}).get('path', '')).splitlines():
                          line = line.strip().lstrip('!')
                          if line and pat.match(line):
                              bad.append(f + ': ' + line)
          if bad:
              print('::error::a build directory is used as a cache path: ' + '; '.join(bad)
                    + '. Reuse of compiled output is the build tool job, by content hash. See AGENTS.md.')
              sys.exit(1)
          print('no build directory is cached')
          "

      - name: Every workflow and action is parseable YAML
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')):
              try:
                  yaml.safe_load(open(f))
                  print('ok   ' + f)
              except Exception as e:
                  print('FAIL ' + f + ': ' + str(e)); bad += 1
          sys.exit(bad)
          "

      # The preset is only ever loaded if it is named `default.json`: for a bare
      # `github>owner/repo` Renovate fetches that one path, and on a 404 falls
      # back to `renovate.json`, which here extends this preset and so resolves
      # to nothing. That failure is silent -- Renovate keeps opening PRs, on
      # stock defaults, in every repo extending the preset. Assert the filename,
      # not just the contents. A JSONC object literal is also a valid JavaScript
      # expression, so the contents parse without pulling in a parser.
      - name: Renovate preset parses
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("default.json")) throw new Error("the preset must be named default.json; Renovate fetches no other filename");
            for (const wrong of ["default.json5", "default.jsonc"]) {
              if (fs.existsSync(wrong)) throw new Error(wrong + " is never fetched by Renovate, rename it to default.json");
            }
            const o = eval("(" + fs.readFileSync("default.json", "utf8") + ")");
            if (!Array.isArray(o.packageRules)) throw new Error("packageRules missing");
            if (!o.labels.includes("deps:update")) throw new Error("deps:update label missing");
            if (o.dependencyDashboard !== true) throw new Error("dependencyDashboard is off, so no repo gets a dashboard issue");
            for (const e of o.extends || []) {
              if (e.includes("dodi-smart/.github")) throw new Error("the preset extends itself: " + e + ", which resolves to nothing");
            }
            console.log("preset OK:", Object.keys(o).join(", "));
          '

      # A malformed release.config.mjs does not fail loudly, it just stops
      # cutting releases, and the major tag every caller pins stops moving
      # with it.
      - name: Release and Renovate config parse
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import config from "./release.config.mjs";

            // Plugins are absolute paths into the package; pluginName maps back.
            const { pluginName } = await import("@dodi-smart/semantic-release-config");
            const byName = (name) => config.plugins.find(p => pluginName(p) === name);
            if (!config.branches.includes("main")) throw new Error("release config: main is not a release branch");
            for (const need of ["@semantic-release/commit-analyzer", "@semantic-release/exec"]) {
              if (!byName(need)) throw new Error("release config: missing " + need);
            }
            const exec = byName("@semantic-release/exec");
            if (!/git tag -f v/.test(exec[1].successCmd)) throw new Error("release config: the major tag is never moved");
            const analyzer = byName("@semantic-release/commit-analyzer");
            const deps = (analyzer[1].releaseRules || []).some(r => r.type === "chore" && r.scope === "deps" && r.release === "patch");
            if (!deps) throw new Error("release config: chore(deps) no longer cuts a patch, so v1 stops moving on dependency updates");
            const notes = byName("@semantic-release/release-notes-generator");
            const types = ((notes[1].presetConfig || {}).types) || [];
            if (!types.length) throw new Error("release config: no changelog sections configured");

            // conventional-changelog-conventionalcommits v10 reads effect, not
            // hidden, and silently treats a leftover hidden key as a bump, so
            // a docs: commit would leak into the notes as an untitled bullet.
            for (const t of types) {
              if ("hidden" in t) throw new Error("release config: " + JSON.stringify(t) + " still carries hidden, which v10 of the preset ignores silently");
              if (t.effect !== "bump" && t.effect !== "hidden") throw new Error("release config: " + JSON.stringify(t) + " has an effect other than bump or hidden");
            }

            // Written as literal UTF-8. An earlier attempt lost every emoji in
            // transit and produced a plain changelog that looked deliberate,
            // so this asserts they survived rather than trusting the file.
            const visible = types.filter(t => t.effect !== "hidden");
            const plain = visible.filter(t => !/[^\x00-\x7F]/.test(t.section || ""));
            if (plain.length) throw new Error("release config: changelog section without an emoji: " + plain.map(t => t.section).join(", "));

            // conventional-changelog takes the FIRST matching entry, so a bare
            // chore listed before the scoped one swallows chore(deps) and hides it.
            const depsAt = types.findIndex(t => t.type === "chore" && t.scope === "deps");
            const choreAt = types.findIndex(t => t.type === "chore" && !t.scope);
            if (depsAt === -1) throw new Error("release config: chore(deps) has no changelog section, so a dependency release would be empty");
            if (choreAt !== -1 && choreAt < depsAt) throw new Error("release config: bare chore is listed before chore(deps), which hides dependency updates");

            const ren = JSON.parse(readFileSync("renovate.json", "utf8"));
            if (!ren.baseBranchPatterns.includes("main")) throw new Error("renovate: baseBranchPatterns must name main, the preset says develop");
            JSON.parse(readFileSync("package.json", "utf8"));

            console.log("release and renovate config OK");
          '

          # The shared package is never published. A release config that
          # gained the npm plugin would try, and fail for want of a token.
          node --input-type=module -e '
            import config from "./release.config.mjs";
            import { pluginName } from "@dodi-smart/semantic-release-config";
            const names = config.plugins.map(pluginName);
            if (names.includes("@semantic-release/npm")) throw new Error("release config: @semantic-release/npm is present, and the shared package is not published");
            console.log("nothing publishes, as expected");
          '

      # A real backmerge in a bun or pnpm repo conflicts on the lockfile, not
      # just package.json, because the shared git plugin commits those too.
      # Assert the resolve list and the input that extends it stay in place,
      # so an edit that narrows the list back down fails here, not in a
      # caller's release run after the tag already moved.
      - name: Backmerge auto-resolve list covers the shared config's lockfiles
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/release.yml'))
          # PyYAML reads the bare 'on' key as the boolean True (YAML 1.1).
          inputs = doc[True]['workflow_call']['inputs']
          if 'backmerge-resolve-paths' not in inputs:
              sys.exit('::error::release.yml lost the backmerge-resolve-paths input, a consuming repo can no longer add its own manifest/lockfile paths')
          if inputs['backmerge-resolve-paths'].get('default') != '':
              sys.exit('::error::backmerge-resolve-paths must default to \"\", so today\'s behaviour is unchanged when a caller does not set it')

          step = [s for s in doc['jobs']['backmerge']['steps'] if 'RESOLVE_EXTRA' in str(s.get('env', {}))]
          if not step:
              sys.exit('::error::the backmerge step no longer wires backmerge-resolve-paths through as RESOLVE_EXTRA')
          script = step[0]['run']
          for f in ('package.json', 'package-lock.json', 'bun.lock', 'pnpm-lock.yaml', 'yarn.lock', 'CHANGELOG.md', '\$RESOLVE_EXTRA'):
              if f not in script:
                  sys.exit('::error::the backmerge auto-resolve loop no longer names ' + f)
          print('backmerge auto-resolve list is intact')
          "

      # What a consumer gets from the installer, checked by resolving.
      - name: Shared config links into a consumer
        run: ./actions/semantic-release-config/test.sh

      - name: Shell scripts pass shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck actions/*/*.sh

      # Run the binary, not `uses: docker://rhysd/actionlint`: that form
      # word-splits `args` without honouring quotes, so an -ignore pattern with
      # spaces is torn apart. The two ignores exist because actionlint's bundled
      # snapshot predates create-github-app-token moving to `client-id`.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
