# The standard tests itself.
#
# Everything here is deterministic and hosted-only. This repo is public, and a
# public repo never touches a self-hosted runner.
#
# No push trigger: Publish release calls this before it moves `v1`.
name: Self test

# No `paths:` filter on purpose. The run takes about 15 seconds, and two of the
# checks read files a filter would have to list: the preset check compares the
# README runner table against the picker, so a README-only change can break it.
# A filter also makes this unusable as a required check, since a filtered-out
# pull request produces no check run at all and could never merge.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push cancels a pull request's run. Any other run gets a group of its
# own, so the run a release waits on is never cancelled and never shares a group.
concurrency:
  group: self-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      # The beta plugins the shared config pins (commit-analyzer, release-notes-generator)
      # require Node ^22.22.2 or >=24.15. Node 24 satisfies that everywhere the
      # rest of this job needs Node, including the release config parse below.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Shared semantic-release config tests
        run: npm test

      # The picker is static: each weight's labels, `labels`, the absence of any
      # run-time override, and the public/fork guard are behaviour, so they are
      # asserted, not reviewed.
      - name: Pick-runner policy
        run: ./actions/pick-runner/test.sh

      # The kill switch is a claim about behaviour. Assert it.
      - name: Agent gate behaviour
        run: ./actions/agent-gate/test.sh

      # Which comment a sticky run EDITS is the part that can be wrong quietly:
      # picking wrong means a later run overwrites something it did not write.
      - name: Sticky comment picks the right comment
        run: ./actions/sticky-comment/test.sh

      # The report must never fail a job: a 403 from the jobs API (a caller with
      # `contents: read` only) still names the runner. Also run under bash 3.2.
      - name: Runner report degrades without failing
        run: ./actions/runner-report/test.sh

      - name: commitlint lints every PR commit without Docker
        run: ./actions/commitlint/test.sh

      # A skip built on changed-files is a positive claim, so every doubt has to
      # come out as `matched=true`, the 3000-file cap included.
      - name: Changed files count every doubt as a match
        run: ./actions/changed-files/test.sh

      # A wrong percentage, or a floor that never trips, reads as a healthy repo.
      - name: LCOV report does the arithmetic and enforces the floors
        run: ./actions/lcov-report/test.sh

      # A phase's command reaches the shell unmangled, each phase gets its own
      # subshell, and the first failure stops the rest. pr-checks runs on this.
      - name: run-phases runs each phase alone and stops at the first failure
        run: ./actions/run-phases/test.sh

      # claude-code-action replaces the git identity a job configured, so
      # deps-verify's fixes were authored by claude[bot] and its own push guard
      # refused them. This runs the push and publish steps against real git
      # repos: the author allowlist, the explicit --author, the identity
      # run-agent forwards, the Renovate-owned needs-manual label and the
      # no-report comment.
      - name: run-agent identity and deps-verify's push and publish steps
        run: ./actions/run-agent/test.sh

      # Only a bot's `chore(release): … [skip ci]` skips the guard wall; either
      # half alone is still checked.
      - name: zavet-check skips only release bots' version bumps
        run: ./actions/zavet-check/test.sh

      # The wait must never pass on the job's own Deployment, and must count the
      # commit before a `[skip ci]` release commit, the one the host builds.
      - name: Deployment wait proves the host's deployment
        run: ./actions/wait-for-deployment/test.sh

      # `sticky-comment` is read only in tag mode, which a non-empty `prompt`
      # switches off. The pair costs a full agent run and posts nothing.
      # run-agent refuses it at runtime; this catches it at review time.
      - name: No workflow asks for a sticky comment it will not get
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              doc = yaml.safe_load(open(f)) or {}
              for job in (doc.get('jobs') or {}).values():
                  for step in (job.get('steps') or []) if isinstance(job, dict) else []:
                      if 'run-agent@' not in str(step.get('uses', '')):
                          continue
                      w = step.get('with') or {}
                      if str(w.get('sticky-comment')) == 'True' or w.get('sticky-comment') == 'true':
                          if str(w.get('prompt', '')).strip():
                              bad.append(f)
          if bad:
              print('::error::sticky-comment with a non-empty prompt in ' + ', '.join(bad)
                    + '. A prompt selects agent mode, which creates no comment. Use track-progress, or tell the agent to post.')
              sys.exit(1)
          print('no run-agent call combines sticky-comment with a prompt')
          "

      # PR Review published nothing on its first real run and then failed its own
      # guard. The agent had run fine. It had simply taken the plugin's documented
      # silent path, and the workflow had no way to tell that from a broken one.
      # The fix was to stop asking the agent to publish and start requiring a file.
      # If the prompt stops naming the file, or the verdict step stops reading the
      # same path, the silence comes straight back.
      # Other workflows merge on review / verdict, so the verdict fails closed.
      - name: PR Review's verdict fails closed
        run: ./scripts/pr-review.test.sh

      - name: PR Review publishes through a file, not through the agent
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          steps = yaml.safe_load(open('.github/workflows/pr-review.yml'))['jobs']['review']['steps']

          agent = [s for s in steps if 'run-agent@' in str(s.get('uses', ''))][0]
          env = agent.get('env') or {}
          prompt = str(env.get('FULL_PROMPT', ''))
          for name in ('FULL_PROMPT', 'SCOPED_PROMPT'):
              for f in ('review-body.md', 'review-verdict.json'):
                  if f not in str(env.get(name, '')):
                      sys.exit('::error::the PR Review %s no longer asks the agent to write %s.' % (name, f))
          if 'review-body.md' not in prompt:
              sys.exit('::error::the PR Review prompt no longer asks the agent to write review-body.md. '
                       'That file is the only thing that reaches the pull request, so the review goes silent.')
          if '--comment' not in prompt:
              sys.exit('::error::the PR Review prompt lost --comment. Inline comments come from the '
                       'plugin steps that flag unlocks.')

          verdict = [s for s in steps if s.get('id') == 'verdict'][0]
          if 'review-body.md' not in verdict['run']:
              sys.exit('::error::the verdict step no longer reads review-body.md, so the agent writes a '
                       'file nobody posts.')

          guard = [s for s in steps if s.get('name', '').startswith('The review reached')][0]
          if 'steps.verdict.outputs.wrote' not in str(guard.get('if', '')):
              sys.exit('::error::the PR Review guard is not keyed on whether the agent wrote its verdict. '
                       'Counting comments cannot tell a silent review from a broken one.')

          # claude-code-action skips itself, reporting success, on any pull request
          # that changes a workflow file. Without this the guard blames the prompt.
          for s_ in (verdict, guard):
              if 'agent.outputs.execution-file' not in str(s_.get('env', {})):
                  sys.exit('::error::PR Review no longer reads run-agent execution-file, so a run the '
                           'action skipped is reported as the agent writing nothing.')
          print('PR Review requires the file it posts')
          "

          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('actions/run-agent/action.yml'))
          if 'execution-file' not in (doc.get('outputs') or {}):
              sys.exit('::error::run-agent no longer forwards execution-file. Its callers cannot then tell '
                       'an agent that ran and said nothing from one claude-code-action never started.')
          call = [s for s in doc['runs']['steps'] if 'claude-code-action@' in str(s.get('uses', ''))][0]
          if call.get('id') != 'agent':
              sys.exit('::error::the claude-code-action step in run-agent lost id: agent, so its outputs '
                       'resolve to empty and every run looks skipped.')
          print('run-agent forwards whether the agent ran')
          "

      # Counting a bot by a substring of its login is a trap. claude-code-action
      # posts under whichever app minted its token, and every one of these
      # workflows already declares GH_APP_CLIENT_ID. Wire those through and a
      # login match silently counts zero for work that did happen.
      - name: No workflow identifies its own bot by a login substring
        run: |
          set -euo pipefail
          # This file is excluded because it carries the pattern it looks for.
          if grep -rn 'user.login' .github/workflows/*.yml \
             | grep -v '^.github/workflows/self-test.yml:' \
             | grep -i 'contains("claude")'; then
            echo '::error::a workflow above matches its own comments by a login containing claude. Match .user.type or a marker in the body instead; the posting identity changes with the token.'
            exit 1
          fi
          echo 'no workflow matches its own bot by login substring'

      # A sparse checkout outlives its job in a persistent workspace. AGENTS.md.
      - name: No workflow or action checks out sparsely
        run: |
          set -euo pipefail
          if grep -rn '^ *sparse-checkout' .github/workflows actions --include='*.yml'; then
            echo '::error::the checkout above is sparse. Read the files from the contents API instead; see AGENTS.md.'
            exit 1
          fi
          echo 'no sparse checkout'

      # The dependency-bot list lived in four places in two shapes, and adding a
      # bot meant four edits, one of them easy to miss. The gate owns it now.
      # A login literal creeping back into a workflow is how the copies return.
      - name: The gate is the only place that lists dependency bots
        run: |
          set -euo pipefail
          python3 -c "
          import sys, re, glob, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              if f.endswith('self-test.yml'):
                  continue
              if re.search(r'renovate\[bot\]|dependabot\[bot\]|app/renovate', open(f).read()):
                  bad.append(f + ' names a dependency-bot login')
          wf = lambda n: yaml.safe_load(open('.github/workflows/' + n))['jobs']
          zsteps = yaml.safe_load(open('actions/zavet-check/action.yml'))['runs']['steps']
          author = [s for s in zsteps if s.get('id') == 'author']
          if not author or 'agent-gate@' not in str(author[0].get('uses', '')):
              bad.append('zavet-check no longer reads the author from agent-gate')
          if any(s.get('id') == 'mode' for s in zsteps):
              bad.append('zavet-check has its own mode step again')
          triage = [s for s in wf('issue-triage.yml')['gate']['steps'] if s.get('id') == 'gate'][0]
          events = str((triage.get('with') or {}).get('events', '')).split()
          if not events or any(e.startswith('pull_request') for e in events):
              bad.append('issue-triage must pass an events allow-list with no pull_request event, got ' + repr(events))
          verify = [s for s in wf('deps-verify.yml')['verify']['steps'] if 'run-agent@' in str(s.get('uses', ''))][0]
          if 'needs.gate.outputs.dependency-bots' not in str(verify['with'].get('allowed-bots', '')):
              bad.append('deps-verify allowed-bots no longer reads the gate output')
          if bad:
              sys.exit('::error::' + '; '.join(bad) + '. Keep the list in actions/agent-gate/gate.sh and read author-kind or dependency-bots.')
          print('dependency bots are listed once, in the gate')
          "

      # The gate reads the live labels, which needs a token that can read them.
      - name: Every agent gate job can read labels
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          bad = []
          for f in ['issue-triage', 'issue-implement', 'claude-assist', 'pr-review', 'deps-verify']:
              gate = yaml.safe_load(open('.github/workflows/' + f + '.yml'))['jobs']['gate']
              perms = gate.get('permissions') or {}
              if not any(perms.get(k) in ('read', 'write') for k in ('issues', 'pull-requests')):
                  bad.append(f)
          if bad:
              sys.exit('::error::gate job cannot read labels (needs issues or pull-requests): ' + ', '.join(bad))
          print('every agent gate job can read labels')
          "

      # `track_progress` forces tag mode, and tag mode renders only three issue
      # actions. run-agent filters the rest out so a reopened issue runs instead
      # of failing in Create prompt. Wiring the raw input back would restore
      # that failure, and it would look like a tidy-up.
      - name: run-agent filters track-progress before passing it on
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('actions/run-agent/action.yml'))
          steps = doc['runs']['steps']
          guard = [s for s in steps if s.get('id') == 'progress']
          if not guard:
              sys.exit('::error::actions/run-agent lost the step that filters track-progress. '
                       'A reopened issue then fails in Create prompt with Unsupported issue action.')
          for a in ('opened', 'assigned', 'labeled'):
              if a not in guard[0]['run']:
                  sys.exit('::error::the track-progress guard no longer names the supported issue action ' + a)
          call = [s for s in steps if 'claude-code-action@' in str(s.get('uses', ''))][0]
          wired = str((call.get('with') or {}).get('track_progress', ''))
          if 'steps.progress.outputs.track' not in wired:
              sys.exit('::error::track_progress is wired to ' + wired + ', not to the guard step. '
                       'It must pass through steps.progress.outputs.track.')
          print('track-progress passes through the guard')
          "

      # One hosted picker job, one summary job. Both drifted back once already:
      # a second picker job crept in as "just for this one caller", and a
      # summary job with a wrong `if:` reports green while its dependencies are
      # still running. Assert the shape rather than trust it stays this way.
      - name: pr-checks has one picker job and an always-on summary job
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']

          pickers = [name for name, job in jobs.items()
                     if any('pick-runner' in str(step.get('uses', ''))
                            for step in (job.get('steps') or []))]
          if len(pickers) != 1:
              sys.exit('::error::pr-checks.yml must call the pick-runner action from exactly one job, found: '
                        + repr(pickers) + '. Two picker jobs bill two hosted minutes before any real work runs.')

          summary = jobs.get('pr-checks')
          if summary is None:
              sys.exit('::error::pr-checks.yml has no pr-checks job. That job is the one stable status-check '
                        'context a branch ruleset can require across single-job and split mode.')
          if str(summary.get('if', '')).strip() != 'always()':
              sys.exit('::error::the pr-checks job must run unconditionally (if: always()), or it silently '
                        'skips instead of reporting the jobs it summarizes.')
          print('pr-checks.yml has one picker job (%s) and an always-on pr-checks summary job' % pickers[0])
          "

      # zavet and react-doctor must never join the required context, and each
      # standalone workflow and its pr-checks job must run one shared action.
      - name: pr-checks keeps zavet and react-doctor out of the summary
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          load = lambda p: yaml.safe_load(open(p))['jobs']
          jobs = load('.github/workflows/pr-checks.yml')
          uses = lambda job: str([s.get('uses', '') for s in job['steps']])
          errors = []
          summary = jobs['pr-checks']
          loop = ' '.join(str(s.get('run', '')) for s in summary['steps'])
          for j in ('zavet', 'react-doctor'):
              if j in summary['needs'] or ('\"' + j + ':') in loop:
                  errors.append('the pr-checks summary must not need or loop over ' + j + '.')
          for job, action, wf, wfjob in (
              ('zavet', 'actions/zavet-check@', 'zavet-check.yml', 'check'),
              ('react-doctor', 'actions/react-doctor@', 'react-doctor.yml', 'doctor')):
              if action not in uses(jobs[job]):
                  errors.append('pr-checks ' + job + ' must use ' + action)
              if action not in uses(load('.github/workflows/' + wf)[wfjob]):
                  errors.append(wf + ' must use ' + action)
          pickers = [n for n, j in jobs.items() if 'pick-runner' in uses(j)]
          if len(pickers) != 1:
              errors.append('exactly one pick-runner job is allowed, found ' + repr(pickers))
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('zavet and react-doctor stay out of the summary and share their actions')
          "

      # `build` runs beside `checks`, and the summary must still require
      # `checks`, or a red lint stops failing the required context.
      - name: pr-checks runs build beside checks and the summary still needs checks
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          if 'checks' in jobs['build'].get('needs', []):
              sys.exit('::error::the build job must not need checks, or it waits for lint and typecheck on every push.')
          summary = jobs['pr-checks']['needs']
          for j in ('checks', 'build'):
              if j not in summary:
                  sys.exit('::error::the pr-checks summary job must need ' + j + ', or a failure there stops failing the required context.')
          print('build needs only pick, and pr-checks still needs checks and build')
          "

      # This workflow runs the caller's own code, so no job holds a write token
      # it does not use. jactionlint covers checkouts and script expressions.
      - name: pr-checks keeps a read-only token and clones nothing to list files
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          errors = []
          doc = yaml.safe_load(open('.github/workflows/pr-checks.yml'))
          if doc.get('permissions') != {'contents': 'read'}:
              errors.append('pr-checks.yml needs workflow-level permissions: {contents: read}, so a job with no block of its own gets no more.')
          # The docs-only decision reads the API, never a clone: a hosted job
          # that clones to list files is the cost this replaced.
          pick = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']['pick']
          gate = yaml.safe_load(open('.github/workflows/pr-review.yml'))['jobs']['gate']
          for label, job in (('pr-checks pick', pick), ('pr-review gate', gate)):
              if any(str(st.get('uses', '')).startswith('actions/checkout@') for st in job['steps']):
                  errors.append('the ' + label + ' job has a checkout; it lists changed files through actions/changed-files, which needs no clone.')
              if not any('actions/changed-files@' in str(st.get('uses', '')) for st in job['steps']):
                  errors.append('the ' + label + ' job must list changed files with actions/changed-files.')
          if 'all-matched' not in str(pick['outputs']['docs_only']):
              errors.append('pick.docs_only must come from changed-files all-matched, so only a fully read list can skip the checks.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('pr-checks holds contents: read at workflow level, pick and the gate clone nothing')
          "

      # The opt-in `hk` input runs the caller's own hk.pkl over the whole tree.
      # No job holds security-events: a code scanning upload would force that
      # grant on every caller, so the SARIF stays an artifact.
      - name: pr-checks hk is opt-in, checks the whole tree and and holds no new permission
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          errors = []
          # Built in pieces: a run script never holds an expression of its own.
          ON = '\$' + '{{ inputs.hk }}'
          OFF = '\$' + '{{ !inputs.hk'
          doc = yaml.safe_load(open('.github/workflows/pr-checks.yml'))
          inp = doc[True]['workflow_call']['inputs'].get('hk')
          if not inp or inp.get('type') != 'boolean' or inp.get('default') is not False:
              errors.append('the hk input must be a boolean that defaults to false, so a caller that never sets it behaves as before.')
          jobs = doc['jobs']
          for name in ('checks', 'all'):
              job = jobs[name]
              if 'security-events' in (job.get('permissions') or {}):
                  errors.append(name + ' runs the caller code and must not hold security-events: write.')
              steps = job['steps']
              runs = [st.get('run', '') for st in steps]
              hk = [i for i, r in enumerate(runs) if 'hk check' in r]
              if len(hk) != 1 or 'hk check --all --sarif hk.sarif' not in runs[hk[0]] or '--pr' in runs[hk[0]]:
                  errors.append(name + ' must run hk check --all --sarif hk.sarif exactly once, never --pr.')
                  continue
              uses = [str(st.get('uses', '')) for st in steps]
              if not any(u.startswith('jdx/mise-action@') for u in uses[:hk[0]]):
                  errors.append(name + ' must run jdx/mise-action before hk check.')
              if not any(st.get('if') == ON for st in steps[:hk[0]] if 'run-phases' in str(st.get('uses', ''))):
                  errors.append(name + ' must run install (hk only) before hk check.')
              if not any(str(st.get('if', '')).startswith(OFF) for st in steps if 'run-phases' in str(st.get('uses', ''))):
                  errors.append(name + ' must skip its ordinary Run phases step when hk is on, or lint runs twice.')
          if any('security-events' in (j.get('permissions') or {}) for j in jobs.values()):
              errors.append('no pr-checks job may hold security-events: a code scanning upload would force that permission on every caller.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('hk defaults off, runs hk check --all in checks and all, and no job holds security-events')
          "

      # `test` and `all` run the caller's whole test suite, so the comment token
      # lives in a job that runs none of it and reads the report as an artifact.
      - name: pr-checks posts coverage from a job that runs no repo code
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          jobs = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          errors = []
          writers = [n for n, j in jobs.items() if (j.get('permissions') or {}).get('pull-requests') == 'write']
          # zavet and react-doctor post their own comments, as their standalone workflows do.
          if set(writers) - {'coverage', 'zavet', 'react-doctor'} or 'coverage' not in writers:
              errors.append('test/all/build must hold no pull-requests: write, and coverage must: found ' + repr(writers))
          uses = [str(st.get('uses', '')) for st in jobs['coverage']['steps']]
          if 'coverage' not in jobs['pr-checks']['needs']:
              errors.append('the pr-checks summary must need coverage, or a breached floor stops failing the required context.')
          if not any('actions/lcov-report@' in u for u in uses):
              errors.append('the coverage job must handle coverage: lcov through actions/lcov-report.')
          kover = [st for st in jobs['coverage']['steps'] if 'steps.kover.outputs.coverage-overall' in str(st.get('env', ''))]
          if not kover or 'exit 1' not in str(kover[0].get('run', '')):
              errors.append('coverage: kover must fail on a breached floor: kover-report only comments.')
          if errors:
              sys.exit('::error::' + ' '.join(errors))
          print('only coverage holds pull-requests: write, and the summary needs it')
          "

      # Each agent workflow used to run the picker as its own hosted job, needed
      # by the agent job. That billed two hosted starts before a proceeding run
      # ever reached the agent. Now the picker is a STEP inside `gate`, after
      # `agent-gate`, guarded on the gate's own `proceed`. Assert the new shape
      # rather than trust it stays this way: a `pick-runner` job creeping back
      # in "just for this one workflow" is exactly how it drifted before.
      - name: Agent workflows pick their runner inside the gate job
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml

          # Each workflow's gate hands its agent job one output, runner. deps-verify
          # picks two pools to choose from, because its verify job runs on light
          # for a green verdict and takes heavy only to build.
          agent_workflows = [
              ('issue-triage.yml',   'triage',    ['runner'], 1),
              ('issue-implement.yml','implement', ['runner'], 1),
              ('claude-assist.yml',  'assist',    ['runner'], 1),
              ('pr-review.yml',      'review',    ['runner'], 1),
              ('deps-verify.yml',    'verify',    ['runner'], 2),
          ]

          bad = []
          for f, agent_job, pools, picks in agent_workflows:
              path = '.github/workflows/' + f
              jobs = yaml.safe_load(open(path))['jobs']

              if 'pick-runner' in jobs:
                  bad.append(f + ': still has a standalone pick-runner job')
                  continue

              gate = jobs.get('gate')
              if gate is None:
                  bad.append(f + ': has no gate job')
                  continue

              steps = gate.get('steps') or []
              pick = [s for s in steps if 'pick-runner@' in str(s.get('uses', ''))]
              if len(pick) != picks:
                  bad.append(f + ': gate job must have exactly %d pick-runner step(s), found %d' % (picks, len(pick)))
                  continue

              for step in pick:
                  cond = str(step.get('if', ''))
                  if 'proceed' not in cond:
                      bad.append(f + ': a pick step is not guarded on a proceed output (if: %r)' % cond)

              for pool in pools:
                  if pool not in (gate.get('outputs') or {}):
                      bad.append(f + ': gate job has no ' + pool + ' output for the agent job to read')

              job = jobs.get(agent_job)
              if job is None:
                  bad.append(f + ': has no ' + agent_job + ' job')
                  continue
              if 'pick-runner' in (job.get('needs') or []):
                  bad.append(f + ': ' + agent_job + ' job still needs pick-runner')
              for pool in pools:
                  if 'needs.gate.outputs.' + pool not in str(job.get('runs-on', '')):
                      bad.append(f + ': ' + agent_job + ' job does not read runs-on from needs.gate.outputs.' + pool)

          if bad:
              sys.exit('::error::' + '; '.join(bad) + '. Folding the picker into the gate job is what makes a '
                        'proceeding agent run cost one hosted start instead of two.')
          print('every agent workflow picks its runner inside the gate job, guarded on proceed')
          "

      # The agent workflows' gates ran on a billed hosted runner before every
      # agent job. They now take the light pool of a private repo and stay hosted
      # for a public repo or a fork PR, through one expression, and every job
      # reports the runner it got. Three claims keep that from drifting: no
      # hosted literal is left behind, runner-report is the first step of every
      # job, and the kill switch is still the first rule the gate evaluates.
      - name: Agent workflow gates are off hosted minutes and keep the kill switch first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, yaml

          files = ['pr-review', 'claude-assist', 'issue-triage', 'issue-implement']
          # Written as two pieces so the workflow linter does not read it as an expression.
          expr = ('$' + '{{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) '
                  '&& \'["self-hosted","Linux","light"]\' || \'"ubuntu-latest"\') }}')
          bad = []
          for f in files:
              text = open('.github/workflows/' + f + '.yml').read()
              jobs = yaml.safe_load(text)['jobs']
              # The only hosted literal allowed is the one inside the expression.
              if 'ubuntu-latest' in text.replace(expr, ''):
                  bad.append(f + ': a hosted runner literal outside the gate expression')
              gate = jobs['gate']
              if gate.get('runs-on') != expr:
                  bad.append(f + ': gate runs-on is not the shared light-or-hosted expression')
              cond = str(gate.get('if', '')).strip()
              if not cond:
                  bad.append(f + ': gate has no job-level if for the payload-only filters')
              if 'agent:no-touch' in cond:
                  bad.append(f + ': the kill switch belongs to the gate action, not the job if')
              if gate.get('permissions', {}).get('actions') and f != 'pr-review':
                  bad.append(f + ': gate gained an actions permission')
              for name, job in jobs.items():
                  first = (job.get('steps') or [{}])[0]
                  if 'actions/runner-report@' not in str(first.get('uses', '')):
                      bad.append(f + ': job ' + name + ' does not start with runner-report')
                  elif (first.get('with') or {}).get('selector') is None:
                      bad.append(f + ': job ' + name + ' runner-report passes no selector')
              # The gate action is the step straight after the report, so
              # nothing evaluates ahead of agent:no-touch.
              if 'agent-gate@' not in str(gate['steps'][1].get('uses', '')):
                  bad.append(f + ': agent-gate is not the first step after runner-report')
          # Inside the gate, agent:no-touch precedes every other rule.
          sh = open('actions/agent-gate/gate.sh').read()
          nt = sh.index('RULE 0, the kill switch')
          for rule in ['RULE 0b', 'RULE 1,', 'RULE 2,', 'RULE 3,', 'RULE 4,', 'RULE 5,', 'RULE 6,']:
              if sh.index(rule) < nt:
                  bad.append('gate.sh evaluates ' + rule + ' before the kill switch')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('agent gates use the shared runner expression, report first and check agent:no-touch first')
          PY

      # A skip that should not have happened is the costly mistake here, above
      # all a `verified` label on a red build. test.sh asserts those cases first.
      - name: deps-verify decides when a run is skipped
        run: ./actions/deps-intent/test.sh

      # Which PR a run is about, and whether it is still that open PR at the
      # head it acted on. deps-verify reads it before and after its long job.
      - name: pr-facts resolves the PR and refuses one that moved
        run: ./actions/pr-facts/test.sh

      # The one guarded push of an agent's round: deps-verify uses it, and so
      # will any workflow that pushes agent commits to a PR branch.
      - name: push-round refuses what a round may not do
        run: ./actions/push-round/test.sh

      # Nothing in deps-verify waits for pr-checks (see deps-verify in AGENTS.md
      # for why). The gate reads a finished run once; verify takes heavy only
      # when the verdict is not green, and the agent runs only when the judge
      # says so.
      - name: deps-verify never waits, and takes heavy only to build
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          src = open('.github/workflows/deps-verify.yml').read()
          jobs = yaml.safe_load(src)['jobs']
          bad = []
          if sorted(jobs) != ['gate', 'verify']:
              bad.append('deps-verify must have exactly the gate and verify jobs, found %s: a third job is how a waiting job comes back' % sorted(jobs))
          if 'sleep ' in src:
              bad.append('deps-verify must not sleep: it reads a finished pr-checks run, it never polls one')
          gate, verify = jobs.get('gate') or {}, jobs.get('verify') or {}
          proceed = str((gate.get('outputs') or {}).get('proceed', ''))
          if \"steps.judge.outputs.judge != 'skip'\" not in proceed or \"steps.ci.outputs.ready == 'true'\" not in proceed:
              bad.append('the gate must proceed only with a ready verdict and a judge that is not skip')
          if \"needs.gate.outputs.proceed == 'true'\" not in str(verify.get('if')):
              bad.append('verify must run only when the gate proceeds')
          runner = str((gate.get('outputs') or {}).get('runner', ''))
          if \"verdict == 'green'\" not in runner or 'pick-light' not in runner or 'pick-heavy' not in runner:
              bad.append('the gate runner output must choose light for a green verdict and heavy otherwise')
          if 'needs.gate.outputs.runner' not in str(verify.get('runs-on')):
              bad.append('verify must run on the gate runner output')
          agent = [s for s in verify.get('steps', []) if s.get('id') == 'agent']
          if not agent or \"needs.gate.outputs.judge == 'agent'\" not in str(agent[0].get('if', '')):
              bad.append('the agent step must run only when the judge says agent')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('deps-verify never waits, and takes heavy only when there is something to build')
          "

      # deps-verify may push fix commits, so where the push happens is the
      # guard. Only the deterministic `push` step may run `git push`, only the
      # `publish` step may set labels, and the agent's prompt must still say it
      # does not push, merge or approve.
      - name: deps-verify pushes and labels only from its deterministic steps
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          steps = yaml.safe_load(open('.github/workflows/deps-verify.yml'))['jobs']['verify']['steps']
          bad = []
          for s in steps:
              run = str(s.get('run', ''))
              sid = s.get('id', s.get('name', s.get('uses', '?')))
              if 'git push' in run and sid != 'push':
                  bad.append('git push outside the push step (%s)' % sid)
              if '/labels' in run and sid != 'publish':
                  bad.append('labels written outside the publish step (%s)' % sid)
          agent = [s for s in steps if 'run-agent@' in str(s.get('uses', ''))]
          if len(agent) != 1:
              bad.append('expected exactly one run-agent step, found %d' % len(agent))
          else:
              prompt = agent[0]['with']['prompt']
              for phrase in ('Do NOT push', 'NEVER edit a lockfile', 'Do not comment on, label, merge or approve'):
                  if phrase not in prompt:
                      bad.append('agent prompt lost: ' + phrase)
          # Renovate ignores the fix commits only while the preset names
          # their author. A drift here marks every fixed branch as edited.
          email = yaml.safe_load(open('.github/workflows/deps-verify.yml'))['jobs']['verify']['env']['FIX_EMAIL']
          if email not in open('default.json').read():
              bad.append('FIX_EMAIL %s is not in default.json gitIgnoredAuthors' % email)
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('deps-verify pushes from push, labels from publish, and the agent is told neither')
          "

      # pick-runner.yml is a thin wrapper around actions/pick-runner now. Every
      # existing caller, internal or external, references these names, so the
      # wrapper losing one is a breaking change hiding behind a passing lint.
      - name: pick-runner.yml still exposes its original interface
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/pick-runner.yml'))
          # PyYAML parses the bare scalar 'on' as the boolean True, not the
          # string 'on'. doc['on'] is a KeyError waiting to look like a typo.
          call = doc[True]['workflow_call']
          inputs = set((call.get('inputs') or {}).keys())
          outputs = set((call.get('outputs') or {}).keys())

          need_in = {'weight', 'labels', 'fallback', 'fallback-when', 'hosted-runner', 'guard-public'}
          need_out = {'runner', 'selector', 'fell-back'}

          missing_in = need_in - inputs
          missing_out = need_out - outputs
          if missing_in or missing_out:
              sys.exit('::error::pick-runner.yml dropped input(s) %s and/or output(s) %s. Every caller '
                        'pinned at @v1 already depends on this exact interface.' % (sorted(missing_in), sorted(missing_out)))
          print('pick-runner.yml still exposes inputs %s and outputs %s' % (sorted(need_in), sorted(need_out)))
          "

      # The helper jobs of the shared checks run self-hosted in a private repo
      # (light, or control for pick and PR Checks: see AGENTS.md), with no hosted
      # minutes, and every runner job reports where it ran.
      # Each claim below drifted or could drift quietly: a literal
      # `ubuntu-latest` creeping back bills hosted minutes; a renamed summary job
      # breaks the required status context; a job whose first step is not the
      # runner report loses the report when a later step fails.
      - name: Checks helper jobs are self-hosted, static and report their runner
        run: |
          set -euo pipefail
          python3 -c "
          import glob, re, sys, yaml
          REPORT = 'dodi-smart/.github/actions/runner-report@v1'
          files = ['pr-checks', 'pick-runner', 'react-doctor', 'zavet-check']
          errors = []
          for name in files:
              path = '.github/workflows/%s.yml' % name
              text = open(path).read()
              for n, line in enumerate(text.splitlines(), 1):
                  if re.match(r'\s*runs-on:\s*[\"\']?ubuntu-latest', line):
                      errors.append('%s:%d: a literal ubuntu-latest runs-on bills hosted minutes in a private repo' % (path, n))
              for jid, job in yaml.safe_load(text)['jobs'].items():
                  if 'uses' in job:
                      continue
                  steps = job.get('steps') or []
                  if not steps or steps[0].get('uses') != REPORT:
                      errors.append('%s: job %s must start with %s' % (path, jid, REPORT))
                  runs_on = str(job.get('runs-on', ''))
                  if 'self-hosted' not in runs_on and 'needs.' not in runs_on:
                      errors.append('%s: job %s has runs-on %r, expected a self-hosted expression' % (path, jid, runs_on))
          pc = yaml.safe_load(open('.github/workflows/pr-checks.yml'))['jobs']
          wrapper = yaml.safe_load(open('.github/workflows/pick-runner.yml'))['jobs']['pick']
          # The wrapper's expression is the reference; the others must match it
          # character for character, and it must carry every part of the contract.
          EXPR = wrapper['runs-on']
          for part in ('github.event.repository.private', '!github.event.pull_request.head.repo.fork',
                       'self-hosted', 'Linux', 'light', 'ubuntu-latest'):
              if part not in EXPR:
                  errors.append('pick-runner.yml: the light runs-on expression lost ' + part)
          # pick and PR Checks run on control (see AGENTS.md): the light expression
          # with only the pool changed. chr(34) is a double quote: this script
          # sits inside one.
          Q = chr(34)
          CONTROL = EXPR.replace(Q + 'light' + Q, Q + 'control' + Q)
          for jid in ('pick', 'pr-checks'):
              if pc[jid]['runs-on'] != CONTROL:
                  errors.append('pr-checks.yml: %s must use the light expression with the pool set to control' % jid)
          # No run-time switch: a job's pool changes in a release, never through
          # a repository or org variable. No job but those two runs on control.
          for path in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/*.yml') + glob.glob('actions/*/*.sh')):
              if path.endswith('self-test.yml') or path.endswith('test.sh'):
                  continue
              text = open(path).read()
              if 'DODI_RUNS_ON' in text:
                  errors.append(path + ': reads a DODI_RUNS_ON_* switch; pools change in a release, not at run time')
              if text.count(Q + 'control' + Q) != (2 if path.endswith('/pr-checks.yml') else 0):
                  errors.append(path + ': names the control pool; only pr-checks pick and PR Checks may')
          if pc['pr-checks'].get('name') != 'PR Checks':
              errors.append('the summary job must stay named PR Checks, it is the required status context')
          modes = [s.get('with', {}).get('mode') for s in pc['pr-checks']['steps'] if s.get('uses') == REPORT]
          if 'run' not in modes:
              errors.append('the PR Checks job must run runner-report with mode: run')
          for f in glob.glob('actions/pick-runner/*'):
              body = open(f).read()
              if f.endswith('test.sh'):
                  continue
              for bad in ('actions/runners', 'create-github-app-token', 'gh api'):
                  if bad in body:
                      errors.append(f + ' mentions ' + bad + '; the picker must make no API call')
          if errors:
              sys.exit('::error::' + ' | '.join(errors))
          print('helper jobs in %s are self-hosted, report their runner, and the picker makes no API call' % files)
          "

      # The picker's `case` block is the only place a preset is defined, and the
      # README table is where people read it. Drift between them is how a
      # retired pool keeps being documented as live. The picker has no fallback
      # column any more: overflow is the queue's job, and the large pool carries
      # `light` too.
      - name: Runner presets match the README
        run: |
          set -euo pipefail
          python3 - <<'PRESETS'
          import re, sys

          picker = open('actions/pick-runner/pick.sh').read()
          readme = open('README.md').read()

          # Every `weight)  sel="..."` arm is a preset, whatever it is called, as
          # dev-standards' read-presets.sh reads it, so there is no list to keep.
          got = dict(re.findall(r'^\s+([a-z]+)\)\s+sel="([^"]*)"', picker, re.M))

          # The README rows are the table under its `weight` header.
          table = readme.split('| `weight` | Selector | Use |', 1)[1].split('\n\n', 1)[0]
          rows = {}
          for name, sel in re.findall(r'^\|\s*`([a-z]+)`\s*\|([^|]*)\|', table, re.M):
              sel = sel.strip().strip('`').strip()
              rows[name] = '' if sel in ('', 'none') else sel

          if 'light' not in got or 'light' not in rows:
              sys.exit('::error::parsed presets %r and README rows %r with no light. '
                       'Refusing to report clean from a parse that found nothing.'
                       % (sorted(got), sorted(rows)))

          bad = [k for k in sorted(set(got) | set(rows)) if got.get(k) != rows.get(k)]
          if bad:
              for k in bad:
                  print('::error::%s: picker=%r README=%r' % (k, got.get(k), rows.get(k)))
              sys.exit(1)

          print('preset table agrees: %r' % got)

          # No weight may name a fallback again. A busy pool queues, and the
          # large pool is reached through the `light` label it carries, not through
          # picker logic that could send a heavy job to the light pool (exit 137).
          bad = []
          if re.search(r'fb_def|fallback', re.sub(r'#.*', '', picker)):
              bad.append('pick.sh has fallback logic again')
          if 'fallback' in ' '.join(rows.values()).lower():
              bad.append('a README selector cell mentions a fallback')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('the picker has no fallback')
          PRESETS

      # Caching a project build directory is a governed rule, not a preference.
      # Those paths hold absolute paths that do not survive a move between
      # runners, and a per-SHA key falls through restore-keys to another
      # branch's compiled output. See AGENTS.md.
      - name: No workflow caches a build directory
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, re, yaml
          pat = re.compile(r'^(.*/)?(build|\.gradle)(/.*)?$')
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')):
              doc = yaml.safe_load(open(f)) or {}
              jobs = list((doc.get('jobs') or {}).values())
              jobs += [doc.get('runs') or {}]
              for job in jobs:
                  for step in (job.get('steps') or []) if isinstance(job, dict) else []:
                      if 'actions/cache' not in str(step.get('uses', '')):
                          continue
                      for line in str((step.get('with') or {}).get('path', '')).splitlines():
                          line = line.strip().lstrip('!')
                          if line and pat.match(line):
                              bad.append(f + ': ' + line)
          if bad:
              print('::error::a build directory is used as a cache path: ' + '; '.join(bad)
                    + '. Reuse of compiled output is the build tool job, by content hash. See AGENTS.md.')
              sys.exit(1)
          print('no build directory is cached')
          "

      # The image cache key is exact: a `restore-keys` line would load images the
      # CLI no longer asks for.
      - name: Supabase image cache key is exact
        run: |
          set -euo pipefail
          python3 - <<'SUPABASE'
          import sys, yaml
          bad = []
          start = yaml.safe_load(open('actions/supabase-start/action.yml'))['runs']['steps']
          caches = [s for s in start if str(s.get('uses', '')).startswith('actions/cache@')]
          if len(caches) != 1:
              bad.append('actions/supabase-start must hold exactly one actions/cache step')
          elif 'restore-keys' in (caches[0].get('with') or {}):
              bad.append('actions/supabase-start uses restore-keys; the key must be exact')
          if bad:
              print('::error::' + '; '.join(bad) + '. See AGENTS.md.')
              sys.exit(1)
          print('supabase cache key exact')
          SUPABASE

      # The release is cut the moment semantic-release succeeds, so the only thing
      # between a broken merge and `next` is this `needs`. Without it the two
      # workflows race, and `next` has already moved when Self test reports.
      - name: Publish release waits for Self test
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/publish-release.yml'))
          jobs = doc['jobs']
          gate = [n for n, j in jobs.items() if j.get('uses') == './.github/workflows/self-test.yml']
          if not gate:
              print('::error::publish-release.yml no longer calls self-test.yml, so next can move before Self test passes')
              sys.exit(1)
          needs = jobs['release'].get('needs') or []
          if isinstance(needs, str):
              needs = [needs]
          if not set(gate) <= set(needs):
              print('::error::the release job does not need ' + ', '.join(gate) + ', so next can move before Self test passes')
              sys.exit(1)
          print('release needs ' + ', '.join(gate))
          "

      - name: Every workflow and action is parseable YAML
        run: |
          set -euo pipefail
          python3 -c "
          import sys, glob, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')):
              try:
                  yaml.safe_load(open(f))
                  print('ok   ' + f)
              except Exception as e:
                  print('FAIL ' + f + ': ' + str(e)); bad += 1
          sys.exit(bad)
          "

      # The preset is only ever loaded if it is named `default.json`: for a bare
      # `github>owner/repo` Renovate fetches that one path, and on a 404 falls
      # back to `renovate.json`, which here extends this preset and so resolves
      # to nothing. That failure is silent -- Renovate keeps opening PRs, on
      # stock defaults, in every repo extending the preset. Assert the filename,
      # not just the contents. A JSONC object literal is also a valid JavaScript
      # expression, so the contents parse without pulling in a parser.
      - name: Renovate preset parses
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("default.json")) throw new Error("the preset must be named default.json; Renovate fetches no other filename");
            for (const wrong of ["default.json5", "default.jsonc"]) {
              if (fs.existsSync(wrong)) throw new Error(wrong + " is never fetched by Renovate, rename it to default.json");
            }
            const o = eval("(" + fs.readFileSync("default.json", "utf8") + ")");
            if (!Array.isArray(o.packageRules)) throw new Error("packageRules missing");
            if (!o.labels.includes("deps:update")) throw new Error("deps:update label missing");
            if (o.dependencyDashboard !== true) throw new Error("dependencyDashboard is off, so no repo gets a dashboard issue");
            if (o.updateNotScheduled !== false) throw new Error("updateNotScheduled must be false: the weekly schedule only gates new branches, so open branches would be rebased and re-tested all week");
            if (o.rebaseWhen !== "conflicted") throw new Error("rebaseWhen must be conflicted: any other value rebases every open branch each time the base moves, and each push reruns the PR checks");
            const actions = o.packageRules.find(r => r.automerge === true && (r.matchManagers || []).includes("github-actions"));
            if (!actions || !actions.minimumReleaseAge) throw new Error("the github-actions automerge rule needs a minimumReleaseAge: without it an upstream tag reaches every consumer within minutes");
            for (const e of o.extends || []) {
              if (e.includes("dodi-smart/.github")) throw new Error("the preset extends itself: " + e + ", which resolves to nothing");
            }
            console.log("preset OK:", Object.keys(o).join(", "));
          '

      # A malformed release.config.mjs does not fail loudly, it just stops
      # cutting releases, and the next channel stops moving with it.
      - name: Release and Renovate config parse
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import config from "./release.config.mjs";

            // Plugins are absolute paths into the package; pluginName maps back.
            const { pluginName } = await import("@dodi-smart/semantic-release-config");
            const byName = (name) => config.plugins.find(p => pluginName(p) === name);
            if (!config.branches.includes("main")) throw new Error("release config: main is not a release branch");
            if (!byName("@semantic-release/commit-analyzer")) throw new Error("release config: missing @semantic-release/commit-analyzer");
            // A release must not move a caller-facing tag. The next channel is moved by
            // scripts/channel-tag.sh and the major tag only by promote.yml.
            if (/git (tag|push)/.test(JSON.stringify(config.plugins))) throw new Error("release config: a release step moves a tag, so a merge reaches every caller without promote.yml");
            const analyzer = byName("@semantic-release/commit-analyzer");
            const deps = (analyzer[1].releaseRules || []).some(r => r.type === "chore" && r.scope === "deps" && r.release === "patch");
            if (!deps) throw new Error("release config: chore(deps) no longer cuts a patch, so releases stop on dependency updates");
            const notes = byName("@semantic-release/release-notes-generator");
            const types = ((notes[1].presetConfig || {}).types) || [];
            if (!types.length) throw new Error("release config: no changelog sections configured");

            // conventional-changelog-conventionalcommits v10 reads effect, not
            // hidden, and silently treats a leftover hidden key as a bump, so
            // a docs: commit would leak into the notes as an untitled bullet.
            for (const t of types) {
              if ("hidden" in t) throw new Error("release config: " + JSON.stringify(t) + " still carries hidden, which v10 of the preset ignores silently");
              if (t.effect !== "bump" && t.effect !== "hidden") throw new Error("release config: " + JSON.stringify(t) + " has an effect other than bump or hidden");
            }

            // Written as literal UTF-8. An earlier attempt lost every emoji in
            // transit and produced a plain changelog that looked deliberate,
            // so this asserts they survived rather than trusting the file.
            const visible = types.filter(t => t.effect !== "hidden");
            const plain = visible.filter(t => !/[^\x00-\x7F]/.test(t.section || ""));
            if (plain.length) throw new Error("release config: changelog section without an emoji: " + plain.map(t => t.section).join(", "));

            // conventional-changelog takes the FIRST matching entry, so a bare
            // chore listed before the scoped one swallows chore(deps) and hides it.
            const depsAt = types.findIndex(t => t.type === "chore" && t.scope === "deps");
            const choreAt = types.findIndex(t => t.type === "chore" && !t.scope);
            if (depsAt === -1) throw new Error("release config: chore(deps) has no changelog section, so a dependency release would be empty");
            if (choreAt !== -1 && choreAt < depsAt) throw new Error("release config: bare chore is listed before chore(deps), which hides dependency updates");

            const ren = JSON.parse(readFileSync("renovate.json", "utf8"));
            if (!ren.baseBranchPatterns.includes("main")) throw new Error("renovate: baseBranchPatterns must name main, the preset says develop");
            JSON.parse(readFileSync("package.json", "utf8"));

            console.log("release and renovate config OK");
          '

          # The shared package is never published. A release config that
          # gained the npm plugin would try, and fail for want of a token.
          node --input-type=module -e '
            import config from "./release.config.mjs";
            import { pluginName } from "@dodi-smart/semantic-release-config";
            const names = config.plugins.map(pluginName);
            if (names.includes("@semantic-release/npm")) throw new Error("release config: @semantic-release/npm is present, and the shared package is not published");
            console.log("nothing publishes, as expected");
          '

      # A real backmerge in a bun or pnpm repo conflicts on the lockfile, not
      # just package.json, because the shared git plugin commits those too.
      # Assert the resolve list and the input that extends it stay in place,
      # so an edit that narrows the list back down fails here, not in a
      # caller's release run after the tag already moved.
      - name: Backmerge auto-resolve list covers the shared config's lockfiles
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/release.yml'))
          # PyYAML reads the bare 'on' key as the boolean True (YAML 1.1).
          inputs = doc[True]['workflow_call']['inputs']
          if 'backmerge-resolve-paths' not in inputs:
              sys.exit('::error::release.yml lost the backmerge-resolve-paths input, a consuming repo can no longer add its own manifest/lockfile paths')
          if inputs['backmerge-resolve-paths'].get('default') != '':
              sys.exit('::error::backmerge-resolve-paths must default to \"\", so today\'s behaviour is unchanged when a caller does not set it')

          # The backmerge is the release job's last step: a job of its own
          # mints a second App token and makes a second full clone.
          if 'backmerge' in doc['jobs']:
              sys.exit('::error::release.yml has a backmerge job again; it belongs in the release job, sharing its token and checkout')
          steps = doc['jobs']['release']['steps']
          step = [s for s in steps if 'RESOLVE_EXTRA' in str(s.get('env', {}))]
          if not step:
              sys.exit('::error::the backmerge step no longer wires backmerge-resolve-paths through as RESOLVE_EXTRA')
          if steps[-1] is not step[0]:
              sys.exit('::error::the backmerge step is no longer the last step of the release job, so it could run before the release finished')
          if 'inputs.backmerge' not in str(step[0].get('if')):
              sys.exit('::error::the backmerge step lost its condition (inputs.backmerge on the backmerge-from branch)')
          script = step[0]['run']
          for f in ('package.json', 'package-lock.json', 'bun.lock', 'pnpm-lock.yaml', 'yarn.lock', 'CHANGELOG.md', '\$RESOLVE_EXTRA'):
              if f not in script:
                  sys.exit('::error::the backmerge auto-resolve loop no longer names ' + f)
          print('backmerge auto-resolve list is intact')
          "

      # What a consumer gets from the installer, checked by resolving.
      - name: Shared config links into a consumer
        run: ./actions/semantic-release-config/test.sh

      # The channel script decides what every caller runs; its tests build a
      # throwaway repo and bare remote, so nothing here touches this checkout.
      - name: Channel tags and ref pinning
        run: ./scripts/channel-tag.test.sh

      # The tooling is installed outside the checkout, so an install there
      # also resolving the caller's whole dependency tree cannot come back.
      - name: Release tooling installs outside the checkout and runs
        run: ./actions/release-tooling/test.sh

      - name: release.yml installs its tooling in a private prefix
        run: |
          set -euo pipefail
          python3 -c "
          import sys, yaml
          doc = yaml.safe_load(open('.github/workflows/release.yml'))
          inputs = doc[True]['workflow_call']['inputs']
          if inputs['semantic-release-packages'].get('default') != '':
              sys.exit('::error::semantic-release-packages must default to \"\", which installs the set pinned in actions/release-tooling')
          steps = doc['jobs']['release']['steps']
          install = [s for s in steps if s.get('name') == 'Install semantic-release']
          if len(install) != 1 or install[0].get('uses') != 'dodi-smart/.github/actions/release-tooling@v1':
              sys.exit('::error::the Install semantic-release step must use actions/release-tooling, which installs into a private prefix')
          text = '\n'.join(str(s.get('run', '')) for s in steps)
          for bad in ('npx semantic-release', 'npm install', '--no-save'):
              if bad in text:
                  sys.exit('::error::release.yml contains ' + bad + '. Tooling installed into the checkout also installs the caller\'s dependency tree, and npx ignores the private prefix.')
          action = yaml.safe_load(open('actions/release-tooling/action.yml'))
          for s in action['runs']['steps']:
              if 'actions/cache' in str(s.get('uses', '')) and (s.get('with') or {}).get('restore-keys'):
                  sys.exit('::error::release-tooling caches with restore-keys. Only an exact key, or a poisoned entry is reimported.')
          print('release.yml installs its tooling in a private prefix')
          "

      # env and build-env parsing, and bun version resolution.
      - name: setup-stack parses env files and resolves bun
        run: ./actions/setup-stack/test.sh

      # ~/.konan is a toolchain cache: an exact key, never restore-keys.
      - name: The Kotlin/Native cache uses an exact key
        run: |
          if grep -A4 'path: ~/.konan' actions/setup-stack/action.yml | grep -q restore-keys; then
            echo "::error::the ~/.konan cache uses restore-keys. Exact key only."; exit 1
          fi

      # A branch ref moves under every caller, and Renovate never proposes a change.
      - name: No action is pinned to a branch
        run: |
          if grep -nE '^\s*-?\s*uses:\s*\S+@(stable|main|master)\s*(#.*)?$' .github/workflows/*.yml actions/*/action.yml; then
            echo "::error::pin a tag or a full SHA, never a branch"; exit 1
          fi

      # deps-verify's gate and release.yml run on the light pool of a private
      # repository and on a hosted runner otherwise. The expression is the only
      # place `ubuntu-latest` may appear, the runner report is each job's first
      # step, and the gate's pre-filter may only test the SHAPE of a bot login, never
      # name one (a pre-filter stricter than agent-gate would skip a real PR).
      - name: deps-verify gate and release.yml select their runner by expression
        run: |
          set -euo pipefail
          python3 -c "
          import re, sys, yaml
          # No literal dollar-brace in this script: Actions would evaluate it before bash runs.
          D = chr(36) + '{' + '{'
          EXPR = D + ' fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && \'[\"self-hosted\",\"Linux\",\"light\"]\' || \'\"ubuntu-latest\"\') }}'
          bad = []
          for f, job in (('deps-verify.yml', 'gate'), ('release.yml', 'release')):
              path = '.github/workflows/' + f
              src = open(path).read()
              doc = yaml.safe_load(src)
              j = doc['jobs'][job]
              if j.get('runs-on') != EXPR:
                  bad.append(f + ': ' + job + ' runs-on is not the shared light-or-hosted expression')
              rest = src.replace(EXPR, '')
              if re.search(r'^\s*runs-on:\s*ubuntu-latest', rest, re.M):
                  bad.append(f + ': a runs-on: ubuntu-latest literal remains')
              first = j['steps'][0]
              if first.get('uses') != 'dodi-smart/.github/actions/runner-report@v1':
                  bad.append(f + ': first step of ' + job + ' is not runner-report')
          dv = yaml.safe_load(open('.github/workflows/deps-verify.yml'))['jobs']
          if dv['verify']['steps'][0].get('uses') != 'dodi-smart/.github/actions/runner-report@v1':
              bad.append('deps-verify.yml: first step of verify is not runner-report')
          # The gate keeps exactly the permissions it had, actions: write included.
          if dv['gate']['permissions'] != {'contents': 'read', 'pull-requests': 'read', 'actions': 'write'}:
              bad.append('deps-verify.yml: the gate permissions changed')
          cond = str(dv['gate'].get('if'))
          # Shape only: the list of dependency bots lives in agent-gate alone.
          for need in (\"endsWith(github.event.pull_request.user.login, '[bot]')\", \"workflow_run.conclusion != 'cancelled'\", \"workflow_run.conclusion != 'skipped'\", \"label.name == 'agent:review'\"):
              if need not in cond:
                  bad.append('deps-verify.yml: the gate if: lost ' + need)
          # release outputs are the contract every caller reads.
          rel = yaml.safe_load(open('.github/workflows/release.yml'))
          outs = rel[True]['workflow_call']['outputs']
          job_outs = rel['jobs']['release']['outputs']
          for o in ('released', 'version', 'tag', 'tags'):
              if outs.get(o, {}).get('value') != D + ' jobs.release.outputs.' + o + ' }}':
                  bad.append('release.yml: workflow output ' + o + ' no longer reads jobs.release.outputs.' + o)
              if job_outs.get(o) != D + ' steps.detect.outputs.' + o + ' }}':
                  bad.append('release.yml: job output ' + o + ' no longer reads steps.detect.outputs.' + o)
          if rel['jobs']['release']['permissions'] != {'contents': 'write', 'issues': 'write', 'pull-requests': 'write'}:
              bad.append('release.yml: the release job permissions changed')
          if bad:
              sys.exit('::error::' + '; '.join(bad))
          print('gate and release select their runner by expression, report it first, and keep their contracts')
          "

      # shellcheck, jactionlint, typos and the whitespace checks all run
      # from hk.pkl, the same definition the local git hooks use. mise.toml
      # pins every tool, and Renovate bumps the pins. .github/jactionlint.yaml
      # holds the linter's policy, with the reason for each exception.
      - uses: jdx/mise-action@v5
      - name: Lint (hk check --all)
        run: hk check --all
