# CycloneDX SBOM of the checkout, attached to each GitHub release a run just cut.
# Thin wrapper; the reasoning is in sbom.sh, the install in install.sh.
name: SBOM
description: Build a CycloneDX SBOM of the checkout with syft and attach it to the GitHub release of each new tag. Never fails the job.

inputs:
  tags:
    description: JSON array of the tags the run cut, as `release.yml`'s detect step writes them. Empty or `[]` does nothing.
    default: '[]'
  exclude:
    description: >-
      Extra globs to leave out of the scan, newline-separated, on top of the
      built-in list (dependency and build output directories). Relative to the
      checkout, e.g. `./fixtures/**`.
    default: ''
  repository:
    description: 'owner/repo'
    default: ${{ github.repository }}
  token:
    description: 'Token to upload release assets with. Needs contents: write.'
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if path="$("$ACTION_PATH/install.sh")"; then
          echo "path=$path" >> "$GITHUB_OUTPUT"
        else
          echo "::warning title=SBOM not attached::syft could not be installed, so no release got an SBOM."
        fi

    - if: steps.install.outputs.path != ''
      shell: bash
      env:
        SYFT:        ${{ steps.install.outputs.path }}
        TAGS:        ${{ inputs.tags }}
        EXCLUDE:     ${{ inputs.exclude }}
        REPO:        ${{ inputs.repository }}
        GH_TOKEN:    ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/sbom.sh"'
