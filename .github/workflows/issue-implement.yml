# Reusable: implement a PLANNED issue, as a PR.
#
# Requested with the `agent:implement` label or `@claude implement`.
#
# The gate is deterministic and runs before anything costs money. An issue is
# implemented only when `Triage state` is `Plan ready`, checked with jq against
# the field. Never ask the agent whether a plan looks good enough. It will
# sometimes accept a two-line issue body, and the result is twenty minutes of
# confident work on the wrong thing.
#
# There is no override. Not workflow_dispatch, not a maintainer. If an issue is
# not planned, the answer is to plan it.
#
# `Agent mode` decides who may trigger it. This workflow is what enforces it.
#
# THE AGENT NEVER PUSHES, OPENS, READIES OR MERGES. It writes code, tests and
# local commits. The steps after it push one round commit to a conventional
# branch and open a DRAFT pull request. When the issue's fields put it on the
# `ready` or `merge` tier (actions/factory), the PR also gets `agent:iterate`,
# and `pr-iterate.yml` takes it from there.
name: Issue Implement

on:
  workflow_call:
    inputs:
      runner-weight:
        type: string
        default: "heavy"     # implementing means building, not linting
      runner-labels:
        type: string
        default: ""
      # Which Triage state makes an issue eligible. Overridable, but think hard
      # before widening it. This is the whole safety property.
      required-state:
        type: string
        default: "Plan ready"
      base-branch:
        type: string
        default: ""       # defaults to the repo's default branch
      model:
        type: string
        default: "claude-opus-5"
      timeout-minutes:
        type: number
        default: 45
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
      GH_APP_CLIENT_ID:        { required: false }
      GH_APP_PRIVATE_KEY:      { required: false }

concurrency:
  group: implement-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false      # never kill a run that may have pushed a branch

# Every job grants its own, so one added later starts with nothing.
permissions: {}

jobs:
  # The picker runs INSIDE this job, after the last step that can still say
  # no, so it never runs for an event that will not proceed.
  # The gate runs on the light pool of a private repo and on a hosted runner
  # otherwise (a public repo, or a fork PR, which the pool cannot serve). The
  # `if:` below is a cheap pre-filter on the event payload alone, so an event the
  # gate would only stop costs no runner at all. It is strictly narrower than the
  # gate: every rule the gate keeps (`agent:no-touch` first, then the rest) still
  # runs for an event that passes it, and nothing the gate posts is skipped.
  gate:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'agent:implement')
      && (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@claude'))
      && !(endsWith(github.event.issue.user.login, '[bot]') || startsWith(github.event.issue.user.login, 'app/'))
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","light"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10   # the picker calls the org API and may retry
    permissions:
      contents: read
      issues: write            # to explain a refusal and clear the request label
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      runner:  ${{ steps.pick.outputs.runner }}
      tier:    ${{ steps.fields.outputs.tier }}
      branch:  ${{ steps.branch.outputs.branch }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.28.3
        with:
          selector: light

      # agent:no-touch first, unconditionally.
      - id: gate
        uses: dodi-smart/.github/actions/agent-gate@pinned/v1.28.3
        with:
          labels:        ${{ toJson(github.event.issue.labels.*.name) }}
          event-name:    ${{ github.event_name }}
          event-action:  ${{ github.event.action }}
          label:         ${{ github.event.label.name }}
          request-label: 'agent:implement'
          author:        ${{ github.event.issue.user.login }}
          comment:       ${{ github.event.comment.body }}
          commands:      'implement'
          bots:          'reject'
          skip-draft:    'false'

      # Is there a plan, and may this actor trigger it? Both answers come from
      # fields the triage workflow already wrote, read once by actions/factory,
      # which also gives the autonomy tier pr-iterate computes the same way.
      - id: fields
        if: steps.gate.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/factory@pinned/v1.28.3
        with:
          command: fields
          issue:   ${{ github.event.issue.number }}

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PROCEED:  ${{ steps.gate.outputs.proceed }}
          READ:     ${{ steps.fields.outputs.read }}
          STATE:    ${{ steps.fields.outputs.state }}
          MODE:     ${{ steps.fields.outputs.mode }}
          REPO:     ${{ github.repository }}
          NUM:      ${{ github.event.issue.number }}
          ACTOR:    ${{ github.actor }}
          REQUIRED: ${{ inputs.required-state }}
        run: |
          set -euo pipefail
          if [ "$PROCEED" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A failed read is not an unplanned issue. Fail rather than refuse.
          if [ "$READ" != "true" ]; then
            echo "::error title=Fields not read::could not read the issue fields of #$NUM"; exit 1
          fi
          state="$STATE"; mode="$MODE"
          echo "Triage state='${state:-<unset>}'  Agent mode='${mode:-<unset>}'"

          refuse() {
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUM" --repo "$REPO" --body "$1" || true
            # Clear the request label so the issue does not look like work in
            # flight. Request labels are self-clearing on every path.
            gh issue edit "$NUM" --repo "$REPO" --remove-label 'agent:implement' 2>/dev/null || true
            echo "REFUSED: $1"
            exit 0
          }

          if [ "$state" != "$REQUIRED" ]; then
            refuse "**Not implementing this yet.** \`Triage state\` is \`${state:-unset}\`, and implementation requires \`$REQUIRED\`.

          Implementing an unplanned issue produces a confident PR built on assumptions nobody checked. Run triage first, by applying \`agent:triage\` or commenting \`@claude triage\`, and once a plan is posted and the state reaches \`$REQUIRED\`, ask again."
          fi

          case "${mode:-}" in
            "Human only")
              refuse "**Not implementing this.** \`Agent mode\` is \`Human only\` on this issue, which is a deliberate instruction that no agent should write the code. Change the field if that is no longer intended." ;;
            "Supervised"|"")
              # Supervised (and unset, which is treated as supervised) requires a
              # human with write access to have asked. The action already refuses
              # actors without write access; this is the same bar, applied before
              # the expensive part rather than inside it.
              perm=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo none)
              case "$perm" in
                admin|write|maintain) echo "actor $ACTOR has $perm, proceeding" ;;
                *) refuse "**Not implementing this.** \`Agent mode\` is \`${mode:-Supervised (unset)}\`, which requires someone with write access to request it. \`$ACTOR\` has \`$perm\`." ;;
              esac ;;
            "Autonomous")
              echo "Agent mode is Autonomous, proceeding" ;;
            *)
              refuse "**Not implementing this.** \`Agent mode\` is \`$mode\`, which this workflow does not recognise." ;;
          esac

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The branch name, from the issue type and title.
      - id: branch
        if: steps.check.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/factory@pinned/v1.28.3
        with:
          command: branch
          args: |-
            ${{ github.event.issue.type.name }}
            ${{ github.event.issue.number }}
            ${{ github.event.issue.title }}

      # Only when the run above is still proceeding: an unplanned issue or a
      # refused actor must never pay for a hosted picker.
      - id: pick
        if: steps.check.outputs.proceed == 'true'
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.28.3
        with:
          weight:             ${{ inputs.runner-weight }}
          labels:             ${{ inputs.runner-labels }}
          gh-app-client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  implement:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ fromJson(needs.gate.outputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read           # the push and the PR use the App token
      issues: write            # to report back and clear the request label
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO:     ${{ github.repository }}
      NUM:      ${{ github.event.issue.number }}
      BRANCH:   ${{ needs.gate.outputs.branch }}
      TIER:     ${{ needs.gate.outputs.tier }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.28.3
        with:
          selector: ${{ needs.gate.outputs.runner }}

      # No credentials persist. The agent runs the repo's install and test
      # scripts here, and a token they could read is a token they could push
      # with. The push token is minted after the agent, for one step.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}
          persist-credentials: false

      - id: facts
        env:
          BASE_REF: ${{ inputs.base-branch || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git switch -q -c "$BRANCH"
          # The identity every factory commit carries, set before the agent so
          # its commits start as it. The push step rewrites the round as it too.
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
          OUT="$RUNNER_TEMP/factory"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          {
            echo "base-sha=$(git rev-parse HEAD)"
            echo "base-ref=$BASE_REF"
          } >> "$GITHUB_OUTPUT"

      # Agent mode, never tag mode: tag mode creates its own branch, pushes,
      # and posts a "Create PR" link. Here the agent only commits; the steps
      # below push and open the PR.
      - id: agent
        uses: dodi-smart/.github/actions/run-agent@pinned/v1.28.3
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ inputs.model }}
          allowed-tools: 'Bash "Bash(gh:*)" Read Write Edit Grep Glob'
          # run-agent guarantees this file on every path, with `why` when the
          # agent left none, so the steps below read one file.
          report-file:     ${{ runner.temp }}/factory/pr.json
          report-valid:    '(.title | type == "string" and length > 0) and (.body | type == "string" and length > 0)'
          report-fallback: '{"title": "", "body": ""}'
          prompt: |
            Implement issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            You are on the branch `${{ needs.gate.outputs.branch }}`, made for it.

            A plan for this issue already exists. `Triage state` is
            `${{ inputs.required-state }}`, which is why this run was allowed to
            start. Read the issue and its comments with `gh issue view
            ${{ github.event.issue.number }} --comments` and find that plan.
            Follow it.

            If, having read the code, you believe the plan is wrong, DO NOT
            quietly implement something else. Say so on the issue with
            `gh issue comment`, explain what you found, commit nothing, and
            stop. A plan that survived triage and then turns out to be wrong is
            worth a conversation, not a silent substitution.

            ## How to work

            1. Read the repo's CLAUDE.md / AGENTS.md first if present, and match
               the surrounding code: its naming, its comment density, its idiom.
            2. Holdout tests first. If the plan has an `Acceptance criteria`
               list, write one test per criterion BEFORE the code, where the
               repo keeps its tests and in its own test runner. List every such
               file, one repo-relative path per line, in `.factory/holdout`.
               Later fix rounds may not change or delete these files or that
               list; a push step refuses them. So test the behaviour the
               criterion states, not the code you are about to write. With no
               criteria, write no `.factory/holdout`.
            3. Implement. Write or update other tests as usual. A change with no
               test is not finished unless the repo has no test setup, in which
               case say so in the PR body.
            4. Run whatever the repo uses to check itself (lint, typecheck,
               tests) and fix what you broke.
            5. Commit with `git commit`. Any message: a later step writes your
               commits as one. Do NOT push, and do NOT open a pull request.

            ## Report

            Write `${{ runner.temp }}/factory/pr.json` with the Write tool:

              {"title": "<PR title>", "body": "<PR body, markdown>"}

            The title is a conventional commit header, e.g. `fix(auth): keep
            the session after a refresh`. If the repo has a commitlint config,
            read it: some enforce a scope-enum and reject a scope you invented.

            The body goes in this shape:

              ## What changed
              One paragraph. The change, not a file list.

              ## Why
              The issue's constraint, in your own words.

              ## Tested
              What you ran and what it showed. Name the command. Name the
              holdout tests, or say there were no acceptance criteria.

              ## Not verified
              What you could not check, and why. Write "nothing" only when
              that is true.

            An honest "I could not verify X" is worth more than a confident
            summary. Do not restate the issue's Priority, Effort or Risk
            fields. Those live on the issue. Do not add `Closes`; the step
            that opens the PR adds it.

            Do not change labels or `Triage state`. The steps after you do
            what is needed.

      # Minted after the agent, so no repo script ever ran beside it.
      # Not narrowed with permission-*: the push must satisfy the org rulesets the App bypasses.
      - id: app-token
        if: ${{ !cancelled() }}
        uses: dodi-smart/.github/actions/app-token@pinned/v1.28.3
        with:
          client-id:   ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - id: subject
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          subject=$(jq -r '.title // ""' "$OUT/pr.json" 2>/dev/null | head -n 1 | tr -d '\r' || true)
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      # Only this step pushes, as round 0, one commit, to a branch that must
      # not exist yet. See actions/factory/factory.sh for every refusal.
      - id: push
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        uses: dodi-smart/.github/actions/factory@pinned/v1.28.3
        with:
          command:   push
          issue:     ${{ github.event.issue.number }}
          base-sha:  ${{ steps.facts.outputs.base-sha }}
          round:     '0'
          head-ref:  ${{ needs.gate.outputs.branch }}
          subject:   ${{ steps.subject.outputs.subject }}
          # The agent may set its own identity; round 0 is rewritten as
          # claude[bot] either way, and only this job's agent committed here.
          agent-emails: claude@anthropic.com
          app-token: ${{ steps.app-token.outputs.token }}

      # The PR is opened here, from the agent's files, never by the agent.
      # Always a draft. A `ready` or `merge` tier also gets `agent:iterate`,
      # which hands the PR to pr-iterate.
      - id: open
        if: ${{ !cancelled() && steps.push.outputs.pushed == 'true' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_REF:  ${{ steps.facts.outputs.base-ref }}
          SHA:       ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          title=$(git log -1 --format=%s "$SHA")
          {
            body=$(jq -r '.body // ""' "$OUT/pr.json" 2>/dev/null || true)
            if [ -n "$body" ]; then printf '%s\n' "$body"
            else printf 'The agent wrote no PR body: %s\n' "$(jq -r '.why // "see the run log"' "$OUT/pr.json" 2>/dev/null || echo 'see the run log')"; fi
            echo
            case "$TIER" in
              merge) echo "This PR may merge on its own once PR Checks and review pass. Add \`agent:no-touch\` to stop it." ;;
              ready) echo "This PR is marked ready for review on its own once PR Checks pass. A person merges it." ;;
            esac
            echo
            echo "Closes #$NUM"
          } > "$OUT/pr.md"
          labels=()
          [ "$TIER" = merge ] || [ "$TIER" = ready ] && labels=(--label agent:iterate)
          GH_TOKEN="$APP_TOKEN" gh label create agent:iterate --repo "$REPO" --color 5319e7 \
            --description "Agent fix loop: fix red checks and review findings, then hand on" >/dev/null 2>&1 || true
          url=$(GH_TOKEN="$APP_TOKEN" gh pr create --repo "$REPO" --draft --base "$BASE_REF" --head "$BRANCH" \
                  --title "$title" --body-file "$OUT/pr.md" "${labels[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Draft PR opened::$url (tier $TIER)"

      # Report on the issue, and clear the request label on every path.
      - if: ${{ always() }}
        env:
          URL:     ${{ steps.open.outputs.url }}
          REFUSED: ${{ steps.push.outputs.refused }}
          RUN:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$URL" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "Opened $URL." || true
          elif [ -n "$REFUSED" ] && [ "$REFUSED" != "the agent committed nothing" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "**Implementation was not pushed.** $REFUSED. [Run log]($RUN)." || true
          fi
          gh issue edit "$NUM" --repo "$REPO" --remove-label 'agent:implement' >/dev/null 2>&1 || true
