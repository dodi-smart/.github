# Install a toolchain, and decide where its package cache lives.
#
# Stack is a VALUE, so it is an input rather than one caller template per stack.
# Five stacks across three workflows would otherwise be fifteen files to keep in
# agreement, and the Gradle one had already grown a product-specific task name.
#
# Cache modes, resolved below:
#
#   isolate=true             -> RUNNER_TEMP dirs, GitHub cache off (deps-verify),
#                               and RUNNER_PERSISTENT_CACHE is ignored
#   RUNNER_PERSISTENT_CACHE  -> the runner's own declaration, on any OS: a writable
#                               directory that outlives the job. GRADLE_USER_HOME
#                               and KONAN_DATA_DIR move under it, and GitHub cache
#                               is off, because the directory IS the cache. Aimed
#                               at the Mac VMs, where a host directory share
#                               survives the VM. Set but not a writable directory:
#                               a warning, then the mode the runner would get anyway
#   self-hosted Linux ARM64  -> isolated anyway; matches no runner today, and is
#                               kept because it describes a class of machine
#   self-hosted Linux X64    -> home dirs, GitHub cache off; the named volume
#                               the runner image mounts IS the cache
#   self-hosted macOS        -> home dirs, and cache=auto becomes true: the
#                               runners are image-based VMs that start every job
#                               with an empty home, so no volume backs anything
#   github-hosted            -> home dirs, and cache=auto becomes true
#
#   Wherever the Actions cache is on, only the default branch saves to it
#   (cache_save); every other ref restores and never writes.
#
# Two rules that are easy to undo by accident:
#
#   PUB_CACHE is job-scoped in EVERY mode. A home dir is only worth using if a
#   named volume backs it, and the image mounts none for ~/.pub-cache.
#
#   Hosted GitHub cache is ONE mechanism per stack (setup-gradle / rust-cache /
#   flutter-action). Never a package store, and never restore-keys on one, which
#   is how a poisoned entry reimports. The one extra cache, ~/.konan, is a
#   toolchain download (Kotlin/Native's LLVM), not a store: exact key, no restore-keys.
#
#   .next/cache (next-cache) is the one cache that takes restore-keys, because
#   Next addresses its entries by content. See the `next` step.
name: Setup stack
description: Install the toolchain for a stack and resolve its package-cache mode.

inputs:
  stack:
    description: 'bun | node | gradle | android | flutter | rust | xcode | none'
    required: true
  node-version:
    description: 'For stack=node, and for semantic-release on any stack'
    default: '24'
  bun-version:
    description: >-
      For stack=bun. `auto` (or empty) takes the repo's own pin, in this order:
      package.json `packageManager` (bun@x.y.z), .bun-version, .tool-versions,
      mise.toml, .mise.toml, and falls back to latest with a notice when none
      names bun. Any explicit version, `latest` included, is used as given.
      Needs the repo checked out first.
    default: 'auto'
  java-version:
    description: 'For gradle/android/flutter. Empty skips the JDK on flutter.'
    default: '21'
  flutter-version:
    description: 'For stack=flutter. Empty takes the channel head.'
    default: ''
  flutter-channel:
    description: 'For stack=flutter'
    default: 'stable'
  rust-toolchain:
    description: 'For stack=rust: stable, nightly, a version such as 1.89.0, or any rustup toolchain specifier'
    default: 'stable'
  rust-components:
    description: 'For stack=rust, e.g. "clippy, rustfmt"'
    default: 'clippy, rustfmt'
  xcode-version:
    description: 'For stack=xcode. Empty takes the runner default.'
    default: ''
  isolate:
    description: >-
      Pin package caches to RUNNER_TEMP and disable GitHub cache. Forced on for
      self-hosted Linux ARM64. Default false: X64 self-hosted uses home dirs
      backed by named volumes, hosted and macOS self-hosted use home dirs plus
      the toolchain cache actions. PUB_CACHE is job-scoped either way.
    default: 'false'
  cache:
    description: >-
      auto | true | false. auto becomes true on github-hosted and on self-hosted
      macOS (ephemeral VMs), and is ignored when isolated, on self-hosted
      Linux (persistent volumes are the cache there) and when the runner sets
      RUNNER_PERSISTENT_CACHE to a writable directory (that directory is the
      cache). Applies to setup-gradle / rust-cache / flutter-action, the
      Kotlin/Native toolchain cache and setup-bun's cache of the bun executable,
      never bun's install cache.
    default: 'auto'
  next-cache:
    description: >-
      auto | true | false. Keep Next.js's build cache (`.next/cache`) between
      jobs, for every directory holding a next.config.{js,mjs,cjs,ts,mts} within
      three levels (node_modules and .git skipped). auto is on for stack bun or
      node when one is found; true falls back to the repo root. Where a
      directory outlives the job (RUNNER_PERSISTENT_CACHE, or ~/.cache/next on
      self-hosted Linux) `.next/cache` becomes a link into it, one subdirectory
      per repository; elsewhere the Actions cache is used when the cache mode
      allows it. Always off when isolated, true included: a verification job
      must not see yesterday's build. Needs the repo checked out first.
    default: 'auto'

  env:
    description: >-
      Newline-separated KEY=VALUE applied to every command step the caller runs.
      Written to a sourceable file rather than $GITHUB_ENV, because GitHub
      refuses a few names there, NODE_OPTIONS among them, since it can inject
      code into node processes the runner itself spawns, and that is exactly the
      variable a Next.js build needs. Read the path from the `env-file` output
      and source it. Placeholders and build tuning only, never secrets: a value
      that must stay secret has no business in a PR build log.
    default: ''
  build-env:
    description: >-
      Same format and parser as `env`, for the build command only. Read the path
      from the `build-env-file` output and source it alone in the build step:
      it exports `env` first, then `build-env`. Kept apart from `env` so a placeholder the build needs is not
      in scope for lint and test.
    default: ''

  # Command overrides. "@stack" means the conventional command for this stack;
  # an explicit empty string means the repo has no such step. Those differ, and
  # a plain default cannot express both. Resolved here so callers read
  # `steps.setup.outputs.install` instead of reimplementing the precedence.
  install:   { description: 'Override the install command',   default: '@stack' }
  lint:      { description: 'Override the lint command',      default: '@stack' }
  typecheck: { description: 'Override the typecheck command', default: '@stack' }
  test:      { description: 'Override the test command',      default: '@stack' }
  build:     { description: 'Override the build command',     default: '@stack' }
  design-lint:
    description: >-
      Design-system lint command (e.g. `bun run lint:design` running oxlint +
      @shadcn/lint). Empty means no step. No `@stack` default: this is opt-in
      per repo.
    default: ''
  lock:
    description: >-
      The command that rewrites this stack's lockfile from its manifests, run
      in the lockfile's directory. "@stack" is the default below; override it
      for a node repo on pnpm or yarn. Empty means the stack has none.
    default: '@stack'
  version-files:
    description: >-
      ERE over repo paths of the version declarations a dependency fix may
      change for this stack (manifests, toolchain pins). "@stack" is the
      default below.
    default: '@stack'


outputs:
  cache-enabled:
    description: 'true when this job uses the GitHub Actions cache. See the README, Caches.'
    value: ${{ steps.resolve.outputs.cache_enabled }}
  env-file:
    description: >-
      Path to a shell file exporting the `env` input. Always written, empty when
      nothing was given, so a caller can source it unconditionally.
    value: ${{ steps.stepenv.outputs.file }}
  build-env-file:
    description: >-
      Path to a shell file exporting `env` and then `build-env`, for the build
      step alone. Always written, so a caller can source it unconditionally.
    value: ${{ steps.stepenv.outputs.build-file }}
  install:
    description: 'Resolved install command: the override, or the stack default. Empty means skip.'
    value: ${{ steps.defaults.outputs.install }}
  lint:
    description: 'Resolved lint command. Empty means skip.'
    value: ${{ steps.defaults.outputs.lint }}
  typecheck:
    description: 'Resolved typecheck command. Empty means skip.'
    value: ${{ steps.defaults.outputs.typecheck }}
  test:
    description: 'Resolved test command. Empty means skip.'
    value: ${{ steps.defaults.outputs.test }}
  build:
    description: 'Resolved build command. Empty means skip.'
    value: ${{ steps.defaults.outputs.build }}
  design-lint:
    description: 'Resolved design-lint command. Empty means skip.'
    value: ${{ steps.defaults.outputs.design-lint }}
  lock:
    description: 'Resolved lock command. Empty means the stack has none.'
    value: ${{ steps.defaults.outputs.lock }}
  version-files:
    description: 'Resolved ERE of version declarations a dependency fix may change.'
    value: ${{ steps.defaults.outputs.version-files }}
  lockfiles:
    description: 'ERE of every lockfile, whatever the stack. Never hand-edited. The one list; deps-intent reads the same file.'
    value: ${{ steps.defaults.outputs.lockfiles }}

runs:
  using: composite
  steps:
    # A non-cone sparse checkout in an earlier job leaves core.sparseCheckout=true
    # in .git/config of the persistent workspace, and actions/checkout's own
    # `sparse-checkout disable` does not clear it on git 2.43: every later
    # checkout there stays sparse. Undo it, so the job sees the whole tree.
    #
    # That workspace is also a blob-less partial clone, so widening the tree
    # lazily fetches the missing blobs, and checkouts no longer persist their
    # credentials: on a private repo the fetch died with "could not read
    # Username". The job token is handed to this one git command through
    # GIT_CONFIG_* env, never written to .git/config or put on the command line,
    # where another job on the same machine could read it.
    - if: runner.environment == 'self-hosted'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail
        if [ "$(git config --local --get core.sparseCheckout 2>/dev/null)" = true ]; then
          echo "::notice::healing a sparse workspace left by an earlier job"
          git config --local --unset core.sparseCheckout
          # `tr`, not `base64 -w0`: BSD base64 on a macOS runner has no -w.
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          if ! GIT_CONFIG_COUNT=1 \
               GIT_CONFIG_KEY_0="http.$SERVER_URL/.extraheader" \
               GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
               git sparse-checkout disable; then
            echo "::error::could not widen the sparse workspace an earlier job left on this runner. Clear the runner's workspace for this repo and re-run."
            exit 1
          fi
        fi

    - id: resolve
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        ISOLATE: ${{ inputs.isolate }}
        CACHE: ${{ inputs.cache }}
        NEXT_CACHE: ${{ inputs.next-cache }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_OS: ${{ runner.os }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # RUNNER_PERSISTENT_CACHE is read from the process environment: the runner
      # exports its .env into every job, so it is not an input of this step.
      # The values written to GITHUB_ENV are cache paths under RUNNER_TEMP or under
      # the runner's own RUNNER_PERSISTENT_CACHE, never workflow input.
      # jactionlint ignore=github-env
      run: |
        set -euo pipefail
        case "$STACK" in
          bun|node|gradle|android|flutter|rust|xcode|none) : ;;
          *) echo "::error::unknown stack '$STACK' (expected bun|node|gradle|android|flutter|rust|xcode|none)"; exit 1 ;;
        esac
        case "$CACHE" in
          auto|true|false) : ;;
          *) echo "::error::cache must be auto, true, or false (got '$CACHE')"; exit 1 ;;
        esac
        case "$NEXT_CACHE" in
          auto|true|false) : ;;
          *) echo "::error::next-cache must be auto, true, or false (got '$NEXT_CACHE')"; exit 1 ;;
        esac

        # isolate=true, or self-hosted Linux ARM64. Deliberately not plain
        # ARM64: the macOS runners are ARM64 too and have no volumes to grow.
        do_isolate=false
        if [ "$ISOLATE" = "true" ]; then
          do_isolate=true
        elif [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] \
          && [ "${RUNNER_OS:-}" = "Linux" ] && [ "${RUNNER_ARCH:-}" = "ARM64" ]; then
          do_isolate=true
        fi

        # GitHub Actions cache: never when isolated, never on self-hosted Linux
        # (a persistent volume is the cache there). self-hosted macOS is an
        # ephemeral VM with an empty home per job, so it caches like hosted.
        # An unknown environment falls through to hosted, so a job that lands
        # on ubuntu-latest still caches.
        cache_enabled=false
        if [ "$do_isolate" != "true" ] \
          && { [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ] || [ "${RUNNER_OS:-}" = "macOS" ]; }; then
          if [ "$CACHE" = "true" ] || [ "$CACHE" = "auto" ]; then
            cache_enabled=true
          fi
        fi

        # The runner declares a directory that outlives the job (a host share
        # mounted into a VM, say). Gradle and Kotlin/Native live there, and the
        # directory is the cache, so every Actions cache goes off. Never a reason
        # to fail the job: a path that is not a writable directory is a warning.
        # The path may contain spaces (VM shares mount under a name with one), so
        # every use is quoted. GITHUB_ENV takes KEY=VALUE to the end of the line.
        persistent=""
        if [ "$do_isolate" != "true" ] && [ -n "${RUNNER_PERSISTENT_CACHE:-}" ]; then
          if [ -d "$RUNNER_PERSISTENT_CACHE" ] && [ -w "$RUNNER_PERSISTENT_CACHE" ] \
            && mkdir -p "$RUNNER_PERSISTENT_CACHE/gradle" "$RUNNER_PERSISTENT_CACHE/konan"; then
            persistent="$RUNNER_PERSISTENT_CACHE"
            cache_enabled=false
            {
              echo "GRADLE_USER_HOME=${persistent}/gradle"
              echo "KONAN_DATA_DIR=${persistent}/konan"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::RUNNER_PERSISTENT_CACHE is set but is not a writable directory; ignoring it and using the usual cache mode for this runner"
          fi
        fi

        # The one directory that outlives the job, for caches that are a plain
        # directory (Next's): the runner's declaration, else the home the named
        # volume backs on self-hosted Linux. Empty everywhere else.
        cache_dir="$persistent"
        if [ -z "$cache_dir" ] && [ "$do_isolate" != "true" ] && [ -n "${HOME:-}" ] \
          && [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${RUNNER_OS:-}" = "Linux" ]; then
          cache_dir="$HOME/.cache"
        fi

        # No volume backs ~/.pub-cache and the image's LRU cap does not reach
        # it, so it is job-scoped in every mode. See the header.
        echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

        if [ "$do_isolate" = "true" ]; then
          {
            echo "BUN_INSTALL_CACHE_DIR=${RUNNER_TEMP}/bun-cache"
            echo "npm_config_cache=${RUNNER_TEMP}/npm-cache"
            # pnpm reads npm_config_* as its own config: npm_config_store_dir
            # is store-dir, npm_config_cache_dir is cache-dir. npm's `cache`
            # setting above is NOT pnpm's, so both are needed. Without them
            # an isolated job still wrote to the shared ~/.cache/pnpm store.
            echo "npm_config_store_dir=${RUNNER_TEMP}/pnpm-store"
            echo "npm_config_cache_dir=${RUNNER_TEMP}/pnpm-cache"
            # Berry derives YARN_CACHE_FOLDER/YARN_GLOBAL_FOLDER from
            # cacheFolder/globalFolder; classic reads YARN_CACHE_FOLDER.
            echo "YARN_CACHE_FOLDER=${RUNNER_TEMP}/yarn-cache"
            echo "YARN_GLOBAL_FOLDER=${RUNNER_TEMP}/yarn-global"
            echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle-home"
            echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home"
          } >> "$GITHUB_ENV"
        fi

        # Which refs may write the Actions cache: the default branch only. An entry
        # saved on a pull request ref is scoped to that PR, so no other PR can read
        # it, and on the Mac hosts its upload took minutes. Every other ref reads.
        cache_save=false
        if [ "$cache_enabled" = true ] && [ -n "${DEFAULT_BRANCH:-}" ] \
          && [ "${REF:-}" = "refs/heads/$DEFAULT_BRANCH" ]; then
          cache_save=true
        fi

        {
          echo "isolated=$do_isolate"
          echo "cache_enabled=$cache_enabled"
          echo "cache_save=$cache_save"
          echo "persistent=$persistent"
          echo "cache_dir=$cache_dir"
        } >> "$GITHUB_OUTPUT"
        echo "stack: $STACK, isolate=$do_isolate, cache=$cache_enabled, save=$cache_save, persistent=${persistent:-none} (input cache=$CACHE, env=${RUNNER_ENVIRONMENT:-unknown}/${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"

    # Next's build cache. `link` points .next/cache into resolve's cache_dir,
    # where checkout's clean cannot reach it; `actions` hands the two cache steps
    # below the paths and the key. Off when isolated, next-cache=true included:
    # a verification job must not see yesterday's build state.
    - id: next
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        NEXT_CACHE: ${{ inputs.next-cache }}
        ISOLATED: ${{ steps.resolve.outputs.isolated }}
        CACHE_ENABLED: ${{ steps.resolve.outputs.cache_enabled }}
        CACHE_DIR: ${{ steps.resolve.outputs.cache_dir }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
      # GITHUB_REPOSITORY comes from the runner. Paths are quoted: a cache_dir can
      # contain spaces. No mapfile, so it runs on a macOS runner's bash 3.2.
      run: |
        set -euo pipefail
        mode=off; paths=""; key=""; restore=""; apps=""
        # isolated -> off; false -> off; true -> on; auto -> on for bun and node
        # only, so no other stack walks its tree.
        on=false
        case "$NEXT_CACHE:$ISOLATED:$STACK" in
          *:true:*|false:*) : ;;
          true:*) on=true ;;
          auto:*:bun|auto:*:node) on=auto ;;
        esac
        if [ "$on" != false ]; then
          apps="$(find . -maxdepth 3 \( -name node_modules -o -name .git \) -prune -o -type f \
              \( -name 'next.config.js' -o -name 'next.config.mjs' -o -name 'next.config.cjs' \
                 -o -name 'next.config.ts' -o -name 'next.config.mts' \) -print 2>/dev/null \
            | sed -e 's|/[^/]*$||' -e 's|^\./||' | LC_ALL=C sort -u)" || true
          if [ -z "$apps" ]; then
            if [ "$on" = true ]; then apps="."; else on=false; fi
          fi
        fi

        # One target per app, under one directory per repository. A real
        # .next/cache left by an earlier job would make ln link inside it.
        link_apps() {
          local app target
          while IFS= read -r app; do
            target="$CACHE_DIR/next/${GITHUB_REPOSITORY//\//-}"
            [ "$app" = "." ] || target="$target/$app"
            mkdir -p "$target" "$app/.next" || return 1
            if [ -d "$app/.next/cache" ] && [ ! -L "$app/.next/cache" ]; then rm -rf "$app/.next/cache" || return 1; fi
            ln -sfn "$target" "$app/.next/cache" || return 1
          done <<< "$apps"
        }

        if [ "$on" != false ] && [ -n "$CACHE_DIR" ]; then
          # A build cache is a nicety: failing to place it never fails the job.
          if link_apps; then mode="link"
          else echo "::warning::could not link .next/cache into $CACHE_DIR/next; building without a kept Next.js cache"; fi
        elif [ "$on" != false ] && [ "$CACHE_ENABLED" = "true" ]; then
          mode=actions
          paths="$(printf '%s\n' "$apps" | sed -e 's|$|/.next/cache|' -e 's|^\./||')"
          # Lockfiles by their index hashes (the one list, lockfiles.re), then
          # the commit's tree: content-addressed, and no workspace walk.
          # awk reads the ERE from ENVIRON, which applies no escape processing.
          lock="$( { git ls-files -s 2>/dev/null || true; } \
            | RE="$(cat "$ACTION_PATH/lockfiles.re")" awk -F '\t' '$2 ~ ENVIRON["RE"]' | git hash-object --stdin)"
          tree="$(git rev-parse 'HEAD^{tree}' 2>/dev/null || echo none)"
          restore="next-$RUNNER_OS-$RUNNER_ARCH-$lock-"
          key="$restore$tree"
        fi

        {
          echo "mode=$mode"
          echo "key=$key"
          echo "restore=$restore"
          printf 'paths<<__SETUP_STACK_EOF__\n%s\n__SETUP_STACK_EOF__\n' "$paths"
        } >> "$GITHUB_OUTPUT"
        echo "next: mode=$mode (input next-cache=$NEXT_CACHE), apps=$(printf '%s' "$apps" | tr '\n' ' ')"

    # Resolved here rather than by setup-bun's bun-version-file, which reads one
    # file only. setup-bun takes an exact version or a range, never a leading v.
    - id: bun
      if: inputs.stack == 'bun'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/bun-version.sh" "$BUN_VERSION"'

    - if: inputs.stack == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun.outputs.version }}
        # The bun install cache is never uploaded to GitHub on any runner.
        # setup-bun's cache of the bun executable follows the resolved mode, so
        # it is off on self-hosted Linux, whose persistent home already has bun.
        # actions/cache stores a path outside the workspace relative to it: once
        # a runner's work dir moved, a hit restored bun to the wrong place, and
        # a hit never re-saves the entry to repair it.
        no-cache: ${{ steps.resolve.outputs.cache_enabled != 'true' }}

    - if: inputs.stack == 'node'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # No cache: npm. Hosted cache is one mechanism per stack, and this
        # action never uploads a package store under restore-keys.

    # Reads the checkout, never runs Gradle. The Kotlin version keys the
    # Kotlin/Native cache, and only a multiplatform catalog has one to cache.
    - id: gradle
      if: inputs.stack == 'gradle' || inputs.stack == 'android' || inputs.stack == 'xcode'
      shell: bash
      run: |
        [ -f gradlew ] && echo "gradle=true" >> "$GITHUB_OUTPUT"
        cat=gradle/libs.versions.toml
        if [ -f "$cat" ] && grep -q multiplatform "$cat"; then
          sed -n 's/^[[:space:]]*kotlin[[:space:]]*=[[:space:]]*"\([^"]*\)".*/kotlin=\1/p' "$cat" | head -n 1 >> "$GITHUB_OUTPUT"
        fi

    - if: (inputs.stack == 'gradle' || inputs.stack == 'android') || (inputs.stack == 'flutter' && inputs.java-version != '')
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
        # No cache: gradle. The hosted Gradle cache is setup-gradle's job.

    # xcode joins when the repo has a gradlew: a KMP iOS job calls it itself.
    # setup-gradle only caches ~/.gradle here, so it needs no JDK.
    - if: inputs.stack == 'gradle' || inputs.stack == 'android' || steps.gradle.outputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@v6
      with:
        # Publishing a build scan from a verification job leaks the dependency
        # graph of a private repo to a third party. Off unless a repo opts in.
        build-scan-publish: false
        cache-disabled: ${{ steps.resolve.outputs.cache_enabled != 'true' }}
        # Saved from the default branch only; see cache_save in resolve.
        cache-read-only: ${{ steps.resolve.outputs.cache_save != 'true' }}

    # ~/.konan holds Kotlin/Native's LLVM and libffi, about a minute of download
    # per job. A toolchain, not a package store, so an exact key and no
    # restore-keys: a new Kotlin version is a new entry, never a partial one.
    #
    # Two steps, one key: restore only where cache_save is false, and
    # actions/cache where it is true, which saves in its post step on a miss.
    # Not an inline actions/cache/save: it would run before the build and store
    # an empty or partial ~/.konan.
    - if: >-
        steps.resolve.outputs.cache_enabled == 'true' && steps.resolve.outputs.cache_save != 'true'
        && steps.gradle.outputs.kotlin != ''
      uses: actions/cache/restore@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.gradle.outputs.kotlin }}

    - if: steps.resolve.outputs.cache_save == 'true' && steps.gradle.outputs.kotlin != ''
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.gradle.outputs.kotlin }}

    # The one cache here with restore-keys: Next addresses its own entries by
    # content, so an entry from another commit is reused where it fits. Every
    # other cache is a store or a toolchain and takes an exact key. The same
    # two-step cache_save split as ~/.konan.
    - if: steps.next.outputs.mode == 'actions' && steps.resolve.outputs.cache_save != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.next.outputs.paths }}
        key: ${{ steps.next.outputs.key }}
        restore-keys: ${{ steps.next.outputs.restore }}

    - if: steps.next.outputs.mode == 'actions' && steps.resolve.outputs.cache_save == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.next.outputs.paths }}
        key: ${{ steps.next.outputs.key }}
        restore-keys: ${{ steps.next.outputs.restore }}

    - if: inputs.stack == 'android'
      uses: android-actions/setup-android@v4

    - if: inputs.stack == 'flutter'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.flutter-channel }}
        cache: ${{ steps.resolve.outputs.cache_enabled == 'true' }}

    # A SHA of master: the action has no version tags. See AGENTS.md.
    - if: inputs.stack == 'rust'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - if: inputs.stack == 'rust' && steps.resolve.outputs.cache_enabled == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ steps.resolve.outputs.cache_save == 'true' }}

    - if: inputs.stack == 'xcode' && inputs.xcode-version != ''
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    # The caller's step environment, parsed once so every command step is a
    # one-line `source`. `env` and `build-env` go through the same script, so a
    # comment line or a value with `=` in it means the same in both.
    - id: stepenv
      shell: bash
      env:
        STEP_ENV: ${{ inputs.env }}
        BUILD_ENV: ${{ inputs.build-env }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        file="${RUNNER_TEMP}/setup-stack-env.sh"
        build_file="${RUNNER_TEMP}/setup-stack-build-env.sh"
        "$ACTION_PATH/envfile.sh" "$file" <<< "$STEP_ENV"
        # The build file is env followed by build-env, so a build step sources
        # one file and a build-env key wins over the same key in env.
        "$ACTION_PATH/envfile.sh" "$build_file" <<< "$STEP_ENV"$'\n'"$BUILD_ENV"
        {
          echo "file=$file"
          echo "build-file=$build_file"
        } >> "$GITHUB_OUTPUT"

    # Conventional commands per stack, so a caller that has nothing unusual to
    # say can name its stack and stop. Anything explicit wins over these. The
    # table is defaults.sh, the one copy.
    - id: defaults
      shell: bash
      env:
        STACK:       ${{ inputs.stack }}
        O_INSTALL:   ${{ inputs.install }}
        O_LINT:      ${{ inputs.lint }}
        O_TYPECHECK: ${{ inputs.typecheck }}
        O_TEST:      ${{ inputs.test }}
        O_BUILD:     ${{ inputs.build }}
        O_DESIGN_LINT: ${{ inputs.design-lint }}
        O_LOCK:      ${{ inputs.lock }}
        O_VERSION_FILES: ${{ inputs.version-files }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/defaults.sh"'
