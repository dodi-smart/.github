              want = '$' + '{{ !inputs.' + j + '-blocking && ' + S + j + S + ' || ' + S + S + ' }}'
              if want not in str(given.get('ignore', '')):
                  errors.append('the Summarize ignore must contain ' + want + ', so a non-blocking result can never fail the context, not ' + repr(given.get('ignore')) + '.')
          rd = [s for s in jobs['react-doctor']['steps'] if 'actions/react-doctor@' in str(s.get('uses', ''))]
          if not rd or 'inputs.react-doctor-blocking' not in str(rd[0].get('with', {}).get('blocking', '')):
              errors.append('the react-doctor step must pass a blocking that reads inputs.react-doctor-blocking.')
          for job, action, wf, wfjob in (
              ('zavet', 'actions/zavet-check@', 'zavet-check.yml', 'check'),
              ('react-doctor', 'actions/react-doctor@', 'react-doctor.yml', 'doctor')):
              if action not in uses(jobs[job]):
