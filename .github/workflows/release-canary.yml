# End-to-end run of pr-checks.yml at the exact pinned release, dispatched by
# Publish release; the `release-canary` status it posts gates promote.yml.
# Why it is shaped this way: AGENTS.md.
name: Release canary

on:
  workflow_dispatch:

permissions: {}

jobs:
  # Exactly what pr-checks.yml's jobs ask for: a called workflow that wants more
  # than its caller grants fails at startup. Self test compares the two.
  pr-checks:
    name: pr-checks at the pinned release
    permissions:
      contents: read
      pull-requests: write     # PR Checks posts the zavet, React Doctor and coverage comments
    uses: ./.github/workflows/pr-checks.yml
    with:
      stack: none
      # Every other command is empty for `none`, so those phases skip and there is no build lane.
      test: mkdir -p coverage && cp .github/canary/lcov.info coverage/lcov.info
      hk: true
      coverage: lcov
      coverage-min-overall: 50
      zavet: true
      zavet-dir: .github/canary/zavet
      zavet-blocking: true
      react-doctor: true
      react-doctor-directory: .github/canary/react
      react-doctor-blocking: true
      dependency-check: true
      # A stuck job ends the canary red instead of holding the run for 30 minutes.
      timeout-minutes: 10

  # Only a successful call posts `success`. A canary that never gets here leaves
  # no status, which promote.yml also holds on. `contents: read` is the checkout.
  result:
    name: Post the release-canary status
    needs: [pr-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Post the status on the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RESULT: ${{ needs.pr-checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/release-canary-status.sh
