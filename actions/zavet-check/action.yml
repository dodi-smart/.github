# Verify a repo's .zavet/ knowledge layer on a pull request.
#
# The steps of what used to be the `check` job in zavet-check.yml, so the
# standalone workflow and the zavet step of pr-checks run exactly the same code.
# The caller checks out with full history first (guards walk the PR's commits)
# and grants `contents: read` and `pull-requests: read`, plus
# `pull-requests: write` when the action posts its own comment.
#
# SEVERITY MIRRORS THE LOCAL HOOKS, deliberately:
#
#   decision checks   FAIL   (a decision that no longer holds is wrong, not stale)
#   guard trailers    FAIL   (the commit-msg hook blocks locally; so does this)
#   spec currency     WARN   (the pre-commit hook is warn-only and always exits 0)
#
# Inverting either of those makes CI disagree with the hooks, and then people
# learn to distrust one of them.
#
# The one exception is a dependency or automation bot's pull request (Renovate,
# Dependabot, a scheduled sync opened by github-actions[bot]): everything runs
# and reports as usual, but nothing fails the job. Those bots can neither write
# a decision trailer nor repair a decision, so a red check there blocks
# automerge without producing anyone who can act on it. The org's own agent
# (claude[bot]) is not in that group. A person reads its PRs and can act, so
# they fail closed like a human's.
#
# Some decision checks reach the GitHub API on purpose, because a decision
# about a file in another repo should be verified rather than asserted. So this
# needs a token and network.
name: Zavet check
description: Run a repo's zavet decision checks, guard trailers and optional audit, and comment only on failure.

inputs:
  checks: { description: "Run the `checks:` of the decisions and specs this run's changes touch (all of them on dispatch and schedule)", default: 'true' }
  guards: { description: 'Require trailers on guarded paths', default: 'true' }
  audit:  { description: 'Report-only health sweep', default: 'false' }
  zavet-dir:  { description: 'Directory holding the knowledge layer', default: '.zavet' }
  yq-version: { description: 'mikefarah yq release to install when it is missing', default: 'v4.53.3' }
  # Under the job's timeout, so a hung check is reported as a check that could
  # not run, and the comment and verdict steps after it still run.
  verify-timeout: { description: 'Minutes `zavet verify` may run before it counts as could-not-run', default: '12' }
  # A PR whose head is this branch is a promotion and its guard commits are not
  # walked again (promotion.sh has the rule and the cost). "" turns it off.
  integration-branch: { description: 'Branch whose promotion PRs skip the guard walk, or "" for none', default: 'develop' }

  # The toolchain the decision checks THEMSELVES run on. Default `none` suits
  # a repo whose checks are plain shell. A check that shells out to a test
  # runner or a build tool needs its stack here, or the command is not found
  # and the job reports a decision that stopped holding when in fact nothing
  # ran. Same input and same values as pr-checks.
  stack:   { description: 'setup-stack stack', default: 'none' }
  # `@stack` installs dependencies the conventional way for that stack, which
  # is what a check running a test file needs. Set to "" for a stack whose
  # tooling resolves on demand.
  install: { description: 'Install command, or @stack', default: '@stack' }
  node-version:    { description: 'Node version', default: '24' }
  bun-version:     { description: 'Bun version', default: 'auto' }
  java-version:    { description: 'Java version', default: '21' }
  flutter-version: { description: 'Flutter version', default: '' }

  # pr-checks runs this in a lane that already set up its toolchain and ran its
  # install, so a second setup and install would be pure cost. Set, the action
  # skips both and the checks source this file instead.
  env-file: { description: "setup-stack `env-file` of a job that already set up and installed; empty sets up here", default: '' }
  # pr-checks posts the comment from its `PR Checks` job, which holds the write
  # token and runs none of the caller's code. 'false' writes the report to the
  # `report-dir` output instead: `failed` (true or false) and, when failed,
  # `comment.md`.
  comment: { description: "'true' posts the failure comment; 'false' only writes the report", default: 'true' }

outputs:
  report-dir:
    description: 'Directory holding `failed` and, on a failure, `comment.md`. Empty when nothing was reported (no knowledge layer, or not a pull request).'
    value: ${{ steps.report.outputs.dir }}

runs:
  using: composite
  steps:
    # Renovate, Dependabot and scheduled automations open PRs that no bot will
    # ever fix a decision on, and none can write a decision trailer. Failing
    # them here blocks automerge on a signal the author cannot act on, so on
    # their PRs everything below still runs and reports, but nothing fails
    # the job. The gate is used only for `author-kind`, which it writes before
    # any rule, so its `proceed` is ignored here on purpose.
    - id: author
      uses: dodi-smart/.github/actions/agent-gate@pinned/v1.44.4
      with:
        labels:     ${{ toJson(github.event.pull_request.labels.*.name) }}
        event-name: ${{ github.event_name }}
        author:     ${{ github.event.pull_request.user.login }}
        bots:       'allow'
        skip-draft: 'false'

    # The one report-only decision, derived from author-kind, read below.
    - id: scope
      shell: bash
      env:
        KIND: ${{ steps.author.outputs.author-kind }}
      run: |
        case "$KIND" in
          dependency|automation) echo "report-only=true"  >> "$GITHUB_OUTPUT" ;;
          *)                     echo "report-only=false" >> "$GITHUB_OUTPUT" ;;
        esac

    - id: present
      shell: bash
      env:
        DIR: ${{ inputs.zavet-dir }}
      run: |
        set -euo pipefail
        if [ -d "$DIR" ]; then
          echo "yes=true" >> "$GITHUB_OUTPUT"
        else
          echo "yes=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no $DIR/ in this repository, nothing to check"
        fi

    # Decided once, before anything is installed. need.sh holds the rule (and
    # why) so test.sh covers it; the steps below read its outputs.
    - id: need
      if: steps.present.outputs.yes == 'true'
      shell: bash
      env:
        DIR: ${{ inputs.zavet-dir }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/need.sh" "$DIR" >> "$GITHUB_OUTPUT"'

    # mikefarah yq, from PATH or the tool cache (install-yq.sh has why). Needed
    # whenever the CLI runs: checks, guards and audit all read frontmatter.
    - id: yq
      if: steps.present.outputs.yes == 'true' && steps.need.outputs.cli == 'true'
      continue-on-error: ${{ steps.scope.outputs.report-only == 'true' }}
      shell: bash
      env:
        YQ: ${{ inputs.yq-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/install-yq.sh" "$YQ" >> "$GITHUB_PATH"'

    # Which checks this run owes. A pull request verifies the records its diff
    # touches and a push the records its commits touch (scope.sh has the rule
    # and why). The same resolution `zavet verify --paths` uses, done here so
    # that a run whose changes no checked record covers installs nothing.
    # Unscoped events (dispatch, schedule) verify everything.
    - id: targets
      if: steps.present.outputs.yes == 'true' && inputs.checks == 'true' && steps.need.outputs.install == 'true'
      shell: bash
      env:
        DIR: ${{ inputs.zavet-dir }}
        ACTION_PATH: ${{ github.action_path }}
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      run: |
        set -euo pipefail
        paths="$RUNNER_TEMP/zavet-changed-paths.txt"
        scope=$("$ACTION_PATH/scope.sh" "$EVENT" "$BASE" HEAD "$paths")
        printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"
        echo "paths=$paths" >> "$GITHUB_OUTPUT"
        if ! grep -qx 'scoped=true' <<< "$scope"; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "verifying every decision and spec check ($EVENT)"
          exit 0
        fi
        zavet="$DIR/bin/zavet"
        ids=$("$zavet" match-batch < "$paths")
        slugs=$("$zavet" spec-match < "$paths")
        owed=$( { "$zavet" checks | awk -F'\t' 'NR==FNR { want[$0]; next } ($1 in want)' <(printf '%s\n' "$ids") -
                  "$zavet" spec-checks | awk -F'\t' 'NR==FNR { want[$0]; next } ($1 in want)' <(printf '%s\n' "$slugs") -
                } | wc -l | tr -d ' ')
        changed=$(wc -l < "$paths" | tr -d ' ')
        echo "owed=$owed" >> "$GITHUB_OUTPUT"
        if [ "$owed" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
        echo "$changed changed file(s); $owed check(s) owed by: ${ids//$'\n'/ } ${slugs//$'\n'/ }"

    # Installed before the checks run, because a `checks:` command is arbitrary
    # and usually belongs to the repo's own toolchain. Only when `targets` says
    # a check will run, and never when the caller passed `env-file` (its job
    # already did both; the install below then has no command and skips). `none`
    # is a real stack value, so once this runs it always writes the env file.
    - id: setup
      if: steps.present.outputs.yes == 'true' && inputs.checks == 'true' && steps.need.outputs.install == 'true' && steps.targets.outputs.run == 'true' && inputs.env-file == ''
      continue-on-error: ${{ steps.scope.outputs.report-only == 'true' }}
      uses: dodi-smart/.github/actions/setup-stack@pinned/v1.44.4
      with:
        stack:           ${{ inputs.stack }}
        isolate:         false
        cache:           auto
        install:         ${{ inputs.install }}
        node-version:    ${{ inputs.node-version }}
        bun-version:     ${{ inputs.bun-version }}
        java-version:    ${{ inputs.java-version }}
        flutter-version: ${{ inputs.flutter-version }}

    # yq, setup and install are continue-on-error on a bot's report-only PR
    # (AGENTS.md has why); what needs a tool that failed is skipped, so no
    # decision is blamed for a download.
    - name: Install dependencies for the decision checks
      id: install
      if: steps.present.outputs.yes == 'true' && inputs.checks == 'true' && steps.need.outputs.install == 'true' && steps.targets.outputs.run == 'true' && steps.setup.outputs.install != ''
      continue-on-error: ${{ steps.scope.outputs.report-only == 'true' }}
      uses: dodi-smart/.github/actions/run-phases@pinned/v1.44.4
      with:
        env-file: ${{ steps.setup.outputs.env-file }}
        install:  ${{ steps.setup.outputs.install }}

    - id: checks
      if: steps.present.outputs.yes == 'true' && inputs.checks == 'true' && steps.yq.outcome != 'failure' && steps.setup.outcome != 'failure' && steps.install.outcome != 'failure'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DIR: ${{ inputs.zavet-dir }}
        ENV_FILE: ${{ inputs.env-file || steps.setup.outputs.env-file }}
        CLI: ${{ steps.need.outputs.cli }}
        DECLARED: ${{ steps.need.outputs.declared }}
        RUN: ${{ steps.targets.outputs.run }}
        SCOPED: ${{ steps.targets.outputs.scoped }}
        CHANGED: ${{ steps.targets.outputs.changed }}
        PATHS_FILE: ${{ steps.targets.outputs.paths }}
        TIMEOUT: ${{ inputs.verify-timeout }}
      run: |
        # `set +e` is REQUIRED and must come first.
        #
        # GitHub runs every `run:` step as `bash -e {0}`. `set -uo pipefail`
        # does NOT clear `-e`, so `out=$(...); rc=$?` aborted the step at
        # the assignment with the runner's exit code, before printf ever ran.
        # The result was a failed check with NO diagnostic output at all, which
        # is the exact failure mode this whole standard exists to eliminate.
        set +e
        set -uo pipefail

        # `zavet verify` is the runner. It prints one "FAIL<TAB>id<TAB>label"
        # row per broken check, which is what the annotation grep below reads,
        # and exits 1 if any failed. This step used to invoke `$DIR/check.sh`,
        # a script the tool has never shipped, so it could only ever have
        # worked in a repo that wrote one by hand.
        #
        # A missing runner is NOT a passing check, and it is not the same event
        # as a check that ran and failed. Without the guard the step exited 127
        # from bash's own "No such file or directory", surfacing as a bare
        # "Process completed with exit code 127" naming nothing. A reader then
        # goes looking for the decision that broke, and there isn't one.
        #
        # Severity splits on whether anything was actually meant to run:
        # a knowledge layer carrying no `checks:` at all has nothing to verify,
        # while one that declares them and cannot run them is unverified, which
        # fails closed like any other unmet check. `need` counted them.
        zavet="$DIR/bin/zavet"
        if [ "$DECLARED" -eq 0 ]; then
          echo "::notice::no decision or spec declares checks:. Nothing to run, and nothing was installed."
          exit 0
        fi
        if [ "$CLI" != true ]; then
          echo "::error title=Decision checks could not run::$zavet is not present or not executable, but $DECLARED decision or spec file(s) declare checks:. Those checks are unverified. The CLI is vendored into the repo, so commit it."
          { echo "### Decision checks"; echo "Could not run: \`$zavet\` is missing or not executable, while $DECLARED decision or spec file(s) declare \`checks:\`."; } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$RUN" = false ]; then
          echo "::notice::no decision or spec with checks covers the $CHANGED changed file(s). Nothing to run, and nothing was installed."
          { echo "### Decision checks"; echo "None owed: no decision or spec with \`checks:\` covers the $CHANGED changed file(s)."; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # setup-stack always writes this (here, or in the caller's job when it
        # passed `env-file`), so the guard is for the case where that step
        # itself failed and left the output empty. The directive
        # below is required, because the path is only known at run time and
        # SC1090 is an error here. Keep any prose above it from starting a
        # line with the linter's name, or that line parses as a directive too.
        # shellcheck source=/dev/null
        [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ] && . "$ENV_FILE"
        # Scoped to this run's changed files; `targets` already knows at least
        # one check is owed. Unscoped runs verify everything.
        args=()
        if [ "$SCOPED" = true ]; then
          mapfile -t changed < "$PATHS_FILE"
          args=(--paths "${changed[@]}")
        fi
        out=$(timeout -k 30s "${TIMEOUT}m" "$zavet" verify "${args[@]}" 2>&1); rc=$?
        printf '%s\n' "$out"
        # Could-not-run, not a decision that stopped holding: 124 is the time
        # limit, 127 a command the `stack` input did not supply.
        case "$rc" in
          124) echo "::error title=Decision checks could not run::zavet verify ran past ${TIMEOUT} minutes and was stopped. A check this slow re-runs work the test job owns; point it at the one test that proves the decision." ;;
          127) echo "::error title=Decision check could not run::a check exited 127, command not found. Set the 'stack' input to the toolchain these checks need." ;;
        esac
        {
          echo "### Decision checks"
          echo '```'
          printf '%s\n' "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        # `|| true` is the point, not decoration. With zero failures this grep
        # matches nothing and exits 1, which under `-e` killed the step, so the
        # job failed precisely BECAUSE every check had passed. The step's verdict
        # is $rc from the runner, never the annotation pass.
        printf '%s\n' "$out" | grep -E '^\s*FAIL' | while read -r line; do
          echo "::error title=Decision check failed::$line"
        done || true
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        exit "$rc"

    # Guards are per-commit: the trailer belongs to the commit that touched
    # the guarded path, so checking the squashed diff would let one trailer
    # cover changes it never described. A promotion PR walks nothing: see
    # promotion.sh for the rule, and why the integration branch must require PRs.
    - id: guards
      if: steps.present.outputs.yes == 'true' && inputs.guards == 'true' && github.event_name == 'pull_request' && steps.yq.outcome != 'failure'
      continue-on-error: true
      shell: bash
      env:
        DIR:  ${{ inputs.zavet-dir }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        HEAD_REPO:   ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF:    ${{ github.event.pull_request.head.ref }}
        BASE_REF:    ${{ github.event.pull_request.base.ref }}
        INTEGRATION: ${{ inputs.integration-branch }}
        CLI: ${{ steps.need.outputs.cli }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e            # see the checks step: GitHub's `bash -e` would abort early
        set -uo pipefail
        zavet="$DIR/bin/zavet"
        if [ "$CLI" != true ]; then
          echo "::notice::$zavet not present or not executable, skipping guard check"
          exit 0
        fi
        if "$ACTION_PATH/promotion.sh" "$HEAD_REPO" "$GITHUB_REPOSITORY" "$HEAD_REF" "$BASE_REF" "$INTEGRATION"; then
          echo "::notice::promotion PR ($HEAD_REF into $BASE_REF): these commits already passed the guard wall on their own pull requests, so none is walked again"
          git log --format='skip (promotion) %H %s' "$BASE".."$HEAD"
          exit 0
        fi
        blocked=0
        for sha in $(git rev-list "$BASE".."$HEAD"); do
          subject=$(git log -1 --format=%s "$sha")
          # Merge commits touch paths their author never edited.
          if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
            echo "skip (merge) $sha $subject"; continue
          fi
          # A release bot's version bump: a promotion PR carries them, and no
          # bot can write a trailer. release-commit.sh holds the rule and why
          # both halves (bot author, release subject) are required.
          if "$ACTION_PATH/release-commit.sh" "$sha"; then
            echo "skip (release) $sha $subject"; continue
          fi
          git show --name-only --format= "$sha" > "$RUNNER_TEMP/paths.txt"
          git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
          if reason=$("$zavet" gate --paths-from "$RUNNER_TEMP/paths.txt" \
                        --message-file "$RUNNER_TEMP/msg.txt" --guards-only 2>&1); then
            echo "ok   $sha $subject"
          else
            blocked=1
            echo "::error title=Guarded change without a trailer::$sha $subject: $reason"
            { echo "### Guard wall"; echo "- \`$sha\` $subject"; echo "  - $reason"; } >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        exit "$blocked"

    - id: audit
      if: steps.present.outputs.yes == 'true' && inputs.audit == 'true' && steps.yq.outcome != 'failure'
      continue-on-error: true
      shell: bash
      env:
        DIR: ${{ inputs.zavet-dir }}
      run: |
        set +e            # see the checks step
        set -uo pipefail
        out=$("$DIR/bin/zavet" audit 2>&1 || true)
        printf '%s\n' "$out"
        { echo "### Audit (report only)"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    # One comment, updated in place, and ONLY when something failed. A clean
    # result is already the green check; a table saying "passed" on every PR
    # is the noise that teaches people to skip bot comments. A comment left
    # from an earlier failing push is deleted once the PR is clean again.
    - id: report
      if: always() && steps.present.outputs.yes == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        CHECKS: ${{ steps.checks.outcome }}
        GUARDS: ${{ steps.guards.outcome }}
        REPORT_ONLY: ${{ steps.scope.outputs.report-only }}
      run: |
        set +e            # see the checks step
        set -uo pipefail
        dir="$RUNNER_TEMP/zavet-report"
        mkdir -p "$dir"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        if [ "$CHECKS" != "failure" ] && [ "$GUARDS" != "failure" ]; then
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo false > "$dir/failed"
          exit 0
        fi
        echo "failed=true" >> "$GITHUB_OUTPUT"
        echo true > "$dir/failed"
        status() { case "$1" in success) echo "passed";; skipped) echo "skipped";; *) echo "**FAILED**";; esac; }
        {
          echo "**Knowledge layer**"
          echo
          echo "| Check | Result |"
          echo "|---|---|"
          echo "| Decision checks | $(status "$CHECKS") |"
          echo "| Guard trailers | $(status "$GUARDS") |"
          echo
          echo "Spec currency is reported in the job summary and never fails a build, the same severity the local pre-commit hook uses."
          if [ "$REPORT_ONLY" = true ]; then
            echo
            echo "Report only: this is a dependency or automation bot's pull request, so the failure above is recorded here without failing the job."
          fi
        } > "$dir/comment.md"

    # A comment that cannot be written must not decide the verdict. The last
    # step below does. pr-checks posts the same comment from the report.
    - if: always() && inputs.comment == 'true' && steps.report.outputs.failed != ''
      continue-on-error: true
      uses: dodi-smart/.github/actions/sticky-comment@pinned/v1.44.4
      with:
        key:       zavet-check
        number:    ${{ github.event.pull_request.number }}
        body-file: ${{ steps.report.outputs.dir }}/comment.md
        delete:    ${{ steps.report.outputs.failed == 'false' }}

    - name: Fail if a decision check or guard failed
      if: always() && steps.present.outputs.yes == 'true'
      shell: bash
      env:
        CHECKS: ${{ steps.checks.outcome }}
        GUARDS: ${{ steps.guards.outcome }}
        REPORT_ONLY: ${{ steps.scope.outputs.report-only }}
      run: |
        set -euo pipefail
        # `if` over `[ x ] && y` for legibility, and the values are echoed
        # because "knowledge-layer checks failed" alone does not say WHICH.
        # (For the record, `[ x ] && y` was NOT the bug. bash's `set -e` does
        # not exit on it. The real cause was the annotation grep above.)
        if [ "$CHECKS" = "failure" ] || [ "$GUARDS" = "failure" ]; then
          if [ "$REPORT_ONLY" = true ]; then
            echo "::warning title=Knowledge-layer checks failed, report only::Dependency or automation bot PR, so the failure is recorded without failing the job (checks=$CHECKS guards=$GUARDS)."
            exit 0
          fi
          echo "knowledge-layer checks failed (checks=$CHECKS guards=$GUARDS)"
          exit 1
        fi
        echo "knowledge layer is consistent (checks=$CHECKS guards=$GUARDS)"
