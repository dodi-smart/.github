# Ask pr-review for a verdict on a pull request's head, unless that head has
# one from the org App already. A `review / verdict` anyone else posted is no
# review: it neither counts at merge-gate nor stops this request. The request is `agent:review` applied with the org App token:
# an App's label event starts the caller's PR Review workflow, and pr-review
# admits a bot-authored PR only when a bot applied the label. A GITHUB_TOKEN
# label starts nothing.
name: Request review
description: Apply agent:review with the App token when the head commit has no review / verdict status from the org App yet.

inputs:
  number:      { description: 'PR number', required: true }
  sha:         { description: 'The head commit the review must cover', required: true }
  client-id:   { description: 'secrets.GH_APP_CLIENT_ID', default: '' }
  private-key: { description: 'secrets.GH_APP_PRIVATE_KEY', default: '' }

outputs:
  requested: { description: '"true" when the label was applied', value: '${{ steps.request.outputs.requested }}' }

runs:
  using: composite
  steps:
    - id: token
      uses: dodi-smart/.github/actions/app-token@pinned/v1.51.0
      with:
        client-id:   ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permissions: issues:write pull-requests:write statuses:read

    - id: request
      shell: bash
      env:
        GH_TOKEN:    ${{ steps.token.outputs.token }}
        REPO:        ${{ github.repository }}
        PR:          ${{ inputs.number }}
        SHA:         ${{ inputs.sha }}
        APP_BOT:     ${{ steps.token.outputs.login }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/request.sh"'
