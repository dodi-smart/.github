# Linters for this repo, run by hk locally and in self-test.
# The aqua: backends are explicit so Renovate's mise manager resolves every pin
# to a GitHub release. Keep hk in step with the Config.pkl version in hk.pkl.
[tools]
"aqua:jdx/hk" = "2.4.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:crate-ci/typos" = "1.50.3"
"aqua:zizmorcore/zizmor" = "1.30.1"
