# Reusable: the deterministic checks a pull request must pass. Replaces a
# hand-written ci.yml per repo. `concurrency:` stays with the CALLER, because it
# depends on that repo's branches.
#
# Do NOT add `paths-ignore` on the caller for a docs-only skip: this workflow
# does that itself (`docs-only-paths`), and a caller-side `paths-ignore` creates
# no status-check context at all, so a ruleset requiring one waits forever.
#
# Light work (lint, typecheck) goes to the light pool, heavy work (build, tests)
# to the large one; `single-job: true` collapses the split onto the heavy runner.
# ONE `pick` job resolves both runners, docs-only (from the API, with no
# checkout) and the lanes: the legs of the one `lanes` matrix job that runs the
# caller's code, each listed only when it has work, so no job shows as skipped.
# A step whose command resolves to empty is skipped. `pr-checks` at the bottom
# always runs and is the one context a ruleset should require. `pick` and
# `pr-checks` run no caller code and sit on the `control` pool of a private repo
# (AGENTS.md); their `runs-on` is written out per job because `runs-on` cannot
# read `env`.
name: PR Checks

# Runs the caller's own code, so no job holds more than it needs.
permissions:
  contents: read

env:
  # What `test` and `all` hand `PR Checks` for the comment: vitest's two JSON files, or the caller's one report.
  COVERAGE_REPORT: ${{ inputs.coverage == 'vitest' && 'coverage/coverage-*.json' || inputs.coverage-path || 'coverage/lcov.info' }}

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true      # bun | node | gradle | android | kmm | flutter | rust | xcode | none

      # "@stack" = this stack's conventional command; "" = this repo has no such
      # step. See actions/setup-stack, which resolves these.
      install:   { type: string, default: "@stack" }
      lint:      { type: string, default: "@stack" }
      typecheck: { type: string, default: "@stack" }
      test:      { type: string, default: "@stack" }
      build:     { type: string, default: "@stack" }

      # The `iOS` lane's command and label (see the `lanes` job). "@stack" is the
      # stack's iOS command, "" turns the lane off. The label is read from the
      # event, so one added after the last push needs `labeled` in the caller's types.
      ios:               { type: string, default: "@stack" }
      ios-label:         { type: string, default: "ios" }
      xcode-version:     { type: string, default: "" }
      # `auto` is the newest iPhone the runner has; see setup-stack.
      xcode-destination: { type: string, default: "auto" }

      # Design-system verifier (oxlint + @shadcn/lint). Opt-in, no `@stack`
      # default (there is no conventional command). Runs on the light pool right
      # after Lint; advisory until the caller's command adds `--max-warnings`.
      design-lint: { type: string, default: "" }

      # Runs `hk check --all` from the caller's hk.pkl, with the tools its
      # mise.toml pins, after install and before lint. Replaces nothing. Findings
      # show in the job log and summary, and the SARIF is kept as an `hk-sarif-<n>`
      # artifact. Nothing goes to code scanning (that needs `security-events:
      # write`, which every caller would have to grant): a repo that wants it
      # uploads the artifact from its own workflow.
      hk: { type: boolean, default: false }

      light-weight: { type: string, default: "light" }
      heavy-weight: { type: string, default: "heavy" }

      # The branch that only receives releases. A repo that develops on an
      # integration branch (`develop`) and releases from `main` must keep `main`
      # for that branch merged in, plus a security-critical patch in a repo that
      # opted in through the `security_hotfix` repository property. Anything else
      # aimed at it fails the `pick` job below, so `PR Checks` is red. That makes
      # the pull request unmergeable only where a ruleset requires `checks / PR
      # Checks` on the release branch: the check says no, the ruleset enforces it.
      # Does nothing when the release branch is the repository default branch,
      # and on any event that is not a pull request.
      release-branch: { type: string, default: "main" }

      # Run every step in ONE lane (`all`) on the heavy runner instead of
      # splitting light work from heavy. Right for Gradle, where three jobs mean
      # three configuration phases and no shared daemon (one job gives one
      # checkout and one warm GRADLE_USER_HOME); the split stays the default.
      single-job: { type: boolean, default: false }

      # Every changed file must match one of these globs (newline-separated,
      # `fnmatch`-style: `*` crosses `/`) for the run to skip every lane but a
      # `checks` that carries only commitlint and zavet. It runs on the light
      # runner when either is on, even with `single-job`: they check the commit
      # messages and the knowledge layer, not the files.
      #
      # `docs_only` is always `false` on `workflow_dispatch`, and whenever the
      # changed files cannot be listed in full (an API error, or the 3000-file
      # cap): a skip is only ever a positive claim, never the fallback.
      docs-only-paths:
        type: string
        default: |-
          **.md
          docs/**

      commitlint:        { type: boolean, default: false }
      commitlint-config: { type: string,  default: ".commitlintrc.json" }

      # Opt-in osv-scanner over the lockfiles the PR changed; only the findings
      # the PR introduces count, and a dependency PR is skipped (deps-verify owns
      # it). `none` reports; low | moderate | high | critical fails a new finding
      # at or above it, and a scan that could not run. Never
      # dependency-review-action: it needs GitHub Advanced Security on private
      # repos and `security-events`, which no pr-checks job holds (see `hk`).
      dependency-check:         { type: boolean, default: false }
      dependency-check-fail-on: { type: string,  default: "none" }

      # Opt-in checks that replace zavet-check.yml and react-doctor.yml. They
      # fail the `pr-checks` summary only when their `*-blocking` input is on.
      # `zavet-stack` is the toolchain the decision checks run on. Zavet is a
      # step of `checks` (or `all`) when that lane can serve it: `zavet-stack` is
      # `none` or the stack, and `zavet-install` is empty. Otherwise it gets its
      # own `Zavet Check` lane.
      # React Doctor is a step of `checks` (or `all`) when the pull request
      # changes a file matching `react-doctor-paths` (newline globs; the default
      # is web source and package.json, narrow it to an app directory in a
      # monorepo). A repo that tunes React Doctor keeps react-doctor.yml.
      zavet:       { type: boolean, default: false }
      zavet-dir:   { type: string,  default: ".zavet" }
      zavet-stack: { type: string,  default: "none" }
      zavet-audit: { type: boolean, default: false }   # report-only health sweep
      # Off by default: an advisory check that silently starts blocking merges
      # is worse than one that reports. On, a failure fails its lane, and so
      # `PR Checks`, the required context: a red Zavet Check blocks the merge.
      zavet-blocking: { type: boolean, default: false }
      # The zavet install. Empty reuses `install` (and the lane's own install);
      # set it when the decision checks need more, e.g. a build whose output a
      # check reads.
      zavet-install: { type: string, default: "" }

      react-doctor:           { type: boolean, default: false }
      react-doctor-paths:
        type: string
        default: |-
          **.ts
          **.tsx
          **.js
          **.jsx
          package.json
      react-doctor-directory: { type: string,  default: "." }
      # Off by default, as `zavet-blocking`. On, React Doctor fails its lane, and
      # so `PR Checks`, on an error-severity finding.
      react-doctor-blocking:  { type: boolean, default: false }

      # none | vitest | kover | lcov. `lcov`: the test command writes an LCOV
      # file (bun test, cargo llvm-cov, c8, nyc) and `coverage-path` points at
      # it; the default is coverage/lcov.info.
      coverage:      { type: string, default: "none" }
      coverage-path: { type: string, default: "" }
      coverage-min-overall: { type: number, default: 0 }
      coverage-min-changed: { type: number, default: 0 }

      # Applied to EVERY command step, via setup-stack's env-file. This is where
      # build tuning goes: GRADLE_OPTS, JAVA_OPTS, a worker count. Placeholders
      # and tuning only, never secrets. A value that must stay secret has no
      # business in a PR build log.
      env:
        type: string
        default: ""      # newline-separated KEY=VALUE

      # Build step only, parsed exactly like `env` (comments and blank lines
      # skipped, first `=` splits). Kept because callers already depend on it;
      # `env` is the general one, so prefer it. Both apply when both are set,
      # and `build-env` wins on a name in both.
      build-env:
        type: string
        default: ""      # newline-separated KEY=VALUE, placeholders only
      timeout-minutes: { type: number, default: 30 }

      java-version:    { type: string, default: "21" }
      node-version:    { type: string, default: "24" }
      bun-version:     { type: string, default: "auto" }
      flutter-version: { type: string, default: "" }
      # Passed to the pinned rust-toolchain action: stable, nightly, or a version.
      rust-toolchain:  { type: string, default: "stable" }
    secrets:
      GH_APP_CLIENT_ID:   { required: false }
      GH_APP_PRIVATE_KEY: { required: false }

jobs:
  # ONE job resolves both runners, whether the diff is docs-only, and the lanes
  # the run needs. It always runs: its outputs are the only thing that decides
  # what else starts. It needs bash, git, gh, jq and python3 (`changed-files`
  # matches globs with fnmatch); a missing one degrades to "not docs-only, run
  # everything" and skips React Doctor, so the check below says so.
  pick:
    name: Pick runner
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","control"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read }   # pull-requests: the changed-files listing
    outputs:
      docs_only: ${{ steps.docs.outputs.all-matched }}
      lanes:     ${{ steps.plan.outputs.lanes }}
      coverage:  ${{ steps.plan.outputs.coverage }}
      key:       ${{ steps.key.outputs.key }}
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.8
      # A pull request aimed at the release branch that is neither a release nor
      # an opted-in security patch fails HERE, so `PR Checks` goes red without
      # booking a build runner. Does nothing on any other base, and where the
      # release branch is the default branch.
      - uses: dodi-smart/.github/actions/target-guard@pinned/v1.44.8
        with:
          release-branch: ${{ inputs.release-branch }}
      # Artifact names are per run and a caller may call this workflow twice, so
      # each call's names carry a hash of its inputs. Not `github.job`: both calls
      # have a job called `lanes`.
      - id: key
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "key=$(printf '%s' "$INPUTS" | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the tools changed-files needs
        run: |
          for t in gh jq python3; do
            command -v "$t" >/dev/null || echo "::warning title=Runner is missing $t::changed-files needs $t, so docs-only detection and the React Doctor path filter will not work on this runner."
          done

      # Whether `test` and `build` have a command, so an empty one never starts a
      # large runner. Bash only, no checkout; an unknown stack fails here.
      - id: cmds
        uses: dodi-smart/.github/actions/setup-stack/resolve@pinned/v1.44.8
        with:
          stack: ${{ inputs.stack }}
          test:  ${{ inputs.test }}
          build: ${{ inputs.build }}

      # `all-matched` is `true` only when the whole list was read and every file
      # matches; any doubt (no PR, API error, empty list, the cap) is `false`.
      - id: docs
        uses: dodi-smart/.github/actions/changed-files@pinned/v1.44.8
        with:
          patterns: ${{ inputs.docs-only-paths }}

      # Fails a pull request that lowers a version its base already has, from
      # the list just read (actions/version-guard).
      - uses: dodi-smart/.github/actions/version-guard@pinned/v1.44.8
        with:
          files-path: ${{ steps.docs.outputs.files-path }}
          complete:   ${{ steps.docs.outputs.complete }}

      - id: rd
        if: ${{ inputs.react-doctor }}
        uses: dodi-smart/.github/actions/changed-files@pinned/v1.44.8
        with:
          patterns: ${{ inputs.react-doctor-paths }}

      # Static (no API call, no token), so both always run and the plan below
      # gives each lane the one it needs.
      - id: light
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.44.8
        with:
          weight: ${{ inputs.light-weight }}
      - id: heavy
        uses: dodi-smart/.github/actions/pick-runner@pinned/v1.44.8
        with:
          weight: ${{ inputs.heavy-weight }}

      # The lanes this run needs, one matrix leg each; plan.sh has the rules.
      # The iOS label is read from the event, so one added after the last push
      # needs `labeled` in the caller's types.
      - id: plan
        uses: dodi-smart/.github/actions/pr-checks-plan@pinned/v1.44.8
        with:
          stack:            ${{ inputs.stack }}
          single-job:       ${{ inputs.single-job }}
          docs-only:        ${{ steps.docs.outputs.all-matched }}
          has-test:         ${{ steps.cmds.outputs.test != '' }}
          has-build:        ${{ steps.cmds.outputs.build != '' }}
          light:            ${{ steps.light.outputs.runner }}
          heavy:            ${{ steps.heavy.outputs.runner }}
          hk:               ${{ inputs.hk }}
          dependency-check: ${{ inputs.dependency-check }}
          commitlint:       ${{ inputs.commitlint && github.event.pull_request != null }}
          coverage:         ${{ inputs.coverage }}
          zavet:            ${{ inputs.zavet }}
          zavet-stack:      ${{ inputs.zavet-stack }}
          zavet-install:    ${{ inputs.zavet-install }}
          react-doctor:     ${{ inputs.react-doctor && steps.rd.outputs.matched == 'true' }}
          ios:              ${{ inputs.ios }}
          ios-labelled:     ${{ contains(github.event.pull_request.labels.*.name, inputs.ios-label) }}

  # ---------------------------------------------------------------------------
  # Every job that runs the caller's code is a leg of this one matrix, and `pick`
  # lists only the legs that have work, so the checks list shows no skipped rows
  # and each step below is written once. Which lanes exist, where they run and
  # what each carries is decided in actions/pr-checks-plan (plan.sh has the rules
  # and why): `checks`, `test` and `build`, or `all` with `single-job`; `iOS` on
  # the hosted Mac; `Zavet Check` when zavet cannot share `checks` or `all`.
  # Every lane runs its commands through `run-phases`, which sources the env file
  # setup-stack wrote, skips an empty phase, stops at the first failure and puts
  # a timing table in the job summary.
  # ---------------------------------------------------------------------------
  lanes:
    name: ${{ matrix.name }}
    needs: [pick]
    if: ${{ needs.pick.outputs.lanes != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.lanes) }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # pull-requests: commitlint's commit list, dependency-check's changed files, zavet's author, React Doctor's API fallback
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.8
        with:
          selector: ${{ matrix.runs_on }}
      # Full history only where zavet or React Doctor runs: zavet's guards walk
      # the pull request's commits, and React Doctor's `scope: changed` diffs
      # against the merge base. No reporter needs history, they list files
      # through the API. A lane with nothing to build or verify (commitlint
      # alone) clones nothing.
      #
      # Flutter: dart-hooks-cache reuses native-asset builds. On self-hosted
      # Linux it keeps them in place, so that checkout does not clean; it does.
      - id: checkout
        if: ${{ contains(matrix.phases, 'install') || matrix.zavet }}
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ !(matrix.zavet || matrix.react_doctor) && 1 || 0 }}
          persist-credentials: false
          clean: ${{ !(inputs.stack == 'flutter' && runner.environment == 'self-hosted' && runner.os == 'Linux') }}
      - if: ${{ steps.checkout.outcome == 'success' && inputs.stack == 'flutter' }}
        uses: dodi-smart/.github/actions/dart-hooks-cache@pinned/v1.44.8
        with:
          toolchain: ${{ inputs.flutter-version }}
      # One setup for every lane, the Mac included: only the inputs that differ
      # there read the lane's phases. It only resolves the commands into outputs; the
      # phases step below reads the ones its lane runs.
      - id: setup
        if: ${{ contains(matrix.phases, 'install') }}
        uses: dodi-smart/.github/actions/setup-stack@pinned/v1.44.8
        with:
          stack:             ${{ inputs.stack }}
          isolate:           false
          cache:             auto
          # Only a lane that builds has a `.next/cache` worth keeping.
          next-cache:        ${{ contains(matrix.phases, 'build') && 'auto' || 'false' }}
          env:               ${{ inputs.env }}
          build-env:         ${{ inputs.build-env }}
          install:           ${{ inputs.install }}
          lint:              ${{ inputs.lint }}
          typecheck:         ${{ inputs.typecheck }}
          test:              ${{ inputs.test }}
          build:             ${{ inputs.build }}
          design-lint:       ${{ inputs.design-lint }}
          ios:               ${{ inputs.ios }}
          # flutter build ios needs no JDK, and a Mac minute costs ten Linux ones.
          java-version:      ${{ (!contains(matrix.phases, 'ios') || inputs.stack != 'flutter') && inputs.java-version || '' }}
          node-version:      ${{ inputs.node-version }}
          bun-version:       ${{ inputs.bun-version }}
          flutter-version:   ${{ inputs.flutter-version }}
          rust-toolchain:    ${{ inputs.rust-toolchain }}
          # Off the Mac, setup-xcode would run for an `xcode` stack and fail.
          xcode-version:     ${{ contains(matrix.phases, 'ios') && inputs.xcode-version || '' }}
          xcode-destination: ${{ inputs.xcode-destination }}
      # Opt-in `hk`: install first, then hk (the whole tree, never `--pr`; its
      # mise cache follows setup-stack's), then `Run phases` for the rest.
      - id: install
        name: Run phases (install)
        if: ${{ matrix.hk }}
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.44.8
        with:
          env-file: ${{ steps.setup.outputs.env-file }}
          install:  ${{ steps.setup.outputs.install }}
      - if: ${{ matrix.hk }}
        uses: dodi-smart/.github/actions/hk-check@pinned/v1.44.8
        with:
          cache:         ${{ steps.setup.outputs.cache-enabled }}
          cache-save:    ${{ steps.setup.outputs.cache-save }}
          artifact-name: hk-sarif-${{ needs.pick.outputs.key }}
      # One step for every lane, with the commands its phases name. With `hk` the
      # install already ran above, so it is not repeated (an empty command is
      # skipped) and a red hk does not hide the rest: they run unless the install
      # failed. Only the iOS lane has the `ios` phase, as its build.
      - id: phases
        name: Run phases
        if: ${{ contains(matrix.phases, 'install') && (success() || (matrix.hk && !cancelled() && steps.install.outcome == 'success')) }}
        uses: dodi-smart/.github/actions/run-phases@pinned/v1.44.8
        with:
          env-file:       ${{ steps.setup.outputs.env-file }}
          build-env-file: ${{ steps.setup.outputs.build-env-file }}
          install:        ${{ !matrix.hk && steps.setup.outputs.install || '' }}
          lint:           ${{ contains(matrix.phases, 'lint') && steps.setup.outputs.lint || '' }}
          design-lint:    ${{ contains(matrix.phases, 'design-lint') && steps.setup.outputs.design-lint || '' }}
          typecheck:      ${{ contains(matrix.phases, 'typecheck') && steps.setup.outputs.typecheck || '' }}
          test:           ${{ contains(matrix.phases, 'test') && steps.setup.outputs.test || '' }}
          build:          ${{ contains(matrix.phases, 'build') && steps.setup.outputs.build || contains(matrix.phases, 'ios') && steps.setup.outputs.ios || '' }}
      # The `PR Checks` job posts the comment and holds the write token; a lane
      # runs the caller's code, so it only hands the report over, by basename,
      # with the workspace its paths are relative to. A red run uploads nothing.
      - name: Stage the coverage report
        if: ${{ matrix.coverage_upload }}
        env:
          OUT: ${{ runner.temp }}/pr-checks-coverage
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # Unquoted on purpose: the path is a glob for vitest's two files.
          # shellcheck disable=SC2206
          files=($COVERAGE_REPORT)
          if [ "${#files[@]}" -eq 0 ] || [ ! -f "${files[0]}" ]; then
            echo "::error title=No coverage report::the test command wrote nothing at $COVERAGE_REPORT"
            exit 1
          fi
          mkdir -p "$OUT/report"
          cp "${files[@]}" "$OUT/report/"
          printf '%s\n' "$GITHUB_WORKSPACE" > "$OUT/workspace"
      - if: ${{ matrix.coverage_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: ${{ runner.temp }}/pr-checks-coverage
          if-no-files-found: error
          retention-days: 1
      # Opt-in `dependency-check`, a step and not a job, on `!cancelled()` and the
      # checkout so a red lint does not hide it.
      - name: Dependency check
        if: ${{ !cancelled() && matrix.dependency_check && steps.checkout.outcome == 'success' }}
        uses: dodi-smart/.github/actions/dependency-check@pinned/v1.44.8
        with:
          fail-on: ${{ inputs.dependency-check-fail-on }}
      # In `checks` or `all` it reuses the lane's toolchain and install (the env
      # file), so it costs no second checkout, setup or install; a lane with no
      # install (its own, or a docs-only `checks`) has no env file, so it sets up
      # its own. It runs
      # after a red lint, but not after a failed setup or install, which it would
      # blame on a decision. Advisory unless `zavet-blocking`: a failure then
      # leaves the lane green. A dependency bot's PR is report-only inside the
      # action. The comment is posted by `PR Checks`, from the report uploaded
      # next, because a lane holds no write token.
      - id: zavet
        name: Zavet Check
        if: ${{ !cancelled() && matrix.zavet && steps.checkout.outcome == 'success' && steps.setup.outcome != 'failure' && steps.install.outcome != 'failure' && !contains(steps.phases.outputs.failed, 'install') }}
        continue-on-error: ${{ !inputs.zavet-blocking }}
        uses: dodi-smart/.github/actions/zavet-check@pinned/v1.44.8
        with:
          zavet-dir:       ${{ inputs.zavet-dir }}
          stack:           ${{ inputs.zavet-stack }}
          audit:           ${{ inputs.zavet-audit }}
          install:         ${{ inputs.zavet-install || inputs.install }}
          node-version:    ${{ inputs.node-version }}
          bun-version:     ${{ inputs.bun-version }}
          java-version:    ${{ inputs.java-version }}
          flutter-version: ${{ inputs.flutter-version }}
          env-file:        ${{ steps.setup.outputs.env-file }}
          comment:         'false'
      - if: ${{ !cancelled() && steps.zavet.outputs.report-dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-checks-comment-zavet-${{ needs.pick.outputs.key }}
          path: ${{ steps.zavet.outputs.report-dir }}
          if-no-files-found: ignore
          retention-days: 1
      # Scans with full history from the lane's checkout and posts nothing: the
      # lane holds no write token, so `PR Checks` posts the comment from the
      # report uploaded next, and there is no commit status. `error`, not
      # `warning`, when blocking: a gate on findings nobody agreed to fix gets
      # bypassed. Advisory unless `react-doctor-blocking`: a failure then leaves
      # the lane green.
      - id: react-doctor
        name: React Doctor
        if: ${{ !cancelled() && matrix.react_doctor && steps.checkout.outcome == 'success' }}
        continue-on-error: ${{ !inputs.react-doctor-blocking }}
        uses: dodi-smart/.github/actions/react-doctor@pinned/v1.44.8
        with:
          directory: ${{ inputs.react-doctor-directory }}
          blocking:  ${{ inputs.react-doctor-blocking && 'error' || 'none' }}
          checkout:  'false'
          comment:   'false'
      - if: ${{ !cancelled() && steps.react-doctor.outputs.report-dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-checks-comment-react-doctor-${{ needs.pick.outputs.key }}
          path: ${{ steps.react-doctor.outputs.report-dir }}
          if-no-files-found: ignore
          retention-days: 1
      # Last, on !cancelled(): a red phase still gets its messages checked. A CLI,
      # not a Docker action: see actions/commitlint. A push or dispatch has no pull
      # request to list commits from, so it skips.
      - name: commitlint
        if: ${{ !cancelled() && matrix.commitlint && github.event.pull_request }}
        uses: dodi-smart/.github/actions/commitlint@pinned/v1.44.8
        with:
          config: ${{ inputs.commitlint-config }}
          number: ${{ github.event.pull_request.number }}

  # ---------------------------------------------------------------------------
  # One stable context, on every push, in both shapes: the job a branch ruleset
  # should require, never a lane, so its name never changes. It runs none of the
  # caller's code, so it is also where the write token lives: it posts the
  # zavet, React Doctor and coverage comments from the reports the lanes
  # uploaded. The control pool of a private repo, like `pick`. Zavet and React
  # Doctor are advisory through their steps' `continue-on-error`, so a lane
  # fails on them only when they block.
  # ---------------------------------------------------------------------------
  pr-checks:
    name: PR Checks
    needs: [pick, lanes]
    if: always()
    runs-on: ${{ fromJSON((github.event.repository.private && !github.event.pull_request.head.repo.fork) && '["self-hosted","Linux","control"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: write }   # pull-requests: the zavet, React Doctor and coverage comments
    steps:
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.8
      # The "Where it ran" table for every job of this run attempt, before the
      # summary, which exits non-zero on a red run.
      - uses: dodi-smart/.github/actions/runner-report@pinned/v1.44.8
        with:
          mode: run

      # The zavet and React Doctor comments, one each. A report directory always
      # holds a file, so a clean result still uploads one; it holds comment.md
      # only when there is something to post. So: comment.md updates the comment
      # in place, a report without it deletes it, and no report (the step
      # skipped this push) leaves it as it was. A comment that cannot be written
      # never decides the verdict.
      - id: reports
        if: (inputs.zavet || inputs.react-doctor) && github.event_name == 'pull_request' && needs.lanes.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pr-checks-comment-*-${{ needs.pick.outputs.key }}
          path: ${{ runner.temp }}/reports
      - id: comments
        if: steps.reports.outcome == 'success'
        env:
          DIR: ${{ runner.temp }}/reports
          KEY: ${{ needs.pick.outputs.key }}
        run: |
          for kind in zavet react-doctor; do
            report="$DIR/pr-checks-comment-$kind-$KEY"
            [ -d "$report" ] || continue
            if [ -s "$report/comment.md" ]; then echo "$kind=$report/comment.md"; else echo "$kind=delete"; fi
          done >> "$GITHUB_OUTPUT"
      - if: steps.comments.outputs.zavet != ''
        continue-on-error: true
        uses: dodi-smart/.github/actions/sticky-comment@pinned/v1.44.8
        with:
          key:       zavet-check
          number:    ${{ github.event.pull_request.number }}
          body-file: ${{ steps.comments.outputs.zavet }}
          delete:    ${{ steps.comments.outputs.zavet == 'delete' }}
      - if: steps.comments.outputs.react-doctor != ''
        continue-on-error: true
        uses: dodi-smart/.github/actions/sticky-comment@pinned/v1.44.8
        with:
          key:       react-doctor
          number:    ${{ github.event.pull_request.number }}
          body-file: ${{ steps.comments.outputs.react-doctor }}
          delete:    ${{ steps.comments.outputs.react-doctor == 'delete' }}

      # The coverage comment, from the report `test` or `all` uploaded, only when
      # every lane passed: a red run keeps the old comment, and is red anyway.
      # The report holds one file, or vitest's two, by basename, and the
      # workspace it was written in. The checkout only gives vitest the tree.
      - if: inputs.coverage == 'vitest' && needs.pick.outputs.coverage == 'true' && needs.lanes.result == 'success'
        uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: coverage
        if: needs.pick.outputs.coverage == 'true' && needs.lanes.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pr-checks-coverage-${{ needs.pick.outputs.key }}
          path: ${{ runner.temp }}/pr-checks-coverage
      - id: writer
        if: steps.coverage.outcome == 'success'
        env:
          DIR: ${{ runner.temp }}/pr-checks-coverage
        run: echo "workspace=$(cat "$DIR/workspace")" >> "$GITHUB_OUTPUT"
      - if: steps.coverage.outcome == 'success' && inputs.coverage == 'vitest'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ${{ runner.temp }}/pr-checks-coverage/report/coverage-summary.json
          json-final-path:   ${{ runner.temp }}/pr-checks-coverage/report/coverage-final.json
          file-coverage-root-path: ${{ steps.writer.outputs.workspace }}
      - if: steps.coverage.outcome == 'success' && inputs.coverage == 'lcov'
        uses: dodi-smart/.github/actions/lcov-report@pinned/v1.44.8
        with:
          path:        ${{ runner.temp }}/pr-checks-coverage/report/*
          source-root: ${{ steps.writer.outputs.workspace }}
          min-overall: ${{ inputs.coverage-min-overall }}
          min-changed: ${{ inputs.coverage-min-changed }}
      # kover-report fails on any event but a pull request or a push.
      - if: steps.coverage.outcome == 'success' && inputs.coverage == 'kover' && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: kover
        uses: mi-kas/kover-report@v2
        with:
          path: ${{ runner.temp }}/pr-checks-coverage/report/*
          token: ${{ github.token }}
          title: Code Coverage
          update-comment: true
          min-coverage-overall: ${{ inputs.coverage-min-overall }}
          min-coverage-changed-files: ${{ inputs.coverage-min-changed }}
      # kover-report only comments on a breached minimum, so the overall floor is
      # enforced here; the changed-files floor stays comment-only.
      - if: steps.kover.outcome == 'success'
        uses: dodi-smart/.github/actions/kover-floor@pinned/v1.44.8
        with:
          overall:     ${{ steps.kover.outputs.coverage-overall }}
          min-overall: ${{ inputs.coverage-min-overall }}
      - if: steps.coverage.outcome == 'success' && inputs.coverage == 'kover' && steps.kover.outcome == 'skipped'
        run: echo "::notice title=Coverage::kover-report supports only pull requests and pushes, so this $GITHUB_EVENT_NAME run has no coverage report or floor."

      - name: Summarize
        if: ${{ !cancelled() }}
        uses: dodi-smart/.github/actions/pr-checks-summary@pinned/v1.44.8
        with:
          needs:     ${{ toJSON(needs) }}
          docs-only: ${{ needs.pick.outputs.docs_only }}
